<title>Repositorio de Conocimiento</title>
<style>
:root{--bg:#0f1419;--panel:#161d26;--panel2:#1c2530;--ink:#e6edf3;--muted:#9aa7b4;
--acc:#4ea3ff;--line:#2a3542;--fisica:#4ea3ff;--control:#a78bfa;--programacion:#5ad19a;--metodologia:#ffb454}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{padding:16px 26px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:19px}header .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.bar input,.bar select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:7px 10px;border-radius:8px;font-size:13px}
.bar input#q{flex:1;min-width:220px}
.bar .clear{cursor:pointer;color:var(--muted);border:1px solid var(--line);padding:7px 12px;border-radius:8px}
.wrap{display:flex;min-height:calc(100vh - 120px)}
.list{width:420px;flex:0 0 420px;border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 120px)}
.count{padding:10px 18px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.card{padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.card:hover{background:var(--panel)}.card.active{background:#1d3148;border-left:3px solid var(--acc)}
.card h3{margin:0 0 5px;font-size:15px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.chip{padding:1px 8px;border-radius:20px;border:1px solid var(--line);background:var(--panel2)}
.chip.cat{color:#0b0e12;font-weight:700;border:0}
.detail{flex:1;overflow-y:auto;max-height:calc(100vh - 120px);padding:26px 40px}
.detail.empty{display:grid;place-items:center;color:var(--muted)}
.detail h1{font-size:26px;margin:0 0 6px}
.detail h2{font-size:18px;margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);color:#cdd9e5}
.detail h3{font-size:15px;margin:16px 0 6px;color:#cdd9e5}
.detail pre{background:#0b0f14;border:1px solid var(--line);border-radius:9px;padding:13px 15px;overflow-x:auto;
  font:12.5px/1.5 SF Mono,Menlo,Consolas,monospace;color:#cfe3f5}
.detail code{background:var(--panel2);padding:1.5px 6px;border-radius:5px;font:12.5px monospace;color:#ffd9a0}
.detail pre code{background:none;padding:0;color:inherit}
.detail table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
.detail th,.detail td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.detail th{background:var(--panel2)}
.detail blockquote{border-left:3px solid var(--acc);margin:12px 0;padding:6px 15px;background:#13202e;color:#cfe1f0}
.metahead{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 6px}
.metahead .chip{font-size:12px}
.wl{border-bottom:1px dotted var(--acc)}
.viewtoggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewtoggle button{background:var(--panel2);color:var(--muted);border:0;padding:7px 12px;cursor:pointer;font-size:13px}
.viewtoggle button.on{background:#23456b;color:#fff}
.list.hide{display:none}
#graphwrap{flex:1;display:none;border-right:1px solid var(--line);background:#0b0f14}
#graphwrap.show{display:block}
#graph{width:100%;height:calc(100vh - 124px)}
.glegend{position:absolute;margin:10px;display:flex;gap:12px;font-size:12px;color:var(--muted);z-index:5}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* ── Estado ──────────────────────────────────────────────────────── */
.st-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;color:#0b0e12;margin-left:3px;vertical-align:middle}
.st-bar{display:flex;gap:6px;align-items:center;margin:6px 0 14px;flex-wrap:wrap}
.st-label{color:var(--muted);font-size:12px;margin-right:2px}
.st-btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:12px;transition:border-color .15s}
.st-btn:hover{border-color:var(--acc);color:var(--ink)}
/* ── Mini barra de progreso global ───────────────────────────────── */
.mini-prog{display:inline-block;width:56px;height:5px;background:var(--panel2);border-radius:3px;vertical-align:middle;margin-left:4px;overflow:hidden}
.mini-prog span{display:block;height:100%;background:var(--programacion);border-radius:3px;transition:width .3s}
/* ── Backlinks ───────────────────────────────────────────────────── */
.backlinks{margin-top:22px;padding:10px 14px;background:var(--panel2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;font-size:13px}
.bl-lbl{font-weight:700;color:var(--muted);margin-right:6px}
/* ── Rutas de aprendizaje ────────────────────────────────────────── */
#rutaswrap{flex:1;overflow-y:auto;max-height:calc(100vh - 120px);padding:22px 32px;display:none;background:var(--bg)}
#rutaswrap.show{display:block}
.ruta-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;max-width:840px}
.ruta-hdr{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ruta-ico{font-size:28px;flex-shrink:0}
.ruta-nom{font-size:16px;font-weight:700;margin-bottom:3px}
.ruta-dsc{font-size:12px;color:var(--muted)}
.ruta-st{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;line-height:1.8}
.ruta-pbwrap{height:6px;background:var(--panel2);border-radius:3px;margin:0 0 12px;position:relative;overflow:hidden}
.ruta-pb{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width .4s}
.ruta-pb-v{background:var(--acc);opacity:.35}
.ruta-pb-d{background:var(--programacion)}
.ruta-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px}
.ruta-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;user-select:none}
.ruta-item:hover{background:var(--panel2)}
.ruta-n{color:var(--muted);font-size:11px;min-width:22px;text-align:right;flex-shrink:0}
.ruta-step-ico{width:16px;text-align:center;flex-shrink:0;font-size:13px}
.ruta-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<script>window.DATA=[{"slug": "amortiguamiento-activo-lcl", "titulo": "Amortiguamiento activo del filtro LCL", "categoria": "control", "tipo": "tecnica", "nivel": "avanzado", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["amortiguar la resonancia LCL sin perdidas"], "tags": ["LCL", "resonancia", "damping", "realimentacion", "dq"], "relacionados": ["filtro-lcl", "control-cascada"], "referencias": ["Dannehl et al., Investigation of Active Damping Approaches for LCL Filters, IEEE TIA 2010"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Técnica que amortigua la resonancia del <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a> mediante <strong>realimentación de software</strong>\n(sin resistencias físicas), emulando una resistencia de amortiguamiento. Evita las pérdidas\ndel amortiguamiento pasivo.</p>\n<h2>Fundamento teórico</h2>\n<p>La realimentación de la <strong>corriente del condensador</strong> \\( i_{Cf}=i_{L1}-i_{L2} \\) a la tensión\nde puente con ganancia \\( K_{ad} \\) emula una resistencia en serie con \\( L_1 \\):</p>\n<p>$$ \\mathbf{v}_i = \\mathbf{v}_{i,PI} - K_{ad}\\,(\\mathbf{i}_{L1}-\\mathbf{i}_{L2}) $$</p>\n<p>Esto añade un término disipativo en la dinámica de \\( i_{L1} \\) que amortigua los polos de\nresonancia (lleva su \\( \\zeta \\) de ~0 a un valor útil).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Siempre que la resonancia LCL caiga dentro o cerca del ancho de banda de control, o cuando se\nquiera subir el lazo de tensión sin excitar la resonancia. Es alternativa al amortiguamiento\npasivo (R en serie con \\( C_f \\)), que disipa potencia.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Identifica \\( f_{res} \\) del LCL.</li>\n<li>Mide/sintetiza la <strong>corriente del condensador</strong> (o estímala como \\( i_{L1}-i_{L2} \\)).</li>\n<li>Elige \\( K_{ad} \\) [Ω] para el \\( \\zeta \\) objetivo de la resonancia (≈0.3–0.7). Barre\n   \\( K_{ad} \\) observando los polos de resonancia.</li>\n<li>Verifica que no degrada el margen de los lazos de corriente/tensión.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">iC = iL1 - iL2                 # corriente del condensador (dq)\nvi_d = vi_pi_d - Kad*iC[0]     # resistencia virtual en serie con L1\nvi_q = vi_pi_q - Kad*iC[1]\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( K_{ad} \\) del orden de unos pocos ohmios (en el proyecto, 6 Ω). Existen variantes con\nrealimentación de \\( i_{L2} \\) o de la derivada de \\( v_C \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Ganancia excesiva → ruido amplificado y posible inestabilidad de alta frecuencia.</li>\n<li>Estimar \\( i_{Cf} \\) con retardo de muestreo significativo → el damping pierde eficacia.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: amortiguar la resonancia): \\( K_{ad}=6\\,\\Omega \\) permitió\n  subir el lazo de tensión a 350 Hz; la resonancia (1.1 kHz) quedó con \\( \\zeta\\approx0.13 \\).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a> · <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Dannehl et al., IEEE TIA 2010.</li>\n</ul>", "buscar": "amortiguamiento activo del filtro lcl definición técnica que amortigua la resonancia del filtro-lcl mediante realimentación de software (sin resistencias físicas), emulando una resistencia de amortiguamiento. evita las pérdidas del amortiguamiento pasivo. fundamento teórico la realimentación de la corriente del condensador \\( i {cf}=i {l1}-i {l2} \\) a la tensión de puente con ganancia \\( k {ad} \\) emula una resistencia en serie con \\( l 1 \\): \\mathbf{v} i = \\mathbf{v} {i,pi} - k {ad}\\,(\\mathbf{i} {l1}-\\mathbf{i} {l2}) esto añade un término disipativo en la dinámica de \\( i {l1} \\) que amortigua los polos de resonancia (lleva su \\( \\zeta \\) de ~0 a un valor útil). cuándo y por qué se usa siempre que la resonancia lcl caiga dentro o cerca del ancho de banda de control, o cuando se quiera subir el lazo de tensión sin excitar la resonancia. es alternativa al amortiguamiento pasivo (r en serie con \\( c f \\)), que disipa potencia. procedimiento de diseño (genérico) 1. identifica \\( f {res} \\) del lcl. 2. mide/sintetiza la corriente del condensador (o estímala como \\( i {l1}-i {l2} \\)). 3. elige \\( k {ad} \\) ω para el \\( \\zeta \\) objetivo de la resonancia (≈0.3–0.7). barre \\( k {ad} \\) observando los polos de resonancia. 4. verifica que no degrada el margen de los lazos de corriente/tensión. ejemplo de código python ic = il1 - il2 corriente del condensador (dq) vi d = vi pi d - kad ic 0 resistencia virtual en serie con l1 vi q = vi pi q - kad ic 1 parámetros y valores típicos \\( k {ad} \\) del orden de unos pocos ohmios (en el proyecto, 6 ω). existen variantes con realimentación de \\( i {l2} \\) o de la derivada de \\( v c \\). errores comunes - ganancia excesiva → ruido amplificado y posible inestabilidad de alta frecuencia. - estimar \\( i {cf} \\) con retardo de muestreo significativo → el damping pierde eficacia. uso en proyectos - 01 - gfm-impedance (objetivo: amortiguar la resonancia): \\( k {ad}=6\\,\\omega \\) permitió subir el lazo de tensión a 350 hz; la resonancia (1.1 khz) quedó con \\( \\zeta\\approx0.13 \\). conceptos relacionados - filtro-lcl · control-cascada referencias - dannehl et al., ieee tia 2010. lcl resonancia damping realimentacion dq"}, {"slug": "analisis-modal", "titulo": "Análisis modal (autovalores, participación, amortiguamiento)", "categoria": "control", "tipo": "metodo", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance", "03-DataCenter-IA"], "objetivos": ["evaluar estabilidad e identificar el origen de cada modo"], "tags": ["autovalores", "polos", "participacion", "zeta", "estabilidad"], "relacionados": ["linealizacion-numerica", "droop-control", "impedancia-salida-estabilidad"], "referencias": ["Kundur, Power System Stability and Control, McGraw-Hill 1994 (cap. 12)"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Estudio de la estabilidad de un sistema lineal a partir de los <strong>autovalores</strong> de \\( A \\)\n(modos), su <strong>amortiguamiento</strong> \\( \\zeta \\) y <strong>frecuencia</strong>, y los <strong>factores de participación</strong>\nque indican qué estados forman cada modo.</p>\n<h2>Fundamento teórico</h2>\n<p>Para un autovalor \\( \\lambda=\\sigma\\pm j\\omega_d \\):\n$$ f=\\frac{|\\omega_d|}{2\\pi}, \\qquad \\zeta=\\frac{-\\sigma}{|\\lambda|} $$\nEstable si \\( \\sigma<0 \\) para todos los modos. El <strong>factor de participación</strong> del estado \\( k \\)\nen el modo \\( i \\) combina los autovectores derecho \\( \\phi \\) e izquierdo \\( \\psi \\):\n\\( p_{ki}=|\\psi_{ik}\\,\\phi_{ki}| \\). Identifica qué dinámica domina cada modo → guía el rediseño.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para saber no solo <strong>si</strong> es estable, sino <strong>qué</strong> modo es problemático y <strong>qué estados</strong> lo\ngeneran: clave para diagnosticar y corregir (¿es el lazo de potencia? ¿la resonancia LCL?).</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Linealiza para obtener \\( A \\) (ver <a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a>).</li>\n<li><code>eig(A)</code> → autovalores y autovectores.</li>\n<li>Para cada modo de interés calcula \\( f,\\zeta \\) y los factores de participación.</li>\n<li>Si un modo está mal amortiguado/inestable, mira qué estados participan y actúa sobre esa\n   parte (ganancia, filtro, impedancia virtual...).</li>\n<li>Criterio práctico de aceptación: \\( \\zeta>0.1 \\) (idealmente &gt;0.3) en modos de control.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\nw, V = np.linalg.eig(A)                 # autovalores y autovectores derechos\ni = np.argmax(w.real)                   # modo menos estable\nf = abs(w[i].imag)/(2*np.pi); zeta = -w[i].real/abs(w[i])\npart = np.abs(V[:, i]); part /= part.max()   # participacion aproximada\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( \\zeta \\) objetivo: &gt;0.1 aceptable, &gt;0.3 bueno. Modos electromecánicos lentos (1–10 Hz),\nresonancias de filtro (cientos de Hz–kHz).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mirar solo \\( \\max\\text{Re} \\) sin el amortiguamiento: un sistema \"estable\" puede tener un\n  modo con \\( \\zeta \\) pésimo.</li>\n<li>Ignorar los factores de participación → se ajusta a ciegas.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: diagnóstico): los factores de participación revelaron que\n  el modo inestable inicial estaba dominado por \\( P_m,Q_m \\) (lazo de potencia), lo que orientó\n  todo el rediseño. Modo final de potencia: 3.3 Hz, \\( \\zeta=0.40 \\).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a> · <a class=\"wl\" data-slug=\"droop-control\">droop-control</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Kundur, <em>Power System Stability and Control</em>, 1994.</li>\n</ul>", "buscar": "análisis modal (autovalores, participación, amortiguamiento) definición estudio de la estabilidad de un sistema lineal a partir de los autovalores de \\( a \\) (modos), su amortiguamiento \\( \\zeta \\) y frecuencia , y los factores de participación que indican qué estados forman cada modo. fundamento teórico para un autovalor \\( \\lambda=\\sigma\\pm j\\omega d \\): f=\\frac{|\\omega d|}{2\\pi}, \\qquad \\zeta=\\frac{-\\sigma}{|\\lambda|} estable si \\( \\sigma<0 \\) para todos los modos. el factor de participación del estado \\( k \\) en el modo \\( i \\) combina los autovectores derecho \\( \\phi \\) e izquierdo \\( \\psi \\): \\( p {ki}=|\\psi {ik}\\,\\phi {ki}| \\). identifica qué dinámica domina cada modo → guía el rediseño. cuándo y por qué se usa para saber no solo si es estable, sino qué modo es problemático y qué estados lo generan: clave para diagnosticar y corregir (¿es el lazo de potencia? ¿la resonancia lcl?). procedimiento de diseño (genérico) 1. linealiza para obtener \\( a \\) (ver linealizacion-numerica ). 2. eig(a) → autovalores y autovectores. 3. para cada modo de interés calcula \\( f,\\zeta \\) y los factores de participación. 4. si un modo está mal amortiguado/inestable, mira qué estados participan y actúa sobre esa parte (ganancia, filtro, impedancia virtual...). 5. criterio práctico de aceptación: \\( \\zeta 0.1 \\) (idealmente 0.3) en modos de control. ejemplo de código python import numpy as np w, v = np.linalg.eig(a) autovalores y autovectores derechos i = np.argmax(w.real) modo menos estable f = abs(w i .imag)/(2 np.pi); zeta = -w i .real/abs(w i ) part = np.abs(v :, i ); part /= part.max() participacion aproximada parámetros y valores típicos \\( \\zeta \\) objetivo: 0.1 aceptable, 0.3 bueno. modos electromecánicos lentos (1–10 hz), resonancias de filtro (cientos de hz–khz). errores comunes - mirar solo \\( \\max\\text{re} \\) sin el amortiguamiento: un sistema \"estable\" puede tener un modo con \\( \\zeta \\) pésimo. - ignorar los factores de participación → se ajusta a ciegas. uso en proyectos - 01 - gfm-impedance (objetivo: diagnóstico): los factores de participación revelaron que el modo inestable inicial estaba dominado por \\( p m,q m \\) (lazo de potencia), lo que orientó todo el rediseño. modo final de potencia: 3.3 hz, \\( \\zeta=0.40 \\). conceptos relacionados - linealizacion-numerica · droop-control · impedancia-salida-estabilidad referencias - kundur, power system stability and control , 1994. autovalores polos participacion zeta estabilidad"}, {"slug": "anti-windup", "titulo": "Anti-windup del integrador", "categoria": "control", "tipo": "tecnica", "nivel": "basico", "proyectos": [], "objetivos": ["evitar la sobrecarga del término integral cuando el actuador satura"], "tags": ["anti-windup", "saturacion", "integrador", "back-calculation", "basico", "control"], "relacionados": ["controlador-pid", "current-limiting", "sintonia-pi-pid", "error-regimen-permanente"], "referencias": ["Aström, Hägglund, PID Controllers, ISA 1995", "Aström, Murray, Feedback Systems, Princeton 2008"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Conjunto de técnicas que <strong>detienen o corrigen la integración</strong> mientras el actuador está\nsaturado, para que el término integral no acumule un valor enorme (\"wind-up\") que retrasaría\ngravemente la recuperación.</p>\n<h2>Fundamento teórico</h2>\n<p>Al saturar, el lazo queda <strong>abierto</strong>: el error persiste y el integrador sigue cargando aunque la\nsalida ya no cambie. La recuperación exige \"descargar\" esa integral, causando gran sobreimpulso.\nEsquema de <strong>back-calculation</strong>: se realimenta la diferencia entre la señal calculada \\( u \\) y la\nsaturada \\( u_{sat} \\) al integrador con ganancia \\( 1/T_t \\):\n$$ \\dot I = K_i e + \\frac{1}{T_t}\\,(u_{sat}-u) $$\nCon \\( u=K_p e + I \\). Cuando no hay saturación, \\( u_{sat}=u \\) y el término extra desaparece.\nAlternativas: <strong>clamping</strong> (congelar \\( I \\) si satura y el error empuja más a la saturación) o\nforma <strong>velocidad</strong> (incremental), que es intrínsecamente anti-windup.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En todo lazo PI con límites físicos: corriente, tensión de modulación, par. Imprescindible junto\nal <a class=\"wl\" data-slug=\"current-limiting\">current-limiting</a> de convertidores, donde la referencia se recorta con frecuencia.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Modela el saturador real (límites de \\( u \\)).</li>\n<li>Elige el esquema (back-calculation suele ser el más robusto).</li>\n<li>Sintoniza \\( T_t \\): regla habitual \\( T_t\\approx\\sqrt{T_i T_d} \\) o \\( T_t\\in[T_i/2,\\,T_i] \\).</li>\n<li>Verifica recuperación sin sobreimpulso tras una saturación prolongada.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> PI de corriente con límite de modulación \\( |u|_{max}=1\\,\\text{p.u.} \\). Se aplica una referencia de 2 p.u. durante 80 ms (saturación inevitable). Comparar recuperación con y sin back-calculation (\\( T_t=T_i/2 \\)).</p>\n<p>Sin anti-windup: durante la saturación el integrador acumula hasta \\( I\\approx K_i\\times2\\,\\text{p.u.}\\times0.08\\,\\text{s}\\approx50\\,\\text{p.u.} \\) (con \\( K_i=315 \\)). Al liberar la saturación, el integrador debe descargarse desde 50 a ~1 p.u. generando un sobreimpulso de corriente de muchas veces la nominal. Con back-calculation: el término \\( (u_{sat}-u)/T_t \\) mantiene \\( I\\approx1\\,\\text{p.u.} \\) durante la saturación. Al liberar, el sobreimpulso queda por debajo del 5 %. Ajuste: \\( T_t\\approx T_i/3\\ldots T_i/2 \\). Demasiado pequeño → ruidoso; demasiado grande → anti-windup ineficaz.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def pi_aw(e, I, Kp, Ki, Tt, umin, umax, dt):\n    u = Kp*e + I\n    usat = min(max(u, umin), umax)\n    I += (Ki*e + (usat-u)/Tt)*dt        # back-calculation\n    return usat, I\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( T_t \\) del orden del tiempo integral \\( T_i \\) (un poco menor). Demasiado pequeño → ruidoso;\ndemasiado grande → anti-windup ineficaz.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Saturar la salida pero seguir integrando el error completo (windup clásico).</li>\n<li>Poner \\( T_t \\) sin relación con \\( T_i \\).</li>\n<li>Olvidar que en cascada el lazo externo también necesita anti-windup si su salida (referencia\n  del interno) se limita.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"controlador-pid\">controlador-pid</a> · <a class=\"wl\" data-slug=\"current-limiting\">current-limiting</a> · <a class=\"wl\" data-slug=\"sintonia-pi-pid\">sintonia-pi-pid</a> · <a class=\"wl\" data-slug=\"error-regimen-permanente\">error-regimen-permanente</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Aström, Hägglund, <em>PID Controllers</em>, 1995.</li>\n<li>Aström, Murray, <em>Feedback Systems</em>, 2008.</li>\n</ul>", "buscar": "anti-windup del integrador definición conjunto de técnicas que detienen o corrigen la integración mientras el actuador está saturado, para que el término integral no acumule un valor enorme (\"wind-up\") que retrasaría gravemente la recuperación. fundamento teórico al saturar, el lazo queda abierto : el error persiste y el integrador sigue cargando aunque la salida ya no cambie. la recuperación exige \"descargar\" esa integral, causando gran sobreimpulso. esquema de back-calculation : se realimenta la diferencia entre la señal calculada \\( u \\) y la saturada \\( u {sat} \\) al integrador con ganancia \\( 1/t t \\): \\dot i = k i e + \\frac{1}{t t}\\,(u {sat}-u) con \\( u=k p e + i \\). cuando no hay saturación, \\( u {sat}=u \\) y el término extra desaparece. alternativas: clamping (congelar \\( i \\) si satura y el error empuja más a la saturación) o forma velocidad (incremental), que es intrínsecamente anti-windup. cuándo y por qué se usa en todo lazo pi con límites físicos: corriente, tensión de modulación, par. imprescindible junto al current-limiting de convertidores, donde la referencia se recorta con frecuencia. procedimiento (genérico) 1. modela el saturador real (límites de \\( u \\)). 2. elige el esquema (back-calculation suele ser el más robusto). 3. sintoniza \\( t t \\): regla habitual \\( t t\\approx\\sqrt{t i t d} \\) o \\( t t\\in t i/2,\\,t i \\). 4. verifica recuperación sin sobreimpulso tras una saturación prolongada. ejemplo de aplicación real problema: pi de corriente con límite de modulación \\( |u| {max}=1\\,\\text{p.u.} \\). se aplica una referencia de 2 p.u. durante 80 ms (saturación inevitable). comparar recuperación con y sin back-calculation (\\( t t=t i/2 \\)). sin anti-windup: durante la saturación el integrador acumula hasta \\( i\\approx k i\\times2\\,\\text{p.u.}\\times0.08\\,\\text{s}\\approx50\\,\\text{p.u.} \\) (con \\( k i=315 \\)). al liberar la saturación, el integrador debe descargarse desde 50 a ~1 p.u. generando un sobreimpulso de corriente de muchas veces la nominal. con back-calculation: el término \\( (u {sat}-u)/t t \\) mantiene \\( i\\approx1\\,\\text{p.u.} \\) durante la saturación. al liberar, el sobreimpulso queda por debajo del 5 %. ajuste: \\( t t\\approx t i/3\\ldots t i/2 \\). demasiado pequeño → ruidoso; demasiado grande → anti-windup ineficaz. ejemplo de código python def pi aw(e, i, kp, ki, tt, umin, umax, dt): u = kp e + i usat = min(max(u, umin), umax) i += (ki e + (usat-u)/tt) dt back-calculation return usat, i parámetros y valores típicos \\( t t \\) del orden del tiempo integral \\( t i \\) (un poco menor). demasiado pequeño → ruidoso; demasiado grande → anti-windup ineficaz. errores comunes - saturar la salida pero seguir integrando el error completo (windup clásico). - poner \\( t t \\) sin relación con \\( t i \\). - olvidar que en cascada el lazo externo también necesita anti-windup si su salida (referencia del interno) se limita. conceptos relacionados - controlador-pid · current-limiting · sintonia-pi-pid · error-regimen-permanente referencias - aström, hägglund, pid controllers , 1995. - aström, murray, feedback systems , 2008. anti-windup saturacion integrador back-calculation basico control"}, {"slug": "compensacion-retardo", "titulo": "Compensación de retardo (Smith predictor, retardo digital)", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": [], "objetivos": ["recuperar margen y desempeño perdidos por el retardo de cómputo y PWM"], "tags": ["retardo", "smith-predictor", "computo", "pwm", "prediccion", "fase", "intermedio", "control"], "relacionados": ["discretizacion-controladores", "margenes-estabilidad", "desacoplo-dq", "estabilidad-armonica", "controlador-pid"], "referencias": ["Buso, Mattavelli, Digital Control in Power Electronics, Morgan & Claypool 2006", "Åström, Hägglund, Advanced PID Control, ISA 2006"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Conjunto de técnicas para <strong>contrarrestar el efecto desestabilizador del retardo</strong> del control\ndigital (cómputo + modulación), que resta fase y limita el ancho de banda. Incluye la predicción de\nestados y el <strong>predictor de Smith</strong> para retardos dominantes.</p>\n<h2>Fundamento teórico</h2>\n<p>En un convertidor digital el retardo total es típicamente \\( T_d\\approx1.5\\,T_s \\) (un periodo de\ncómputo + medio de PWM/ZOH). Su efecto en frecuencia es fase pura:\n$$ e^{-sT_d}\\ \\Rightarrow\\ \\Delta\\phi(\\omega)=-\\omega T_d $$\nque <strong>resta margen de fase</strong> proporcional a \\( \\omega_c \\) y empuja la impedancia hacia la\nno-pasividad (<a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad-armonica</a>). Compensaciones:\n- <strong>Predicción de estados / corriente:</strong> estimar el valor de la variable \\( T_d \\) por delante\n  (modelo del filtro, observador) y controlar sobre la predicción → cancela el retardo dentro de la\n  banda del modelo.\n- <strong>Predictor de Smith:</strong> para una planta \\( G(s)e^{-sT_d} \\), realimenta una predicción <strong>sin\n  retardo</strong> usando un modelo \\( \\hat G \\):\n  $$ C_{eq}(s)=\\frac{C(s)}{1+C(s)\\hat G(s)\\,(1-e^{-sT_d})} $$\n  Así el controlador \"ve\" \\( \\hat G(s) \\) sin retardo y se sintoniza como si no lo hubiera; el\n  retardo queda fuera del lazo característico (si el modelo es exacto).\n- <strong>Adelanto de ángulo:</strong> en dq, rotar la referencia/medida \\( \\omega T_d \\) compensa el giro del\n  marco durante el retardo (mejora el <a class=\"wl\" data-slug=\"desacoplo-dq\">desacoplo</a>).</p>\n<p>Limitación: todas dependen de la <strong>exactitud del modelo</strong>; un \\( \\hat G \\) o \\( T_d \\) erróneo\nreintroduce error y puede empeorar la robustez.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En lazos rápidos (corriente) con \\( f_c \\) cercano a \\( f_s/10 \\), donde el retardo ya cuesta varios\ngrados de margen; en convertidores de alta frecuencia de cruce; y para mejorar la pasividad de la\nimpedancia a alta frecuencia.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Cuantifica \\( T_d \\) real (cómputo + actualización PWM) y su \\( \\Delta\\phi \\) en \\( \\omega_c \\).</li>\n<li>Decide técnica: predicción de estados (robusta, sencilla) o Smith (retardos grandes).</li>\n<li>Implementa el predictor con el modelo \\( \\hat G \\) y verifica robustez a error de \\( \\hat G,T_d \\).</li>\n<li>Re-evalúa <a class=\"wl\" data-slug=\"margenes-estabilidad\">márgenes</a> e impedancia con el compensador.</li>\n<li>Discretiza con cuidado (<a class=\"wl\" data-slug=\"discretizacion-controladores\">discretizacion-controladores</a>).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># Adelanto de angulo en dq por el retardo de computo+PWM\nimport numpy as np\ndef angle_advance(theta, w, Td):\n    return theta + w*Td                 # rota referencia para compensar el retardo\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( T_d\\approx1.5\\,T_s \\). Adelanto de ángulo \\( \\omega T_d \\). El predictor de Smith es sensible a\nerrores de modelo &gt; 10–20 %.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Despreciar \\( T_d \\) al diseñar (márgenes optimistas que no se cumplen en hardware).</li>\n<li>Predictor de Smith con modelo pobre → peor que sin compensar.</li>\n<li>Sobre-predecir (compensar de más) → adelanto excesivo y ruido amplificado.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"discretizacion-controladores\">discretizacion-controladores</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"desacoplo-dq\">desacoplo-dq</a> · <a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad-armonica</a> · <a class=\"wl\" data-slug=\"controlador-pid\">controlador-pid</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Buso, Mattavelli, <em>Digital Control in Power Electronics</em>, 2006.</li>\n<li>Åström, Hägglund, <em>Advanced PID Control</em>, 2006.</li>\n</ul>", "buscar": "compensación de retardo (smith predictor, retardo digital) definición conjunto de técnicas para contrarrestar el efecto desestabilizador del retardo del control digital (cómputo + modulación), que resta fase y limita el ancho de banda. incluye la predicción de estados y el predictor de smith para retardos dominantes. fundamento teórico en un convertidor digital el retardo total es típicamente \\( t d\\approx1.5\\,t s \\) (un periodo de cómputo + medio de pwm/zoh). su efecto en frecuencia es fase pura: e^{-st d}\\ \\rightarrow\\ \\delta\\phi(\\omega)=-\\omega t d que resta margen de fase proporcional a \\( \\omega c \\) y empuja la impedancia hacia la no-pasividad ( estabilidad-armonica ). compensaciones: - predicción de estados / corriente: estimar el valor de la variable \\( t d \\) por delante (modelo del filtro, observador) y controlar sobre la predicción → cancela el retardo dentro de la banda del modelo. - predictor de smith: para una planta \\( g(s)e^{-st d} \\), realimenta una predicción sin retardo usando un modelo \\( \\hat g \\): c {eq}(s)=\\frac{c(s)}{1+c(s)\\hat g(s)\\,(1-e^{-st d})} así el controlador \"ve\" \\( \\hat g(s) \\) sin retardo y se sintoniza como si no lo hubiera; el retardo queda fuera del lazo característico (si el modelo es exacto). - adelanto de ángulo: en dq, rotar la referencia/medida \\( \\omega t d \\) compensa el giro del marco durante el retardo (mejora el desacoplo-dq|desacoplo ). limitación: todas dependen de la exactitud del modelo ; un \\( \\hat g \\) o \\( t d \\) erróneo reintroduce error y puede empeorar la robustez. cuándo y por qué se usa en lazos rápidos (corriente) con \\( f c \\) cercano a \\( f s/10 \\), donde el retardo ya cuesta varios grados de margen; en convertidores de alta frecuencia de cruce; y para mejorar la pasividad de la impedancia a alta frecuencia. procedimiento de diseño (genérico) 1. cuantifica \\( t d \\) real (cómputo + actualización pwm) y su \\( \\delta\\phi \\) en \\( \\omega c \\). 2. decide técnica: predicción de estados (robusta, sencilla) o smith (retardos grandes). 3. implementa el predictor con el modelo \\( \\hat g \\) y verifica robustez a error de \\( \\hat g,t d \\). 4. re-evalúa margenes-estabilidad|márgenes e impedancia con el compensador. 5. discretiza con cuidado ( discretizacion-controladores ). ejemplo de código python adelanto de angulo en dq por el retardo de computo+pwm import numpy as np def angle advance(theta, w, td): return theta + w td rota referencia para compensar el retardo parámetros y valores típicos \\( t d\\approx1.5\\,t s \\). adelanto de ángulo \\( \\omega t d \\). el predictor de smith es sensible a errores de modelo 10–20 %. errores comunes - despreciar \\( t d \\) al diseñar (márgenes optimistas que no se cumplen en hardware). - predictor de smith con modelo pobre → peor que sin compensar. - sobre-predecir (compensar de más) → adelanto excesivo y ruido amplificado. conceptos relacionados - discretizacion-controladores · margenes-estabilidad · desacoplo-dq · estabilidad-armonica · controlador-pid referencias - buso, mattavelli, digital control in power electronics , 2006. - åström, hägglund, advanced pid control , 2006. retardo smith-predictor computo pwm prediccion fase intermedio control"}, {"slug": "compensador-adelanto-atraso", "titulo": "Compensador de adelanto-atraso (lead-lag)", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": [], "objetivos": ["moldear fase y ganancia del lazo para fijar margen y ancho de banda"], "tags": ["lead-lag", "adelanto", "atraso", "compensador", "frecuencia", "intermedio", "control"], "relacionados": ["loop-shaping", "lugar-raices", "diagrama-bode", "margenes-estabilidad", "controlador-pid"], "referencias": ["Ogata, Ingeniería de Control Moderna, Pearson", "Franklin, Powell, Feedback Control of Dynamic Systems, Pearson"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Compensador clásico de primer orden que <strong>aporta fase</strong> (adelanto) o <strong>reduce ganancia en alta\nfrecuencia / mejora la de baja</strong> (atraso) para moldear la respuesta en frecuencia del lazo. Es la\nversión analógica/continua del moldeo que en digital harías con un PID filtrado.</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Adelanto (lead)</strong> \\( (\\alpha>1) \\):\n$$ C(s)=K_c\\,\\frac{1+\\alpha T s}{1+T s},\\qquad\n   \\phi_{max}=\\arcsin\\frac{\\alpha-1}{\\alpha+1}\\ \\text{ en }\\ \\omega_m=\\frac{1}{T\\sqrt{\\alpha}} $$\nAporta hasta \\( \\phi_{max} \\) de fase (≈55–65° por etapa con \\( \\alpha\\le10 \\)) cerca del cruce de\nganancia → <strong>sube el margen de fase y el ancho de banda</strong>; eleva la ganancia en alta (más rápido,\npero más ruido). Es análogo a un PD filtrado.</p>\n<p><strong>Atraso (lag)</strong> \\( (\\alpha<1) \\): misma forma; añade ganancia en baja frecuencia\n(<strong>reduce el error en régimen permanente</strong>) y atenúa en alta, a costa de un poco de fase negativa\nque se coloca lejos del cruce. Análogo a un PI aproximado.</p>\n<p><strong>Lead-lag</strong> combina ambos: el lag mejora el error estacionario y el lead recupera el margen y la\nvelocidad.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando un P/PI no basta para cumplir simultáneamente margen, ancho de banda y error, o cuando se\nprefiere un compensador propio (sin el polo en el origen del integrador) y bien condicionado para\ndiscretizar. Encaja con el enfoque de <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> y se diseña sobre <a class=\"wl\" data-slug=\"diagrama-bode\">diagrama-bode</a> o\n<a class=\"wl\" data-slug=\"lugar-raices\">lugar-raices</a>.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Fija especificaciones: margen de fase y \\( \\omega_c \\) objetivo (de las <a class=\"wl\" data-slug=\"especificaciones-control\">especificaciones-control</a>).</li>\n<li>Evalúa la fase que falta en \\( \\omega_c \\) → fase a aportar por el <strong>lead</strong> (margen extra 5–10°).</li>\n<li>Calcula \\( \\alpha=\\dfrac{1+\\sin\\phi_{max}}{1-\\sin\\phi_{max}} \\) y \\( T=\\dfrac{1}{\\omega_c\\sqrt\\alpha} \\).</li>\n<li>Ajusta \\( K_c \\) para que el cruce caiga en \\( \\omega_c \\).</li>\n<li>Si falla el error estacionario, añade una etapa <strong>lag</strong> en baja frecuencia.</li>\n<li>Verifica márgenes (<a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a>) y discretiza (<a class=\"wl\" data-slug=\"discretizacion-controladores\">discretizacion-controladores</a>).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Lazo de posición de un accionamiento con margen de fase de 22° (objetivo 45°). Diseñar un compensador de adelanto de una etapa que aporte los 23° necesarios sin degradar el cruce.</p>\n<p>Fase a aportar con 5° de margen extra: \\( \\phi_{max}=28° \\). Factor: \\( \\alpha=(1+\\sin28°)/(1-\\sin28°)\\approx2.77 \\). Constante de tiempo: \\( T=1/(\\omega_c\\sqrt{\\alpha})=1/(200\\times1.66)=3.0\\,\\text{ms} \\). Compensador: \\( C(s)=(1+\\alpha T s)/(1+Ts)=(1+8.3\\times10^{-3}s)/(1+3.0\\times10^{-3}s) \\). A \\( \\omega_c=200\\,\\text{rad/s} \\), la ganancia del compensador es \\( \\sqrt{\\alpha}\\approx1.66 \\) (+4.4 dB): reducir \\( K_c \\) en esa proporción para mantener el cruce en \\( \\omega_c \\). Resultado final: margen de fase \\( \\approx22+28=50° \\) ✓. Si \\( \\alpha>10 \\) la amplificación de ruido sería inaceptable: encadenar dos etapas en lugar de una.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct, numpy as np\nphi = np.deg2rad(50); wc = 200.0\nalpha = (1+np.sin(phi))/(1-np.sin(phi)); T = 1/(wc*np.sqrt(alpha))\nlead = ct.tf([alpha*T, 1], [T, 1])      # 1 etapa de adelanto\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Por etapa de adelanto: \\( \\alpha \\le 10 \\) (\\( \\phi_{max}\\lesssim 55^\\circ \\)); para más fase,\n<strong>encadena</strong> etapas. La separación lead/lag suele ser de una década respecto a \\( \\omega_c \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Pedir demasiada fase a una sola etapa (\\( \\alpha \\) enorme) → amplifica ruido en alta frecuencia.</li>\n<li>Colocar el cero/polo del lag cerca de \\( \\omega_c \\) → resta fase donde más duele.</li>\n<li>Olvidar reescalar \\( K_c \\) tras añadir el compensador (el cruce se mueve).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> · <a class=\"wl\" data-slug=\"lugar-raices\">lugar-raices</a> · <a class=\"wl\" data-slug=\"diagrama-bode\">diagrama-bode</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"controlador-pid\">controlador-pid</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Ogata, <em>Ingeniería de Control Moderna</em>.</li>\n<li>Franklin, Powell, <em>Feedback Control of Dynamic Systems</em>.</li>\n</ul>", "buscar": "compensador de adelanto-atraso (lead-lag) definición compensador clásico de primer orden que aporta fase (adelanto) o reduce ganancia en alta frecuencia / mejora la de baja (atraso) para moldear la respuesta en frecuencia del lazo. es la versión analógica/continua del moldeo que en digital harías con un pid filtrado. fundamento teórico adelanto (lead) \\( (\\alpha 1) \\): c(s)=k c\\,\\frac{1+\\alpha t s}{1+t s},\\qquad \\phi {max}=\\arcsin\\frac{\\alpha-1}{\\alpha+1}\\ \\text{ en }\\ \\omega m=\\frac{1}{t\\sqrt{\\alpha}} aporta hasta \\( \\phi {max} \\) de fase (≈55–65° por etapa con \\( \\alpha\\le10 \\)) cerca del cruce de ganancia → sube el margen de fase y el ancho de banda ; eleva la ganancia en alta (más rápido, pero más ruido). es análogo a un pd filtrado. atraso (lag) \\( (\\alpha<1) \\): misma forma; añade ganancia en baja frecuencia ( reduce el error en régimen permanente ) y atenúa en alta, a costa de un poco de fase negativa que se coloca lejos del cruce. análogo a un pi aproximado. lead-lag combina ambos: el lag mejora el error estacionario y el lead recupera el margen y la velocidad. cuándo y por qué se usa cuando un p/pi no basta para cumplir simultáneamente margen, ancho de banda y error, o cuando se prefiere un compensador propio (sin el polo en el origen del integrador) y bien condicionado para discretizar. encaja con el enfoque de loop-shaping y se diseña sobre diagrama-bode o lugar-raices . procedimiento de diseño (genérico) 1. fija especificaciones: margen de fase y \\( \\omega c \\) objetivo (de las especificaciones-control ). 2. evalúa la fase que falta en \\( \\omega c \\) → fase a aportar por el lead (margen extra 5–10°). 3. calcula \\( \\alpha=\\dfrac{1+\\sin\\phi {max}}{1-\\sin\\phi {max}} \\) y \\( t=\\dfrac{1}{\\omega c\\sqrt\\alpha} \\). 4. ajusta \\( k c \\) para que el cruce caiga en \\( \\omega c \\). 5. si falla el error estacionario, añade una etapa lag en baja frecuencia. 6. verifica márgenes ( margenes-estabilidad ) y discretiza ( discretizacion-controladores ). ejemplo de aplicación real problema: lazo de posición de un accionamiento con margen de fase de 22° (objetivo 45°). diseñar un compensador de adelanto de una etapa que aporte los 23° necesarios sin degradar el cruce. fase a aportar con 5° de margen extra: \\( \\phi {max}=28° \\). factor: \\( \\alpha=(1+\\sin28°)/(1-\\sin28°)\\approx2.77 \\). constante de tiempo: \\( t=1/(\\omega c\\sqrt{\\alpha})=1/(200\\times1.66)=3.0\\,\\text{ms} \\). compensador: \\( c(s)=(1+\\alpha t s)/(1+ts)=(1+8.3\\times10^{-3}s)/(1+3.0\\times10^{-3}s) \\). a \\( \\omega c=200\\,\\text{rad/s} \\), la ganancia del compensador es \\( \\sqrt{\\alpha}\\approx1.66 \\) (+4.4 db): reducir \\( k c \\) en esa proporción para mantener el cruce en \\( \\omega c \\). resultado final: margen de fase \\( \\approx22+28=50° \\) ✓. si \\( \\alpha 10 \\) la amplificación de ruido sería inaceptable: encadenar dos etapas en lugar de una. ejemplo de código python import control as ct, numpy as np phi = np.deg2rad(50); wc = 200.0 alpha = (1+np.sin(phi))/(1-np.sin(phi)); t = 1/(wc np.sqrt(alpha)) lead = ct.tf( alpha t, 1 , t, 1 ) 1 etapa de adelanto parámetros y valores típicos por etapa de adelanto: \\( \\alpha \\le 10 \\) (\\( \\phi {max}\\lesssim 55^\\circ \\)); para más fase, encadena etapas. la separación lead/lag suele ser de una década respecto a \\( \\omega c \\). errores comunes - pedir demasiada fase a una sola etapa (\\( \\alpha \\) enorme) → amplifica ruido en alta frecuencia. - colocar el cero/polo del lag cerca de \\( \\omega c \\) → resta fase donde más duele. - olvidar reescalar \\( k c \\) tras añadir el compensador (el cruce se mueve). conceptos relacionados - loop-shaping · lugar-raices · diagrama-bode · margenes-estabilidad · controlador-pid referencias - ogata, ingeniería de control moderna . - franklin, powell, feedback control of dynamic systems . lead-lag adelanto atraso compensador frecuencia intermedio control"}, {"slug": "control-cascada", "titulo": "Control en cascada (lazos de corriente y tensión)", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["regular la tension del condensador con lazos anidados"], "tags": ["cascada", "PI", "desacoplo", "dq", "ancho-de-banda"], "relacionados": ["filtro-lcl", "amortiguamiento-activo-lcl", "marco-dq", "droop-control"], "referencias": ["Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Arquitectura de control con lazos anidados: un lazo <strong>interno de corriente</strong> (rápido) dentro\nde un lazo <strong>externo de tensión</strong> (más lento), cada uno un PI en el marco dq con desacoplo\ncruzado.</p>\n<h2>Fundamento teórico</h2>\n<p>Lazo de corriente sobre \\( i_{L1} \\) (planta \\( 1/(sL_1+R_1) \\)) y lazo de tensión sobre\n\\( v_C \\). El <strong>desacoplo</strong> cancela los términos cruzados \\( \\pm\\omega L \\), \\( \\pm\\omega C \\)\ndel marco giratorio:\n$$ v_i = K_{p,i}e_i + K_{i,i}\\!\\int e_i \\;\\mp\\; \\omega L_1 i_{L1q,d} + v_C $$\n$$ i_{L1}^{*} = K_{p,v}e_v + K_{i,v}\\!\\int e_v \\;\\mp\\; \\omega C_f v_{Cq,d} $$\n<strong>Regla de oro</strong>: cada lazo interno ~5–10× más rápido que el externo (separación de escalas).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Estándar en convertidores con control de tensión (grid-forming, UPS). El lazo de corriente da\nprotección y rechazo rápido; el de tensión fija el punto de operación.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li><strong>Lazo de corriente</strong> (ancho de banda \\( f_{ci}\\sim f_{sw}/10 \\)): PI por cancelación del\n   polo de planta → \\( K_{p,i}=L_1\\omega_{ci},\\; K_{i,i}=R_1\\omega_{ci} \\).</li>\n<li><strong>Lazo de tensión</strong> (\\( f_{cv}\\sim f_{ci}/3 \\) a /5): \\( K_{p,v}=C_f\\omega_{cv} \\), \\( K_{i,v} \\)\n   por el cero deseado.</li>\n<li>Añade <strong>desacoplo</strong> \\( \\pm\\omega L,\\ \\pm\\omega C \\) y feedforward de \\( v_C \\).</li>\n<li>Si la resonancia LCL limita \\( f_{cv} \\), añade <a class=\"wl\" data-slug=\"amortiguamiento-activo-lcl\">amortiguamiento-activo-lcl</a> primero.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># lazo tension -&gt; referencia de corriente (con desacoplo)\niL1ref_d = Kp_v*ev_d + Ki_v*xvd - w*Cf*vcq\n# lazo corriente -&gt; tension de puente (con desacoplo + feedforward vc)\nvid = Kp_i*ei_d + Ki_i*xid - w*L1*iL1q + vcd\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( f_{ci} \\) ≈ 0.5–1.5 kHz, \\( f_{cv} \\) ≈ 100–400 Hz. En el proyecto: 1 kHz / 350 Hz.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li><strong>Feedforward de corriente de carga mal usado</strong>: en el proyecto desestabilizaba (lazo\n  positivo). Verifica los feedforward en lazo cerrado.</li>\n<li>Subir el lazo de tensión sin amortiguar la resonancia LCL → la excita.</li>\n<li>Olvidar el signo del desacoplo cruzado.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: regular v_C): cascada corriente(1 kHz)/tensión(350 Hz)\n  con desacoplo. El feedforward de carga inicial se eliminó por desestabilizar.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a> · <a class=\"wl\" data-slug=\"amortiguamiento-activo-lcl\">amortiguamiento-activo-lcl</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"droop-control\">droop-control</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Yazdani, Iravani, <em>Voltage-Sourced Converters in Power Systems</em>, 2010.</li>\n</ul>", "buscar": "control en cascada (lazos de corriente y tensión) definición arquitectura de control con lazos anidados: un lazo interno de corriente (rápido) dentro de un lazo externo de tensión (más lento), cada uno un pi en el marco dq con desacoplo cruzado. fundamento teórico lazo de corriente sobre \\( i {l1} \\) (planta \\( 1/(sl 1+r 1) \\)) y lazo de tensión sobre \\( v c \\). el desacoplo cancela los términos cruzados \\( \\pm\\omega l \\), \\( \\pm\\omega c \\) del marco giratorio: v i = k {p,i}e i + k {i,i}\\!\\int e i \\;\\mp\\; \\omega l 1 i {l1q,d} + v c i {l1}^{ } = k {p,v}e v + k {i,v}\\!\\int e v \\;\\mp\\; \\omega c f v {cq,d} regla de oro : cada lazo interno ~5–10× más rápido que el externo (separación de escalas). cuándo y por qué se usa estándar en convertidores con control de tensión (grid-forming, ups). el lazo de corriente da protección y rechazo rápido; el de tensión fija el punto de operación. procedimiento de diseño (genérico) 1. lazo de corriente (ancho de banda \\( f {ci}\\sim f {sw}/10 \\)): pi por cancelación del polo de planta → \\( k {p,i}=l 1\\omega {ci},\\; k {i,i}=r 1\\omega {ci} \\). 2. lazo de tensión (\\( f {cv}\\sim f {ci}/3 \\) a /5): \\( k {p,v}=c f\\omega {cv} \\), \\( k {i,v} \\) por el cero deseado. 3. añade desacoplo \\( \\pm\\omega l,\\ \\pm\\omega c \\) y feedforward de \\( v c \\). 4. si la resonancia lcl limita \\( f {cv} \\), añade amortiguamiento-activo-lcl primero. ejemplo de código python lazo tension - referencia de corriente (con desacoplo) il1ref d = kp v ev d + ki v xvd - w cf vcq lazo corriente - tension de puente (con desacoplo + feedforward vc) vid = kp i ei d + ki i xid - w l1 il1q + vcd parámetros y valores típicos \\( f {ci} \\) ≈ 0.5–1.5 khz, \\( f {cv} \\) ≈ 100–400 hz. en el proyecto: 1 khz / 350 hz. errores comunes - feedforward de corriente de carga mal usado : en el proyecto desestabilizaba (lazo positivo). verifica los feedforward en lazo cerrado. - subir el lazo de tensión sin amortiguar la resonancia lcl → la excita. - olvidar el signo del desacoplo cruzado. uso en proyectos - 01 - gfm-impedance (objetivo: regular v c): cascada corriente(1 khz)/tensión(350 hz) con desacoplo. el feedforward de carga inicial se eliminó por desestabilizar. conceptos relacionados - filtro-lcl · amortiguamiento-activo-lcl · marco-dq · droop-control referencias - yazdani, iravani, voltage-sourced converters in power systems , 2010. cascada pi desacoplo dq ancho-de-banda"}, {"slug": "control-repetitivo", "titulo": "Control repetitivo", "categoria": "control", "tipo": "tecnica", "nivel": "avanzado", "proyectos": [], "objetivos": ["anular errores periódicos rechazando todos los armónicos de una frecuencia"], "tags": ["repetitivo", "periodico", "armonicos", "modelo-interno", "plug-in", "thd", "avanzado"], "relacionados": ["controlador-resonante", "controlador-pid", "discretizacion-controladores", "error-regimen-permanente", "fft-analisis-espectral"], "referencias": ["Hara et al., Repetitive Control System: A New Type Servo System for Periodic Exogenous Signals, IEEE TAC 1988", "Zhou, Wang, Digital Repetitive Controlled PWM Inverter, IEEE TIE 2003"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Controlador basado en el <strong>principio del modelo interno</strong> para señales <strong>periódicas</strong>: incorpora un\ngenerador de periodo \\( T \\) (un retardo realimentado) que da ganancia infinita a la fundamental y\n<strong>todos sus armónicos</strong> a la vez, anulando el error periódico en régimen permanente.</p>\n<h2>Fundamento teórico</h2>\n<p>El modelo interno de una señal periódica de periodo \\( T \\) es el generador\n$$ G_{rc}(s)=\\frac{e^{-sT}}{1-e^{-sT}} $$\ncuyos polos están en \\( s=j\\,k\\,\\frac{2\\pi}{T} \\) (la fundamental \\( \\omega_0=2\\pi/T \\) y <strong>todos</strong>\nlos armónicos \\( k\\omega_0 \\)) → ganancia infinita en cada uno. Equivale a infinitos\n<a class=\"wl\" data-slug=\"controlador-resonante\">resonantes</a> en paralelo con un solo retardo. En <strong>discreto</strong> con \\( N=T/T_s \\)\nmuestras por periodo:\n$$ C_{rc}(z)=\\frac{z^{-N}}{1-Q(z)\\,z^{-N}}\\,k_r\\,z^{m}\\,F(z) $$\n- \\( Q(z) \\): filtro (ganancia \\( <1 \\) o pasa-bajos) que <strong>sacrifica precisión por robustez</strong> (sin\n  él, errores de modelo a alta frecuencia desestabilizan).\n- \\( z^{m} \\): <strong>avance</strong> que compensa el retardo de la planta.\n- \\( F(z) \\): filtro de fase/estabilización; \\( k_r \\): ganancia de aprendizaje.</p>\n<p>Se implementa casi siempre como <strong>plug-in</strong>: se añade en paralelo a un controlador realimentado\nexistente (PI/PR), que estabiliza y da respuesta rápida, mientras el repetitivo limpia los armónicos\nperiódicos ciclo a ciclo. Coste: la convergencia tarda <strong>varios periodos</strong> y reacciona lento a\nperturbaciones no periódicas.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando la perturbación/​referencia es periódica y rica en armónicos: inversores de tensión (UPS/CVCF)\ncon carga no lineal, filtros activos, rectificadores con rizado periódico. Da muy bajo THD con poco\ncoste de cómputo frente a apilar muchos resonantes.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Estabiliza primero el lazo con un controlador realimentado (PI/PR).</li>\n<li>Añade el repetitivo en plug-in: fija \\( N=T/T_s \\) (entero; ojo si \\( f_0 \\) varía).</li>\n<li>Diseña \\( Q(z) \\) (pasa-bajos) para robustez a alta frecuencia.</li>\n<li>Ajusta el avance \\( z^{m} \\) (compensa retardo de planta) y la ganancia \\( k_r \\).</li>\n<li>Verifica estabilidad (criterio de pequeña ganancia sobre \\( Q-k_r z^{m}F\\hat G \\)) y THD resultante.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">class Repetitive:                        # plug-in discreto\n    def __init__(self, N, kr, Q=0.95): self.buf=[0.0]*N; self.kr=kr; self.Q=Q\n    def step(self, err):\n        u = self.Q*self.buf[0] + self.kr*err     # memoria de 1 periodo\n        self.buf = self.buf[1:] + [u]\n        return self.buf[0]\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( Q\\approx0.95\\text{–}0.99 \\) o pasa-bajos con corte &lt; \\( f_s/4 \\). \\( k_r \\) 0.5–2. Convergencia\nen 3–10 periodos. THD &lt; 1–3 % alcanzable.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>\\( N \\) no entero o frecuencia de red variable → el repetitivo se desintoniza (usar \\( N \\)\n  fraccional/adaptativo).</li>\n<li>Sin filtro \\( Q \\) → inestabilidad por errores de modelo a alta frecuencia.</li>\n<li>Usarlo solo (sin lazo estabilizante) o esperar respuesta rápida a transitorios no periódicos.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"controlador-resonante\">controlador-resonante</a> · <a class=\"wl\" data-slug=\"controlador-pid\">controlador-pid</a> · <a class=\"wl\" data-slug=\"discretizacion-controladores\">discretizacion-controladores</a> · <a class=\"wl\" data-slug=\"error-regimen-permanente\">error-regimen-permanente</a> · <a class=\"wl\" data-slug=\"fft-analisis-espectral\">fft-analisis-espectral</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Hara et al., <em>Repetitive Control System</em>, IEEE TAC 1988.</li>\n<li>Zhou, Wang, <em>Digital Repetitive Controlled PWM Inverter</em>, IEEE TIE 2003.</li>\n</ul>", "buscar": "control repetitivo definición controlador basado en el principio del modelo interno para señales periódicas : incorpora un generador de periodo \\( t \\) (un retardo realimentado) que da ganancia infinita a la fundamental y todos sus armónicos a la vez, anulando el error periódico en régimen permanente. fundamento teórico el modelo interno de una señal periódica de periodo \\( t \\) es el generador g {rc}(s)=\\frac{e^{-st}}{1-e^{-st}} cuyos polos están en \\( s=j\\,k\\,\\frac{2\\pi}{t} \\) (la fundamental \\( \\omega 0=2\\pi/t \\) y todos los armónicos \\( k\\omega 0 \\)) → ganancia infinita en cada uno. equivale a infinitos controlador-resonante|resonantes en paralelo con un solo retardo. en discreto con \\( n=t/t s \\) muestras por periodo: c {rc}(z)=\\frac{z^{-n}}{1-q(z)\\,z^{-n}}\\,k r\\,z^{m}\\,f(z) - \\( q(z) \\): filtro (ganancia \\( <1 \\) o pasa-bajos) que sacrifica precisión por robustez (sin él, errores de modelo a alta frecuencia desestabilizan). - \\( z^{m} \\): avance que compensa el retardo de la planta. - \\( f(z) \\): filtro de fase/estabilización; \\( k r \\): ganancia de aprendizaje. se implementa casi siempre como plug-in : se añade en paralelo a un controlador realimentado existente (pi/pr), que estabiliza y da respuesta rápida, mientras el repetitivo limpia los armónicos periódicos ciclo a ciclo. coste: la convergencia tarda varios periodos y reacciona lento a perturbaciones no periódicas. cuándo y por qué se usa cuando la perturbación/​referencia es periódica y rica en armónicos: inversores de tensión (ups/cvcf) con carga no lineal, filtros activos, rectificadores con rizado periódico. da muy bajo thd con poco coste de cómputo frente a apilar muchos resonantes. procedimiento de diseño (genérico) 1. estabiliza primero el lazo con un controlador realimentado (pi/pr). 2. añade el repetitivo en plug-in: fija \\( n=t/t s \\) (entero; ojo si \\( f 0 \\) varía). 3. diseña \\( q(z) \\) (pasa-bajos) para robustez a alta frecuencia. 4. ajusta el avance \\( z^{m} \\) (compensa retardo de planta) y la ganancia \\( k r \\). 5. verifica estabilidad (criterio de pequeña ganancia sobre \\( q-k r z^{m}f\\hat g \\)) y thd resultante. ejemplo de código python class repetitive: plug-in discreto def init (self, n, kr, q=0.95): self.buf= 0.0 n; self.kr=kr; self.q=q def step(self, err): u = self.q self.buf 0 + self.kr err memoria de 1 periodo self.buf = self.buf 1: + u return self.buf 0 parámetros y valores típicos \\( q\\approx0.95\\text{–}0.99 \\) o pasa-bajos con corte < \\( f s/4 \\). \\( k r \\) 0.5–2. convergencia en 3–10 periodos. thd < 1–3 % alcanzable. errores comunes - \\( n \\) no entero o frecuencia de red variable → el repetitivo se desintoniza (usar \\( n \\) fraccional/adaptativo). - sin filtro \\( q \\) → inestabilidad por errores de modelo a alta frecuencia. - usarlo solo (sin lazo estabilizante) o esperar respuesta rápida a transitorios no periódicos. conceptos relacionados - controlador-resonante · controlador-pid · discretizacion-controladores · error-regimen-permanente · fft-analisis-espectral referencias - hara et al., repetitive control system , ieee tac 1988. - zhou, wang, digital repetitive controlled pwm inverter , ieee tie 2003. repetitivo periodico armonicos modelo-interno plug-in thd avanzado"}, {"slug": "control-tension-bus-dc", "titulo": "Control de tensión del bus DC", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": [], "objetivos": ["mantener constante la tensión del bus DC regulando el intercambio de potencia"], "tags": ["bus-dc", "lazo-externo", "balance-energia", "rectificador-activo", "back-to-back", "intermedio"], "relacionados": ["control-cascada", "dinamica-bus-dc", "convertidor-vsc", "controlador-pid", "estabilidad-bus-dc-cpl"], "referencias": ["Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010", "Blaabjerg et al., Overview of Control and Grid Synchronization, IEEE TIE 2006"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Lazo <strong>externo</strong> que regula la tensión del condensador del bus DC a su referencia, generando la\n<strong>referencia de corriente activa</strong> \\( i_d^* \\) (o de potencia) para el lazo interno de corriente.\nEs el lazo que cierra el balance de energía en rectificadores activos y convertidores back-to-back.</p>\n<h2>Fundamento teórico</h2>\n<p>El bus DC es un integrador de potencia (ver <a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a>). En términos de energía\n\\( E=\\tfrac12 C v_{dc}^2 \\):\n$$ \\frac{dE}{dt}=\\tfrac12 C\\frac{d(v_{dc}^2)}{dt}=P_{in}-P_{out} $$\nLa planta \\( v_{dc}\\!\\leftarrow\\!P \\) es <strong>no lineal</strong> (aparece \\( v_{dc}^2 \\)). Dos enfoques:\n- <strong>Linealizar</strong> en torno a \\( V_{dc0} \\): \\( C V_{dc0}\\,\\dot{\\tilde v}_{dc}=\\tilde P \\) → planta\n  integradora \\( 1/(C V_{dc0}\\,s) \\), se cierra con un PI.\n- Controlar <strong>\\( v_{dc}^2 \\)</strong> (la energía) como variable: la planta se vuelve <strong>lineal exacta</strong>\n  \\( \\tfrac{C}{2}\\,\\dot{(v_{dc}^2)}=P \\).</p>\n<p>Con tensión de red alineada al eje d (\\( e_q=0 \\)), \\( P\\approx \\tfrac32 e_d i_d \\), así que el PI\nde tensión produce \\( i_d^* \\). El <strong>feedforward</strong> de la potencia de carga \\( P_{out} \\) acelera el\nrechazo. La <strong>separación de bandas</strong> es crítica: el lazo de tensión debe ser bastante más lento que\nel de corriente (factor ~5–10) y, en monofásico, más lento que el rizado de \\( 2\\omega \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En el lado red de cualquier rectificador activo / convertidor back-to-back (el del usuario), en\nSTATCOM con almacenamiento, y en general cuando el bus DC alimenta una carga y hay que mantener su\ntensión pese a perturbaciones de potencia.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Modela el bus (\\( C \\), \\( V_{dc0} \\)) y linealiza, o usa \\( v_{dc}^2 \\) como variable.</li>\n<li>Diseña el lazo interno de corriente primero (<a class=\"wl\" data-slug=\"desacoplo-dq\">desacoplo-dq</a>, <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a>).</li>\n<li>Sintoniza el PI de tensión con \\( \\omega_{v}\\approx(1/5\\text{–}1/10)\\,\\omega_{c,i} \\).</li>\n<li>En monofásico/desequilibrio, filtra o haz \\( \\omega_v < 2\\omega \\) (evitar realimentar el rizado\n   de 100 Hz como referencia de corriente).</li>\n<li>Añade feedforward de \\( P_{out} \\) y <strong>anti-windup</strong> (<a class=\"wl\" data-slug=\"anti-windup\">anti-windup</a>) al límite de \\( i_d^* \\).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Convertidor back-to-back lado red, \\( C=10\\,\\text{mF} \\), \\( V_{dc0}=1.2\\,\\text{kV} \\), carga de 500 kW. El lazo de corriente ya diseñado croza a \\( f_{ci}=1\\,\\text{kHz} \\). Diseñar el lazo de tensión DC.</p>\n<p>Planta (usando \\( v_{dc}^2 \\) como variable): \\( P\\to\\tfrac{C}{2}\\dot{(v_{dc}^2)} \\), ganancia \\( 2/(Cs) \\). Ancho de banda objetivo: \\( f_{cv}=f_{ci}/5=200\\,\\text{Hz} \\), \\( \\omega_{cv}=1257\\,\\text{rad/s} \\). PI: \\( K_{pv}=C\\,\\omega_{cv}/2=0.01\\times1257/2=6.3\\,\\text{(W/V}^2\\text{)/...} \\); aplicando la fórmula en la base de \\( v_{dc}^2 \\) y \\( P \\). Con feedforward de carga: ante un escalón de carga del 10 % (50 kW), la caída de \\( V_{dc} \\) se reduce de 22 V a 6 V (factor 3.7 de mejora). Si \\( \\omega_{cv} \\) se sube a 500 Hz: el rizado de \\( 2\\times50=100\\,\\text{Hz} \\) del bus se realimenta y distorsiona la corriente de red — este es el límite superior para \\( f_{cv} \\).</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def dc_voltage_loop(vdc_ref, vdc, P_load, ed, pi_v, C):\n    # control sobre energia (planta lineal): error en vdc^2\n    e = vdc_ref**2 - vdc**2\n    P_ref = pi_v(e) + P_load                 # feedforward de carga\n    id_ref = (2/3)*P_ref/max(ed, 1e-3)       # referencia de corriente activa\n    return id_ref\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Ancho de banda del lazo de tensión: 10–50 Hz (muy por debajo del de corriente). Rizado de\n\\( v_{dc} \\) admisible 1–2 %. \\( V_{dc} > 2\\sqrt2\\,V_{LL}/\\sqrt3 \\) para no saturar la modulación.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Lazo de tensión demasiado rápido → realimenta el rizado de \\( 2\\omega \\) y distorsiona la corriente.</li>\n<li>Tratar la planta como lineal lejos de \\( V_{dc0} \\) sin usar \\( v_{dc}^2 \\).</li>\n<li>Olvidar anti-windup en el límite de \\( i_d^* \\) (saturación durante arranques/huecos).</li>\n<li>Ignorar que una carga CPL añade impedancia negativa (<a class=\"wl\" data-slug=\"estabilidad-bus-dc-cpl\">estabilidad-bus-dc-cpl</a>).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a> · <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> · <a class=\"wl\" data-slug=\"convertidor-vsc\">convertidor-vsc</a> · <a class=\"wl\" data-slug=\"desacoplo-dq\">desacoplo-dq</a> · <a class=\"wl\" data-slug=\"estabilidad-bus-dc-cpl\">estabilidad-bus-dc-cpl</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Yazdani, Iravani, 2010.</li>\n<li>Blaabjerg et al., <em>Overview of Control and Grid Synchronization</em>, IEEE TIE 2006.</li>\n</ul>", "buscar": "control de tensión del bus dc definición lazo externo que regula la tensión del condensador del bus dc a su referencia, generando la referencia de corriente activa \\( i d^ \\) (o de potencia) para el lazo interno de corriente. es el lazo que cierra el balance de energía en rectificadores activos y convertidores back-to-back. fundamento teórico el bus dc es un integrador de potencia (ver dinamica-bus-dc ). en términos de energía \\( e=\\tfrac12 c v {dc}^2 \\): \\frac{de}{dt}=\\tfrac12 c\\frac{d(v {dc}^2)}{dt}=p {in}-p {out} la planta \\( v {dc}\\!\\leftarrow\\!p \\) es no lineal (aparece \\( v {dc}^2 \\)). dos enfoques: - linealizar en torno a \\( v {dc0} \\): \\( c v {dc0}\\,\\dot{\\tilde v} {dc}=\\tilde p \\) → planta integradora \\( 1/(c v {dc0}\\,s) \\), se cierra con un pi. - controlar \\( v {dc}^2 \\) (la energía) como variable: la planta se vuelve lineal exacta \\( \\tfrac{c}{2}\\,\\dot{(v {dc}^2)}=p \\). con tensión de red alineada al eje d (\\( e q=0 \\)), \\( p\\approx \\tfrac32 e d i d \\), así que el pi de tensión produce \\( i d^ \\). el feedforward de la potencia de carga \\( p {out} \\) acelera el rechazo. la separación de bandas es crítica: el lazo de tensión debe ser bastante más lento que el de corriente (factor ~5–10) y, en monofásico, más lento que el rizado de \\( 2\\omega \\). cuándo y por qué se usa en el lado red de cualquier rectificador activo / convertidor back-to-back (el del usuario), en statcom con almacenamiento, y en general cuando el bus dc alimenta una carga y hay que mantener su tensión pese a perturbaciones de potencia. procedimiento de diseño (genérico) 1. modela el bus (\\( c \\), \\( v {dc0} \\)) y linealiza, o usa \\( v {dc}^2 \\) como variable. 2. diseña el lazo interno de corriente primero ( desacoplo-dq , control-cascada ). 3. sintoniza el pi de tensión con \\( \\omega {v}\\approx(1/5\\text{–}1/10)\\,\\omega {c,i} \\). 4. en monofásico/desequilibrio, filtra o haz \\( \\omega v < 2\\omega \\) (evitar realimentar el rizado de 100 hz como referencia de corriente). 5. añade feedforward de \\( p {out} \\) y anti-windup ( anti-windup ) al límite de \\( i d^ \\). ejemplo de aplicación real problema: convertidor back-to-back lado red, \\( c=10\\,\\text{mf} \\), \\( v {dc0}=1.2\\,\\text{kv} \\), carga de 500 kw. el lazo de corriente ya diseñado croza a \\( f {ci}=1\\,\\text{khz} \\). diseñar el lazo de tensión dc. planta (usando \\( v {dc}^2 \\) como variable): \\( p\\to\\tfrac{c}{2}\\dot{(v {dc}^2)} \\), ganancia \\( 2/(cs) \\). ancho de banda objetivo: \\( f {cv}=f {ci}/5=200\\,\\text{hz} \\), \\( \\omega {cv}=1257\\,\\text{rad/s} \\). pi: \\( k {pv}=c\\,\\omega {cv}/2=0.01\\times1257/2=6.3\\,\\text{(w/v}^2\\text{)/...} \\); aplicando la fórmula en la base de \\( v {dc}^2 \\) y \\( p \\). con feedforward de carga: ante un escalón de carga del 10 % (50 kw), la caída de \\( v {dc} \\) se reduce de 22 v a 6 v (factor 3.7 de mejora). si \\( \\omega {cv} \\) se sube a 500 hz: el rizado de \\( 2\\times50=100\\,\\text{hz} \\) del bus se realimenta y distorsiona la corriente de red — este es el límite superior para \\( f {cv} \\). ejemplo de código python def dc voltage loop(vdc ref, vdc, p load, ed, pi v, c): control sobre energia (planta lineal): error en vdc^2 e = vdc ref 2 - vdc 2 p ref = pi v(e) + p load feedforward de carga id ref = (2/3) p ref/max(ed, 1e-3) referencia de corriente activa return id ref parámetros y valores típicos ancho de banda del lazo de tensión: 10–50 hz (muy por debajo del de corriente). rizado de \\( v {dc} \\) admisible 1–2 %. \\( v {dc} 2\\sqrt2\\,v {ll}/\\sqrt3 \\) para no saturar la modulación. errores comunes - lazo de tensión demasiado rápido → realimenta el rizado de \\( 2\\omega \\) y distorsiona la corriente. - tratar la planta como lineal lejos de \\( v {dc0} \\) sin usar \\( v {dc}^2 \\). - olvidar anti-windup en el límite de \\( i d^ \\) (saturación durante arranques/huecos). - ignorar que una carga cpl añade impedancia negativa ( estabilidad-bus-dc-cpl ). conceptos relacionados - dinamica-bus-dc · control-cascada · convertidor-vsc · desacoplo-dq · estabilidad-bus-dc-cpl referencias - yazdani, iravani, 2010. - blaabjerg et al., overview of control and grid synchronization , ieee tie 2006. bus-dc lazo-externo balance-energia rectificador-activo back-to-back intermedio"}, {"slug": "control-vectorial", "titulo": "Control vectorial (orientación de campo / red)", "categoria": "control", "tipo": "tecnica", "nivel": "avanzado", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["controlar corriente trifasica desacoplando par/flujo o P/Q en dq"], "tags": ["control-vectorial", "FOC", "dq", "orientacion-de-campo", "desacoplo"], "relacionados": ["marco-dq", "control-cascada", "potencia-instantanea-dq", "pll-srf"], "referencias": ["Kazmierkowski, Krishnan, Blaabjerg, Control in Power Electronics, Academic Press 2002", "Vas, Sensorless Vector and Direct Torque Control, Oxford 1998"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Estrategia que controla las magnitudes trifásicas como <strong>vectores espaciales</strong> en un marco dq\n<strong>orientado</strong> con una variable física (el flujo del rotor en máquinas, la tensión de red en\nconvertidores). Al orientar el marco, las dos componentes \\( d \\) y \\( q \\) controlan magnitudes\ndesacopladas.</p>\n<h2>Fundamento teórico</h2>\n<p>Un sistema trifásico equilibrado se representa por un <strong>vector espacial</strong> que, llevado a dq con\nel ángulo de orientación \\( \\theta \\) (ver <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a>), queda constante en régimen permanente.\nCon la orientación adecuada:\n- <strong>Máquinas (FOC, Field-Oriented Control)</strong>: marco alineado con el flujo de rotor. Entonces\n  \\( i_d \\) controla el <strong>flujo</strong> y \\( i_q \\) controla el <strong>par</strong>:\n  \\( T \\propto \\psi\\, i_q \\). Se controla la máquina como una de continua.\n- <strong>Convertidor conectado a red</strong>: marco alineado con la tensión de red (\\( v_q=0 \\), vía\n  <a class=\"wl\" data-slug=\"pll-srf\">pll-srf</a>). Entonces \\( i_d \\leftrightarrow P \\) e \\( i_q \\leftrightarrow Q \\)\n  (ver <a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a>).</p>\n<p>En ambos casos se cierran <strong>lazos de corriente PI sobre \\( i_d, i_q \\)</strong> con <strong>desacoplo</strong> de los\ntérminos cruzados \\( \\pm\\omega L\\,i \\) que introduce el marco giratorio. Es la base de los lazos\ninternos de casi todos los convertidores y accionamientos.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En accionamientos de máquinas AC (PMSM, inducción) y en convertidores conectados a red. Permite\ncontrol independiente y de alto desempeño de par/flujo o de P/Q.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Determina el ángulo de orientación \\( \\theta \\) (estimador de flujo en FOC; PLL en red).</li>\n<li>Mide corrientes y transfórmalas a dq con \\( \\theta \\) (Clarke + Park).</li>\n<li>Cierra lazos PI sobre \\( i_d, i_q \\) con <strong>desacoplo</strong> \\( \\pm\\omega L \\) y feedforward.</li>\n<li>Antitransforma la tensión de referencia (dq→abc) y genera el PWM.</li>\n<li>Sintoniza los PI por ancho de banda (ver <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a>, <a class=\"wl\" data-slug=\"sintonia-pi-pid\">sintonia-pi-pid</a>).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># lazo de corriente vectorial (dq) con desacoplo\ne_d, e_q = id_ref - id, iq_ref - iq\nvd = Kp*e_d + Ki*xd - w*L*iq     # desacoplo cruzado\nvq = Kp*e_q + Ki*xq + w*L*id\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Ancho de banda del lazo de corriente ≈ \\( f_{sw}/10 \\). En FOC, \\( i_d=0 \\) (PMSM de imanes\nsuperficiales) para par máximo por amperio; debilitamiento de campo con \\( i_d<0 \\) a alta velocidad.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Orientación incorrecta (error en \\( \\theta \\)) → acoplamiento par/flujo o P/Q.</li>\n<li>Olvidar el desacoplo \\( \\pm\\omega L \\) → lazos d y q acoplados, peor desempeño.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: los lazos de corriente dq con desacoplo son control vectorial aplicado a un\n  convertidor de red (orientación a la tensión por la PLL en el GFL). El FOC de máquina es\n  candidato a proyecto propio.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> · <a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a> · <a class=\"wl\" data-slug=\"pll-srf\">pll-srf</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Kazmierkowski et al., <em>Control in Power Electronics</em>, 2002.</li>\n</ul>", "buscar": "control vectorial (orientación de campo / red) definición estrategia que controla las magnitudes trifásicas como vectores espaciales en un marco dq orientado con una variable física (el flujo del rotor en máquinas, la tensión de red en convertidores). al orientar el marco, las dos componentes \\( d \\) y \\( q \\) controlan magnitudes desacopladas. fundamento teórico un sistema trifásico equilibrado se representa por un vector espacial que, llevado a dq con el ángulo de orientación \\( \\theta \\) (ver marco-dq ), queda constante en régimen permanente. con la orientación adecuada: - máquinas (foc, field-oriented control) : marco alineado con el flujo de rotor. entonces \\( i d \\) controla el flujo y \\( i q \\) controla el par : \\( t \\propto \\psi\\, i q \\). se controla la máquina como una de continua. - convertidor conectado a red : marco alineado con la tensión de red (\\( v q=0 \\), vía pll-srf ). entonces \\( i d \\leftrightarrow p \\) e \\( i q \\leftrightarrow q \\) (ver potencia-instantanea-dq ). en ambos casos se cierran lazos de corriente pi sobre \\( i d, i q \\) con desacoplo de los términos cruzados \\( \\pm\\omega l\\,i \\) que introduce el marco giratorio. es la base de los lazos internos de casi todos los convertidores y accionamientos. cuándo y por qué se usa en accionamientos de máquinas ac (pmsm, inducción) y en convertidores conectados a red. permite control independiente y de alto desempeño de par/flujo o de p/q. procedimiento (genérico) 1. determina el ángulo de orientación \\( \\theta \\) (estimador de flujo en foc; pll en red). 2. mide corrientes y transfórmalas a dq con \\( \\theta \\) (clarke + park). 3. cierra lazos pi sobre \\( i d, i q \\) con desacoplo \\( \\pm\\omega l \\) y feedforward. 4. antitransforma la tensión de referencia (dq→abc) y genera el pwm. 5. sintoniza los pi por ancho de banda (ver control-cascada , sintonia-pi-pid ). ejemplo de código python lazo de corriente vectorial (dq) con desacoplo e d, e q = id ref - id, iq ref - iq vd = kp e d + ki xd - w l iq desacoplo cruzado vq = kp e q + ki xq + w l id parámetros y valores típicos ancho de banda del lazo de corriente ≈ \\( f {sw}/10 \\). en foc, \\( i d=0 \\) (pmsm de imanes superficiales) para par máximo por amperio; debilitamiento de campo con \\( i d<0 \\) a alta velocidad. errores comunes - orientación incorrecta (error en \\( \\theta \\)) → acoplamiento par/flujo o p/q. - olvidar el desacoplo \\( \\pm\\omega l \\) → lazos d y q acoplados, peor desempeño. uso en proyectos - 01/02 : los lazos de corriente dq con desacoplo son control vectorial aplicado a un convertidor de red (orientación a la tensión por la pll en el gfl). el foc de máquina es candidato a proyecto propio. conceptos relacionados - marco-dq · control-cascada · potencia-instantanea-dq · pll-srf referencias - kazmierkowski et al., control in power electronics , 2002. control-vectorial foc dq orientacion-de-campo desacoplo"}, {"slug": "controlabilidad-observabilidad", "titulo": "Controlabilidad y observabilidad", "categoria": "control", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["saber si se pueden gobernar y estimar todos los estados de un sistema"], "tags": ["controlabilidad", "observabilidad", "espacio-estados", "gramian", "kalman", "intermedio"], "relacionados": ["representacion-espacio-estados", "asignacion-polos-lqr", "variables-estado", "funcion-transferencia"], "referencias": ["Ogata, Ingeniería de Control Moderna, Pearson", "Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Dos propiedades estructurales del modelo en espacio de estados. <strong>Controlabilidad:</strong> la entrada\npuede llevar el estado a cualquier punto en tiempo finito. <strong>Observabilidad:</strong> el estado puede\nreconstruirse a partir de la salida medida.</p>\n<h2>Fundamento teórico</h2>\n<p>Para \\( \\dot{\\mathbf{x}}=A\\mathbf{x}+B\\mathbf{u} \\), \\( \\mathbf{y}=C\\mathbf{x} \\), criterio de\nrango de Kalman:\n$$ \\mathcal{C}=[\\,B\\ \\ AB\\ \\ A^2B\\ \\dots\\ A^{n-1}B\\,],\\qquad\n   \\mathcal{O}=\\begin{bmatrix}C\\\\CA\\\\\\vdots\\\\CA^{n-1}\\end{bmatrix} $$\nControlable \\( \\iff \\mathrm{rank}\\,\\mathcal{C}=n \\); observable \\( \\iff \\mathrm{rank}\\,\\mathcal{O}=n \\).\nUn modo (autovalor) <strong>no controlable</strong> no se puede mover con realimentación; uno <strong>no observable</strong>\nno aparece en \\( y \\). Si además es <strong>inestable</strong>, el diseño es inviable (no estabilizable / no\ndetectable). La pérdida de rango suele venir de <strong>cancelaciones polo-cero</strong> ocultas en\n\\( G(s)=C(sI-A)^{-1}B \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Antes de diseñar realimentación de estado o un observador: la <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignación de\npolos</a> exige controlabilidad y el observador exige observabilidad. En modelos grandes de\nconvertidor (15+ estados) detecta estados redundantes o desacoplados.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Forma \\( \\mathcal{C} \\) y \\( \\mathcal{O} \\) (o sus gramianos en sistemas mal escalados).</li>\n<
