pman, <em>Máquinas Eléctricas</em>.</li>\n<li>Yazdani, Iravani, 2010.</li>\n</ul>", "buscar": "sistema trifásico equilibrado definición sistema de tres tensiones senoidales de igual amplitud y frecuencia, desfasadas 120° . si las cargas son iguales en las tres fases, el sistema es equilibrado y se reduce a un análisis monofásico equivalente. fundamento teórico v a=\\hat v\\cos\\omega t,\\quad v b=\\hat v\\cos(\\omega t-120^\\circ),\\quad v c=\\hat v\\cos(\\omega t+120^\\circ) en equilibrio la suma instantánea es nula (\\( v a+v b+v c=0 \\)) → no circula corriente por el neutro. relaciones línea-fase: - estrella (y): \\( v {ll}=\\sqrt3\\,v {fase} \\), \\( i {l}=i {fase} \\). - triángulo (δ): \\( v {ll}=v {fase} \\), \\( i {l}=\\sqrt3\\,i {fase} \\). potencia trifásica total (constante en equilibrio): p=\\sqrt3\\,v {ll}i l\\cos\\varphi,\\qquad s=\\sqrt3\\,v {ll}i l la potencia instantánea total es constante (no pulsa a \\( 2\\omega \\) como la monofásica), lo que motiva el control en marco-dq|dq . cuándo y por qué se usa es el marco de todo el sistema eléctrico de potencia y de los convertidores de red. las tensiones nominales y los cálculos de potencia/corriente parten siempre de estas relaciones. procedimiento (genérico) 1. identifica conexión (y/δ) y si hay neutro. 2. pasa a fasores y usa el equivalente monofásico (una fase) si está equilibrado. 3. aplica relaciones línea-fase para tensiones/corrientes. 4. para desequilibrio o falta, usa componentes-simetricas . ejemplo de aplicación real problema: parque eólico de \\( p=10\\,\\text{mw} \\) a \\( v {ll}=33\\,\\text{kv} \\), \\( \\cos\\phi=0.95\\,\\text{retraso} \\). calcular corriente de línea, potencia reactiva y tensión de fase pico para dimensionar el convertidor. corriente de línea: \\( i l=p/(\\sqrt{3}\\,v {ll}\\cos\\phi)=10\\times10^6/(\\sqrt{3}\\times33000\\times0.95)\\approx184\\,\\text{a} \\). potencia reactiva inductiva: \\( q=p\\tan(\\arccos0.95)\\approx3.29\\,\\text{mvar} \\). potencia aparente: \\( s=p/\\cos\\phi\\approx10.53\\,\\text{mva} \\). tensión de fase pico (para diseñar la modulación del vsc): \\( \\hat v f=33000\\sqrt{2}/\\sqrt{3}\\approx26.9\\,\\text{kv} \\). con estos datos se dimensiona el condensador del bus dc y se fijan las referencias \\( i d^ ,i q^ \\) del control. ejemplo de código python import numpy as np vll = 690.0 vf pico = vll np.sqrt(2/3) pico de fase (amplitud) p = np.sqrt(3) vll il np.cos(phi) potencia activa trifásica parámetros y valores típicos tensiones de línea típicas en convertidores: 400 v, 690 v (bt); frecuencia 50/60 hz. convención de amplitud de fase: \\( \\hat v {fase}=v {ll}\\sqrt{2/3} \\). errores comunes - confundir tensión de línea con tensión de fase (factor \\( \\sqrt3 \\)). - mezclar valores de pico y rms. - suponer suma nula con cargas o red desequilibradas (entonces circula homopolar). conceptos relacionados - potencia-ac-fasores · marco-dq · transformada-clarke · sistema-por-unidad referencias - chapman, máquinas eléctricas . - yazdani, iravani, 2010. trifasico equilibrado fasores linea-fase basico modelado"}, {"slug": "topologias-multinivel", "titulo": "Topologías de inversores multinivel", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "avanzado", "proyectos": [], "objetivos": ["elegir la topologia de convertidor segun tension", "potencia y calidad"], "tags": ["multinivel", "NPC", "T-type", "flying-capacitor", "MMC", "CHB"], "relacionados": ["modelo-promediado", "marco-dq", "control-vectorial"], "referencias": ["Rodriguez, Lai, Peng, Multilevel Inverters: Survey of Topologies, IEEE TIE 2002", "Akagi, Classification and Terminology of MMC, IEEE TPEL 2011"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Convertidores que sintetizan la tensión de salida en <strong>más de dos niveles</strong>. Frente al puente de\n2 niveles, reparten la tensión entre más dispositivos y producen una onda más escalonada: menor\ncontenido armónico, menor \\( dv/dt \\) y mayor tensión/potencia manejable.</p>\n<h2>Fundamento teórico</h2>\n<p>Con \\( n \\) niveles, la tensión de salida toma \\( n \\) valores discretos; el rizado y la \\( THD \\)\ncaen y la tensión de bloqueo por dispositivo es \\( \\approx V_{dc}/(n-1) \\). Familias principales:\n- <strong>NPC</strong> (Neutral-Point-Clamped, diode-clamped): 3 niveles con diodos de anclaje al neutro del\n  bus DC. Reto: <strong>balanceo del punto neutro</strong>.\n- <strong>T-type</strong>: variante de 3 niveles con conmutador bidireccional al neutro; buen compromiso en\n  baja-media tensión.\n- <strong>Flying Capacitor (FC)</strong>: niveles mediante condensadores flotantes; reto: <strong>balanceo de los\n  condensadores</strong>, redundancia de estados de conmutación.\n- <strong>Cascaded H-Bridge (CHB)</strong>: puentes H en serie con fuentes DC aisladas; modular, ideal con\n  fuentes separadas (PV, baterías).\n- <strong>MMC</strong> (Modular Multilevel Converter): brazos de submódulos en serie; estándar en <strong>HVDC</strong> y\n  alta potencia. Retos: control de <strong>energía de submódulos</strong> y <strong>corriente circulante</strong>.</p>\n<p>Modulación: PD/POD-PWM multinivel, <strong>SVM</strong> multinivel, o selección de estados (MMC). La\n<strong>redundancia</strong> de estados de conmutación se aprovecha para balancear condensadores.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando la tensión supera la capacidad de un dispositivo de 2 niveles, o se exige baja \\( THD \\) /\nbajo \\( dv/dt \\) (motores, red). Selección por tensión/potencia:</p>\n<table>\n<thead>\n<tr>\n<th>Topología</th>\n<th>Rango típico</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>NPC / T-type (3 niveles)</td>\n<td>baja-media tensión, industrial</td>\n</tr>\n<tr>\n<td>Flying capacitor</td>\n<td>media tensión, alta frecuencia efectiva</td>\n</tr>\n<tr>\n<td>CHB</td>\n<td>con fuentes DC aisladas (PV, baterías)</td>\n</tr>\n<tr>\n<td>MMC</td>\n<td>alta tensión / HVDC / gran potencia</td>\n</tr>\n</tbody>\n</table>\n<h2>Procedimiento de elección (genérico)</h2>\n<ol>\n<li>Fija tensión y potencia → descarta familias por tensión de bloqueo.</li>\n<li>Requisitos de \\( THD \\), \\( dv/dt \\), eficiencia → nº de niveles.</li>\n<li>Disponibilidad de fuentes DC aisladas → CHB vs NPC/FC/MMC.</li>\n<li>Evalúa el coste de control (balanceo de condensadores, corriente circulante en MMC).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># tension de bloqueo por dispositivo y niveles\nn_niveles = 3\nV_bloqueo = Vdc/(n_niveles-1)     # menor tension por interruptor que en 2 niveles\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>3 niveles (NPC/T-type) en convertidores industriales; decenas-cientos de submódulos en MMC para\nHVDC. Tensión de bloqueo repartida \\( V_{dc}/(n-1) \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Ignorar el balanceo de condensadores (NPC neutro, FC, MMC): puede divergir.</li>\n<li>Subestimar el coste de control y medida al subir niveles.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li>Candidato a proyecto propio (MMC). Ficha de panorama por ahora; los proyectos 01/02 usan 2\n  niveles (modelo promediado).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"control-vectorial\">control-vectorial</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Rodriguez et al., <em>Multilevel Inverters: Survey of Topologies</em>, IEEE TIE 2002.</li>\n</ul>", "buscar": "topologías de inversores multinivel definición convertidores que sintetizan la tensión de salida en más de dos niveles . frente al puente de 2 niveles, reparten la tensión entre más dispositivos y producen una onda más escalonada: menor contenido armónico, menor \\( dv/dt \\) y mayor tensión/potencia manejable. fundamento teórico con \\( n \\) niveles, la tensión de salida toma \\( n \\) valores discretos; el rizado y la \\( thd \\) caen y la tensión de bloqueo por dispositivo es \\( \\approx v {dc}/(n-1) \\). familias principales: - npc (neutral-point-clamped, diode-clamped): 3 niveles con diodos de anclaje al neutro del bus dc. reto: balanceo del punto neutro . - t-type : variante de 3 niveles con conmutador bidireccional al neutro; buen compromiso en baja-media tensión. - flying capacitor (fc) : niveles mediante condensadores flotantes; reto: balanceo de los condensadores , redundancia de estados de conmutación. - cascaded h-bridge (chb) : puentes h en serie con fuentes dc aisladas; modular, ideal con fuentes separadas (pv, baterías). - mmc (modular multilevel converter): brazos de submódulos en serie; estándar en hvdc y alta potencia. retos: control de energía de submódulos y corriente circulante . modulación: pd/pod-pwm multinivel, svm multinivel, o selección de estados (mmc). la redundancia de estados de conmutación se aprovecha para balancear condensadores. cuándo y por qué se usa cuando la tensión supera la capacidad de un dispositivo de 2 niveles, o se exige baja \\( thd \\) / bajo \\( dv/dt \\) (motores, red). selección por tensión/potencia: | topología | rango típico | |---|---| | npc / t-type (3 niveles) | baja-media tensión, industrial | | flying capacitor | media tensión, alta frecuencia efectiva | | chb | con fuentes dc aisladas (pv, baterías) | | mmc | alta tensión / hvdc / gran potencia | procedimiento de elección (genérico) 1. fija tensión y potencia → descarta familias por tensión de bloqueo. 2. requisitos de \\( thd \\), \\( dv/dt \\), eficiencia → nº de niveles. 3. disponibilidad de fuentes dc aisladas → chb vs npc/fc/mmc. 4. evalúa el coste de control (balanceo de condensadores, corriente circulante en mmc). ejemplo de código python tension de bloqueo por dispositivo y niveles n niveles = 3 v bloqueo = vdc/(n niveles-1) menor tension por interruptor que en 2 niveles parámetros y valores típicos 3 niveles (npc/t-type) en convertidores industriales; decenas-cientos de submódulos en mmc para hvdc. tensión de bloqueo repartida \\( v {dc}/(n-1) \\). errores comunes - ignorar el balanceo de condensadores (npc neutro, fc, mmc): puede divergir. - subestimar el coste de control y medida al subir niveles. uso en proyectos - candidato a proyecto propio (mmc). ficha de panorama por ahora; los proyectos 01/02 usan 2 niveles (modelo promediado). conceptos relacionados - modelo-promediado · marco-dq · control-vectorial referencias - rodriguez et al., multilevel inverters: survey of topologies , ieee tie 2002. multinivel npc t-type flying-capacitor mmc chb"}, {"slug": "transformada-clarke", "titulo": "Transformada de Clarke (αβ)", "categoria": "fisica-modelado", "tipo": "tecnica", "nivel": "basico", "proyectos": [], "objetivos": ["reducir tres magnitudes trifásicas a dos ejes estacionarios ortogonales"], "tags": ["clarke", "alfa-beta", "trifasico", "transformada", "basico", "modelado"], "relacionados": ["marco-dq", "control-vectorial", "sistema-trifasico", "potencia-instantanea-dq", "componentes-simetricas"], "referencias": ["Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010", "Akagi, Watanabe, Aredes, Instantaneous Power Theory, Wiley 2007"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Transformación lineal que lleva las tres magnitudes \\( (a,b,c) \\) a dos ejes ortogonales\n<strong>estacionarios</strong> \\( (\\alpha,\\beta) \\) (más una componente homopolar \\( 0 \\)). Es el paso previo\na la rotación de <a class=\"wl\" data-slug=\"marco-dq\">Park</a>.</p>\n<h2>Fundamento teórico</h2>\n<p>Con convención de <strong>amplitud invariante</strong> (factor 2/3):\n$$ \\begin{bmatrix}x_\\alpha\\\\x_\\beta\\\\x_0\\end{bmatrix}=\n   \\frac{2}{3}\\begin{bmatrix}1&-\\tfrac12&-\\tfrac12\\\\[2pt]0&\\tfrac{\\sqrt3}{2}&-\\tfrac{\\sqrt3}{2}\\\\[2pt]\n   \\tfrac12&\\tfrac12&\\tfrac12\\end{bmatrix}\n   \\begin{bmatrix}x_a\\\\x_b\\\\x_c\\end{bmatrix} $$\n\\( \\alpha \\) se alinea con la fase \\( a \\). En un sistema <strong>equilibrado</strong> \\( x_0=0 \\) y un fasor\ngiratorio en abc se vuelve un vector que gira en el plano \\( \\alpha\\beta \\) a frecuencia \\( \\omega \\).\nCon convención de <strong>potencia invariante</strong> el factor es \\( \\sqrt{2/3} \\) (la matriz es ortonormal y\nconserva la potencia). El homopolar captura el desequilibrio de modo común.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Base del <strong>control vectorial</strong> y de la teoría de potencia instantánea. Permite trabajar con un\nsolo número complejo \\( x_\\alpha+jx_\\beta \\), simplifica el modelado y es donde operan PLLs y\nresonantes (control PR en αβ sin necesidad de rotar a dq).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Mide \\( x_a,x_b,x_c \\).</li>\n<li>Aplica la matriz de Clarke (elige convención y mantenla en todo el proyecto).</li>\n<li>Opera en αβ (control PR, PLL) o rota a dq con Park usando \\( \\theta \\).</li>\n<li>Antitransforma αβ→abc para las modulantes del PWM.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Corrientes trifásicas levemente desequilibradas: \\( [i_a,i_b,i_c]=[1.0,\\,-0.55,\\,-0.45]\\,\\text{p.u.} \\) Aplicar Clarke y detectar el desequilibrio en el plano αβ.</p>\n<p>Componente α (amplitud invariante): \\( i_\\alpha=\\tfrac{2}{3}[1.0-(-0.55)/2-(-0.45)/2]=\\tfrac{2}{3}[1.0+0.275+0.225]=1.0\\,\\text{p.u.} \\). Componente β: \\( i_\\beta=\\tfrac{1}{\\sqrt3}[i_b-i_c]=\\tfrac{1}{\\sqrt3}[-0.55+0.45]=-0.058\\,\\text{p.u.} \\). En equilibrio perfecto \\( i_\\beta \\) tendría magnitud igual a \\( i_\\alpha \\) y desfase 90°; aquí \\( |i_\\beta|\\approx0.058\\ll i_\\alpha=1.0 \\): el desequilibrio es leve (~5.8 %). En el plano αβ la trayectoria describe una elipse en lugar de un círculo — cuanto más excéntrica, mayor el desequilibrio. Un detector <a class=\"wl\" data-slug=\"dsogi-pll\">DSOGI</a> puede separar directamente las secuencias positiva y negativa desde αβ.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\ndef clarke(a, b, c):                    # amplitud invariante\n    al = (2/3)*(a - 0.5*b - 0.5*c)\n    be = (2/3)*(np.sqrt(3)/2)*(b - c)\n    return al, be\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Si las tres fases suman cero (sin neutro), \\( x_0=0 \\) y basta con \\( \\alpha,\\beta \\). Convención\nde amplitud: el pico de fase se conserva (\\( x_\\alpha \\) = pico de la fase a).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mezclar convención de amplitud y de potencia (factores \\( \\sqrt{2/3} \\) vs 2/3).</li>\n<li>Descartar el homopolar cuando hay neutro o desequilibrio relevante.</li>\n<li>Confundir Clarke (eje fijo) con Park (eje giratorio).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"control-vectorial\">control-vectorial</a> · <a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a> · <a class=\"wl\" data-slug=\"componentes-simetricas\">componentes-simetricas</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Yazdani, Iravani, 2010.</li>\n<li>Akagi, Watanabe, Aredes, <em>Instantaneous Power Theory</em>, 2007.</li>\n</ul>", "buscar": "transformada de clarke (αβ) definición transformación lineal que lleva las tres magnitudes \\( (a,b,c) \\) a dos ejes ortogonales estacionarios \\( (\\alpha,\\beta) \\) (más una componente homopolar \\( 0 \\)). es el paso previo a la rotación de marco-dq|park . fundamento teórico con convención de amplitud invariante (factor 2/3): \\begin{bmatrix}x \\alpha\\\\x \\beta\\\\x 0\\end{bmatrix}= \\frac{2}{3}\\begin{bmatrix}1&-\\tfrac12&-\\tfrac12\\\\ 2pt 0&\\tfrac{\\sqrt3}{2}&-\\tfrac{\\sqrt3}{2}\\\\ 2pt \\tfrac12&\\tfrac12&\\tfrac12\\end{bmatrix} \\begin{bmatrix}x a\\\\x b\\\\x c\\end{bmatrix} \\( \\alpha \\) se alinea con la fase \\( a \\). en un sistema equilibrado \\( x 0=0 \\) y un fasor giratorio en abc se vuelve un vector que gira en el plano \\( \\alpha\\beta \\) a frecuencia \\( \\omega \\). con convención de potencia invariante el factor es \\( \\sqrt{2/3} \\) (la matriz es ortonormal y conserva la potencia). el homopolar captura el desequilibrio de modo común. cuándo y por qué se usa base del control vectorial y de la teoría de potencia instantánea. permite trabajar con un solo número complejo \\( x \\alpha+jx \\beta \\), simplifica el modelado y es donde operan plls y resonantes (control pr en αβ sin necesidad de rotar a dq). procedimiento (genérico) 1. mide \\( x a,x b,x c \\). 2. aplica la matriz de clarke (elige convención y mantenla en todo el proyecto). 3. opera en αβ (control pr, pll) o rota a dq con park usando \\( \\theta \\). 4. antitransforma αβ→abc para las modulantes del pwm. ejemplo de aplicación real problema: corrientes trifásicas levemente desequilibradas: \\( i a,i b,i c = 1.0,\\,-0.55,\\,-0.45 \\,\\text{p.u.} \\) aplicar clarke y detectar el desequilibrio en el plano αβ. componente α (amplitud invariante): \\( i \\alpha=\\tfrac{2}{3} 1.0-(-0.55)/2-(-0.45)/2 =\\tfrac{2}{3} 1.0+0.275+0.225 =1.0\\,\\text{p.u.} \\). componente β: \\( i \\beta=\\tfrac{1}{\\sqrt3} i b-i c =\\tfrac{1}{\\sqrt3} -0.55+0.45 =-0.058\\,\\text{p.u.} \\). en equilibrio perfecto \\( i \\beta \\) tendría magnitud igual a \\( i \\alpha \\) y desfase 90°; aquí \\( |i \\beta|\\approx0.058\\ll i \\alpha=1.0 \\): el desequilibrio es leve (~5.8 %). en el plano αβ la trayectoria describe una elipse en lugar de un círculo — cuanto más excéntrica, mayor el desequilibrio. un detector dsogi-pll|dsogi puede separar directamente las secuencias positiva y negativa desde αβ. ejemplo de código python import numpy as np def clarke(a, b, c): amplitud invariante al = (2/3) (a - 0.5 b - 0.5 c) be = (2/3) (np.sqrt(3)/2) (b - c) return al, be parámetros y valores típicos si las tres fases suman cero (sin neutro), \\( x 0=0 \\) y basta con \\( \\alpha,\\beta \\). convención de amplitud: el pico de fase se conserva (\\( x \\alpha \\) = pico de la fase a). errores comunes - mezclar convención de amplitud y de potencia (factores \\( \\sqrt{2/3} \\) vs 2/3). - descartar el homopolar cuando hay neutro o desequilibrio relevante. - confundir clarke (eje fijo) con park (eje giratorio). conceptos relacionados - marco-dq · control-vectorial · potencia-instantanea-dq · componentes-simetricas referencias - yazdani, iravani, 2010. - akagi, watanabe, aredes, instantaneous power theory , 2007. clarke alfa-beta trifasico transformada basico modelado"}, {"slug": "variables-estado", "titulo": "Cómo definir las variables de estado", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance", "03-DataCenter-IA"], "objetivos": ["elegir el conjunto minimo de variables que describen el sistema"], "tags": ["estado", "orden", "energia", "independencia", "modelado"], "relacionados": ["modelado-sistemas", "representacion-espacio-estados", "filtro-lcl", "linealizacion-teoria"], "referencias": ["Franklin, Powell, Feedback Control of Dynamic Systems"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Las <strong>variables de estado</strong> son el conjunto <strong>mínimo</strong> de variables que, junto con las entradas\nfuturas, determinan por completo la evolución del sistema. Son la \"memoria\" del sistema en cada\ninstante.</p>\n<h2>Fundamento teórico</h2>\n<p>Idea central: el estado guarda la <strong>energía almacenada</strong>. El número de variables de estado\n(el <strong>orden</strong> del sistema) es igual al número de elementos <strong>independientes</strong> que almacenan\nenergía:\n- Inductor → su <strong>corriente</strong> \\( i_L \\) (energía \\( \\tfrac{1}{2}L i_L^2 \\)).\n- Condensador → su <strong>tensión</strong> \\( v_C \\) (energía \\( \\tfrac{1}{2}C v_C^2 \\)).\n- Masa/inercia → su <strong>velocidad</strong> \\( \\omega \\) (energía \\( \\tfrac{1}{2}J\\omega^2 \\)).\n- Integradores del control (PI, filtros) → su salida es estado.</p>\n<p>La elección <strong>no es única</strong> (cualquier transformación invertible \\( \\mathbf{z}=T\\mathbf{x} \\) da\notro conjunto válido), pero conviene que sean:\n- <strong>Físicas / medibles</strong> (facilitan observador y validación).\n- <strong>Independientes</strong>: si un lazo solo de condensadores o un corte solo de inductores crea una\n  dependencia, esos almacenadores <strong>no</strong> son independientes y el orden baja.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Es el paso que fija la estructura del modelo de estado. Elegir bien evita estados redundantes\n(matriz \\( A \\) singular) o modelos de orden equivocado.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Lista todos los elementos almacenadores de energía.</li>\n<li>Comprueba <strong>independencia</strong> (lazos de C, cortes de L → reducen el orden).</li>\n<li>Asigna a cada almacenador independiente su variable de energía (i en L, v en C, ω en J).</li>\n<li>Añade los estados del <strong>control</strong> (integradores de PI, filtros, PLL).</li>\n<li>Verifica que con esas variables puedes escribir \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># filtro LCL por fase -&gt; 3 estados; en dq -&gt; 6 (cada uno d y q)\nestados = [&quot;iL1&quot;, &quot;vC&quot;, &quot;iL2&quot;]          # corriente L1, tension Cf, corriente L2\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>GFM (proyecto 01): 15 estados = 6 del LCL (dq) + δ + Pm, Qm + 4 integradores PI + 2 del HPF.\nGFL (proyecto 02): 10 = 6 del LCL + δ + ε(PLL) + 2 integradores de corriente.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Tomar como estados independientes condensadores en paralelo o inductores en serie (no lo son).</li>\n<li>Olvidar los estados del controlador (integradores, filtros, PLL).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: las variables de estado se eligieron como las corrientes de inductor y tensiones de\n  condensador del LCL más los estados del control (droop/PLL e integradores).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"modelado-sistemas\">modelado-sistemas</a> · <a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a> · <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Franklin, Powell, <em>Feedback Control of Dynamic Systems</em>.</li>\n</ul>", "buscar": "cómo definir las variables de estado definición las variables de estado son el conjunto mínimo de variables que, junto con las entradas futuras, determinan por completo la evolución del sistema. son la \"memoria\" del sistema en cada instante. fundamento teórico idea central: el estado guarda la energía almacenada . el número de variables de estado (el orden del sistema) es igual al número de elementos independientes que almacenan energía: - inductor → su corriente \\( i l \\) (energía \\( \\tfrac{1}{2}l i l^2 \\)). - condensador → su tensión \\( v c \\) (energía \\( \\tfrac{1}{2}c v c^2 \\)). - masa/inercia → su velocidad \\( \\omega \\) (energía \\( \\tfrac{1}{2}j\\omega^2 \\)). - integradores del control (pi, filtros) → su salida es estado. la elección no es única (cualquier transformación invertible \\( \\mathbf{z}=t\\mathbf{x} \\) da otro conjunto válido), pero conviene que sean: - físicas / medibles (facilitan observador y validación). - independientes : si un lazo solo de condensadores o un corte solo de inductores crea una dependencia, esos almacenadores no son independientes y el orden baja. cuándo y por qué se usa es el paso que fija la estructura del modelo de estado. elegir bien evita estados redundantes (matriz \\( a \\) singular) o modelos de orden equivocado. procedimiento (genérico) 1. lista todos los elementos almacenadores de energía. 2. comprueba independencia (lazos de c, cortes de l → reducen el orden). 3. asigna a cada almacenador independiente su variable de energía (i en l, v en c, ω en j). 4. añade los estados del control (integradores de pi, filtros, pll). 5. verifica que con esas variables puedes escribir \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\). ejemplo de código python filtro lcl por fase - 3 estados; en dq - 6 (cada uno d y q) estados = \"il1\", \"vc\", \"il2\" corriente l1, tension cf, corriente l2 parámetros y valores típicos gfm (proyecto 01): 15 estados = 6 del lcl (dq) + δ + pm, qm + 4 integradores pi + 2 del hpf. gfl (proyecto 02): 10 = 6 del lcl + δ + ε(pll) + 2 integradores de corriente. errores comunes - tomar como estados independientes condensadores en paralelo o inductores en serie (no lo son). - olvidar los estados del controlador (integradores, filtros, pll). uso en proyectos - 01/02 : las variables de estado se eligieron como las corrientes de inductor y tensiones de condensador del lcl más los estados del control (droop/pll e integradores). conceptos relacionados - modelado-sistemas · representacion-espacio-estados · filtro-lcl referencias - franklin, powell, feedback control of dynamic systems . estado orden energia independencia modelado"}, {"slug": "arquitecturas-control", "titulo": "Arquitecturas de control (cascada, feedforward, 2-DOF)", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["elegir la estructura del lazo antes de sintonizar"], "tags": ["arquitectura", "cascada", "feedforward", "2-DOF", "desacoplo"], "relacionados": ["ciclo-diseno-control", "control-cascada", "metodos-sintesis-control"], "referencias": ["Aström, Hägglund, Advanced PID Control, ISA 2006"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Decisión, previa a la sintonía, de <strong>cómo se estructura</strong> el control: qué se mide, qué lazos hay\ny cómo se combinan. La estructura suele importar más que el ajuste fino de ganancias.</p>\n<h2>Fundamento teórico</h2>\n<p>Patrones principales:\n- <strong>Cascada</strong>: lazos anidados (interno rápido, externo lento). Mejora el rechazo de\n  perturbaciones internas y da protección. Requiere <strong>separación de escalas</strong>. Ver <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a>.\n- <strong>Feedforward / desacoplo</strong>: cancela perturbaciones medibles o acoplamientos conocidos\n  (p.ej. términos \\( \\pm\\omega L \\) del marco dq) antes de que afecten. No afecta a la\n  estabilidad del lazo (es de lazo abierto) pero mejora el desempeño.\n- <strong>2-DOF</strong> (dos grados de libertad): separa el seguimiento de referencia (prefiltro) del\n  rechazo de perturbación (realimentación), permitiendo optimizarlos por separado.\n- <strong>Específicos de convertidores</strong>: impedancia virtual, amortiguamiento activo, que dan forma a\n  la dinámica sin un lazo clásico adicional.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Elegir bien la arquitectura simplifica la sintonía y mejora robustez. La cascada es estándar en\nconvertidores con control de tensión; el feedforward/desacoplo es casi obligatorio en dq.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Identifica qué variables puedes medir y cuáles quieres controlar.</li>\n<li>Si hay dinámica rápida interna controlable, usa cascada (interno = la rápida).</li>\n<li>Añade feedforward para perturbaciones/acoplamientos medibles.</li>\n<li>Si seguimiento y rechazo tienen requisitos distintos, considera 2-DOF.</li>\n<li>Verifica que cada feedforward realmente ayuda <strong>en lazo cerrado</strong> (no asumir).</li>\n</ol>\n<h2>Errores comunes</h2>\n<ul>\n<li>Feedforward que desestabiliza (en el GFM, el feedforward de carga lo hacía): siempre verificar.</li>\n<li>Cascada sin separación de escalas → los lazos interactúan.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 (GFM)</strong>: cascada tensión/corriente + desacoplo dq + impedancia virtual + damping activo.</li>\n<li><strong>02 (GFL)</strong>: lazo de corriente + PLL; sin lazo de tensión externo.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> · <a class=\"wl\" data-slug=\"metodos-sintesis-control\">metodos-sintesis-control</a> · <a class=\"wl\" data-slug=\"ciclo-diseno-control\">ciclo-diseno-control</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Aström, Hägglund, <em>Advanced PID Control</em>, 2006.</li>\n</ul>", "buscar": "arquitecturas de control (cascada, feedforward, 2-dof) definición decisión, previa a la sintonía, de cómo se estructura el control: qué se mide, qué lazos hay y cómo se combinan. la estructura suele importar más que el ajuste fino de ganancias. fundamento teórico patrones principales: - cascada : lazos anidados (interno rápido, externo lento). mejora el rechazo de perturbaciones internas y da protección. requiere separación de escalas . ver control-cascada . - feedforward / desacoplo : cancela perturbaciones medibles o acoplamientos conocidos (p.ej. términos \\( \\pm\\omega l \\) del marco dq) antes de que afecten. no afecta a la estabilidad del lazo (es de lazo abierto) pero mejora el desempeño. - 2-dof (dos grados de libertad): separa el seguimiento de referencia (prefiltro) del rechazo de perturbación (realimentación), permitiendo optimizarlos por separado. - específicos de convertidores : impedancia virtual, amortiguamiento activo, que dan forma a la dinámica sin un lazo clásico adicional. cuándo y por qué se usa elegir bien la arquitectura simplifica la sintonía y mejora robustez. la cascada es estándar en convertidores con control de tensión; el feedforward/desacoplo es casi obligatorio en dq. procedimiento (genérico) 1. identifica qué variables puedes medir y cuáles quieres controlar. 2. si hay dinámica rápida interna controlable, usa cascada (interno = la rápida). 3. añade feedforward para perturbaciones/acoplamientos medibles. 4. si seguimiento y rechazo tienen requisitos distintos, considera 2-dof. 5. verifica que cada feedforward realmente ayuda en lazo cerrado (no asumir). errores comunes - feedforward que desestabiliza (en el gfm, el feedforward de carga lo hacía): siempre verificar. - cascada sin separación de escalas → los lazos interactúan. uso en proyectos - 01 (gfm) : cascada tensión/corriente + desacoplo dq + impedancia virtual + damping activo. - 02 (gfl) : lazo de corriente + pll; sin lazo de tensión externo. conceptos relacionados - control-cascada · metodos-sintesis-control · ciclo-diseno-control referencias - aström, hägglund, advanced pid control , 2006. arquitectura cascada feedforward 2-dof desacoplo"}, {"slug": "asignacion-polos-lqr", "titulo": "Control en espacio de estados (asignación de polos, LQR/LQG)", "categoria": "metodologia", "tipo": "metodo", "nivel": "avanzado", "proyectos": [], "objetivos": ["disenar control MIMO con realimentacion de estado"], "tags": ["espacio-estados", "asignacion-polos", "LQR", "LQG", "observador", "MIMO"], "relacionados": ["metodos-sintesis-control", "linealizacion-numerica", "analisis-modal", "control-robusto-hinf"], "referencias": ["Anderson, Moore, Optimal Control: Linear Quadratic Methods, 1990", "Franklin, Powell, Feedback Control of Dynamic Systems"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Familia de métodos que diseñan el control realimentando el <strong>vector de estado</strong>\n\\( u=-Kx \\), eligiendo \\( K \\) por <strong>asignación de polos</strong> (colocar los autovalores donde se\nquiera) o por <strong>LQR</strong> (minimizar un coste cuadrático). Naturales para sistemas MIMO y de muchos\nestados como un convertidor.</p>\n<h2>Fundamento teórico</h2>\n<ul>\n<li><strong>Asignación de polos</strong>: si el par \\( (A,B) \\) es controlable, existe \\( K \\) tal que los\n  autovalores de \\( A-BK \\) son los deseados. Da control directo de la dinámica, pero elegir\n  \"buenos\" polos en MIMO no es trivial.</li>\n<li><strong>LQR</strong>: minimiza \\( J=\\int (x^TQx + u^TRu)\\,dt \\); la solución \\( K=R^{-1}B^TP \\) viene de la\n  ecuación de Riccati. \\( Q,R \\) ponderan desempeño vs esfuerzo de control. Garantiza márgenes\n  de robustez (≥60° de fase) en el caso de estado completo.</li>\n<li><strong>LQG</strong>: LQR + <strong>observador</strong> (filtro de Kalman) cuando no se miden todos los estados.</li>\n<li>Requiere un modelo de estado fiable (ver <a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a>).</li>\n</ul>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando el sistema es MIMO y acoplado (varios estados que interactúan), o cuando se quiere un\ndiseño sistemático que pondere desempeño y esfuerzo. En convertidores: control de estado del\nfiltro LCL, MMC (muchos estados), accionamientos.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Obtén \\( (A,B,C,D) \\) por linealización.</li>\n<li>Comprueba controlabilidad/observabilidad.</li>\n<li>LQR: elige \\( Q,R \\) (p.ej. Bryson: normaliza por máximos admisibles), resuelve Riccati → \\( K \\).</li>\n<li>Si faltan medidas, diseña observador (Kalman) → LQG.</li>\n<li>Evalúa márgenes y robustez (LQG pierde las garantías del LQR: comprobar).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">from scipy.linalg import solve_continuous_are\nimport numpy as np\nP = solve_continuous_are(A, B, Q, R)\nK = np.linalg.solve(R, B.T @ P)        # u = -K x\neig_cl = np.linalg.eigvals(A - B @ K)  # polos en lazo cerrado\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( Q,R \\) por regla de Bryson (inversos de los máximos al cuadrado). Ajustar la relación \\( Q/R \\)\npara más desempeño (Q alto) o menos esfuerzo (R alto).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Asignar polos demasiado rápidos → esfuerzo de control y ruido excesivos.</li>\n<li>Asumir que LQG hereda la robustez del LQR (no la garantiza: verificar márgenes).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li>Pendiente de aplicar en un proyecto (candidato: control de estado del LCL o MMC). Ficha de\n  panorama por ahora.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"metodos-sintesis-control\">metodos-sintesis-control</a> · <a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a> · <a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a> · <a class=\"wl\" data-slug=\"control-robusto-hinf\">control-robusto-hinf</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Anderson, Moore, <em>Optimal Control</em>, 1990.</li>\n</ul>", "buscar": "control en espacio de estados (asignación de polos, lqr/lqg) definición familia de métodos que diseñan el control realimentando el vector de estado \\( u=-kx \\), eligiendo \\( k \\) por asignación de polos (colocar los autovalores donde se quiera) o por lqr (minimizar un coste cuadrático). naturales para sistemas mimo y de muchos estados como un convertidor. fundamento teórico - asignación de polos : si el par \\( (a,b) \\) es controlable, existe \\( k \\) tal que los autovalores de \\( a-bk \\) son los deseados. da control directo de la dinámica, pero elegir \"buenos\" polos en mimo no es trivial. - lqr : minimiza \\( j=\\int (x^tqx + u^tru)\\,dt \\); la solución \\( k=r^{-1}b^tp \\) viene de la ecuación de riccati. \\( q,r \\) ponderan desempeño vs esfuerzo de control. garantiza márgenes de robustez (≥60° de fase) en el caso de estado completo. - lqg : lqr + observador (filtro de kalman) cuando no se miden todos los estados. - requiere un modelo de estado fiable (ver linealizacion-numerica ). cuándo y por qué se usa cuando el sistema es mimo y acoplado (varios estados que interactúan), o cuando se quiere un diseño sistemático que pondere desempeño y esfuerzo. en convertidores: control de estado del filtro lcl, mmc (muchos estados), accionamientos. procedimiento (genérico) 1. obtén \\( (a,b,c,d) \\) por linealización. 2. comprueba controlabilidad/observabilidad. 3. lqr: elige \\( q,r \\) (p.ej. bryson: normaliza por máximos admisibles), resuelve riccati → \\( k \\). 4. si faltan medidas, diseña observador (kalman) → lqg. 5. evalúa márgenes y robustez (lqg pierde las garantías del lqr: comprobar). ejemplo de código python from scipy.linalg import solve continuous are import numpy as np p = solve continuous are(a, b, q, r) k = np.linalg.solve(r, b.t @ p) u = -k x eig cl = np.linalg.eigvals(a - b @ k) polos en lazo cerrado parámetros y valores típicos \\( q,r \\) por regla de bryson (inversos de los máximos al cuadrado). ajustar la relación \\( q/r \\) para más desempeño (q alto) o menos esfuerzo (r alto). errores comunes - asignar polos demasiado rápidos → esfuerzo de control y ruido excesivos. - asumir que lqg hereda la robustez del lqr (no la garantiza: verificar márgenes). uso en proyectos - pendiente de aplicar en un proyecto (candidato: control de estado del lcl o mmc). ficha de panorama por ahora. conceptos relacionados - metodos-sintesis-control · linealizacion-numerica · analisis-modal · control-robusto-hinf referencias - anderson, moore, optimal control , 1990. espacio-estados asignacion-polos lqr lqg observador mimo"}, {"slug": "calidad-potencia", "titulo": "Calidad de potencia y normativa (IEEE 519, IEC 61000)", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["cuantificar y cumplir los límites de distorsión armónica", "desequilibrio y flicker"], "tags": ["calidad-potencia", "thd", "armonicos", "flicker", "ieee519", "iec61000", "desequilibrio", "intermedio"], "relacionados": ["fft-analisis-espectral", "modulacion-pwm", "filtro-lcl", "estabilidad-armonica", "deteccion-islanding"], "referencias": ["IEEE Std 519-2022, Harmonic Control in Electric Power Systems", "IEC 61000-3-2/3-12, Limits for Harmonic Current Emissions", "IEC 61000-4-30, Power Quality Measurement Methods"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Conjunto de métricas y límites normativos que caracterizan la <strong>calidad de la tensión/corriente</strong>\nentregada a la red: armónicos, interarmónicos, desequilibrio, flicker (parpadeo), dips/swells y\ntransitorios. Define lo que el convertidor no debe inyectar en el punto de conexión común (PCC).</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Distorsión armónica total (THD):</strong>\n$$ \\text{THD}_I = \\frac{\\sqrt{\\sum_{h=2}^{\\infty}I_h^2}}{I_1}\\times100\\,\\% $$\nEn <strong>IEEE 519-2022</strong> los límites de corriente se fijan en el PCC en función de la relación\n\\( I_{sc}/I_L \\) (relación de cortocircuito / carga): a mayor SCR más corriente armónica admisible.\nArmónicos de tensión total &lt; 5 %, individuales &lt; 3 %.</p>\n<p><strong>IEC 61000-3-2/3-12:</strong> límites de emisión armónica de equipos individuales (hasta 16 A y hasta\n75 A respectivamente) para 2–40 armónicos en valores absolutos (A) por fase.</p>\n<p><strong>Desequilibrio de tensión</strong> (NEMA / IEC 61000-2-2): factor de desequilibrio\n\\( V_{unb}=V_{neg}/V_{pos}\\times100\\,\\% < 2\\text{–}3\\,\\% \\).</p>\n<p><strong>Flicker (IEC 61000-3-3 / 61000-3-11):</strong> \\( P_{st} \\) (flicker de corta duración, 10 min) y\n\\( P_{lt} \\) (larga duración, 2 h) miden la sensación de parpadeo; causado por cargas pulsantes de\ngran amplitud a 0.5–25 Hz. Límites: \\( P_{st}<1 \\), \\( P_{lt}<0.65 \\).</p>\n<p><strong>Medición normativa (IEC 61000-4-30 clase A):</strong> ventanas sincronizadas de 10/12 ciclos (200/166,7 ms);\nagrupación en 3 s, 10 min, 2 h para estadísticas.</p>\n<p><strong>Origen en convertidores:</strong> la <a class=\"wl\" data-slug=\"modulacion-pwm\">conmutación PWM</a> genera armónicos en torno a\n\\( f_{sw} \\) y bandas laterales; el <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a> los atenúa; la resonancia del LCL y la\n<a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad-armonica</a> pueden amplificarlos. Las cargas pulsantes de data center (GPU en rafaga)\ngeneran flicker e interarmónicos.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Como criterio de aceptación en el diseño del filtro y del control, en auditorías de conexión a red\ny en el análisis de impacto de cargas de data center / renovables. Conecta los estudios de\nsimulación con los requisitos legales.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Identifica la norma aplicable (IEEE 519 para red industrial US; IEC 61000 para Europa/equipos).</li>\n<li>Mide o simula la corriente en el PCC con <a class=\"wl\" data-slug=\"fft-analisis-espectral\">FFT</a> (ventana IEC 61000-4-30).</li>\n<li>Compara con los límites por armónico y THD.</li>\n<li>Si incumple: aumenta la atenuación del <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a>, añade filtro activo o <a class=\"wl\" data-slug=\"control-repetitivo\">control-repetitivo</a>,\n   o reduce la carga armónica en el PCC.</li>\n<li>Para flicker: evalúa la carga pulsante y mitiga con almacenamiento/bus DC correctamente\n   dimensionado (<a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a>).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\ndef thd(spectrum_rms, fundamental_idx=1):\n    harm = np.concatenate([spectrum_rms[:fundamental_idx], spectrum_rms[fundamental_idx+1:]])\n    return np.sqrt(np.sum(harm**2)) / spectrum_rms[fundamental_idx] * 100  # %\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>THD de corriente &lt; 5 % (IEEE 519 en conexión típica); armónico individual 3–5 % (orden dependiente);\ndesequilibrio &lt; 2 %; \\( P_{st}<1 \\). Armónicos dominantes de VSC 2-niveles: \\( f_{sw}\\pm 2f_1 \\),\n\\( 2f_{sw}\\pm f_1 \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Medir THD con ventana no sincronizada → fuga espectral que infla el THD artificialmente.</li>\n<li>Cumplir límites de armónicos individuales pero ignorar el THD total.</li>\n<li>Confundir límites de emisión de equipo (IEC 61000-3-2) con límites del PCC (IEEE 519).</li>\n<li>Ignorar el flicker en cargas pulsantes de data center (GPU workloads).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"fft-analisis-espectral\">fft-analisis-espectral</a> · <a class=\"wl\" data-slug=\"modulacion-pwm\">modulacion-pwm</a> · <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a> · <a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad-armonica</a> · <a class=\"wl\" data-slug=\"deteccion-islanding\">deteccion-islanding</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>IEEE Std 519-2022, <em>Harmonic Control in Electric Power Systems</em>.</li>\n<li>IEC 61000-3-2, <em>Limits for Harmonic Current Emissions</em>.</li>\n<li>IEC 61000-4-30, <em>Power Quality Measurement Methods</em>.</li>\n</ul>", "buscar": "calidad de potencia y normativa (ieee 519, iec 61000) definición conjunto de métricas y límites normativos que caracterizan la calidad de la tensión/corriente entregada a la red: armónicos, interarmónicos, desequilibrio, flicker (parpadeo), dips/swells y transitorios. define lo que el convertidor no debe inyectar en el punto de conexión común (pcc). fundamento teórico distorsión armónica total (thd): \\text{thd} i = \\frac{\\sqrt{\\sum {h=2}^{\\infty}i h^2}}{i 1}\\times100\\,\\% en ieee 519-2022 los límites de corriente se fijan en el pcc en función de la relación \\( i {sc}/i l \\) (relación de cortocircuito / carga): a mayor scr más corriente armónica admisible. armónicos de tensión total < 5 %, individuales < 3 %. iec 61000-3-2/3-12: límites de emisión armónica de equipos individuales (hasta 16 a y hasta 75 a respectivamente) para 2–40 armónicos en valores absolutos (a) por fase. desequilibrio de tensión (nema / iec 61000-2-2): factor de desequilibrio \\( v {unb}=v {neg}/v {pos}\\times100\\,\\% < 2\\text{–}3\\,\\% \\). flicker (iec 61000-3-3 / 61000-3-11): \\( p {st} \\) (flicker de corta duración, 10 min) y \\( p {lt} \\) (larga duración, 2 h) miden la sensación de parpadeo; causado por cargas pulsantes de gran amplitud a 0.5–25 hz. límites: \\( p {st}<1 \\), \\( p {lt}<0.65 \\). medición normativa (iec 61000-4-30 clase a): ventanas sincronizadas de 10/12 ciclos (200/166,7 ms); agrupación en 3 s, 10 min, 2 h para estadísticas. origen en convertidores: la modulacion-pwm|conmutación pwm genera armónicos en torno a \\( f {sw} \\) y bandas laterales; el filtro-lcl los atenúa; la resonancia del lcl y la estabilidad-armonica pueden amplificarlos. las cargas pulsantes de data center (gpu en rafaga) generan flicker e interarmónicos. cuándo y por qué se usa como criterio de aceptación en el diseño del filtro y del control, en auditorías de conexión a red y en el análisis de impacto de cargas de data center / renovables. conecta los estudios de simulación con los requisitos legales. procedimiento de diseño (genérico) 1. identifica la norma aplicable (ieee 519 para red industrial us; iec 61000 para europa/equipos). 2. mide o simula la corriente en el pcc con fft-analisis-espectral|fft (ventana iec 61000-4-30). 3. compara con los límites por armónico y thd. 4. si incumple: aumenta la atenuación del filtro-lcl , añade filtro activo o control-repetitivo , o reduce la carga armónica en el pcc. 5. para flicker: evalúa la carga pulsante y mitiga con almacenamiento/bus dc correctamente dimensionado ( dinamica-bus-dc ). ejemplo de código python import numpy as np def thd(spectrum rms, fundamental idx=1): harm = np.concatenate( spectrum rms :fundamental idx , spectrum rms fundamental idx+1: ) return np.sqrt(np.sum(harm 2)) / spectrum rms fundamental idx 100 % parámetros y valores típicos thd de corriente < 5 % (ieee 519 en conexión típica); armónico individual 3–5 % (orden dependiente); desequilibrio < 2 %; \\( p {st}<1 \\). armónicos dominantes de vsc 2-niveles: \\( f {sw}\\pm 2f 1 \\), \\( 2f {sw}\\pm f 1 \\). errores comunes - medir thd con ventana no sincronizada → fuga espectral que infla el thd artificialmente. - cumplir límites de armónicos individuales pero ignorar el thd total. - confundir límites de emisión de equipo (iec 61000-3-2) con límites del pcc (ieee 519). - ignorar el flicker en cargas pulsantes de data center (gpu workloads). conceptos relacionados - fft-analisis-espectral · modulacion-pwm · filtro-lcl · estabilidad-armonica · deteccion-islanding referencias - ieee std 519-2022, harmonic control in electric power systems . - iec 61000-3-2, limits for harmonic current emissions . - iec 61000-4-30, power quality measurement methods . calidad-potencia thd armonicos flicker ieee519 iec61000 desequilibrio intermedio"}, {"slug": "ciclo-diseno-control", "titulo": "Ciclo de diseño de control (Diseñar → Evaluar → Validar)", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["estructurar el proceso de diseno de control de un convertidor"], "tags": ["metodologia", "diseno", "evaluacion", "validacion", "proceso"], "relacionados": ["especificaciones-control", "metodos-sintesis-control", "margenes-estabilidad", "niveles-validacion", "robustez-parametrica"], "referencias": ["Aström, Murray, Feedback Systems, Princeton 2008", "Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Marco de trabajo que organiza el diseño de un controlador en tres fases con realimentación entre\nellas: <strong>Diseñar</strong> (de la especificación al controlador), <strong>Evaluar</strong> (¿cumple y es robusto?) y\n<strong>Validar</strong> (¿funciona en la realidad?). Es el hilo que da coherencia a todas las técnicas.</p>\n<h2>Fundamento teórico</h2>\n<p>El principio que distingue \"conocer técnicas\" de \"saber diseñar control\" es la <strong>trazabilidad</strong>:\n$$ \\text{requisito} \\rightarrow \\text{especificación medible} \\rightarrow \\text{decisión de diseño}\n   \\rightarrow \\text{métrica de evaluación} \\rightarrow \\text{prueba de validación} $$\nCada decisión de diseño debe tener un criterio de aceptación medible y una prueba que lo\nconfirme en un nivel de fidelidad adecuado.</p>\n<h2>Las tres fases (mapa)</h2>\n<p><strong>1 · Diseñar</strong> — <a class=\"wl\" data-slug=\"especificaciones-control\">especificaciones-control</a> · <a class=\"wl\" data-slug=\"arquitecturas-control\">arquitecturas-control</a> ·\n<a class=\"wl\" data-slug=\"metodos-sintesis-control\">metodos-sintesis-control</a> (clásico: <a class=\"wl\" data-slug=\"sintonia-pi-pid\">sintonia-pi-pid</a>, <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a>; estado:\n<a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a>; avanzado: <a class=\"wl\" data-slug=\"control-predictivo\">control-predictivo</a>, <a class=\"wl\" data-slug=\"control-robusto-hinf\">control-robusto-hinf</a>).</p>\n<p><strong>2 · Evaluar</strong> — estabilidad (<a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a>, Nyquist) · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> ·\n<a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a> · <a class=\"wl\" data-slug=\"metricas-desempeno\">metricas-desempeno</a> · <a class=\"wl\" data-slug=\"robustez-parametrica\">robustez-parametrica</a>.</p>\n<p><strong>3 · Validar</strong> — <a class=\"wl\" data-slug=\"niveles-validacion\">niveles-validacion</a> (lineal → no lineal → conmutado → HIL → real) ·\n<a class=\"wl\" data-slug=\"pruebas-validacion\">pruebas-validacion</a> · <a class=\"wl\" data-slug=\"validacion-cruzada\">validacion-cruzada</a>.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Siempre. Evita el error típico de \"ajustar ganancias hasta que parezca ir\": fuerza a fijar\nobjetivos medibles antes de diseñar y a validar lo diseñado en el nivel correcto.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Especifica objetivos medibles (ancho de banda, margen de fase, rechazo, robustez).</li>\n<li>Modela la planta al nivel adecuado (p.ej. promediado dq linealizado).</li>\n<li>Elige arquitectura y método de síntesis; sintoniza.</li>\n<li>Evalúa: estabilidad, márgenes, desempeño, robustez paramétrica.</li>\n<li>Valida subiendo niveles de fidelidad; vuelve a (3) si falla.</li>\n</ol>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02 (GFM/GFL)</strong>: el ciclo completo — diseño (cascada/droop/PLL), evaluación (polos,\n  impedancia, SCR crítico) y validación (lineal ↔ inyección ↔ conmutado).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"especificaciones-control\">especificaciones-control</a> · <a class=\"wl\" data-slug=\"metodos-sintesis-control\">metodos-sintesis-control</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"niveles-validacion\">niveles-validacion</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Aström, Murray, <em>Feedback Systems</em>, 2008 · Skogestad, <em>Multivariable Feedback Control</em>, 2005.</li>\n</ul>", "buscar": "ciclo de diseño de control (diseñar → evaluar → validar) definición marco de trabajo que organiza el diseño de un controlador en tres fases con realimentación entre ellas: diseñar (de la especificación al controlador), evaluar (¿cumple y es robusto?) y validar (¿funciona en la realidad?). es el hilo que da coherencia a todas las técnicas. fundamento teórico el principio que distingue \"conocer técnicas\" de \"saber diseñar control\" es la trazabilidad : \\text{requisito} \\rightarrow \\text{especificación medible} \\rightarrow \\text{decisión de diseño} \\rightarrow \\text{métrica de evaluación} \\rightarrow \\text{prueba de validación} cada decisión de diseño debe tener un criterio de aceptación medible y una prueba que lo confirme en un nivel de fidelidad adecuado. las tres fases (mapa) 1 · diseñar — especificaciones-control · arquitecturas-control · metodos-sintesis-control (clásico: sintonia-pi-pid , loop-shaping ; estado: asignacion-polos-lqr ; avanzado: control-predictivo , control-robusto-hinf ). 2 · evaluar — estabilidad ( analisis-modal , nyquist) · margenes-estabilidad · funciones-sensibilidad · metricas-desempeno · robustez-parametrica . 3 · validar — niveles-validacion (lineal → no lineal → conmutado → hil → real) · pruebas-validacion · validacion-cruzada . cuándo y por qué se usa siempre. evita el error típico de \"ajustar ganancias hasta que parezca ir\": fuerza a fijar objetivos medibles antes de diseñar y a validar lo diseñado en el nivel correcto. procedimiento (genérico) 1. especifica objetivos medibles (ancho de banda, margen de fase, rechazo, robustez). 2. modela la planta al nivel adecuado (p.ej. promediado dq linealizado). 3. elige arquitectura y método de síntesis; sintoniza. 4. evalúa: estabilidad, márgenes, desempeño, robustez paramétrica. 5. valida subiendo niveles de fidelidad; vuelve a (3) si falla. uso en proyectos - 01/02 (gfm/gfl) : el ciclo completo — diseño (cascada/droop/pll), evaluación (polos, impedancia, scr crítico) y validación (lineal ↔ inyección ↔ conmutado). conceptos relacionados - especificaciones-control · metodos-sintesis-control · margenes-estabilidad · niveles-validacion referencias - aström, murray, feedback systems , 2008 · skogestad, multivariable feedback control , 2005. metodologia diseno evaluacion validacion proceso"}, {"slug": "clasificacion-estabilidad", "titulo": "Clasificación de la estabilidad del sistema de potencia", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["ubicar cada fenómeno de estabilidad en un marco común y elegir la herramienta"], "tags": ["estabilidad", "clasificacion", "converter-driven", "frecuencia", "tension", "angulo", "intermedio"], "relacionados": ["estabilidad-armonica", "oscilaciones-subsincronas", "ecuacion-oscilacion", "interaccion-pll-red-debil", "grid-forming-vs-following"], "referencias": ["Hatziargyriou et al., Definition and Classification of Power System Stability Revisited & Extended, IEEE TPWRS 2021", "Kundur, Power System Stability and Control, McGraw-Hill 1994"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Marco taxonómico (IEEE/CIGRE 2021) que organiza <strong>todos</strong> los fenómenos de estabilidad de un\nsistema eléctrico según la variable física afectada, la magnitud de la perturbación y la escala de\ntiempo. Permite ubicar cada concepto del repositorio y elegir el modelo/criterio adecuado.</p>\n<h2>Fundamento teórico</h2>\n<p>Categorías principales:\n- <strong>Estabilidad de ángulo del rotor:</strong> capacidad de las máquinas síncronas de mantener sincronismo.\n  Subdivisiones: <em>pequeña señal</em> (oscilaciones, <a class=\"wl\" data-slug=\"ecuacion-oscilacion\">modo electromecánico</a>) y\n  <em>transitoria</em> (gran perturbación, criterio de áreas iguales).\n- <strong>Estabilidad de frecuencia:</strong> equilibrio generación-carga tras un desbalance grande; depende de\n  inercia y reservas (FFR, droop). Escala: segundos a minutos.\n- <strong>Estabilidad de tensión:</strong> capacidad de mantener tensiones aceptables; <em>pequeña</em> y <em>gran</em>\n  perturbación; ligada a límites de reactiva y colapso de tensión.\n- <strong>Estabilidad de resonancia:</strong> intercambio de energía oscilatorio — <em>eléctrica</em> (serie, SSR) y\n  <em>electromecánica</em> (torsional); ver <a class=\"wl\" data-slug=\"oscilaciones-subsincronas\">oscilaciones-subsincronas</a>.\n- <strong>Estabilidad impulsada por convertidor (converter-driven):</strong> la categoría <strong>nueva</strong> de 2021,\n  por la dinámica rápida de la electrónica de potencia. Dos bandas:\n  - <em>Interacción lenta</em> (&lt; ~10 Hz): PLL en red débil, lazo de potencia/sincronización\n    (<a class=\"wl\" data-slug=\"interaccion-pll-red-debil\">interaccion-pll-red-debil</a>, GFM vs GFL).\n  - <em>Interacción rápida</em> (decenas de Hz–kHz): resonancia/<a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad armónica</a>.</p>\n<p>Eje transversal: <strong>pequeña señal</strong> (linealización, autovalores/impedancia) vs <strong>gran perturbación</strong>\n(simulación no lineal en el tiempo).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Como mapa para diagnosticar: ante una oscilación o colapso, su frecuencia y causa la sitúan en una\ncategoría, lo que dicta el modelo (electromecánico, fasorial, conmutado), la herramienta (modal,\nimpedancia, dominio del tiempo) y la mitigación.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Caracteriza el evento: variable afectada (ángulo/frecuencia/tensión), frecuencia de oscilación,\n   tamaño de la perturbación.</li>\n<li>Ubícalo en la categoría correspondiente.</li>\n<li>Elige el modelo y el criterio (modal/impedancia/temporal) acorde a la escala.</li>\n<li>Aplica la mitigación propia de esa categoría.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-text\">f_osc &lt; 1 Hz  ........ ángulo (modo electromecánico) / frecuencia\n1–10 Hz ............. converter-driven lento (PLL, red débil)\n10 Hz–kHz ........... converter-driven rápido (resonancia/armónica)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Modo electromecánico 0.1–2 Hz; interárea 0.1–0.8 Hz; converter-driven lento 1–10 Hz; armónico\n100 Hz–3 kHz; SSR/SSCI 5–100 Hz.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Aplicar modelos electromecánicos (fasor a 50 Hz) a fenómenos converter-driven rápidos.</li>\n<li>Tratar como \"estabilidad de tensión\" una oscilación que es resonancia de impedancia.</li>\n<li>Olvidar que en sistemas dominados por convertidores la inercia ya no garantiza estabilidad.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad-armonica</a> · <a class=\"wl\" data-slug=\"oscilaciones-subsincronas\">oscilaciones-subsincronas</a> · <a class=\"wl\" data-slug=\"ecuacion-oscilacion\">ecuacion-oscilacion</a> · <a class=\"wl\" data-slug=\"interaccion-pll-red-debil\">interaccion-pll-red-debil</a> · <a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Hatziargyriou et al., <em>Definition and Classification of Power System Stability Revisited &amp; Extended</em>, IEEE TPWRS 2021.</li>\n<li>Kundur, <em>Power System Stability and Control</em>, 1994.</li>\n</ul>", "buscar": "clasificación de la estabilidad del sistema de potencia definición marco taxonómico (ieee/cigre 2021) que organiza todos los fenómenos de estabilidad de un sistema eléctrico según la variable física afectada, la magnitud de la perturbación y la escala de tiempo. permite ubicar cada concepto del repositorio y elegir el modelo/criterio adecuado. fundamento teórico categorías principales: - estabilidad de ángulo del rotor: capacidad de las máquinas síncronas de mantener sincronismo. subdivisiones: pequeña señal (oscilaciones, ecuacion-oscilacion|modo electromecánico ) y transitoria (gran perturbación, criterio de áreas iguales). - estabilidad de frecuencia: equilibrio generación-carga tras un desbalance grande; depende de inercia y reservas (ffr, droop). escala: segundos a minutos. - estabilidad de tensión: capacidad de mantener tensiones aceptables; pequeña y gran perturbación; ligada a límites de reactiva y colapso de tensión. - estabilidad de resonancia: intercambio de energía oscilatorio — eléctrica (serie, ssr) y electromecánica (torsional); ver oscilaciones-subsincronas . - estabilidad impulsada por convertidor (converter-driven): la categoría nueva de 2021, por la dinámica rápida de la electrónica de potencia. dos bandas: - interacción lenta (< ~10 hz): pll en red débil, lazo de potencia/sincronización ( interaccion-pll-red-debil , gfm vs gfl). - interacción rápida (decenas de hz–khz): resonancia/ estabilidad-armonica|estabilidad armónica . eje transversal: pequeña señal (linealización, autovalores/impedancia) vs gran perturbación (simulación no lineal en el tiempo). cuándo y por qué se usa como mapa para diagnosticar: ante una oscilación o colapso, su frecuencia y causa la sitúan en una categoría, lo que dicta el modelo (electromecánico, fasorial, conmutado), la herramienta (modal, impedancia, dominio del tiempo) y la mitigación. procedimiento de diseño (genérico) 1. caracteriza el evento: variable afectada (ángulo/frecuencia/tensión), frecuencia de oscilación, tamaño de la perturbación. 2. ubícalo en la categoría correspondiente. 3. elige el modelo y el criterio (modal/impedancia/temporal) acorde a la escala. 4. aplica la mitigación propia de esa categoría. ejemplo de código text f osc < 1 hz ........ ángulo (modo electromecánico) / frecuencia 1–10 hz ............. converter-driven lento (pll, red débil) 10 hz–khz ........... converter-driven rápido (resonancia/armónica) parámetros y valores típicos modo electromecánico 0.1–2 hz; interárea 0.1–0.8 hz; converter-driven lento 1–10 hz; armónico 100 hz–3 khz; ssr/ssci 5–100 hz. errores comunes - aplicar modelos electromecánicos (fasor a 50 hz) a fenómenos converter-driven rápidos. - tratar como \"estabilidad de tensión\" una oscilación que es resonancia de impedancia. - olvidar que en sistemas dominados por convertidores la inercia ya no garantiza estabilidad. conceptos relacionados - estabilidad-armonica · oscilaciones-subsincronas · ecuacion-oscilacion · interaccion-pll-red-debil · grid-forming-vs-following referencias - hatziargyriou et al., definition and classification of power system stability revisited & extended , ieee tpwrs 2021. - kundur, power system stability and control , 1994. estabilidad clasificacion converter-driven frecuencia tension angulo intermedio"}, {"slug": "control-jerarquico-microrred", "titulo": "Control jerárquico de microrredes (primario/secundario/terciario)", "categoria": "metodologia", "tipo": "metodo", "nivel": "avanzado", "proyectos": [], "objetivos": ["organizar el control de una microrred en capas por escala de tiempo y objetivo"], "tags": ["microrred", "jerarquico", "primario", "secundario", "terciario", "droop", "restauracion", "avanzado"], "relacionados": ["droop-control", "droop-dc", "microrred-hibrida-ac-dc", "servicios-red-soporte", "vsm-inercia"], "referencias": ["Guerrero et al., Hierarchical Control of Droop-Controlled AC and DC Microgrids, IEEE TIE 2011", "Olivares et al., Trends in Microgrid Control, IEEE TSG 2014"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Arquitectura de control en <strong>tres niveles</strong> —primario, secundario y terciario— separados por escala\nde tiempo y objetivo, que coordina las fuentes de una microrred desde la dinámica rápida del\nconvertidor hasta la gestión económica y el intercambio con la red.</p>\n<h2>Fundamento teórico</h2>\n<ul>\n<li><strong>Primario (ms–s):</strong> local, sin comunicaciones. Lazos de tensión/corriente del convertidor y\n  <strong>droop</strong> para reparto de potencia entre unidades en paralelo (ver <a class=\"wl\" data-slug=\"droop-control\">droop-control</a>,\n  <a class=\"wl\" data-slug=\"droop-dc\">droop-dc</a>):\n  $$ \\omega=\\omega^*-m\\,P,\\qquad V=V^*-n\\,Q\\quad(\\text{AC});\\qquad V_{dc}=V_{dc}^*-R_d\\,I\\ (\\text{DC}) $$\n  Da estabilidad y reparto proporcional, pero deja <strong>desviación</strong> en \\( \\omega/V \\).</li>\n<li><strong>Secundario (s–min):</strong> <strong>restaura</strong> la desviación que deja el droop, devolviendo \\( \\omega \\) y\n  \\( V \\) a su valor nominal y corrigiendo el reparto; puede ser centralizado o <strong>distribuido</strong>\n  (consenso). Aporta el término de corrección \\( \\delta\\omega,\\delta V \\) que se suma a la referencia\n  del primario.</li>\n<li><strong>Terciario (min–h):</strong> <strong>optimiza</strong> el flujo de potencia: despacho económico, intercambio con la\n  red principal, gestión de almacenamiento (EMS). Fija las referencias de P/Q de cada unidad.</li>\n</ul>\n<p>Principio de <strong>separación temporal</strong>: cada nivel es ~5–10× más lento que el inferior para no\ninteractuar. Modos de operación: <strong>conectado a red</strong> (terciario manda P/Q) e <strong>isla</strong> (primario +\nsecundario mantienen la red).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En microrredes (incluida la híbrida AC/DC del data center): coordina varias fuentes/convertidores,\ngarantiza reparto de carga, calidad de tensión/frecuencia y operación económica, con transición\nsuave isla↔red. Traduce los <a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios de red</a> a una estructura operable.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Diseña el <strong>primario</strong> (lazos internos + droop) para estabilidad y reparto.</li>\n<li>Añade el <strong>secundario</strong> (PI/consenso) con banda ~1/10 del primario para restaurar \\( \\omega/V \\).</li>\n<li>Define el <strong>terciario</strong> (optimización/EMS) y las referencias que envía.</li>\n<li>Especifica comunicaciones y tolerancia a su fallo (distribuido &gt; centralizado en robustez).</li>\n<li>Verifica transiciones isla↔red y estabilidad de la interacción entre niveles.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def primary(w_ref, V_ref, P, Q, m, n, dW=0.0, dV=0.0):\n    w = w_ref - m*P + dW                 # droop + correccion secundaria (dW, dV)\n    V = V_ref - n*Q + dV\n    return w, V\n# secundario: dW += k_s*(w_nom - w_med)*dt   (restauracion)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Primario ms–s; secundario segundos; terciario minutos. Droop \\( m,n \\) para 1–5 % de desviación a\nplena carga. Bandas separadas factor 5–10 entre niveles.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Bandas de niveles solapadas → interacción y oscilación entre primario y secundario.</li>\n<li>Secundario centralizado sin plan ante fallo de comunicaciones.</li>\n<li>Reparto deficiente en DC por resistencias de línea desiguales (corregir en secundario).</li>\n<li>Transición isla↔red sin sincronización previa → transitorios bruscos.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"droop-control\">droop-control</a> · <a class=\"wl\" data-slug=\"droop-dc\">droop-dc</a> · <a class=\"wl\" data-slug=\"microrred-hibrida-ac-dc\">microrred-hibrida-ac-dc</a> · <a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios-red-soporte</a> · <a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Guerrero et al., <em>Hierarchical Control of Droop-Controlled AC and DC Microgrids</em>, IEEE TIE 2011.</li>\n<li>Olivares et al., <em>Trends in Microgrid Control</em>, IEEE TSG 2014.</li>\n</ul>", "buscar": "control jerárquico de microrredes (primario/secundario/terciario) definición arquitectura de control en tres niveles —primario, secundario y terciario— separados por escala de tiempo y objetivo, que coordina las fuentes de una microrred desde la dinámica rápida del convertidor hasta la gestión económica y el intercambio con la red. fundamento teórico - primario (ms–s): local, sin comunicaciones. lazos de tensión/corriente del convertidor y droop para reparto de potencia entre unidades en paralelo (ver droop-control , droop-dc ): \\omega=\\omega^ -m\\,p,\\qquad v=v^ -n\\,q\\quad(\\text{ac});\\qquad v {dc}=v {dc}^ -r d\\,i\\ (\\text{dc}) da estabilidad y reparto proporcional, pero deja desviación en \\( \\omega/v \\). - secundario (s–min): restaura la desviación que deja el droop, devolviendo \\( \\omega \\) y \\( v \\) a su valor nominal y corrigiendo el reparto; puede ser centralizado o distribuido (consenso). aporta el término de corrección \\( \\delta\\omega,\\delta v \\) que se suma a la referencia del primario. - terciario (min–h): optimiza el flujo de potencia: despacho económico, intercambio con la red principal, gestión de almacenamiento (ems). fija las referencias de p/q de cada unidad. principio de separación temporal : cada nivel es ~5–10× más lento que el inferior para no interactuar. modos de operación: conectado a red (terciario manda p/q) e isla (primario + secundario mantienen la red). cuándo y por qué se usa en microrredes (incluida la híbrida ac/dc del data center): coordina varias fuentes/convertidores, garantiza reparto de carga, calidad de tensión/frecuencia y operación económica, con transición suave isla↔red. traduce los servicios-red-soporte|servicios de red a una estructura operable. procedimiento de diseño (genérico) 1. diseña el primario (lazos internos + droop) para estabilidad y reparto. 2. añade el secundario (pi/consenso) con banda ~1/10 del primario para restaurar \\( \\omega/v \\). 3. define el terciario (optimización/ems) y las referencias que envía. 4. especifica comunicaciones y tolerancia a su fallo (distribuido centralizado en robustez). 5. verifica transiciones isla↔red y estabilidad de la interacción entre niveles. ejemplo de código python def primary(w ref, v ref, p, q, m, n, dw=0.0, dv=0.0): w = w ref - m p + dw droop + correccion secundaria (dw, dv) v = v ref - n q + dv return w, v secundario: dw += k s (w nom - w med) dt (restauracion) parámetros y valores típicos primario ms–s; secundario segundos; terciario minutos. droop \\( m,n \\) para 1–5 % de desviación a plena carga. bandas separadas factor 5–10 entre niveles. errores comunes - bandas de niveles solapadas → interacción y oscilación entre primario y secundario. - secundario centralizado sin plan ante fallo de comunicaciones. - reparto deficiente en dc por resistencias de línea desiguales (corregir en secundario). - transición isla↔red sin sincronización previa → transitorios bruscos. conceptos relacionados - droop-control · droop-dc · microrred-hibrida-ac-dc · servicios-red-soporte · vsm-inercia referencias - guerrero et al., hierarchical control of droop-controlled ac and dc microgrids , ieee tie 2011. - olivares et al., trends in microgrid control , ieee tsg 2014. microrred jerarquico primario secundario terciario droop restauracion avanzado"}, {"slug": "control-predictivo", "titulo": "Control predictivo (MPC / FCS-MPC)", "categoria": "metodologia", "tipo": "metodo", "nivel": "avanzado", "proyectos": [], "objetivos": ["controlar con restricciones explicitas optimizando un horizonte"], "tags": ["MPC", "FCS-MPC", "predictivo", "restricciones", "horizonte", "panorama"], "relacionados": ["metodos-sintesis-control", "asignacion-polos-lqr", "current-limiting"], "referencias": ["Rodriguez, Cortes, Predictive Control of Power Converters and Drives, Wiley 2012"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Control que, en cada instante, <strong>predice</strong> el comportamiento futuro con el modelo y <strong>optimiza</strong>\nuna acción minimizando un coste sobre un horizonte, respetando <strong>restricciones explícitas</strong>\n(corriente máxima, tensión de bus). En convertidores destaca el <strong>FCS-MPC</strong> (Finite Control Set),\nque evalúa directamente los estados de conmutación posibles.</p>\n<h2>Fundamento teórico</h2>\n<ul>\n<li><strong>MPC</strong> (continuo/lineal): minimiza \\( J=\\sum (\\hat{y}-y_{ref})^2 + \\lambda\\,\\Delta u^2 \\) sobre\n  un horizonte, sujeto a restricciones; aplica solo el primer paso (horizonte deslizante).</li>\n<li><strong>FCS-MPC</strong>: el convertidor tiene un número <strong>finito</strong> de estados de conmutación; se predice la\n  respuesta de cada uno con el modelo discreto y se elige el de menor coste. Sin modulador (PWM)\n  → frecuencia de conmutación variable.</li>\n<li>Maneja de forma natural el <a class=\"wl\" data-slug=\"current-limiting\">current-limiting</a> (la restricción va en el coste).</li>\n</ul>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando hay <strong>restricciones duras</strong> (corriente, tensión) que deben respetarse, sistemas MIMO con\nacoplamiento, o no linealidades. Muy usado en accionamientos y convertidores modernos.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Modelo discreto de predicción \\( x[k+1]=f(x[k],u[k]) \\).</li>\n<li>Define la función de coste (error de seguimiento + esfuerzo + penalización de restricciones).</li>\n<li>FCS-MPC: enumera los estados de conmutación, predice y elige el de menor coste.</li>\n<li>MPC con restricciones: resuelve la optimización (QP) en cada paso.</li>\n<li>Evalúa coste computacional, frecuencia de conmutación (FCS) y robustez ante error de modelo.</li>\n</ol>\n<h2>Errores comunes</h2>\n<ul>\n<li>FCS-MPC con espectro de conmutación disperso (frecuencia variable) → problemas de filtrado/EMI.</li>\n<li>Sensibilidad al error de modelo (es model-based): la robustez no es automática.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li>Candidato a proyecto propio (FCS-MPC sobre convertidor conectado a red o accionamiento). Ficha\n  de panorama por ahora.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"metodos-sintesis-control\">metodos-sintesis-control</a> · <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a> · <a class=\"wl\" data-slug=\"current-limiting\">current-limiting</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Rodriguez, Cortes, <em>Predictive Control of Power Converters and Drives</em>, 2012.</li>\n</ul>", "buscar": "control predictivo (mpc / fcs-mpc) definición control que, en cada instante, predice el comportamiento futuro con el modelo y optimiza una acción minimizando un coste sobre un horizonte, respetando restricciones explícitas (corriente máxima, tensión de bus). en convertidores destaca el fcs-mpc (finite control set), que evalúa directamente los estados de conmutación posibles. fundamento teórico - mpc (continuo/lineal): minimiza \\( j=\\sum (\\hat{y}-y {ref})^2 + \\lambda\\,\\delta u^2 \\) sobre un horizonte, sujeto a restricciones; aplica solo el primer paso (horizonte deslizante). - fcs-mpc : el convertidor tiene un número finito de estados de conmutación; se predice la respuesta de cada uno con el modelo discreto y se elige el de menor coste. sin modulador (pwm) → frecuencia de conmutación variable. - maneja de forma natural el current-limiting (la restricción va en el coste). cuándo y por qué se usa cuando hay restricciones duras (corriente, tensión) que deben respetarse, sistemas mimo con acoplamiento, o no linealidades. muy usado en accionamientos y convertidores modernos. procedimiento (genérico) 1. modelo discreto de predicción \\( x k+1 =f(x k ,u k ) \\). 2. define la función de coste (error de seguimiento + esfuerzo + penalización de restricciones). 3. fcs-mpc: enumera los estados de conmutación, predice y elige el de menor coste. 4. mpc con restricciones: resuelve la optimización (qp) en cada paso. 5. evalúa coste computacional, frecuencia de conmutación (fcs) y robustez ante error de modelo. errores comunes - fcs-mpc con espectro de conmutación disperso (frecuencia variable) → problemas de filtrado/emi. - sensibilidad al error de modelo (es model-based): la robustez no es automática. uso en proyectos - candidato a proyecto propio (fcs-mpc sobre convertidor conectado a red o accionamiento). ficha de panorama por ahora. conceptos relacionados - metodos-sintesis-control · asignacion-polos-lqr · current-limiting referencias - rodriguez, cortes, predictive control of power converters and drives , 2012. mpc fcs-mpc predictivo restricciones horizonte panorama"}, {"slug": "control-robusto-hinf", "titulo": "Control robusto (H∞, μ-síntesis)", "categoria": "metodologia", "tipo": "metodo", "nivel": "avanzado", "proyectos": [], "objetivos": ["garantizar estabilidad y desempeno ante incertidumbre"], "tags": ["robusto", "H-infinito", "mu-sintesis", "incertidumbre", "panorama"], "relacionados": ["metodos-sintesis-control", "funciones-sensibilidad", "robustez-parametrica", "margenes-estabilidad"], "referencias": ["Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005 (cap. 8-9)"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Métodos que diseñan el controlador para el <strong>peor caso</strong> de incertidumbre del modelo, ofreciendo\n<strong>garantías</strong> de estabilidad y desempeño. \\(H_\\infty\\) minimiza la norma infinito (el pico en\nfrecuencia) de funciones de transferencia ponderadas; la \\(\\mu\\)-síntesis trata incertidumbre\nestructurada.</p>\n<h2>Fundamento teórico</h2>\n<p>Se formula con <strong>pesos</strong> \\( W_S, W_T, W_u \\) que dan forma a las funciones de <a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a>:\n$$ \\min_C \\left\\| \\begin{matrix} W_S S \\\\ W_u KS \\\\ W_T T \\end{matrix} \\right\\|_\\infty $$\nEl resultado garantiza que \\( S, T \\) quedan bajo las plantillas \\( 1/W \\). La incertidumbre del\nmodelo se modela como bloques \\( \\Delta \\) acotados; el teorema de la ganancia pequeña / \\( \\mu \\)\nda la condición de robustez.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando la planta varía mucho (red de fortaleza desconocida, parámetros inciertos) y se necesitan\n<strong>garantías</strong> en vez de comprobaciones puntuales. Conecta con el análisis de impedancia: se puede\nexigir pasividad/robustez en bandas mediante los pesos.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Modela la incertidumbre (multiplicativa, paramétrica) como \\( \\Delta \\) acotado.</li>\n<li>Elige pesos \\( W_S, W_T, W_u \\) que codifiquen las especificaciones.</li>\n<li>Resuelve el problema \\(H_\\infty\\) (solver dedicado) → controlador.</li>\n<li>Verifica robustez (valor singular estructurado \\( \\mu \\)) y reduce el orden del controlador si hace falta.</li>\n</ol>\n<h2>Errores comunes</h2>\n<ul>\n<li>Pesos mal elegidos → controlador conservador o de orden altísimo.</li>\n<li>Olvidar reducir el orden: \\(H_\\infty\\) da controladores del orden de la planta + pesos.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li>Candidato a proyecto propio (p.ej. control robusto de un GFL/GFM ante SCR incierto). Ficha de\n  panorama por ahora.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"metodos-sintesis-control\">metodos-sintesis-control</a> · <a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a> · <a class=\"wl\" data-slug=\"robustez-parametrica\">robustez-parametrica</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, cap. 8-9.</li>\n</ul>", "buscar": "control robusto (h∞, μ-síntesis) definición métodos que diseñan el controlador para el peor caso de incertidumbre del modelo, ofreciendo garantías de estabilidad y desempeño. \\(h \\infty\\) minimiza la norma infinito (el pico en frecuencia) de funciones de transferencia ponderadas; la \\(\\mu\\)-síntesis trata incertidumbre estructurada. fundamento teórico se formula con pesos \\( w s, w t, w u \\) que dan forma a las funciones de funciones-sensibilidad : \\min c \\left\\| \\begin{matrix} w s s \\\\ w u ks \\\\ w t t \\end{matrix} \\right\\| \\infty el resultado garantiza que \\( s, t \\) quedan bajo las plantillas \\( 1/w \\). la incertidumbre del modelo se modela como bloques \\( \\delta \\) acotados; el teorema de la ganancia pequeña / \\( \\mu \\) da la condición de robustez. cuándo y por qué se usa cuando la planta varía mucho (red de fortaleza desconocida, parámetros inciertos) y se necesitan garantías en vez de comprobaciones puntuales. conecta con el análisis de impedancia: se puede exigir pasividad/robustez en bandas mediante los pesos. procedimiento (genérico) 1. modela la incertidumbre (multiplicativa, paramétrica) como \\( \\delta \\) acotado. 2. elige pesos \\( w s, w t, w u \\) que codifiquen las especificaciones. 3. resuelve el problema \\(h \\infty\\) (solver dedicado) → controlador. 4. verifica robustez (valor singular estructurado \\( \\mu \\)) y reduce el
