li>Comprueba el rango (o valores singulares &gt; tolerancia).</li>\n<li>Si hay déficit, identifica qué modo y si es estable (estabilizable/detectable basta para control).</li>\n<li>Reduce el modelo (elimina estados no controlables/observables) si procede.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Filtro LC de 2º orden con estados \\( [i_L,\\,v_C] \\), entrada \\( v_{sw} \\) (tensión del convertidor), salida \\( y=i_L \\) (único sensor). Verificar controlabilidad y observabilidad para justificar un observador de \\( v_C \\).</p>\n<p>Matrices: \\( A=\\bigl[\\begin{smallmatrix}-r/L & -1/L \\\\ 1/C & 0\\end{smallmatrix}\\bigr] \\), \\( B=[1/L,\\,0]^\\top \\), \\( C=[1,\\,0] \\). Controlabilidad: \\( \\mathcal{C}=[B,\\,AB]=[1/L,\\,-r/L^2-1/(LC);\\;0,\\,1/(LC)] \\). \\( \\det(\\mathcal{C})=1/(L^2C)\\neq0 \\) (\\( n=2 \\)) → <strong>controlable</strong>. Observabilidad: \\( \\mathcal{O}=[C;\\,CA]=[1,0;\\,-r/L,-1/L] \\). \\( \\det(\\mathcal{O})=-1/L\\neq0 \\) → <strong>observable</strong> desde \\( i_L \\). Conclusión: con un único sensor de corriente se puede reconstruir \\( v_C \\) mediante un observador de Luenberger, evitando un sensor de tensión adicional.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct, numpy as np\nsys = ct.ss(A, B, C, D)\nnc = np.linalg.matrix_rank(ct.ctrb(A, B))   # == n ?\nno = np.linalg.matrix_rank(ct.obsv(A, C))   # == n ?\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Usar tolerancia relativa en el rango (sistemas mal condicionados). Los <strong>gramianos</strong>\n(<code>ct.gram</code>) cuantifican \"cuán\" controlable/observable es cada modo (útil para reducción balanceada).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Decidir el rango sin tolerancia numérica en matrices mal escaladas.</li>\n<li>Confundir controlabilidad (estado) con estabilizabilidad (solo los modos inestables).</li>\n<li>Cancelar polo-cero en \\( G(s) \\) creyendo que simplifica, ocultando un modo inestable.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a> · <a class=\"wl\" data-slug=\"variables-estado\">variables-estado</a> · <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Ogata, <em>Ingeniería de Control Moderna</em>.</li>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, 2005.</li>\n</ul>", "buscar": "controlabilidad y observabilidad definición dos propiedades estructurales del modelo en espacio de estados. controlabilidad: la entrada puede llevar el estado a cualquier punto en tiempo finito. observabilidad: el estado puede reconstruirse a partir de la salida medida. fundamento teórico para \\( \\dot{\\mathbf{x}}=a\\mathbf{x}+b\\mathbf{u} \\), \\( \\mathbf{y}=c\\mathbf{x} \\), criterio de rango de kalman: \\mathcal{c}= \\,b\\ \\ ab\\ \\ a^2b\\ \\dots\\ a^{n-1}b\\, ,\\qquad \\mathcal{o}=\\begin{bmatrix}c\\\\ca\\\\\\vdots\\\\ca^{n-1}\\end{bmatrix} controlable \\( \\iff \\mathrm{rank}\\,\\mathcal{c}=n \\); observable \\( \\iff \\mathrm{rank}\\,\\mathcal{o}=n \\). un modo (autovalor) no controlable no se puede mover con realimentación; uno no observable no aparece en \\( y \\). si además es inestable , el diseño es inviable (no estabilizable / no detectable). la pérdida de rango suele venir de cancelaciones polo-cero ocultas en \\( g(s)=c(si-a)^{-1}b \\). cuándo y por qué se usa antes de diseñar realimentación de estado o un observador: la asignacion-polos-lqr|asignación de polos exige controlabilidad y el observador exige observabilidad. en modelos grandes de convertidor (15+ estados) detecta estados redundantes o desacoplados. procedimiento (genérico) 1. forma \\( \\mathcal{c} \\) y \\( \\mathcal{o} \\) (o sus gramianos en sistemas mal escalados). 2. comprueba el rango (o valores singulares tolerancia). 3. si hay déficit, identifica qué modo y si es estable (estabilizable/detectable basta para control). 4. reduce el modelo (elimina estados no controlables/observables) si procede. ejemplo de aplicación real problema: filtro lc de 2º orden con estados \\( i l,\\,v c \\), entrada \\( v {sw} \\) (tensión del convertidor), salida \\( y=i l \\) (único sensor). verificar controlabilidad y observabilidad para justificar un observador de \\( v c \\). matrices: \\( a=\\bigl \\begin{smallmatrix}-r/l & -1/l \\\\ 1/c & 0\\end{smallmatrix}\\bigr \\), \\( b= 1/l,\\,0 ^\\top \\), \\( c= 1,\\,0 \\). controlabilidad: \\( \\mathcal{c}= b,\\,ab = 1/l,\\,-r/l^2-1/(lc);\\;0,\\,1/(lc) \\). \\( \\det(\\mathcal{c})=1/(l^2c)\\neq0 \\) (\\( n=2 \\)) → controlable . observabilidad: \\( \\mathcal{o}= c;\\,ca = 1,0;\\,-r/l,-1/l \\). \\( \\det(\\mathcal{o})=-1/l\\neq0 \\) → observable desde \\( i l \\). conclusión: con un único sensor de corriente se puede reconstruir \\( v c \\) mediante un observador de luenberger, evitando un sensor de tensión adicional. ejemplo de código python import control as ct, numpy as np sys = ct.ss(a, b, c, d) nc = np.linalg.matrix rank(ct.ctrb(a, b)) == n ? no = np.linalg.matrix rank(ct.obsv(a, c)) == n ? parámetros y valores típicos usar tolerancia relativa en el rango (sistemas mal condicionados). los gramianos ( ct.gram ) cuantifican \"cuán\" controlable/observable es cada modo (útil para reducción balanceada). errores comunes - decidir el rango sin tolerancia numérica en matrices mal escaladas. - confundir controlabilidad (estado) con estabilizabilidad (solo los modos inestables). - cancelar polo-cero en \\( g(s) \\) creyendo que simplifica, ocultando un modo inestable. conceptos relacionados - representacion-espacio-estados · variables-estado · asignacion-polos-lqr referencias - ogata, ingeniería de control moderna . - skogestad, postlethwaite, multivariable feedback control , 2005. controlabilidad observabilidad espacio-estados gramian kalman intermedio"}, {"slug": "controlador-pid", "titulo": "Controlador PID", "categoria": "control", "tipo": "tecnica", "nivel": "basico", "proyectos": [], "objetivos": ["entender que aporta cada termino proporcional", "integral y derivativo"], "tags": ["PID", "PI", "proporcional", "integral", "derivativo", "basico"], "relacionados": ["realimentacion", "sintonia-pi-pid", "sistema-primer-orden", "control-cascada"], "referencias": ["Aström, Hägglund, Advanced PID Control, ISA 2006"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Controlador que actúa sobre el error con tres términos: <strong>P</strong>roporcional, <strong>I</strong>ntegral y\n<strong>D</strong>erivativo. Es el controlador más usado en la industria por su sencillez y eficacia.</p>\n<h2>Fundamento teórico</h2>\n<p>$$ u(t) = K_p\\,e(t) + K_i\\!\\int_0^t e\\,d\\tau + K_d\\,\\frac{de}{dt}\n   \\;\\;\\Longleftrightarrow\\;\\; C(s)=K_p+\\frac{K_i}{s}+K_d\\,s $$\nQué aporta cada término:\n- <strong>Proporcional</strong> \\( K_p \\): reacciona al error actual; más \\( K_p \\) → más rápido, pero deja\n  <strong>error en régimen</strong> y puede oscilar.\n- <strong>Integral</strong> \\( K_i \\): acumula el error pasado; <strong>elimina el error en régimen</strong>, pero añade\n  retraso de fase (puede reducir estabilidad y dar <em>windup</em>).\n- <strong>Derivativo</strong> \\( K_d \\): anticipa según la tendencia del error; <strong>amortigua</strong> y mejora\n  estabilidad, pero amplifica el <strong>ruido</strong> (se suele filtrar).\nEn convertidores se usa casi siempre <strong>PI</strong> (sin D, por el ruido de conmutación).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En lazos de corriente, tensión, velocidad: cuando se quiere seguimiento sin error en régimen con\nuna estructura simple. Es la base de los lazos en cascada.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Empieza con P para fijar la rapidez.</li>\n<li>Añade I para anular el error en régimen (cuida el <em>windup</em>: usa anti-windup).</li>\n<li>Añade D (filtrado) solo si necesitas más amortiguamiento y el ruido lo permite.</li>\n<li>Sintoniza por ancho de banda o cancelación de polo (ver <a class=\"wl\" data-slug=\"sintonia-pi-pid\">sintonia-pi-pid</a>).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSC con \\( L=2\\,\\text{mH} \\), \\( r=50\\,\\text{m}\\Omega \\), \\( f_{sw}=10\\,\\text{kHz} \\). Diseñar el PI de corriente para \\( f_c=1\\,\\text{kHz} \\) con margen de fase real ≥ 45°, considerando el retardo de cómputo \\( T_d=150\\,\\mu\\text{s} \\).</p>\n<p>Paso 1 — cancelación de polo: cero del PI en \\( \\omega_z=r/L=25\\,\\text{rad/s} \\). Paso 2 — ganancia: \\( K_p=L\\omega_c=0.002\\times6283\\approx12.6 \\), \\( K_i=K_p\\,r/L\\approx315\\,\\text{s}^{-1} \\). Paso 3 — verificar margen con retardo: desfase del retardo a \\( \\omega_c \\) es \\( \\omega_c T_d\\times(180/\\pi)\\approx54° \\), reduciendo el margen de 90° a 36° (no cumple 45°). Corrección: reducir \\( \\omega_c \\) a 750 Hz (\\( K_p\\approx9.4 \\)), desfase del retardo \\( \\approx40° \\), margen resultante \\( \\approx50° \\). El PI sin considerar el retardo cumpliría en teoría pero no en implementación real.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># PI discreto con anti-windup (saturacion de la salida)\ninteg += Ki*e*dt\nu = Kp*e + integ\nif u &gt; umax: u = umax; integ -= Ki*e*dt    # no acumular si satura\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Lazos de convertidor: PI con cero en el polo de la planta. Margen de fase objetivo 45–60°.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Olvidar el <strong>anti-windup</strong>: el integrador se carga al saturar y la respuesta se degrada.</li>\n<li>Usar D con señal ruidosa sin filtrar.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"realimentacion\">realimentacion</a> · <a class=\"wl\" data-slug=\"sintonia-pi-pid\">sintonia-pi-pid</a> · <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Aström, Hägglund, <em>Advanced PID Control</em>, 2006.</li>\n</ul>", "buscar": "controlador pid definición controlador que actúa sobre el error con tres términos: p roporcional, i ntegral y d erivativo. es el controlador más usado en la industria por su sencillez y eficacia. fundamento teórico u(t) = k p\\,e(t) + k i\\!\\int 0^t e\\,d\\tau + k d\\,\\frac{de}{dt} \\;\\;\\longleftrightarrow\\;\\; c(s)=k p+\\frac{k i}{s}+k d\\,s qué aporta cada término: - proporcional \\( k p \\): reacciona al error actual; más \\( k p \\) → más rápido, pero deja error en régimen y puede oscilar. - integral \\( k i \\): acumula el error pasado; elimina el error en régimen , pero añade retraso de fase (puede reducir estabilidad y dar windup ). - derivativo \\( k d \\): anticipa según la tendencia del error; amortigua y mejora estabilidad, pero amplifica el ruido (se suele filtrar). en convertidores se usa casi siempre pi (sin d, por el ruido de conmutación). cuándo y por qué se usa en lazos de corriente, tensión, velocidad: cuando se quiere seguimiento sin error en régimen con una estructura simple. es la base de los lazos en cascada. procedimiento (genérico) 1. empieza con p para fijar la rapidez. 2. añade i para anular el error en régimen (cuida el windup : usa anti-windup). 3. añade d (filtrado) solo si necesitas más amortiguamiento y el ruido lo permite. 4. sintoniza por ancho de banda o cancelación de polo (ver sintonia-pi-pid ). ejemplo de aplicación real problema: vsc con \\( l=2\\,\\text{mh} \\), \\( r=50\\,\\text{m}\\omega \\), \\( f {sw}=10\\,\\text{khz} \\). diseñar el pi de corriente para \\( f c=1\\,\\text{khz} \\) con margen de fase real ≥ 45°, considerando el retardo de cómputo \\( t d=150\\,\\mu\\text{s} \\). paso 1 — cancelación de polo: cero del pi en \\( \\omega z=r/l=25\\,\\text{rad/s} \\). paso 2 — ganancia: \\( k p=l\\omega c=0.002\\times6283\\approx12.6 \\), \\( k i=k p\\,r/l\\approx315\\,\\text{s}^{-1} \\). paso 3 — verificar margen con retardo: desfase del retardo a \\( \\omega c \\) es \\( \\omega c t d\\times(180/\\pi)\\approx54° \\), reduciendo el margen de 90° a 36° (no cumple 45°). corrección: reducir \\( \\omega c \\) a 750 hz (\\( k p\\approx9.4 \\)), desfase del retardo \\( \\approx40° \\), margen resultante \\( \\approx50° \\). el pi sin considerar el retardo cumpliría en teoría pero no en implementación real. ejemplo de código python pi discreto con anti-windup (saturacion de la salida) integ += ki e dt u = kp e + integ if u umax: u = umax; integ -= ki e dt no acumular si satura parámetros y valores típicos lazos de convertidor: pi con cero en el polo de la planta. margen de fase objetivo 45–60°. errores comunes - olvidar el anti-windup : el integrador se carga al saturar y la respuesta se degrada. - usar d con señal ruidosa sin filtrar. conceptos relacionados - realimentacion · sintonia-pi-pid · control-cascada referencias - aström, hägglund, advanced pid control , 2006. pid pi proporcional integral derivativo basico"}, {"slug": "controlador-resonante", "titulo": "Controlador resonante (proporcional-resonante, PR)", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": [], "objetivos": ["seguir y rechazar senoides y armónicos sin error en marco estacionario"], "tags": ["resonante", "pr", "modelo-interno", "armonicos", "alfa-beta", "intermedio", "control"], "relacionados": ["controlador-pid", "transformada-clarke", "marco-dq", "amortiguamiento-activo-lcl", "error-regimen-permanente"], "referencias": ["Teodorescu et al., Proportional-resonant controllers and filters for grid-connected converters, IET 2006", "Yepes et al., Effects of discretization methods on the performance of resonant controllers, IEEE TPEL 2010"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Controlador que añade a una parte proporcional un <strong>término resonante</strong> sintonizado a una\nfrecuencia \\( \\omega_0 \\). Proporciona <strong>ganancia muy alta</strong> justo en esa frecuencia, de modo que\nsigue (o rechaza) una senoide de \\( \\omega_0 \\) con error nulo en régimen permanente, trabajando\ndirectamente en marco <strong>estacionario</strong> (αβ o monofásico), sin rotar a dq.</p>\n<h2>Fundamento teórico</h2>\n<p>Por el <strong>principio del modelo interno</strong>: para anular el error ante una entrada, el lazo debe\ncontener un modelo del generador de esa señal. El de una senoide de frecuencia \\( \\omega_0 \\) es\n\\( s^2+\\omega_0^2 \\). El PR <strong>ideal</strong> es:\n$$ G_{PR}(s)=K_p+\\frac{2K_r\\,s}{s^2+\\omega_0^2} $$\ncon ganancia \\( \\to\\infty \\) en \\( \\omega_0 \\) (equivale a un PI en marco giratorio: el resonante\nes la \"imagen\" de un integrador rotado \\( \\pm\\omega_0 \\)). En la práctica se usa la forma <strong>no\nideal</strong> con amortiguamiento \\( \\omega_c \\) (banda finita, robusta a desviaciones de frecuencia):\n$$ G_{PR}(s)=K_p+\\frac{2K_r\\,\\omega_c\\,s}{s^2+2\\omega_c s+\\omega_0^2} $$\nLa ganancia de pico es \\( K_p+K_r \\) y el ancho de banda \\( \\approx 2\\omega_c \\). Para corregir\nvarios armónicos se suman <strong>compensadores armónicos (HC)</strong> en \\( h\\omega_0 \\) (típico 5, 7, 11, 13):\n$$ G(s)=K_p+\\sum_{h}\\frac{2K_{rh}\\,\\omega_c\\,s}{s^2+2\\omega_c s+(h\\omega_0)^2} $$</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Control de corriente/tensión de convertidores de red en αβ (evita los dos marcos dq y el desacoplo),\nrechazo selectivo de armónicos (filtros activos), y sistemas monofásicos donde no hay un dq natural.\nEs la alternativa estacionaria al PI+<a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a>.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Diseña \\( K_p \\) como en un P puro para el ancho de banda y margen objetivo (planta del lazo de\n   corriente \\( \\approx 1/(sL+R) \\)).</li>\n<li>Fija \\( \\omega_0 \\) (frecuencia de red) y elige \\( \\omega_c \\) (1–15 rad/s) según la robustez a\n   variación de frecuencia deseada.</li>\n<li>Ajusta \\( K_r \\) para la velocidad de convergencia del término resonante sin degradar el margen.</li>\n<li>Añade HC en los armónicos relevantes (cada uno resta algo de fase: vigílalo).</li>\n<li><strong>Discretiza con cuidado</strong> (Tustin con <em>prewarp</em> en \\( \\omega_0 \\), o métodos que preserven la\n   posición del pico): ver <a class=\"wl\" data-slug=\"discretizacion-controladores\">discretizacion-controladores</a>. Considera frecuencia <strong>adaptativa</strong>\n   (tomar \\( \\omega_0 \\) de la PLL) si la red varía.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSC monofásico controlado en marco estacionario. Un PI genera error en régimen para la referencia sinusoidal de 50 Hz. Implementar un PR no ideal para eliminar el error y añadir compensación del 5º armónico (250 Hz).</p>\n<p>El PI tiene ganancia finita a 50 Hz, dejando un error proporcional. El término resonante \\( 2K_r\\omega_c s/(s^2+2\\omega_c s+\\omega_0^2) \\) con \\( \\omega_0=314\\,\\text{rad/s} \\) y \\( \\omega_c=5\\,\\text{rad/s} \\) añade una ganancia de pico \\( \\approx K_p+K_r \\) en ±5 rad/s alrededor de 50 Hz: el error cae a casi cero. Para el 5º armónico (250 Hz): se añade un segundo resonante en \\( h\\omega_0=5\\times314=1570\\,\\text{rad/s} \\). Cada HC resta fase al lazo — con 2 HC la pérdida acumulada cerca del cruce de ganancia debe verificarse con <code>ct.margin()</code>. Si el margen baja a &lt;30°, reducir \\( K_r \\) de los HC.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct\nw0, wc = 2*3.1416*50, 5.0\nKp, Kr = 20.0, 2000.0\nPR = ct.tf([Kp, 2*(Kr*wc+Kp*wc), Kp*w0**2],\n           [1, 2*wc, w0**2])           # Kp + termino resonante no ideal\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( \\omega_c \\approx 2\\pi\\cdot(0.5\\text{–}2) \\) Hz (compromiso selectividad/robustez), pico de\nganancia 40–80 dB sobre \\( K_p \\). HC hasta el 13º armónico en filtros activos.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Discretizar con métodos que <strong>desplazan el pico</strong> (Euler) → el resonante deja de cancelar a\n  \\( \\omega_0 \\) y empeora con la frecuencia de muestreo.</li>\n<li>PR ideal (\\( \\omega_c=0 \\)) en sistema real: oscila si la frecuencia de red se desvía.</li>\n<li>Apilar muchos HC sin vigilar la pérdida acumulada de margen de fase.</li>\n<li>Olvidar el límite/anti-windup del actuador (también aplica a resonantes).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"controlador-pid\">controlador-pid</a> · <a class=\"wl\" data-slug=\"transformada-clarke\">transformada-clarke</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"amortiguamiento-activo-lcl\">amortiguamiento-activo-lcl</a> · <a class=\"wl\" data-slug=\"discretizacion-controladores\">discretizacion-controladores</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Teodorescu et al., <em>PR controllers and filters for grid-connected converters</em>, IET 2006.</li>\n<li>Yepes et al., <em>Effects of discretization methods on resonant controllers</em>, IEEE TPEL 2010.</li>\n</ul>", "buscar": "controlador resonante (proporcional-resonante, pr) definición controlador que añade a una parte proporcional un término resonante sintonizado a una frecuencia \\( \\omega 0 \\). proporciona ganancia muy alta justo en esa frecuencia, de modo que sigue (o rechaza) una senoide de \\( \\omega 0 \\) con error nulo en régimen permanente, trabajando directamente en marco estacionario (αβ o monofásico), sin rotar a dq. fundamento teórico por el principio del modelo interno : para anular el error ante una entrada, el lazo debe contener un modelo del generador de esa señal. el de una senoide de frecuencia \\( \\omega 0 \\) es \\( s^2+\\omega 0^2 \\). el pr ideal es: g {pr}(s)=k p+\\frac{2k r\\,s}{s^2+\\omega 0^2} con ganancia \\( \\to\\infty \\) en \\( \\omega 0 \\) (equivale a un pi en marco giratorio: el resonante es la \"imagen\" de un integrador rotado \\( \\pm\\omega 0 \\)). en la práctica se usa la forma no ideal con amortiguamiento \\( \\omega c \\) (banda finita, robusta a desviaciones de frecuencia): g {pr}(s)=k p+\\frac{2k r\\,\\omega c\\,s}{s^2+2\\omega c s+\\omega 0^2} la ganancia de pico es \\( k p+k r \\) y el ancho de banda \\( \\approx 2\\omega c \\). para corregir varios armónicos se suman compensadores armónicos (hc) en \\( h\\omega 0 \\) (típico 5, 7, 11, 13): g(s)=k p+\\sum {h}\\frac{2k {rh}\\,\\omega c\\,s}{s^2+2\\omega c s+(h\\omega 0)^2} cuándo y por qué se usa control de corriente/tensión de convertidores de red en αβ (evita los dos marcos dq y el desacoplo), rechazo selectivo de armónicos (filtros activos), y sistemas monofásicos donde no hay un dq natural. es la alternativa estacionaria al pi+ marco-dq . procedimiento de diseño (genérico) 1. diseña \\( k p \\) como en un p puro para el ancho de banda y margen objetivo (planta del lazo de corriente \\( \\approx 1/(sl+r) \\)). 2. fija \\( \\omega 0 \\) (frecuencia de red) y elige \\( \\omega c \\) (1–15 rad/s) según la robustez a variación de frecuencia deseada. 3. ajusta \\( k r \\) para la velocidad de convergencia del término resonante sin degradar el margen. 4. añade hc en los armónicos relevantes (cada uno resta algo de fase: vigílalo). 5. discretiza con cuidado (tustin con prewarp en \\( \\omega 0 \\), o métodos que preserven la posición del pico): ver discretizacion-controladores . considera frecuencia adaptativa (tomar \\( \\omega 0 \\) de la pll) si la red varía. ejemplo de aplicación real problema: vsc monofásico controlado en marco estacionario. un pi genera error en régimen para la referencia sinusoidal de 50 hz. implementar un pr no ideal para eliminar el error y añadir compensación del 5º armónico (250 hz). el pi tiene ganancia finita a 50 hz, dejando un error proporcional. el término resonante \\( 2k r\\omega c s/(s^2+2\\omega c s+\\omega 0^2) \\) con \\( \\omega 0=314\\,\\text{rad/s} \\) y \\( \\omega c=5\\,\\text{rad/s} \\) añade una ganancia de pico \\( \\approx k p+k r \\) en ±5 rad/s alrededor de 50 hz: el error cae a casi cero. para el 5º armónico (250 hz): se añade un segundo resonante en \\( h\\omega 0=5\\times314=1570\\,\\text{rad/s} \\). cada hc resta fase al lazo — con 2 hc la pérdida acumulada cerca del cruce de ganancia debe verificarse con ct.margin() . si el margen baja a <30°, reducir \\( k r \\) de los hc. ejemplo de código python import control as ct w0, wc = 2 3.1416 50, 5.0 kp, kr = 20.0, 2000.0 pr = ct.tf( kp, 2 (kr wc+kp wc), kp w0 2 , 1, 2 wc, w0 2 ) kp + termino resonante no ideal parámetros y valores típicos \\( \\omega c \\approx 2\\pi\\cdot(0.5\\text{–}2) \\) hz (compromiso selectividad/robustez), pico de ganancia 40–80 db sobre \\( k p \\). hc hasta el 13º armónico en filtros activos. errores comunes - discretizar con métodos que desplazan el pico (euler) → el resonante deja de cancelar a \\( \\omega 0 \\) y empeora con la frecuencia de muestreo. - pr ideal (\\( \\omega c=0 \\)) en sistema real: oscila si la frecuencia de red se desvía. - apilar muchos hc sin vigilar la pérdida acumulada de margen de fase. - olvidar el límite/anti-windup del actuador (también aplica a resonantes). conceptos relacionados - controlador-pid · transformada-clarke · marco-dq · amortiguamiento-activo-lcl · discretizacion-controladores referencias - teodorescu et al., pr controllers and filters for grid-connected converters , iet 2006. - yepes et al., effects of discretization methods on resonant controllers , ieee tpel 2010. resonante pr modelo-interno armonicos alfa-beta intermedio control"}, {"slug": "criterio-nyquist", "titulo": "Criterio de estabilidad de Nyquist", "categoria": "control", "tipo": "metodo", "nivel": "basico", "proyectos": [], "objetivos": ["determinar la estabilidad en lazo cerrado a partir de la ganancia de lazo"], "tags": ["nyquist", "estabilidad", "lazo-cerrado", "rodeos", "basico", "control"], "relacionados": ["margenes-estabilidad", "diagrama-bode", "estabilidad-bibo", "polos-ceros", "impedancia-salida-estabilidad"], "referencias": ["Ogata, Ingeniería de Control Moderna, Pearson", "Aström, Murray, Feedback Systems, Princeton 2008"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Criterio gráfico que decide la <strong>estabilidad en lazo cerrado</strong> observando cómo la traza de la\nganancia de lazo \\( L(j\\omega) \\) rodea al <strong>punto crítico \\( -1 \\)</strong>, sin calcular las raíces\ndel polinomio característico.</p>\n<h2>Fundamento teórico</h2>\n<p>Se apoya en el <strong>principio del argumento</strong>. Para el lazo \\( 1+L(s)=0 \\), recorriendo el contorno\nde Nyquist (todo el eje \\( j\\omega \\) cerrado por la derecha), el número de rodeos en sentido\nhorario \\( N \\) de \\( L(j\\omega) \\) alrededor de \\( -1 \\) cumple:\n$$ Z = N + P $$\n- \\( Z \\): ceros de \\( 1+L \\) en el semiplano derecho = <strong>polos inestables del lazo cerrado</strong>.\n- \\( P \\): polos inestables de \\( L \\) (lazo abierto).\n- Estable \\( \\iff Z=0 \\): se necesitan \\( N=-P \\) rodeos <strong>antihorarios</strong> de \\( -1 \\).</p>\n<p>Si \\( L \\) es estable en lazo abierto (\\( P=0 \\)), basta con que <strong>no se rodee</strong> \\( -1 \\). La\ndistancia mínima de la traza a \\( -1 \\) define el <a class=\"wl\" data-slug=\"margenes-estabilidad\">margen de módulo</a>.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando hay retardos, polos en lazo abierto inestables o sistemas donde Routh no aplica bien. Es\nla base del <strong>criterio de estabilidad por impedancia</strong> (el cociente \\( Z_o/Z_g \\) se trata como\nuna ganancia de lazo y se le aplica Nyquist).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Obtén \\( L(j\\omega) \\) y cuenta \\( P \\) (polos de \\( L \\) en SPD).</li>\n<li>Traza el diagrama polar de \\( L(j\\omega) \\) para \\( \\omega:-\\infty\\to\\infty \\).</li>\n<li>Cuenta los rodeos netos \\( N \\) alrededor de \\( -1 \\).</li>\n<li>Aplica \\( Z=N+P \\); estable si \\( Z=0 \\).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Lazo de corriente con planta \\( G_i(s)=1/(Ls) \\), \\( L=2\\,\\text{mH} \\), PI y retardo de cómputo \\( T_d=150\\,\\mu\\text{s} \\). Verificar estabilidad por Nyquist y cuantificar el margen.</p>\n<p>La ganancia de lazo es \\( L(j\\omega) \\) con contribuciones: integrador \\( -90° \\), PI (cero muy por debajo de \\( \\omega_c \\), aporte \\( \\approx0° \\)) y retardo \\( -\\omega_c T_d\\times(180/\\pi) \\). A \\( \\omega_c=6283\\,\\text{rad/s} \\): desfase del retardo \\( \\approx-54° \\), fase total \\( \\approx-144° \\), margen de fase \\( 36° \\). Como \\( P=0 \\) (lazo abierto estable), basta verificar que la traza no rodea \\( -1 \\). La distancia mínima da \\( M_s=1/\\sin(36°)\\approx1.7<2 \\): cumple la especificación. Para subir el margen a 45° bajar \\( \\omega_c \\) a \\( \\approx750\\,\\text{Hz} \\) (reduce el desfase del retardo a \\( -40° \\)).</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct, numpy as np\nL = ct.tf([10], [1, 3, 3, 1])\nct.nyquist_plot(L)                 # ¿rodea -1?\nprint(ct.margin(L))                # (GM, PM, wcg, wcp): lectura cuantitativa\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Objetivo práctico: dejar \\( -1 \\) holgadamente fuera de la traza (margen de módulo \\( 1/M_s \\)\ncon \\( M_s<2 \\)). El cruce con el eje real negativo da el margen de ganancia.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Olvidar contar \\( P \\): con polos inestables en lazo abierto, \"no rodear −1\" NO implica estable.</li>\n<li>Ignorar el rizo cerca de \\( -1 \\) por integradores/retardos (semicírculos en el infinito).</li>\n<li>Confundir el criterio simplificado (válido si \\( P=0 \\)) con el general.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"diagrama-bode\">diagrama-bode</a> · <a class=\"wl\" data-slug=\"estabilidad-bibo\">estabilidad-bibo</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Ogata, <em>Ingeniería de Control Moderna</em>.</li>\n<li>Aström, Murray, <em>Feedback Systems</em>, 2008.</li>\n</ul>", "buscar": "criterio de estabilidad de nyquist definición criterio gráfico que decide la estabilidad en lazo cerrado observando cómo la traza de la ganancia de lazo \\( l(j\\omega) \\) rodea al punto crítico \\( -1 \\) , sin calcular las raíces del polinomio característico. fundamento teórico se apoya en el principio del argumento . para el lazo \\( 1+l(s)=0 \\), recorriendo el contorno de nyquist (todo el eje \\( j\\omega \\) cerrado por la derecha), el número de rodeos en sentido horario \\( n \\) de \\( l(j\\omega) \\) alrededor de \\( -1 \\) cumple: z = n + p - \\( z \\): ceros de \\( 1+l \\) en el semiplano derecho = polos inestables del lazo cerrado . - \\( p \\): polos inestables de \\( l \\) (lazo abierto). - estable \\( \\iff z=0 \\): se necesitan \\( n=-p \\) rodeos antihorarios de \\( -1 \\). si \\( l \\) es estable en lazo abierto (\\( p=0 \\)), basta con que no se rodee \\( -1 \\). la distancia mínima de la traza a \\( -1 \\) define el margenes-estabilidad|margen de módulo . cuándo y por qué se usa cuando hay retardos, polos en lazo abierto inestables o sistemas donde routh no aplica bien. es la base del criterio de estabilidad por impedancia (el cociente \\( z o/z g \\) se trata como una ganancia de lazo y se le aplica nyquist). procedimiento (genérico) 1. obtén \\( l(j\\omega) \\) y cuenta \\( p \\) (polos de \\( l \\) en spd). 2. traza el diagrama polar de \\( l(j\\omega) \\) para \\( \\omega:-\\infty\\to\\infty \\). 3. cuenta los rodeos netos \\( n \\) alrededor de \\( -1 \\). 4. aplica \\( z=n+p \\); estable si \\( z=0 \\). ejemplo de aplicación real problema: lazo de corriente con planta \\( g i(s)=1/(ls) \\), \\( l=2\\,\\text{mh} \\), pi y retardo de cómputo \\( t d=150\\,\\mu\\text{s} \\). verificar estabilidad por nyquist y cuantificar el margen. la ganancia de lazo es \\( l(j\\omega) \\) con contribuciones: integrador \\( -90° \\), pi (cero muy por debajo de \\( \\omega c \\), aporte \\( \\approx0° \\)) y retardo \\( -\\omega c t d\\times(180/\\pi) \\). a \\( \\omega c=6283\\,\\text{rad/s} \\): desfase del retardo \\( \\approx-54° \\), fase total \\( \\approx-144° \\), margen de fase \\( 36° \\). como \\( p=0 \\) (lazo abierto estable), basta verificar que la traza no rodea \\( -1 \\). la distancia mínima da \\( m s=1/\\sin(36°)\\approx1.7<2 \\): cumple la especificación. para subir el margen a 45° bajar \\( \\omega c \\) a \\( \\approx750\\,\\text{hz} \\) (reduce el desfase del retardo a \\( -40° \\)). ejemplo de código python import control as ct, numpy as np l = ct.tf( 10 , 1, 3, 3, 1 ) ct.nyquist plot(l) ¿rodea -1? print(ct.margin(l)) (gm, pm, wcg, wcp): lectura cuantitativa parámetros y valores típicos objetivo práctico: dejar \\( -1 \\) holgadamente fuera de la traza (margen de módulo \\( 1/m s \\) con \\( m s<2 \\)). el cruce con el eje real negativo da el margen de ganancia. errores comunes - olvidar contar \\( p \\): con polos inestables en lazo abierto, \"no rodear −1\" no implica estable. - ignorar el rizo cerca de \\( -1 \\) por integradores/retardos (semicírculos en el infinito). - confundir el criterio simplificado (válido si \\( p=0 \\)) con el general. conceptos relacionados - margenes-estabilidad · diagrama-bode · estabilidad-bibo · impedancia-salida-estabilidad referencias - ogata, ingeniería de control moderna . - aström, murray, feedback systems , 2008. nyquist estabilidad lazo-cerrado rodeos basico control"}, {"slug": "current-limiting", "titulo": "Current limiting (limitación de corriente en grid-forming)", "categoria": "control", "tipo": "tecnica", "nivel": "avanzado", "proyectos": ["01-GFM-Impedance"], "objetivos": ["proteger los semiconductores ante faltas"], "tags": ["falta", "saturacion", "anti-windup", "proteccion", "gran-señal"], "relacionados": ["control-cascada", "impedancia-virtual", "vsm-inercia"], "referencias": ["Paquette, Divan, Virtual Impedance Current Limiting for Inverters in Microgrids, IEEE TIA 2015"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Mecanismo que acota la corriente del inversor ante perturbaciones grandes (faltas). Crítico en\ngrid-forming porque, al ser <strong>fuente de tensión</strong>, ante un hueco de red inyectaría una corriente\nenorme que destruiría los semiconductores.</p>\n<h2>Fundamento teórico</h2>\n<p>La forma más directa: <strong>saturar la magnitud</strong> de la referencia de corriente del lazo interno a\n\\( I_{max} \\), con <strong>anti-windup</strong> para no cargar los integradores del lazo de tensión:</p>\n<p>$$ \\lVert \\mathbf{i}_{L1}^{*}\\rVert \\le I_{max} \\;\\Rightarrow\\;\n   \\mathbf{i}_{L1}^{*}\\leftarrow I_{max}\\,\\frac{\\mathbf{i}_{L1}^{*}}{\\lVert\\mathbf{i}_{L1}^{*}\\rVert} $$</p>\n<p>Es un fenómeno de <strong>gran señal</strong>: rompe la linealidad, por lo que el análisis de impedancia/\nestabilidad lineal deja de aplicar y se estudia por simulación temporal.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Siempre en convertidores reales. El reto abierto en grid-forming: limitar <strong>sin</strong> perder el\ncarácter formador ni la sincronización (un límite duro puede hacer que el inversor \"siga\" la\nfalta como GFL y pierda estabilidad de ángulo).</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Fija \\( I_{max} \\) (típico 1.1–1.5 pu de la corriente nominal de pico).</li>\n<li>Implementa la saturación de la <strong>magnitud</strong> del fasor de referencia (no por eje, para no\n   distorsionar la fase).</li>\n<li>Añade <strong>anti-windup</strong>: congela/recorta los integradores del lazo externo mientras satura.</li>\n<li>Considera variantes que preservan el comportamiento formador: <strong>impedancia virtual\n   adaptativa</strong> (sube \\( Z_v \\) en falta) o limitación con prioridad de eje d/q.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">mag = np.hypot(iL1ref_d, iL1ref_q)\nif mag &gt; Imax:\n    s = Imax/mag\n    iL1ref_d *= s; iL1ref_q *= s\n    dxv_d = dxv_q = 0.0          # anti-windup: congela integradores de tension\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( I_{max} \\) = 1.1–1.5 pu. En el proyecto, 1.5 pu (≈30.6 A frente a \\( I_n=20.4 \\) A).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Saturar por eje en vez de por magnitud → distorsiona la fase de la corriente.</li>\n<li>Olvidar el anti-windup → al salir de la falta hay un transitorio grande (windup).</li>\n<li>Analizar la falta con impedancia lineal → no aplica; usar simulación de gran señal.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: protección): ante un hueco al 30%, sin límite la corriente\n  llegaba a <strong>4.76 pu</strong>; con el límite quedó en <strong>1.51 pu</strong>. En <code>simulate.py</code> / <code>main_phase5.py</code>.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> · <a class=\"wl\" data-slug=\"impedancia-virtual\">impedancia-virtual</a> · <a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Paquette, Divan, IEEE TIA 2015.</li>\n</ul>", "buscar": "current limiting (limitación de corriente en grid-forming) definición mecanismo que acota la corriente del inversor ante perturbaciones grandes (faltas). crítico en grid-forming porque, al ser fuente de tensión , ante un hueco de red inyectaría una corriente enorme que destruiría los semiconductores. fundamento teórico la forma más directa: saturar la magnitud de la referencia de corriente del lazo interno a \\( i {max} \\), con anti-windup para no cargar los integradores del lazo de tensión: \\lvert \\mathbf{i} {l1}^{ }\\rvert \\le i {max} \\;\\rightarrow\\; \\mathbf{i} {l1}^{ }\\leftarrow i {max}\\,\\frac{\\mathbf{i} {l1}^{ }}{\\lvert\\mathbf{i} {l1}^{ }\\rvert} es un fenómeno de gran señal : rompe la linealidad, por lo que el análisis de impedancia/ estabilidad lineal deja de aplicar y se estudia por simulación temporal. cuándo y por qué se usa siempre en convertidores reales. el reto abierto en grid-forming: limitar sin perder el carácter formador ni la sincronización (un límite duro puede hacer que el inversor \"siga\" la falta como gfl y pierda estabilidad de ángulo). procedimiento de diseño (genérico) 1. fija \\( i {max} \\) (típico 1.1–1.5 pu de la corriente nominal de pico). 2. implementa la saturación de la magnitud del fasor de referencia (no por eje, para no distorsionar la fase). 3. añade anti-windup : congela/recorta los integradores del lazo externo mientras satura. 4. considera variantes que preservan el comportamiento formador: impedancia virtual adaptativa (sube \\( z v \\) en falta) o limitación con prioridad de eje d/q. ejemplo de código python mag = np.hypot(il1ref d, il1ref q) if mag imax: s = imax/mag il1ref d = s; il1ref q = s dxv d = dxv q = 0.0 anti-windup: congela integradores de tension parámetros y valores típicos \\( i {max} \\) = 1.1–1.5 pu. en el proyecto, 1.5 pu (≈30.6 a frente a \\( i n=20.4 \\) a). errores comunes - saturar por eje en vez de por magnitud → distorsiona la fase de la corriente. - olvidar el anti-windup → al salir de la falta hay un transitorio grande (windup). - analizar la falta con impedancia lineal → no aplica; usar simulación de gran señal. uso en proyectos - 01 - gfm-impedance (objetivo: protección): ante un hueco al 30%, sin límite la corriente llegaba a 4.76 pu ; con el límite quedó en 1.51 pu . en simulate.py / main phase5.py . conceptos relacionados - control-cascada · impedancia-virtual · vsm-inercia referencias - paquette, divan, ieee tia 2015. falta saturacion anti-windup proteccion gran-señal"}, {"slug": "desacoplo-dq", "titulo": "Desacoplo dq y feedforward de red", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": [], "objetivos": ["convertir el lazo de corriente dq acoplado en dos lazos SISO independientes"], "tags": ["desacoplo", "feedforward", "acoplamiento-cruzado", "dq", "lazo-corriente", "intermedio", "control"], "relacionados": ["marco-dq", "control-cascada", "control-vectorial", "controlador-pid", "filtro-lcl"], "referencias": ["Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010", "Kazmierkowski, Krishnan, Blaabjerg, Control in Power Electronics, Academic Press 2002"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Técnica que <strong>cancela el acoplamiento cruzado</strong> \\( \\pm\\omega L \\) entre los ejes d y q del lazo de\ncorriente de un convertidor, y compensa por <strong>prealimentación (feedforward)</strong> la tensión de red,\ndejando dos plantas SISO de primer orden controlables con sendos PI.</p>\n<h2>Fundamento teórico</h2>\n<p>La dinámica del filtro en dq incluye los términos de Coriolis del marco giratorio (ver <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a>):\n$$ L\\frac{di_d}{dt}=v_d-e_d+\\omega L\\,i_q-R i_d,\\qquad\n   L\\frac{di_q}{dt}=v_q-e_q-\\omega L\\,i_d-R i_q $$\ncon \\( v_{dq} \\) tensión del convertidor y \\( e_{dq} \\) tensión de red. Eligiendo la ley de control\n$$ v_d=v_d'-\\omega L\\,i_q+e_d,\\qquad v_q=v_q'+\\omega L\\,i_d+e_q $$\nlos términos cruzados y la perturbación de red <strong>se cancelan</strong>, y queda\n$$ L\\frac{di_d}{dt}=v_d'-R i_d \\ \\Rightarrow\\ \\frac{i_d}{v_d'}=\\frac{1}{Ls+R} $$\nes decir, dos plantas de primer orden idénticas y <strong>desacopladas</strong>, donde \\( v_{dq}' \\) lo fija el\nPI. El feedforward de \\( e_{dq} \\) mejora el rechazo de perturbación de red y la respuesta ante\nhuecos; el desacoplo de \\( \\omega L \\) elimina el sobreimpulso cruzado en transitorios de par.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En todo control vectorial de corriente de convertidores y máquinas, sobre todo cuando \\( \\omega L \\)\nes grande (alta frecuencia o inductancia), donde el acoplamiento degrada notablemente la respuesta.\nEs la base del lazo interno de la <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a>.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Modela el filtro en dq e identifica los términos \\( \\pm\\omega L \\) y \\( e_{dq} \\).</li>\n<li>Implementa el desacoplo (resta/suma \\( \\omega L\\,i \\)) y el feedforward de \\( e_{dq} \\) medida.</li>\n<li>Diseña los PI sobre la planta SISO \\( 1/(Ls+R) \\) (p.ej. <em>internal model control</em>:\n   \\( K_p=L\\,\\alpha_c \\), \\( K_i=R\\,\\alpha_c \\), con \\( \\alpha_c \\) el ancho de banda deseado).</li>\n<li>Verifica robustez al <strong>error de estimación</strong> de \\( L \\) y \\( \\omega \\) (el desacoplo nunca es\n   perfecto) y al retardo de cómputo/PWM.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSC trifásico con \\( L=2\\,\\text{mH} \\), \\( R=0.05\\,\\Omega \\), \\( \\omega=314\\,\\text{rad/s} \\). Cuantificar el acoplamiento sin desacoplo y verificar que tras añadir el feedforward desaparece.</p>\n<p>Sin desacoplo: una referencia \\( i_d^*=1000\\,\\text{A} \\), \\( i_q^*=0 \\) produce, durante el transitorio, un error cruzado en \\( i_q \\) de amplitud \\( \\approx\\omega L\\Delta i_d/K_p=314\\times0.002\\times1000/12.6\\approx50\\,\\text{A} \\). Con desacoplo: se añade \\( v_d\\leftarrow v_d-\\omega L i_q \\) y \\( v_q\\leftarrow v_q+\\omega L i_d \\). El término cruzado se cancela algebraicamente y \\( i_q \\) permanece en 0 durante el escalón de \\( i_d^*\\) — verificable en simulación midiendo el máximo de \\( |i_q| \\) con/sin desacoplo. Con \\( L \\) con error del 10 %: el residuo de acoplamiento es \\( 0.1\\times\\omega L\\Delta i_d/K_p\\approx5\\,\\text{A} \\), despreciable en la mayoría de aplicaciones.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def current_ctrl(id_ref, iq_ref, id_, iq_, ed, eq, w, L, pi_d, pi_q):\n    vd = pi_d(id_ref - id_) - w*L*iq_ + ed      # desacoplo + feedforward\n    vq = pi_q(iq_ref - iq_) + w*L*id_ + eq\n    return vd, vq\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Ancho de banda del lazo de corriente \\( \\alpha_c \\approx (1/10\\text{–}1/5)\\,\\omega_{sw} \\).\nEl desacoplo importa cuando \\( \\omega L \\gtrsim R \\) (casi siempre en convertidores de red).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Usar \\( L \\) o \\( \\omega \\) erróneos → desacoplo imperfecto y acoplamiento residual.</li>\n<li>Feedforward de \\( e_{dq} \\) ruidoso (medida sucia) → inyecta ruido en la modulación; filtrar.</li>\n<li>Olvidar el retardo digital, que reintroduce acoplamiento efectivo a alta frecuencia.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> · <a class=\"wl\" data-slug=\"control-vectorial\">control-vectorial</a> · <a class=\"wl\" data-slug=\"controlador-pid\">controlador-pid</a> · <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Yazdani, Iravani, 2010.</li>\n<li>Kazmierkowski, Krishnan, Blaabjerg, <em>Control in Power Electronics</em>, 2002.</li>\n</ul>", "buscar": "desacoplo dq y feedforward de red definición técnica que cancela el acoplamiento cruzado \\( \\pm\\omega l \\) entre los ejes d y q del lazo de corriente de un convertidor, y compensa por prealimentación (feedforward) la tensión de red, dejando dos plantas siso de primer orden controlables con sendos pi. fundamento teórico la dinámica del filtro en dq incluye los términos de coriolis del marco giratorio (ver marco-dq ): l\\frac{di d}{dt}=v d-e d+\\omega l\\,i q-r i d,\\qquad l\\frac{di q}{dt}=v q-e q-\\omega l\\,i d-r i q con \\( v {dq} \\) tensión del convertidor y \\( e {dq} \\) tensión de red. eligiendo la ley de control v d=v d'-\\omega l\\,i q+e d,\\qquad v q=v q'+\\omega l\\,i d+e q los términos cruzados y la perturbación de red se cancelan , y queda l\\frac{di d}{dt}=v d'-r i d \\ \\rightarrow\\ \\frac{i d}{v d'}=\\frac{1}{ls+r} es decir, dos plantas de primer orden idénticas y desacopladas , donde \\( v {dq}' \\) lo fija el pi. el feedforward de \\( e {dq} \\) mejora el rechazo de perturbación de red y la respuesta ante huecos; el desacoplo de \\( \\omega l \\) elimina el sobreimpulso cruzado en transitorios de par. cuándo y por qué se usa en todo control vectorial de corriente de convertidores y máquinas, sobre todo cuando \\( \\omega l \\) es grande (alta frecuencia o inductancia), donde el acoplamiento degrada notablemente la respuesta. es la base del lazo interno de la control-cascada . procedimiento de diseño (genérico) 1. modela el filtro en dq e identifica los términos \\( \\pm\\omega l \\) y \\( e {dq} \\). 2. implementa el desacoplo (resta/suma \\( \\omega l\\,i \\)) y el feedforward de \\( e {dq} \\) medida. 3. diseña los pi sobre la planta siso \\( 1/(ls+r) \\) (p.ej. internal model control : \\( k p=l\\,\\alpha c \\), \\( k i=r\\,\\alpha c \\), con \\( \\alpha c \\) el ancho de banda deseado). 4. verifica robustez al error de estimación de \\( l \\) y \\( \\omega \\) (el desacoplo nunca es perfecto) y al retardo de cómputo/pwm. ejemplo de aplicación real problema: vsc trifásico con \\( l=2\\,\\text{mh} \\), \\( r=0.05\\,\\omega \\), \\( \\omega=314\\,\\text{rad/s} \\). cuantificar el acoplamiento sin desacoplo y verificar que tras añadir el feedforward desaparece. sin desacoplo: una referencia \\( i d^ =1000\\,\\text{a} \\), \\( i q^ =0 \\) produce, durante el transitorio, un error cruzado en \\( i q \\) de amplitud \\( \\approx\\omega l\\delta i d/k p=314\\times0.002\\times1000/12.6\\approx50\\,\\text{a} \\). con desacoplo: se añade \\( v d\\leftarrow v d-\\omega l i q \\) y \\( v q\\leftarrow v q+\\omega l i d \\). el término cruzado se cancela algebraicamente y \\( i q \\) permanece en 0 durante el escalón de \\( i d^ \\) — verificable en simulación midiendo el máximo de \\( |i q| \\) con/sin desacoplo. con \\( l \\) con error del 10 %: el residuo de acoplamiento es \\( 0.1\\times\\omega l\\delta i d/k p\\approx5\\,\\text{a} \\), despreciable en la mayoría de aplicaciones. ejemplo de código python def current ctrl(id ref, iq ref, id , iq , ed, eq, w, l, pi d, pi q): vd = pi d(id ref - id ) - w l iq + ed desacoplo + feedforward vq = pi q(iq ref - iq ) + w l id + eq return vd, vq parámetros y valores típicos ancho de banda del lazo de corriente \\( \\alpha c \\approx (1/10\\text{–}1/5)\\,\\omega {sw} \\). el desacoplo importa cuando \\( \\omega l \\gtrsim r \\) (casi siempre en convertidores de red). errores comunes - usar \\( l \\) o \\( \\omega \\) erróneos → desacoplo imperfecto y acoplamiento residual. - feedforward de \\( e {dq} \\) ruidoso (medida sucia) → inyecta ruido en la modulación; filtrar. - olvidar el retardo digital, que reintroduce acoplamiento efectivo a alta frecuencia. conceptos relacionados - marco-dq · control-cascada · control-vectorial · controlador-pid · filtro-lcl referencias - yazdani, iravani, 2010. - kazmierkowski, krishnan, blaabjerg, control in power electronics , 2002. desacoplo feedforward acoplamiento-cruzado dq lazo-corriente intermedio control"}, {"slug": "deteccion-islanding", "titulo": "Detección de islanding (anti-islanding)", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": [], "objetivos": ["detectar la separación de la red y desconectar el convertidor en tiempo normativo"], "tags": ["islanding", "anti-islanding", "deteccion", "OUF", "OUV", "NDZ", "grid-code", "intermedio"], "relacionados": ["pll-srf", "dsogi-pll", "fault-ride-through", "servicios-red-soporte", "calidad-potencia"], "referencias": ["IEEE Std 1547-2018, Standard for Interconnection and Interoperability of DER", "Mahat et al., A Hybrid Islanding Detection Technique, IEEE TPEL 2011"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Conjunto de métodos que detectan que un convertidor distribuido ha quedado operando en una\n<strong>isla</strong> (separado de la red principal) y lo desconectan dentro del tiempo exigido por la normativa\n(típicamente &lt; 2 s), evitando riesgos para el personal de mantenimiento y el equipamiento.</p>\n<h2>Fundamento teórico</h2>\n<p>Cuando la red se desconecta, la isla puede quedar con potencia generada ≈ carga (coincidencia de P y Q),\npor lo que la tensión y frecuencia permanecen dentro de límites durante un tiempo → <strong>zona de no\ndetección (NDZ)</strong>. Los métodos se clasifican en:</p>\n<p><strong>Pasivos</strong> (monitorizan parámetros de red):\n- <strong>OUF/OUV</strong> (Over/Under Frequency/Voltage): umbrales normativos. Rápido pero con NDZ amplia.\n- <strong>ROCOF</strong> (Rate of Change of Frequency): \\( df/dt \\) supera un umbral al desconectar la red.\n  Sensible pero puede disparar falsamente en eventos de red (falta lejana).\n- <strong>Cambio de fase / vector shift</strong>: salto de ángulo al perder la red; rápido, pero sensible a\n  faltas y conmutación de cargas grandes.</p>\n<p><strong>Activos</strong> (perturban intencionadamente la salida):\n- <strong>Positive Feedback / Sandia Frequency Shift (SFS):</strong> se añade una perturbación de frecuencia\n  proporcional al ROCOF; en isla la frecuencia escapa rápidamente del rango → detección. En red\n  fuerte la red absorbe la perturbación; en isla se amplifica.\n- <strong>Reactive Power Export (RPE):</strong> inyección de Q perturbación; produce desvíos de tensión en isla.\n- <strong>Impedance Measurement:</strong> inyecta un tono de prueba y mide la impedancia de red; sube mucho al\n  aislar. Exacto pero más complejo y puede añadir distorsión.</p>\n<p><strong>Comunicación</strong> (más robusta):\n- <strong>SCADA/Teleprotección:</strong> la apertura del interruptor envía una señal directa al inversor. Sin NDZ;\n  depende de comunicaciones (falla si el enlace falla).</p>\n<p>Compromiso: los métodos activos reducen la NDZ pero degradan la calidad de potencia; en\n<strong>grid-forming</strong> la detección es más difícil porque el convertidor sostiene tensión/frecuencia\nincluso en isla.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Obligatorio por normativa (IEEE 1547, IEC 62116, VDE-AR-N 4105) para toda generación distribuida\nconectada a red pública. Especialmente crítico en instalaciones con <a class=\"wl\" data-slug=\"servicios-red-soporte\">FRT y\ninercia sintética</a> que pueden mantener la isla activa más tiempo.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Comprueba los umbrales normativos del grid code aplicable (OUF/OUV, ROCOF, tiempo de actuación).</li>\n<li>Implementa métodos pasivos como primera línea (OUF/OUV + ROCOF/phase-jump).</li>\n<li>Añade un método activo (SFS) para reducir NDZ si la normativa lo exige.</li>\n<li>Coordina con <a class=\"wl\" data-slug=\"fault-ride-through\">FRT</a>: durante un hueco no disparar anti-islanding; al despejar\n   la falta, re-sincronizar (<a class=\"wl\" data-slug=\"pll-srf\">pll-srf</a>) antes de reconectar.</li>\n<li>Valida con escenarios de NDZ (carga resonante balanceada) y con perturbaciones de red que no\n   deben causar falso disparo.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def rocof_islanding(f_hist, dt, thresh=0.5):   # Hz/s\n    if len(f_hist) &lt; 2: return False\n    rocof = (f_hist[-1] - f_hist[-2]) / dt\n    return abs(rocof) &gt; thresh                  # True = island detectado\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>OUF: 47–52 Hz (EN 50549); OUV: 0.85–1.10 p.u.; ROCOF: 0.5–2 Hz/s; tiempo &lt; 0.5–2 s según normativa.\nNDZ de OUF/OUV ≈ zona donde generación ≈ carga con Q≈0.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Umbrales de ROCOF demasiado sensibles → falso disparo durante faltas de red que no son islanding.</li>\n<li>Grid-forming sin método activo → sostiene la isla dentro de los umbrales pasivos indefinidamente.</li>\n<li>No coordinar FRT y anti-islanding (el FRT bloquea el disparo durante el hueco; al despejar puede\n  haber islanding real).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"pll-srf\">pll-srf</a> · <a class=\"wl\" data-slug=\"dsogi-pll\">dsogi-pll</a> · <a class=\"wl\" data-slug=\"fault-ride-through\">fault-ride-through</a> · <a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios-red-soporte</a> · <a class=\"wl\" data-slug=\"calidad-potencia\">calidad-potencia</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>IEEE Std 1547-2018, <em>Standard for Interconnection and Interoperability of DER</em>.</li>\n<li>Mahat et al., <em>A Hybrid Islanding Detection Technique</em>, IEEE TPEL 2011.</li>\n</ul>", "buscar": "detección de islanding (anti-islanding) definición conjunto de métodos que detectan que un convertidor distribuido ha quedado operando en una isla (separado de la red principal) y lo desconectan dentro del tiempo exigido por la normativa (típicamente < 2 s), evitando riesgos para el personal de mantenimiento y el equipamiento. fundamento teórico cuando la red se desconecta, la isla puede quedar con potencia generada ≈ carga (coincidencia de p y q), por lo que la tensión y frecuencia permanecen dentro de límites durante un tiempo → zona de no detección (ndz) . los métodos se clasifican en: pasivos (monitorizan parámetros de red): - ouf/ouv (over/under frequency/voltage): umbrales normativos. rápido pero con ndz amplia. - rocof (rate of change of frequency): \\( df/dt \\) supera un umbral al desconectar la red. sensible pero puede disparar falsamente en eventos de red (falta lejana). - cambio de fase / vector shift : salto de ángulo al perder la red; rápido, pero sensible a faltas y conmutación de cargas grandes. activos (perturban intencionadamente la salida): - positive feedback / sandia frequency shift (sfs): se añade una perturbación de frecuencia proporcional al rocof; en isla la frecuencia escapa rápidamente del rango → detección. en red fuerte la red absorbe la perturbación; en isla se amplifica. - reactive power export (rpe): inyección de q perturbación; produce desvíos de tensión en isla. - impedance measurement: inyecta un tono de prueba y mide la impedancia de red; sube mucho al aislar. exacto pero más complejo y puede añadir distorsión. comunicación (más robusta): - scada/teleprotección: la apertura del interruptor envía una señal directa al inversor. sin ndz; depende de comunicaciones (falla si el enlace falla). compromiso: los métodos activos reducen la ndz pero degradan la calidad de potencia; en grid-forming la detección es más difícil porque el convertidor sostiene tensión/frecuencia incluso en isla. cuándo y por qué se usa obligatorio por normativa (ieee 1547, iec 62116, vde-ar-n 4105) para toda generación distribuida conectada a red pública. especialmente crítico en instalaciones con servicios-red-soporte|frt y inercia sintética que pueden mantener la isla activa más tiempo. procedimiento de diseño (genérico) 1. comprueba los umbrales normativos del grid code aplicable (ouf/ouv, rocof, tiempo de actuación). 2. implementa métodos pasivos como primera línea (ouf/ouv + rocof/phase-jump). 3. añade un método activo (sfs) para reducir ndz si la normativa lo exige. 4. coordina con fault-ride-through|frt : durante un hueco no disparar anti-islanding; al despejar la falta, re-sincronizar ( pll-srf ) antes de reconectar. 5. valida con escenarios de ndz (carga resonante balanceada) y con perturbaciones de red que no deben causar falso disparo. ejemplo de código python def rocof islanding(f hist, dt, thresh=0.5): hz/s if len(f hist) < 2: return false rocof = (f hist -1 - f hist -2 ) / dt return abs(rocof) thresh true = island detectado parámetros y valores típicos ouf: 47–52 hz (en 50549); ouv: 0.85–1.10 p.u.; rocof: 0.5–2 hz/s; tiempo < 0.5–2 s según normativa. ndz de ouf/ouv ≈ zona donde generación ≈ carga con q≈0. errores comunes - umbrales de rocof demasiado sensibles → falso disparo durante faltas de red que no son islanding. - grid-forming sin método activo → sostiene la isla dentro de los umbrales pasivos indefinidamente. - no coordinar frt y anti-islanding (el frt bloquea el disparo durante el hueco; al despejar puede haber islanding real). conceptos relacionados - pll-srf · dsogi-pll · fault-ride-through · servicios-red-soporte · calidad-potencia referencias - ieee std 1547-2018, standard for interconnection and interoperability of der . - mahat et al., a hybrid islanding detection technique , ieee tpel 2011. islanding anti-islanding deteccion ouf ouv ndz grid-code intermedio"}, {"slug": "diagrama-bloques", "titulo": "Diagrama de bloques y álgebra de bloques", "categoria": "control", "tipo": "concepto", "nivel": "basico", "proyectos": [], "objetivos": ["interconectar subsistemas y reducirlos a una función de transferencia equivalente"], "tags": ["diagrama-bloques", "algebra-bloques", "interconexion", "lazo-cerrado", "basico"], "relacionados": ["funcion-transferencia", "realimentacion", "control-cascada", "error-regimen-permanente"], "referencias": ["Ogata, Ingeniería de Control Moderna, Pearson", "Nise, Control Systems Engineering, Wiley"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Representación gráfica de un sistema como <strong>bloques</strong> (funciones de transferencia) unidos por\nseñales, con <strong>sumadores</strong> y <strong>puntos de bifurcación</strong>. El álgebra de bloques permite reducirlo a\nuna única \\( G_{eq}(s) \\).</p>\n<h2>Fundamento teórico</h2>\n<p>Reglas básicas de combinación:\n- <strong>Serie (cascada):</strong> \\( G_1G_2 \\).\n- <strong>Paralelo:</strong> \\( G_1\\pm G_2 \\).\n- <strong>Realimentación:</strong> lazo con planta \\( G \\) y sensor \\( H \\):\n$$ \\frac{Y}{R}=\\frac{G}{1+GH}\\quad(\\text{negativa}),\\qquad \\frac{G}{1-GH}\\quad(\\text{positiva}) $$\n\\( L=GH \\) es la <strong>ganancia de lazo</strong>; \\( 1+L \\) el <strong>denominador característico</strong>. Mover un\nsumador o una bifurcación a través de un bloque exige multiplicar/dividir por ese bloque para\nconservar las señales. Para topologías densas, la <strong>regla de Mason</strong> da \\( G_{eq} \\) directamente.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para modelar sistemas con varios lazos (corriente dentro de tensión dentro de potencia → ver\n<a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a>), identificar la ganancia de lazo que entra en Nyquist/Bode y derivar las\n<a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a> \\( S=1/(1+L) \\), \\( T=L/(1+L) \\).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Dibuja bloques y señales; marca entradas, salidas y perturbaciones.</li>\n<li>Reduce series y paralelos.</li>\n<li>Cierra lazos internos con la fórmula de realimentación (de dentro hacia afuera).</li>\n<li>Obtén \\( G_{eq} \\); identifica \\( L \\), \\( S \\), \\( T \\).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Control en cascada: lazo interno de corriente con FT cerrada \\( H_i(s)=\\omega_{ci}/(s+\\omega_{ci}) \\) y planta capacitiva del bus \\( G_v(s)=1/(Cs) \\). Reducir el diagrama y hallar la FT de referencia de tensión a tensión de salida.</p>\n<p>Paso 1: el lazo interno está ya reducido a \\( H_i(s) \\). Paso 2: la planta que ve el lazo externo es \\( H_i\\cdot G_v=\\omega_{ci}/[(s+\\omega_{ci})\\,Cs] \\). Paso 3: con PI externo \\( C_v(s) \\): la FT de lazo cerrado externo es \\( G_{v,cl}=C_v H_i G_v/(1+C_v H_i G_v) \\). Con \\( \\omega_{ci}\\gg\\omega_{cv} \\) (separación de escalas), \\( H_i\\approx1 \\) en la banda del lazo externo y el diagrama se simplifica a \\( C_v/Cs/(1+C_v/(Cs)) \\). La separación de escalas es la condición que hace válida esta simplificación.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct\nG = ct.tf([5], [1, 2]); H = ct.tf([1], [1])\nT = ct.feedback(G, H)              # G/(1+GH): lazo cerrado\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>En cascada, el lazo interno suele ser 5–10× más rápido que el externo, de modo que se aproxima a\nganancia unidad en la banda del externo.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mover un sumador/bifurcación sin compensar con el bloque → señales incorrectas.</li>\n<li>Confundir lazo abierto \\( L \\) con lazo cerrado \\( T \\).</li>\n<li>Reducir lazos acoplados como si fueran independientes.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"funcion-transferencia\">funcion-transferencia</a> · <a class=\"wl\" data-slug=\"realimentacion\">realimentacion</a> · <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> · <a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Ogata, <em>Ingeniería de Control Moderna</em>.</li>\n<li>Nise, <em>Control Systems Engineering</em>.</li>\n</ul>", "buscar": "diagrama de bloques y álgebra de bloques definición representación gráfica de un sistema como bloques (funciones de transferencia) unidos por señales, con sumadores y puntos de bifurcación . el álgebra de bloques permite reducirlo a una única \\( g {eq}(s) \\). fundamento teórico reglas básicas de combinación: - serie (cascada): \\( g 1g 2 \\). - paralelo: \\( g 1\\pm g 2 \\). - realimentación: lazo con planta \\( g \\) y sensor \\( h \\): \\frac{y}{r}=\\frac{g}{1+gh}\\quad(\\text{negativa}),\\qquad \\frac{g}{1-gh}\\quad(\\text{positiva}) \\( l=gh \\) es la ganancia de lazo ; \\( 1+l \\) el denominador característico . mover un sumador o una bifurcación a través de un bloque exige multiplicar/dividir por ese bloque para conservar las señales. para topologías densas, la regla de mason da \\( g {eq} \\) directamente. cuándo y por qué se usa para modelar sistemas con varios lazos (corriente dentro de tensión dentro de potencia → ver control-cascada ), identificar la ganancia de lazo que entra en nyquist/bode y derivar las funciones-sensibilidad \\( s=1/(1+l) \\), \\( t=l/(1+l) \\). procedimiento (genérico) 1. dibuja bloques y señales; marca entradas, salidas y perturbaciones. 2. reduce series y paralelos. 3. cierra lazos internos con la fórmula de realimentación (de dentro hacia afuera). 4. obtén \\( g {eq} \\); identifica \\( l \\), \\( s \\), \\( t \\). ejemplo de aplicación real problema: control en cascada: lazo interno de corriente con ft cerrada \\( h i(s)=\\omega {ci}/(s+\\omega {ci}) \\) y planta capacitiva del bus \\( g v(s)=1/(cs) \\). reducir el diagrama y hallar la ft de referencia de tensión a tensión de salida. paso 1: el lazo interno está ya reducido a \\( h i(s) \\). paso 2: la planta que ve el lazo externo es \\( h i\\cdot g v=\\omega {ci}/ (s+\\omega {ci})\\,cs \\). paso 3: con pi externo \\( c v(s) \\): la ft de lazo cerrado externo es \\( g {v,cl}=c v h i g v/(1+c v h i g v) \\). con \\( \\omega {ci}\\gg\\omega {cv} \\) (separación de escalas), \\( h i\\approx1 \\) en la banda del lazo externo y el diagrama se simplifica a \\( c v/cs/(1+c v/(cs)) \\). la separación de escalas es la condición que hace válida esta simplificación. ejemplo de código python import control as ct g = ct.tf( 5 , 1, 2 ); h = ct.tf( 1 , 1 ) t = ct.feedback(g, h) g/(1+gh): lazo cerrado parámetros y valores típicos en cascada, el lazo interno suele ser 5–10× más rápido que el externo, de modo que se aproxima a ganancia unidad en la banda del externo. errores comunes - mover un sumador/bifurcación sin compensar con el bloque → señales incorrectas. - confundir lazo abierto \\( l \\) con lazo cerrado \\( t \\). - reducir lazos acoplados como si fueran independientes. conceptos relacionados - funcion-transferencia · realimentacion · control-cascada · funciones-sensibilidad referencias - ogata, ingeniería de control moderna . - nise, control systems engineering . diagrama-bloques algebra-bloques interconexion lazo-cerrado basico"}, {"slug": "diagrama-bode", "titulo": "Diagrama de Bode", "categoria": "control", "tipo": "concepto", "nivel": "basico", "proyectos": [], "objetivos": [{"leer la respuesta en frecuencia": "magnitud y fase"}], "tags": ["bode", "frecuencia", "magnitud", "fase", "decibelios", "basico"], "relacionados": ["funcion-transferencia", "margenes-estabilidad", "loop-shaping", "respuesta-frecuencia-ss"], "referencias": ["Ogata, Ingeniería de Control Moderna, Pearson"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Par de gráficas que muestran cómo responde un sistema lineal a senoides de distinta frecuencia:\nla <strong>magnitud</strong> (en dB) y la <strong>fase</strong> (en grados) de \\( G(j\\omega) \\) frente a la frecuencia (en\nescala logarítmica). Es la herramienta visual del diseño en frecuencia.</p>\n<h2>Fundamento teórico</h2>\n<p>Se evalúa la función de transferencia en \\( s=j\\omega \\):\n$$ |G(j\\omega)|_{dB}=20\\log_{10}|G(j\\omega)|, \\qquad \\angle G(j\\omega) $$\nReglas de lectura (asíntotas):\n- Cada <strong>polo</strong> añade \\( -20 \\) dB/década de pendiente y hasta \\( -90° \\) de fase.\n- Cada <strong>cero</strong>, \\( +20 \\) dB/década y hasta \\( +90° \\).\n- Un <strong>integrador</strong> \\( 1/s \\): \\( -20 \\) dB/dec y \\( -90° \\) constantes.\nLa <strong>frecuencia de cruce de ganancia</strong> (donde \\( |G|=0 \\) dB) marca el ancho de banda; en ella se\nlee el <strong>margen de fase</strong>. La ventaja del logaritmo: multiplicar bloques = sumar sus Bode.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para diseñar por loop-shaping, leer márgenes de estabilidad y entender el filtrado (qué\nfrecuencias pasan o se atenúan). Es el lenguaje del análisis de impedancia.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Calcula \\( G(j\\omega) \\) en un rango de frecuencias (escala log).</li>\n<li>Dibuja magnitud (dB) y fase (deg).</li>\n<li>Localiza el cruce de ganancia y lee el margen de fase; localiza el cruce de fase (−180°) y lee\n   el margen de ganancia.</li>\n<li>Da forma a la curva para cumplir las especificaciones.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Filtro LCL con \\( L_1=2\\,\\text{mH} \\), \\( L_2=0.5\\,\\text{mH} \\), \\( C_f=15\\,\\mu\\text{F} \\). Identificar la resonancia en el Bode y determinar la zona válida para cruzar con el lazo de corriente.</p>\n<p>Frecuencia de resonancia: \\( f_{res}=\\tfrac{1}{2\\pi}\\sqrt{(L_1+L_2)/(L_1 L_2 C_f)}\\approx2.05\\,\\text{kHz} \\). En el Bode, por debajo de \\( f_{res} \\) la pendiente es \\( -40\\,\\text{dB/dec} \\) (dos inductores en serie); en \\( f_{res} \\) la ganancia sube &gt;40 dB y la fase cae \\( -180° \\). El lazo de corriente debe cruzar <strong>por debajo de \\( f_{res} \\)</strong>: con objetivo \\( f_c\\approx1\\,\\text{kHz} \\) hay un margen de factor 2× frente a la resonancia. El amortiguamiento activo (<a class=\"wl\" data-slug=\"amortiguamiento-activo-lcl\">amortiguamiento-activo-lcl</a>) neutraliza el pico para permitir \\( f_c \\) más alto si se requiere.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct, numpy as np\nG = ct.tf([1], [1, 2, 1])\nmag, phase, w = ct.frequency_response(G, np.logspace(-1, 2, 500))\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Pendiente \\( -20 \\) dB/dec en el cruce → buen margen de fase. Margen de fase objetivo 45–60°.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Confundir frecuencia (rad/s) con Hz al leer la gráfica.</li>\n<li>Cruce con pendiente \\( -40 \\) dB/dec → margen de fase pobre (cerca de inestable).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"funcion-transferencia\">funcion-transferencia</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> · <a class=\"wl\" data-slug=\"respuesta-frecuencia-ss\">respuesta-frecuencia-ss</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Ogata, <em>Ingeniería de Control Moderna</em>.</li>\n</ul>", "buscar": "diagrama de bode definición par de gráficas que muestran cómo responde un sistema lineal a senoides de distinta frecuencia: la magnitud (en db) y la fase (en grados) de \\( g(j\\omega) \\) frente a la frecuencia (en escala logarítmica). es la herramienta visual del diseño en frecuencia. fundamento teórico se evalúa la función de transferencia en \\( s=j\\omega \\): |g(j\\omega)| {db}=20\\log {10}|g(j\\omega)|, \\qquad \\angle g(j\\omega) reglas de lectura (asíntotas): - cada polo añade \\( -20 \\) db/década de pendiente y hasta \\( -90° \\) de fase. - cada cero , \\( +20 \\) db/década y hasta \\( +90° \\). - un integrador \\( 1/s \\): \\( -20 \\) db/dec y \\( -90° \\) constantes. la frecuencia de cruce de ganancia (donde \\( |g|=0 \\) db) marca el ancho de banda; en ella se lee el margen de fase . la ventaja del logaritmo: multiplicar bloques = sumar sus bode. cuándo y por qué se usa para diseñar por loop-shaping, leer márgenes de estabilidad y entender el filtrado (qué frecuencias pasan o se atenúan). es el lenguaje del análisis de impedancia. procedimiento (genérico) 1. calcula \\( g(j\\omega) \\) en un rango de frecuencias (escala log). 2. dibuja magnitud (db) y fase (deg). 3. localiza el cruce de ganancia y lee el margen de fase; localiza el cruce de fase (−180°) y lee el margen de ganancia. 4. da forma a la curva para cumplir las especificaciones. ejemplo de aplicación real problema: filtro lcl con \\( l 1=2\\,\\text{mh} \\), \\( l 2=0.5\\,\\text{mh} \\), \\( c f=15\\,\\mu\\text{f} \\). identificar la resonancia en el bode y determinar la zona válida para cruzar con el lazo de corriente. frecuencia de resonancia: \\( f {res}=\\tfrac{1}{2\\pi}\\sqrt{(l 1+l 2)/(l 1 l 2 c f)}\\approx2.05\\,\\text{khz} \\). en el bode, por debajo de \\( f {res} \\) la pendiente es \\( -40\\,\\text{db/dec} \\) (dos inductores en serie); en \\( f {res} \\) la ganancia sube 40 db y la fase cae \\( -180° \\). el lazo de corriente debe cruzar por debajo de \\( f {res} \\) : con objetivo \\( f c\\approx1\\,\\text{khz} \\) hay un margen de factor 2× frente a la resonancia. el amortiguamiento activo ( amortiguamiento-activo-lcl ) neutraliza el pico para permitir \\( f c \\) más alto si se requiere. ejemplo de código python import control as ct, numpy as np g = ct.tf( 1 , 1, 2, 1 ) mag, phase, w = ct.frequency response(g, np.logspace(-1, 2, 500)) parámetros y valores típicos pendiente \\( -20 \\) db/dec en el cruce → buen margen de fase. margen de fase objetivo 45–60°. errores comunes - confundir frecuencia (rad/s) con hz al leer la gráfica. - cruce con pendiente \\( -40 \\) db/dec → margen de fase pobre (cerca de inestable). conceptos relacionados - funcion-transferencia · margenes-estabilidad · loop-shaping · respuesta-frecuencia-ss referencias - ogata, ingeniería de control moderna . bode frecuencia magnitud fase decibelios basico"}, {"slug": "droop-control", "titulo": "Control por droop (P-f, Q-V)", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance"], "objetivos": ["sincronizar sin PLL", "repartir potencia entre fuentes"], "tags": ["grid-forming", "droop", "frecuencia", "reparto-carga", "dq"], "relacionados": ["grid-forming-vs-following", "vsm-inercia", "impedancia-virtual", "analisis-modal"], "referencias": ["Chandorkar, Divan, Adapa, Control of Parallel Connected Inverters, IEEE TIA 1993"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Estrategia de grid-forming que fija la <strong>frecuencia</strong> según la potencia activa y la <strong>tensión</strong>\nsegún la reactiva, emulando el estatismo de un generador síncrono. Permite sincronizar y\nrepartir carga <strong>sin comunicación ni PLL</strong>.</p>\n<h2>Fundamento teórico</h2>\n<p>$$ \\omega = \\omega_0 + m_p\\,(P_{set}-P), \\qquad V^{*} = V_0 + n_q\\,(Q_{set}-Q) $$\n$$ \\dot\\delta = \\omega - \\omega_0 $$\nLa potencia se mide y filtra (paso-bajo \\( \\omega_f \\)) para quitar el rizado:\n\\( \\dot{P}_m=\\omega_f(P-P_m) \\). El lazo de potencia activa tiene un <strong>integrador</strong> (el ángulo\n\\( \\delta \\)) y el polo del filtro \\( \\omega_f \\): si la ganancia \\( m_p\\,\\partial P/\\partial\\delta \\)\nes alta, el cruce cae donde el filtro ya da −90° → poco margen de fase.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Base de la mayoría de microrredes y grid-forming. Para una línea inductiva, P↔ángulo y\nQ↔tensión están desacoplados, lo que justifica el emparejamiento P-f / Q-V.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li><strong>\\( m_p \\)</strong> desde la caída de frecuencia admisible a plena potencia (típico 0.5–2%):\n   \\( m_p = \\dfrac{\\Delta\\omega_{max}}{S_n} = \\dfrac{(\\text{droop}\\%)\\,\\omega_0}{S_n} \\).</li>\n<li><strong>\\( n_q \\)</strong> desde la caída de tensión admisible (típico 2–5%): \\( n_q=\\dfrac{(\\text{droop}\\%)\\,V_0}{S_n} \\).</li>\n<li><strong>Filtro de potencia \\( \\omega_f \\)</strong>: bajo (5–20 Hz) para promediar el rizado y mantener el\n   lazo de potencia lento; un \\( \\omega_f \\) alto acerca el polo al cruce y reduce el margen.</li>\n<li>Verifica el <strong>amortiguamiento del modo de potencia</strong> con autovalores. Si es bajo, usa\n   <a class=\"wl\" data-slug=\"impedancia-virtual\">impedancia-virtual</a> (reduce \\( \\partial P/\\partial\\delta \\)) o pasa a <a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a>.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">mp = droop_p*w0/Sn           # (rad/s)/W\nnq = droop_q*V0/Sn           # V/var\nw  = w0 + mp*(Pset - Pm)     # droop P-f\nVref = V0 + nq*(Qset - Qm)   # droop Q-V\nddelta = w - w0; dPm = wf*(P - Pm); dQm = wf*(Q - Qm)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( m_p \\) (droop P-f) 0.5–2 %, \\( n_q \\) (droop Q-V) 2–5 %, \\( f_{pow} \\) 5–20 Hz. En el proyecto: 0.5 % / 2 % / 15 Hz.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>\\( \\omega_f \\) demasiado alto → modo de potencia mal amortiguado o inestable.</li>\n<li>Asumir desacoplo P-f / Q-V con línea resistiva (X/R bajo): ahí P y Q se acoplan.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: sincronizar sin PLL): droop P-f/Q-V como capa externa.\n  El modo de potencia resultó a 3.3 Hz; su amortiguamiento se trató con impedancia virtual.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a> · <a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a> · <a class=\"wl\" data-slug=\"impedancia-virtual\">impedancia-virtual</a> · <a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Chandorkar et al., IEEE TIA 1993.</li>\n</ul>", "buscar": "control por droop (p-f, q-v) definición estrategia de grid-forming que fija la frecuencia según la potencia activa y la tensión según la reactiva, emulando el estatismo de un generador síncrono. permite sincronizar y repartir carga sin comunicación ni pll . fundamento teórico \\omega = \\omega 0 + m p\\,(p {set}-p), \\qquad v^{ } = v 0 + n q\\,(q {set}-q) \\dot\\delta = \\omega - \\omega 0 la potencia se mide y filtra (paso-bajo \\( \\omega f \\)) para quitar el rizado: \\( \\dot{p} m=\\omega f(p-p m) \\). el lazo de potencia activa tiene un integrador (el ángulo \\( \\delta \\)) y el polo del filtro \\( \\omega f \\): si la ganancia \\( m p\\,\\partial p/\\partial\\delta \\) es alta, el cruce cae donde el filtro ya da −90° → poco margen de fase. cuándo y por qué se usa base de la mayoría de microrredes y grid-forming. para una línea inductiva, p↔ángulo y q↔tensión están desacoplados, lo que justifica el emparejamiento p-f / q-v. procedimiento de diseño (genérico) 1. \\( m p \\) desde la caída de frecuencia admisible a plena potencia (típico 0.5–2%): \\( m p = \\dfrac{\\delta\\omega {max}}{s n} = \\dfrac{(\\text{droop}\\%)\\,\\omega 0}{s n} \\). 2. \\( n q \\) desde la caída de tensión admisible (típico 2–5%): \\( n q=\\dfrac{(\\text{droop}\\%)\\,v 0}{s n} \\). 3. filtro de potencia \\( \\omega f \\) : bajo (5–20 hz) para promediar el rizado y mantener el lazo de potencia lento; un \\( \\omega f \\) alto acerca el polo al cruce y reduce el margen. 4. verifica el amortiguamiento del modo de potencia con autovalores. si es bajo, usa impedancia-virtual (reduce \\( \\partial p/\\partial\\delta \\)) o pasa a vsm-inercia . ejemplo de código python mp = droop p w0/sn (rad/s)/w nq = droop q v0/sn v/var w = w0 + mp (pset - pm) droop p-f vref = v0 + nq (qset - qm) droop q-v ddelta = w - w0; dpm = wf (p - pm); dqm = wf (q - qm) parámetros y valores típicos \\( m p \\) (droop p-f) 0.5–2 %, \\( n q \\) (droop q-v) 2–5 %, \\( f {pow} \\) 5–20 hz. en el proyecto: 0.5 % / 2 % / 15 hz. errores comunes - \\( \\omega f \\) demasiado alto → modo de potencia mal amortiguado o inestable. - asumir desacoplo p-f / q-v con línea resistiva (x/r bajo): ahí p y q se acoplan. uso en proyectos - 01 - gfm-impedance (objetivo: sincronizar sin pll): droop p-f/q-v como capa externa. el modo de potencia resultó a 3.3 hz; su amortiguamiento se trató con impedancia virtual. conceptos relacionados - grid-forming-vs-following · vsm-inercia · impedancia-virtual · analisis-modal referencias - chandorkar et al., ieee tia 1993. grid-forming droop frecuencia reparto-carga dq"}, {"slug": "droop-dc", "titulo": "Droop DC y reparto de carga en bus continuo", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": [], "objetivos": ["repartir corriente entre fuentes de un bus DC sin comunicaciones"], "tags": ["droop-dc", "reparto-carga", "bus-dc", "resistencia-virtual", "microrred-dc", "intermedio"], "relacionados": ["droop-control", "control-tension-bus-dc", "dinamica-bus-dc", "control-jerarquico-microrred", "microrred-hibrida-ac-dc"], "referencias": ["Guerrero et al., Hierarchical Control of Droop-Controlled AC and DC Microgrids, IEEE TIE 2011", "Lu et al., State-of-Charge Balancing Using Adaptive Droop for DC Microgrids, IEEE TPEL 2014"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Estrategia de control primario que reparte la corriente/potencia entre varias fuentes conectadas a\nun <strong>bus DC común</strong> introduciendo una <strong>caída de tensión proporcional a la corriente</strong> (resistencia\nvirtual), sin necesidad de comunicaciones entre convertidores.</p>\n<h2>Fundamento teórico</h2>\n<p>Cada convertidor sigue la ley:\n$$ V_{dc}=V_{dc}^*-R_d\\,I_o $$\ncon \\( R_d \\) la <strong>resistencia de droop (virtual)</strong>. Como todas las unidades comparten el mismo\n\\( V_{dc} \\) del bus, el reparto de corriente queda fijado por\n$$ \\frac{I_{o,1}}{I_{o,2}}=\\frac{R_{d,2}}{R_{d,1}} $$\nes decir, <strong>inversamente proporcional</strong> a la resistencia de droop. Análogo DC del <a class=\"wl\" data-slug=\"droop-control\">droop AC</a> (allí \\( \\omega\\!-\\!P \\); aquí \\( V_{dc}\\!-\\!I \\)).</p>\n<p><strong>Compromiso fundamental:</strong> un \\( R_d \\) grande mejora el reparto y la estabilidad pero empeora la\n<strong>regulación de tensión</strong> (mayor caída con la carga). La desviación de tensión la corrige el nivel\n<strong>secundario</strong> (ver <a class=\"wl\" data-slug=\"control-jerarquico-microrred\">control-jerarquico-microrred</a>) sumando \\( \\delta V \\) a \\( V_{dc}^* \\).</p>\n<p><strong>Error por resistencia de línea:</strong> las resistencias de cable \\( R_{line,i} \\) se suman a \\( R_d \\) y\ndistorsionan el reparto; \\( R_d\\gg R_{line} \\) lo mitiga, o se compensa en el sec
