arco de referencia dq (Park/Clarke)", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["modelar el sistema trifasico como continuo y desacoplar el control"], "tags": ["park", "clarke", "dq", "transformada", "trifasico"], "relacionados": ["potencia-instantanea-dq", "control-cascada", "filtro-lcl"], "referencias": ["Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Transformación que lleva las magnitudes trifásicas (abc) a un marco giratorio de dos ejes\n(d, q) sincronizado con la frecuencia de red. En régimen permanente, las senoides de 50 Hz se\nconvierten en <strong>constantes</strong> → permite usar PI y analizar el sistema como uno de continua.</p>\n<h2>Fundamento teórico</h2>\n<p>Clarke (abc→αβ) y Park (αβ→dq) con ángulo \\( \\theta=\\int\\omega\\,dt \\):\n$$ \\begin{bmatrix}x_d\\\\x_q\\end{bmatrix}=\n   \\begin{bmatrix}\\cos\\theta&\\sin\\theta\\\\-\\sin\\theta&\\cos\\theta\\end{bmatrix}\n   \\begin{bmatrix}x_\\alpha\\\\x_\\beta\\end{bmatrix} $$\nAl derivar en el marco giratorio aparece el <strong>acoplamiento cruzado</strong> \\( \\pm\\omega \\) entre d y q\n(la \"fuerza de Coriolis\" del marco): por eso los modelos dq llevan términos \\( \\pm\\omega L i \\),\n\\( \\pm\\omega C v \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En todo control de convertidores trifásicos y máquinas. En grid-forming, el ángulo \\( \\theta \\)\nlo genera el propio control (droop/VSM), no una PLL.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Define el ángulo \\( \\theta \\) del marco (de la PLL en GFL, del droop/VSM en GFM).</li>\n<li>Aplica Clarke y Park a tensiones y corrientes medidas.</li>\n<li>Diseña el control en dq (referencias constantes, PI sin error en permanente).</li>\n<li>Antitransforma (dq→abc) para generar las modulantes del PWM.</li>\n<li>Cuida la convención (amplitud vs potencia invariante) y el alineamiento (eje d con tensión).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def park(alpha, beta, th):\n    c, s = np.cos(th), np.sin(th)\n    return c*alpha + s*beta, -s*alpha + c*beta   # (d, q)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Convención de amplitud (pico de fase) usada en el proyecto: \\( V_0=V_{ll}\\sqrt{2/3} \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mezclar convenciones (amplitud vs potencia invariante) → factores 3/2 mal en la potencia.</li>\n<li>Olvidar los términos cruzados \\( \\pm\\omega \\) al modelar.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: modelado): todo el modelo (15 estados) vive en dq. Además\n  se usan <strong>dos</strong> marcos (red y control) ligados por el ángulo \\( \\delta \\).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a> · <a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> · <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Yazdani, Iravani, 2010.</li>\n</ul>", "buscar": "marco de referencia dq (park/clarke) definición transformación que lleva las magnitudes trifásicas (abc) a un marco giratorio de dos ejes (d, q) sincronizado con la frecuencia de red. en régimen permanente, las senoides de 50 hz se convierten en constantes → permite usar pi y analizar el sistema como uno de continua. fundamento teórico clarke (abc→αβ) y park (αβ→dq) con ángulo \\( \\theta=\\int\\omega\\,dt \\): \\begin{bmatrix}x d\\\\x q\\end{bmatrix}= \\begin{bmatrix}\\cos\\theta&\\sin\\theta\\\\-\\sin\\theta&\\cos\\theta\\end{bmatrix} \\begin{bmatrix}x \\alpha\\\\x \\beta\\end{bmatrix} al derivar en el marco giratorio aparece el acoplamiento cruzado \\( \\pm\\omega \\) entre d y q (la \"fuerza de coriolis\" del marco): por eso los modelos dq llevan términos \\( \\pm\\omega l i \\), \\( \\pm\\omega c v \\). cuándo y por qué se usa en todo control de convertidores trifásicos y máquinas. en grid-forming, el ángulo \\( \\theta \\) lo genera el propio control (droop/vsm), no una pll. procedimiento de diseño (genérico) 1. define el ángulo \\( \\theta \\) del marco (de la pll en gfl, del droop/vsm en gfm). 2. aplica clarke y park a tensiones y corrientes medidas. 3. diseña el control en dq (referencias constantes, pi sin error en permanente). 4. antitransforma (dq→abc) para generar las modulantes del pwm. 5. cuida la convención (amplitud vs potencia invariante) y el alineamiento (eje d con tensión). ejemplo de código python def park(alpha, beta, th): c, s = np.cos(th), np.sin(th) return c alpha + s beta, -s alpha + c beta (d, q) parámetros y valores típicos convención de amplitud (pico de fase) usada en el proyecto: \\( v 0=v {ll}\\sqrt{2/3} \\). errores comunes - mezclar convenciones (amplitud vs potencia invariante) → factores 3/2 mal en la potencia. - olvidar los términos cruzados \\( \\pm\\omega \\) al modelar. uso en proyectos - 01 - gfm-impedance (objetivo: modelado): todo el modelo (15 estados) vive en dq. además se usan dos marcos (red y control) ligados por el ángulo \\( \\delta \\). conceptos relacionados - potencia-instantanea-dq · control-cascada · filtro-lcl referencias - yazdani, iravani, 2010. park clarke dq transformada trifasico"}, {"slug": "microrred-hibrida-ac-dc", "titulo": "Microrred híbrida AC/DC e interlink converter", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["entender la arquitectura de una microrred con subredes AC y DC acopladas"], "tags": ["microrred-hibrida", "ac-dc", "interlink", "ilc", "bus-dc", "datacenter", "intermedio"], "relacionados": ["convertidor-vsc", "dinamica-bus-dc", "droop-dc", "control-jerarquico-microrred", "carga-pulsante-datacenter-ia"], "referencias": ["Loh et al., Autonomous Operation of Hybrid Microgrid With AC and DC Subgrids, IEEE TPEL 2013", "Nejabatkhah, Li, Overview of Power Management Strategies of Hybrid AC/DC Microgrid, IEEE TPEL 2015"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Microrred con <strong>dos subredes</strong> —una AC y una DC— unidas por uno o varios <strong>convertidores de\ninterconexión</strong> (interlink converter, ILC). Combina las ventajas de cada dominio: la DC integra de\nforma natural PV, baterías y cargas electrónicas (data centers); la AC conecta a la red y a cargas\nrotativas.</p>\n<h2>Fundamento teórico</h2>\n<ul>\n<li><strong>Subred DC:</strong> bus de tensión \\( V_{dc} \\) con fuentes/cargas y reparto por <a class=\"wl\" data-slug=\"droop-dc\">droop-dc</a>. Su\n  estado de carga se refleja en \\( V_{dc} \\) (ver <a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a>).</li>\n<li><strong>Subred AC:</strong> bus de frecuencia \\( \\omega \\)/tensión \\( V \\) con droop AC (<a class=\"wl\" data-slug=\"droop-control\">droop-control</a>).</li>\n<li><strong>Interlink converter (ILC):</strong> un <a class=\"wl\" data-slug=\"convertidor-vsc\">VSC</a> bidireccional que <strong>transfiere potencia</strong>\n  entre ambas y normaliza los indicadores de carga de cada subred. La estrategia autónoma habitual\n  iguala los <strong>droop normalizados</strong>:\n  $$ P_{ILC}\\ \\propto\\ \\frac{\\omega-\\omega^*}{\\Delta\\omega_{max}}-\\frac{V_{dc}-V_{dc}^*}{\\Delta V_{dc,max}} $$\n  de modo que cuando una subred está más cargada (su variable de droop más desviada), el ILC le\n  envía potencia desde la otra, <strong>repartiendo el estrés</strong> sin comunicaciones.</li>\n</ul>\n<p>Modos: <strong>conectado a red</strong> (la red AC fija \\( \\omega,V \\); el ILC regula \\( V_{dc} \\)) e <strong>isla</strong>\n(droop en ambas subredes + balanceo por el ILC). Para data centers IA, la subred DC absorbe la\n<a class=\"wl\" data-slug=\"carga-pulsante-datacenter-ia\">carga pulsante</a> y el dimensionado del bus (<a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a>) y la\nestabilidad CPL son críticos.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En instalaciones con fuerte componente DC (PV, baterías, cargas electrónicas) y necesidad de\nconexión AC: data centers, edificios, buques, microrredes rurales. Reduce etapas de conversión y\nmejora eficiencia frente a una arquitectura puramente AC.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Define topología: nº de buses, ubicación de fuentes/cargas, nº de ILC.</li>\n<li>Diseña el primario de cada subred (droop AC y <a class=\"wl\" data-slug=\"droop-dc\">DC</a>).</li>\n<li>Diseña la estrategia del ILC (igualar droops normalizados) y sus límites de potencia.</li>\n<li>Coordina con el <a class=\"wl\" data-slug=\"control-jerarquico-microrred\">control jerárquico</a> (secundario/terciario).</li>\n<li>Verifica estabilidad del bus DC con cargas CPL/pulsantes y transiciones de modo.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def ilc_power(w, Vdc, w0, Vdc0, dW_max, dVdc_max, Kp):\n    soc_ac = (w - w0)/dW_max            # carga normalizada AC\n    soc_dc = (Vdc - Vdc0)/dVdc_max      # carga normalizada DC\n    return Kp*(soc_ac - soc_dc)         # potencia a transferir por el ILC\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Desviaciones normalizadas de droop ±1 a plena carga. Bus DC 350–800 V (BT). ILC dimensionado al\nmáximo intercambio esperado entre subredes.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>ILC sin normalizar los droops → reparto AC/DC desequilibrado.</li>\n<li>Despreciar la dinámica CPL del bus DC con cargas de data center.</li>\n<li>No definir prioridades de carga ni la transición isla↔red del ILC.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"convertidor-vsc\">convertidor-vsc</a> · <a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a> · <a class=\"wl\" data-slug=\"droop-dc\">droop-dc</a> · <a class=\"wl\" data-slug=\"control-jerarquico-microrred\">control-jerarquico-microrred</a> · <a class=\"wl\" data-slug=\"carga-pulsante-datacenter-ia\">carga-pulsante-datacenter-ia</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Loh et al., <em>Autonomous Operation of Hybrid Microgrid With AC and DC Subgrids</em>, IEEE TPEL 2013.</li>\n<li>Nejabatkhah, Li, <em>Overview of Power Management Strategies of Hybrid AC/DC Microgrid</em>, IEEE TPEL 2015.</li>\n</ul>", "buscar": "microrred híbrida ac/dc e interlink converter definición microrred con dos subredes —una ac y una dc— unidas por uno o varios convertidores de interconexión (interlink converter, ilc). combina las ventajas de cada dominio: la dc integra de forma natural pv, baterías y cargas electrónicas (data centers); la ac conecta a la red y a cargas rotativas. fundamento teórico - subred dc: bus de tensión \\( v {dc} \\) con fuentes/cargas y reparto por droop-dc . su estado de carga se refleja en \\( v {dc} \\) (ver dinamica-bus-dc ). - subred ac: bus de frecuencia \\( \\omega \\)/tensión \\( v \\) con droop ac ( droop-control ). - interlink converter (ilc): un convertidor-vsc|vsc bidireccional que transfiere potencia entre ambas y normaliza los indicadores de carga de cada subred. la estrategia autónoma habitual iguala los droop normalizados : p {ilc}\\ \\propto\\ \\frac{\\omega-\\omega^ }{\\delta\\omega {max}}-\\frac{v {dc}-v {dc}^ }{\\delta v {dc,max}} de modo que cuando una subred está más cargada (su variable de droop más desviada), el ilc le envía potencia desde la otra, repartiendo el estrés sin comunicaciones. modos: conectado a red (la red ac fija \\( \\omega,v \\); el ilc regula \\( v {dc} \\)) e isla (droop en ambas subredes + balanceo por el ilc). para data centers ia, la subred dc absorbe la carga-pulsante-datacenter-ia|carga pulsante y el dimensionado del bus ( dinamica-bus-dc ) y la estabilidad cpl son críticos. cuándo y por qué se usa en instalaciones con fuerte componente dc (pv, baterías, cargas electrónicas) y necesidad de conexión ac: data centers, edificios, buques, microrredes rurales. reduce etapas de conversión y mejora eficiencia frente a una arquitectura puramente ac. procedimiento de diseño (genérico) 1. define topología: nº de buses, ubicación de fuentes/cargas, nº de ilc. 2. diseña el primario de cada subred (droop ac y droop-dc|dc ). 3. diseña la estrategia del ilc (igualar droops normalizados) y sus límites de potencia. 4. coordina con el control-jerarquico-microrred|control jerárquico (secundario/terciario). 5. verifica estabilidad del bus dc con cargas cpl/pulsantes y transiciones de modo. ejemplo de código python def ilc power(w, vdc, w0, vdc0, dw max, dvdc max, kp): soc ac = (w - w0)/dw max carga normalizada ac soc dc = (vdc - vdc0)/dvdc max carga normalizada dc return kp (soc ac - soc dc) potencia a transferir por el ilc parámetros y valores típicos desviaciones normalizadas de droop ±1 a plena carga. bus dc 350–800 v (bt). ilc dimensionado al máximo intercambio esperado entre subredes. errores comunes - ilc sin normalizar los droops → reparto ac/dc desequilibrado. - despreciar la dinámica cpl del bus dc con cargas de data center. - no definir prioridades de carga ni la transición isla↔red del ilc. conceptos relacionados - convertidor-vsc · dinamica-bus-dc · droop-dc · control-jerarquico-microrred · carga-pulsante-datacenter-ia referencias - loh et al., autonomous operation of hybrid microgrid with ac and dc subgrids , ieee tpel 2013. - nejabatkhah, li, overview of power management strategies of hybrid ac/dc microgrid , ieee tpel 2015. microrred-hibrida ac-dc interlink ilc bus-dc datacenter intermedio"}, {"slug": "modelado-sistemas", "titulo": "Modelado de sistemas físicos", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance", "03-DataCenter-IA"], "objetivos": ["obtener un modelo matematico util de un sistema fisico"], "tags": ["modelado", "ecuaciones", "caja-blanca", "identificacion", "dominios"], "relacionados": ["variables-estado", "representacion-espacio-estados", "linealizacion-teoria", "marco-dq", "modelo-promediado"], "referencias": ["Ljung, System Identification, Prentice Hall 1999", "Khalil, Nonlinear Systems, Prentice Hall 2002"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Construir una descripción matemática que reproduzca el comportamiento <strong>relevante</strong> de un sistema\nfísico para un propósito concreto (diseñar control, analizar estabilidad, simular). Un modelo no\nes \"la realidad\", es una aproximación útil con un dominio de validez.</p>\n<h2>Fundamento teórico</h2>\n<p>Enfoques según el conocimiento disponible:\n- <strong>Caja blanca</strong> (de conocimiento): se derivan las ecuaciones de las leyes físicas\n  (balance + leyes constitutivas). Es lo que usamos en convertidores.\n- <strong>Caja negra</strong> (identificación): se ajusta un modelo a datos de entrada/salida sin física.\n- <strong>Caja gris</strong>: estructura física con parámetros ajustados a datos.</p>\n<p>La caja blanca combina:\n- <strong>Leyes de balance</strong> (conservación): Kirchhoff de corrientes/tensiones, Newton, balance de energía.\n- <strong>Leyes constitutivas</strong> de cada elemento: inductor \\( v=L\\,\\dfrac{di}{dt} \\), condensador\n  \\( i=C\\,\\dfrac{dv}{dt} \\), resistencia \\( v=Ri \\), inercia \\( T=J\\,\\dfrac{d\\omega}{dt} \\).\nCombinándolas se obtiene un sistema de EDOs \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\).\nLa elección de <strong>nivel de abstracción</strong> (qué se desprecia) es la decisión clave: p.ej. modelo\npromediado vs conmutado.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Es el primer paso de todo: sin modelo no hay diseño ni análisis. El nivel del modelo debe\najustarse al uso (diseño de control → promediado lineal; verificar EMI → conmutado).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Define el <strong>propósito</strong> del modelo y su rango de validez (qué fenómenos debe capturar).</li>\n<li>Identifica los elementos <strong>almacenadores de energía</strong> (fijan el orden; ver <a class=\"wl\" data-slug=\"variables-estado\">variables-estado</a>).</li>\n<li>Aplica leyes de balance + constitutivas → ecuaciones diferenciales.</li>\n<li>Lleva a forma de estado \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\) (ver <a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a>).</li>\n<li>Si hace falta para el análisis lineal, lineliza (ver <a class=\"wl\" data-slug=\"linealizacion-teoria\">linealizacion-teoria</a>).</li>\n<li><strong>Valida</strong> el modelo contra datos o un modelo de mayor fidelidad.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># circuito RLC serie -&gt; dos estados (i del inductor, v del condensador)\ndef f(x, u):\n    i, v = x; Vin = u\n    di = (Vin - R*i - v)/L\n    dv = i/C\n    return [di, dv]\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>El orden del modelo = nº de almacenadores independientes. Para un filtro LCL por fase: 3\n(\\( i_{L1}, v_C, i_{L2} \\)); en dq, 6.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Modelar con más detalle del necesario para el propósito (lento, frágil).</li>\n<li>No declarar el rango de validez → usar el modelo fuera de donde vale.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: caja blanca del inversor (LCL + control) en marco dq, nivel promediado, validado\n  contra inyección de impedancia y promediado-vs-conmutado.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"variables-estado\">variables-estado</a> · <a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a> · <a class=\"wl\" data-slug=\"linealizacion-teoria\">linealizacion-teoria</a> · <a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Khalil, <em>Nonlinear Systems</em>, 2002 · Ljung, <em>System Identification</em>, 1999.</li>\n</ul>", "buscar": "modelado de sistemas físicos definición construir una descripción matemática que reproduzca el comportamiento relevante de un sistema físico para un propósito concreto (diseñar control, analizar estabilidad, simular). un modelo no es \"la realidad\", es una aproximación útil con un dominio de validez. fundamento teórico enfoques según el conocimiento disponible: - caja blanca (de conocimiento): se derivan las ecuaciones de las leyes físicas (balance + leyes constitutivas). es lo que usamos en convertidores. - caja negra (identificación): se ajusta un modelo a datos de entrada/salida sin física. - caja gris : estructura física con parámetros ajustados a datos. la caja blanca combina: - leyes de balance (conservación): kirchhoff de corrientes/tensiones, newton, balance de energía. - leyes constitutivas de cada elemento: inductor \\( v=l\\,\\dfrac{di}{dt} \\), condensador \\( i=c\\,\\dfrac{dv}{dt} \\), resistencia \\( v=ri \\), inercia \\( t=j\\,\\dfrac{d\\omega}{dt} \\). combinándolas se obtiene un sistema de edos \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\). la elección de nivel de abstracción (qué se desprecia) es la decisión clave: p.ej. modelo promediado vs conmutado. cuándo y por qué se usa es el primer paso de todo: sin modelo no hay diseño ni análisis. el nivel del modelo debe ajustarse al uso (diseño de control → promediado lineal; verificar emi → conmutado). procedimiento (genérico) 1. define el propósito del modelo y su rango de validez (qué fenómenos debe capturar). 2. identifica los elementos almacenadores de energía (fijan el orden; ver variables-estado ). 3. aplica leyes de balance + constitutivas → ecuaciones diferenciales. 4. lleva a forma de estado \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\) (ver representacion-espacio-estados ). 5. si hace falta para el análisis lineal, lineliza (ver linealizacion-teoria ). 6. valida el modelo contra datos o un modelo de mayor fidelidad. ejemplo de código python circuito rlc serie - dos estados (i del inductor, v del condensador) def f(x, u): i, v = x; vin = u di = (vin - r i - v)/l dv = i/c return di, dv parámetros y valores típicos el orden del modelo = nº de almacenadores independientes. para un filtro lcl por fase: 3 (\\( i {l1}, v c, i {l2} \\)); en dq, 6. errores comunes - modelar con más detalle del necesario para el propósito (lento, frágil). - no declarar el rango de validez → usar el modelo fuera de donde vale. uso en proyectos - 01/02 : caja blanca del inversor (lcl + control) en marco dq, nivel promediado, validado contra inyección de impedancia y promediado-vs-conmutado. conceptos relacionados - variables-estado · representacion-espacio-estados · linealizacion-teoria · modelo-promediado referencias - khalil, nonlinear systems , 2002 · ljung, system identification , 1999. modelado ecuaciones caja-blanca identificacion dominios"}, {"slug": "modelo-bateria-bess", "titulo": "Modelo de batería y sistema BESS", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["modelar la dinámica eléctrica de una batería y dimensionar un BESS"], "tags": ["bateria", "bess", "soc", "thevenin", "degradacion", "almacenamiento", "intermedio", "modelado"], "relacionados": ["dinamica-bus-dc", "droop-dc", "control-tension-bus-dc", "servicios-red-soporte", "sistema-por-unidad"], "referencias": ["Tremblay, Dessaint, Experimental Validation of a Battery Dynamic Model, IEEE TVT 2009", "Plett, Battery Management Systems Vol.1-2, Artech House 2015"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Modelo eléctrico equivalente de una celda electroquímica (Li-ion, LFP, etc.) y su integración como\nsistema BESS (Battery Energy Storage System) con convertidor DC/DC o DC/AC para inyección a red o\nsoporte de bus DC.</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Modelo de Thevenin de 1 RC</strong> (suficiente para control):\n$$ V_{bat}=OCV(SoC)-I\\,R_0-V_{RC},\\qquad \\tau_{RC}\\dot V_{RC}=I\\,R_1-V_{RC} $$\ncon:\n- \\( OCV(SoC) \\): tensión en circuito abierto, función no lineal del estado de carga.\n- \\( R_0 \\): resistencia interna (pérdidas óhmicas, calentamiento, caída en pulsos).\n- \\( R_1,C_1=\\tau_{RC}/R_1 \\): par RC de difusión (constante \\( \\tau_{RC}\\sim10\\text{–}100 \\) s).</p>\n<p><strong>Estado de carga (SoC):</strong>\n$$ \\dot{SoC}=-\\frac{\\eta_c\\,I}{Q_{nom}},\\quad SoC\\in[0,1] $$\ncon \\( \\eta_c \\) eficiencia coulómbica y \\( Q_{nom} \\) capacidad nominal (Ah). SoC se estima por\nintegración de corriente (<em>coulomb counting</em>, deriva con tiempo) o por filtro de Kalman sobre \\( V_{bat} \\).</p>\n<p><strong>Degradación (simplificada):</strong> el estado de salud SoH disminuye con los ciclos y el tiempo; la\nresistencia interna \\( R_0 \\) aumenta y \\( Q_{nom} \\) cae. Para control de servicios de red\n(droop por SoC): un droop adaptativo \\( R_d=f(SoC) \\) equilibra el uso entre baterías.</p>\n<p><strong>Arquitectura BESS:</strong>\n- Bus DC → convertidor bidireccional DC/DC (<em>boost/buck</em>) → batería (desacopla tensión de batería\n  variable del bus DC).\n- Bus DC → VSC (<a class=\"wl\" data-slug=\"convertidor-vsc\">convertidor-vsc</a>) → red AC.\n- La gestión de SoC y límites de potencia/corriente es responsabilidad del BMS (Battery Management\n  System), que limita las referencias del control.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para modelar el bus DC de un BESS, diseñar los lazos de carga/descarga, los servicios de\nfrecuencia/inercia (<a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios-red-soporte</a>) y el <a class=\"wl\" data-slug=\"droop-dc\">droop DC</a> con equilibrio de SoC\nentre baterías en paralelo.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Parametriza el modelo Thevenin (\\( R_0,R_1,\\tau_{RC} \\)) con datos de la hoja de datos o\n   identificación (HPPC test).</li>\n<li>Obtén la curva \\( OCV(SoC) \\) del fabricante.</li>\n<li>Dimensiona capacidad: \\( E_{bat}=P_{nom}\\cdot t_{descarga} \\); corriente máxima por C-rate.</li>\n<li>Conecta al control de bus DC y define límites de corriente/SoC para el BMS.</li>\n<li>Implementa estimación de SoC (integración o Kalman) y droop adaptativo si hay varias baterías.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def battery_step(I, soc, Vrc, R0, R1, tau, Qnom, dt, ocv_fn):\n    Vbat = ocv_fn(soc) - I*R0 - Vrc\n    dsoc = -I/Qnom                         # coulomb counting (Ah -&gt; fraccion)\n    dVrc = (I*R1 - Vrc)/tau\n    return Vbat, soc + dsoc*dt, Vrc + dVrc*dt\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Li-ion: \\( R_0\\approx0.5\\text{–}5 \\) mΩ/celda; C-rate 0.5–2C continuo, 3–5C pulso; ciclos 2000–6000\n(LFP &gt; NMC); tensión celda 2.5–4.2 V. BESS de red: 0.5–4 h de descarga.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Usar un modelo puramente resistivo (sin RC) → no captura la dinámica de difusión (rizado de tensión\n  en pulsos, relevante para dimensionar el convertidor).</li>\n<li>Ignorar el límite de C-rate en el control (puede degradar la batería o disparar el BMS).</li>\n<li>Asumir \\( OCV \\) lineal con SoC (la curva es muy no lineal en los extremos).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a> · <a class=\"wl\" data-slug=\"droop-dc\">droop-dc</a> · <a class=\"wl\" data-slug=\"control-tension-bus-dc\">control-tension-bus-dc</a> · <a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios-red-soporte</a> · <a class=\"wl\" data-slug=\"sistema-por-unidad\">sistema-por-unidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Tremblay, Dessaint, <em>Experimental Validation of a Battery Dynamic Model</em>, IEEE TVT 2009.</li>\n<li>Plett, <em>Battery Management Systems</em>, Artech House 2015.</li>\n</ul>", "buscar": "modelo de batería y sistema bess definición modelo eléctrico equivalente de una celda electroquímica (li-ion, lfp, etc.) y su integración como sistema bess (battery energy storage system) con convertidor dc/dc o dc/ac para inyección a red o soporte de bus dc. fundamento teórico modelo de thevenin de 1 rc (suficiente para control): v {bat}=ocv(soc)-i\\,r 0-v {rc},\\qquad \\tau {rc}\\dot v {rc}=i\\,r 1-v {rc} con: - \\( ocv(soc) \\): tensión en circuito abierto, función no lineal del estado de carga. - \\( r 0 \\): resistencia interna (pérdidas óhmicas, calentamiento, caída en pulsos). - \\( r 1,c 1=\\tau {rc}/r 1 \\): par rc de difusión (constante \\( \\tau {rc}\\sim10\\text{–}100 \\) s). estado de carga (soc): \\dot{soc}=-\\frac{\\eta c\\,i}{q {nom}},\\quad soc\\in 0,1 con \\( \\eta c \\) eficiencia coulómbica y \\( q {nom} \\) capacidad nominal (ah). soc se estima por integración de corriente ( coulomb counting , deriva con tiempo) o por filtro de kalman sobre \\( v {bat} \\). degradación (simplificada): el estado de salud soh disminuye con los ciclos y el tiempo; la resistencia interna \\( r 0 \\) aumenta y \\( q {nom} \\) cae. para control de servicios de red (droop por soc): un droop adaptativo \\( r d=f(soc) \\) equilibra el uso entre baterías. arquitectura bess: - bus dc → convertidor bidireccional dc/dc ( boost/buck ) → batería (desacopla tensión de batería variable del bus dc). - bus dc → vsc ( convertidor-vsc ) → red ac. - la gestión de soc y límites de potencia/corriente es responsabilidad del bms (battery management system), que limita las referencias del control. cuándo y por qué se usa para modelar el bus dc de un bess, diseñar los lazos de carga/descarga, los servicios de frecuencia/inercia ( servicios-red-soporte ) y el droop-dc|droop dc con equilibrio de soc entre baterías en paralelo. procedimiento de diseño (genérico) 1. parametriza el modelo thevenin (\\( r 0,r 1,\\tau {rc} \\)) con datos de la hoja de datos o identificación (hppc test). 2. obtén la curva \\( ocv(soc) \\) del fabricante. 3. dimensiona capacidad: \\( e {bat}=p {nom}\\cdot t {descarga} \\); corriente máxima por c-rate. 4. conecta al control de bus dc y define límites de corriente/soc para el bms. 5. implementa estimación de soc (integración o kalman) y droop adaptativo si hay varias baterías. ejemplo de código python def battery step(i, soc, vrc, r0, r1, tau, qnom, dt, ocv fn): vbat = ocv fn(soc) - i r0 - vrc dsoc = -i/qnom coulomb counting (ah - fraccion) dvrc = (i r1 - vrc)/tau return vbat, soc + dsoc dt, vrc + dvrc dt parámetros y valores típicos li-ion: \\( r 0\\approx0.5\\text{–}5 \\) mω/celda; c-rate 0.5–2c continuo, 3–5c pulso; ciclos 2000–6000 (lfp nmc); tensión celda 2.5–4.2 v. bess de red: 0.5–4 h de descarga. errores comunes - usar un modelo puramente resistivo (sin rc) → no captura la dinámica de difusión (rizado de tensión en pulsos, relevante para dimensionar el convertidor). - ignorar el límite de c-rate en el control (puede degradar la batería o disparar el bms). - asumir \\( ocv \\) lineal con soc (la curva es muy no lineal en los extremos). conceptos relacionados - dinamica-bus-dc · droop-dc · control-tension-bus-dc · servicios-red-soporte · sistema-por-unidad referencias - tremblay, dessaint, experimental validation of a battery dynamic model , ieee tvt 2009. - plett, battery management systems , artech house 2015. bateria bess soc thevenin degradacion almacenamiento intermedio modelado"}, {"slug": "modelo-promediado", "titulo": "Modelo promediado vs conmutado", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance"], "objetivos": ["justificar el modelo de diseño y validar contra el conmutado"], "tags": ["averaging", "PWM", "conmutado", "simulacion", "rizado"], "relacionados": ["filtro-lcl", "medicion-impedancia-inyeccion", "marco-dq"], "referencias": ["Erickson, Maksimovic, Fundamentals of Power Electronics, Springer (averaging)"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>El <strong>modelo promediado</strong> sustituye la tensión conmutada del puente por su valor medio en cada\nperiodo de conmutación (la modulante × \\( V_{dc}/2 \\)). El <strong>modelo conmutado</strong> simula los IGBTs\ny el PWM reales, con su rizado de alta frecuencia.</p>\n<h2>Fundamento teórico</h2>\n<p>Si la frecuencia de conmutación \\( f_{sw} \\) es mucho mayor que el ancho de banda de control y\nque la dinámica del filtro, el promedio del puente reproduce la dinámica <strong>útil</strong>; el filtro LCL\natenúa el rizado de conmutación. El error entre conmutado y promediado es pequeño y de alta\nfrecuencia. Formalmente es <em>state-space averaging</em>: se promedia \\( \\dot x = f(x,u) \\) sobre el\nperiodo de conmutación.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para <strong>diseñar y analizar</strong> (control, impedancia, estabilidad) se usa el promediado: es continuo,\nlinealizable y rápido de simular. El conmutado se reserva para <strong>validar</strong> y para estudiar\nfenómenos de conmutación (rizado, pérdidas, EMI).</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Diseña y analiza con el modelo promediado.</li>\n<li>Verifica que \\( f_{sw} \\gg \\) (10×) el mayor ancho de banda de control.</li>\n<li>Valida en un modelo conmutado (PLECS o PWM en código): compara formas de onda e impedancia.</li>\n<li>Si difieren salvo el rizado, el promediado es válido.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># conmutado: v_puente = +-Vdc/2 segun PWM; promediado: v_puente = (Vdc/2)*modulante\nv_sw  = np.where(m &gt; carrier(t), Vdc/2, -Vdc/2)\nv_avg = (Vdc/2)*m\n# tras el filtro LC, vc_sw ~= vc_avg + rizado pequeno\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Validez si \\( f_{sw}/f_{control}\\gtrsim 10 \\). En el proyecto: \\( f_{sw}=10\\,\\text{kHz} \\),\nrizado de \\( v_C \\) ≈ 2.5%, diferencia conmutado-promediado ≈ 0.67%.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Usar promediado cuando \\( f_{sw} \\) no separa escalas → el promediado oculta inestabilidades de\n  conmutación.</li>\n<li>Comparar conmutado y promediado sin filtrar el rizado y concluir que \"no coinciden\".</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: justificar el modelo): <code>switched.py</code> demostró que el\n  promediado captura la dinámica útil (dif. 0.67%). Todo el análisis se hizo con el promediado.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a> · <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Erickson, Maksimovic, <em>Fundamentals of Power Electronics</em>.</li>\n</ul>", "buscar": "modelo promediado vs conmutado definición el modelo promediado sustituye la tensión conmutada del puente por su valor medio en cada periodo de conmutación (la modulante × \\( v {dc}/2 \\)). el modelo conmutado simula los igbts y el pwm reales, con su rizado de alta frecuencia. fundamento teórico si la frecuencia de conmutación \\( f {sw} \\) es mucho mayor que el ancho de banda de control y que la dinámica del filtro, el promedio del puente reproduce la dinámica útil ; el filtro lcl atenúa el rizado de conmutación. el error entre conmutado y promediado es pequeño y de alta frecuencia. formalmente es state-space averaging : se promedia \\( \\dot x = f(x,u) \\) sobre el periodo de conmutación. cuándo y por qué se usa para diseñar y analizar (control, impedancia, estabilidad) se usa el promediado: es continuo, linealizable y rápido de simular. el conmutado se reserva para validar y para estudiar fenómenos de conmutación (rizado, pérdidas, emi). procedimiento de diseño (genérico) 1. diseña y analiza con el modelo promediado. 2. verifica que \\( f {sw} \\gg \\) (10×) el mayor ancho de banda de control. 3. valida en un modelo conmutado (plecs o pwm en código): compara formas de onda e impedancia. 4. si difieren salvo el rizado, el promediado es válido. ejemplo de código python conmutado: v puente = +-vdc/2 segun pwm; promediado: v puente = (vdc/2) modulante v sw = np.where(m carrier(t), vdc/2, -vdc/2) v avg = (vdc/2) m tras el filtro lc, vc sw ~= vc avg + rizado pequeno parámetros y valores típicos validez si \\( f {sw}/f {control}\\gtrsim 10 \\). en el proyecto: \\( f {sw}=10\\,\\text{khz} \\), rizado de \\( v c \\) ≈ 2.5%, diferencia conmutado-promediado ≈ 0.67%. errores comunes - usar promediado cuando \\( f {sw} \\) no separa escalas → el promediado oculta inestabilidades de conmutación. - comparar conmutado y promediado sin filtrar el rizado y concluir que \"no coinciden\". uso en proyectos - 01 - gfm-impedance (objetivo: justificar el modelo): switched.py demostró que el promediado captura la dinámica útil (dif. 0.67%). todo el análisis se hizo con el promediado. conceptos relacionados - filtro-lcl · medicion-impedancia-inyeccion · marco-dq referencias - erickson, maksimovic, fundamentals of power electronics . averaging pwm conmutado simulacion rizado"}, {"slug": "modulacion-pwm", "titulo": "Modulación por ancho de pulso (PWM)", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "basico", "proyectos": [], "objetivos": ["entender como un convertidor sintetiza una tension media conmutando"], "tags": ["PWM", "ciclo-de-trabajo", "conmutacion", "modulacion", "basico"], "relacionados": ["modelo-promediado", "topologias-multinivel", "control-vectorial"], "referencias": ["Mohan, Undeland, Robbins, Power Electronics, Wiley"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Técnica para que un convertidor genere una <strong>tensión media</strong> deseada <strong>conmutando</strong> sus\ninterruptores entre niveles fijos (p.ej. \\( +V_{dc} \\) y \\( 0 \\)). Variando la fracción de tiempo\nque está en cada nivel se controla el valor medio.</p>\n<h2>Fundamento teórico</h2>\n<p>El <strong>ciclo de trabajo</strong> \\( d \\) (entre 0 y 1) es la fracción del periodo de conmutación en que el\ninterruptor está cerrado. La tensión <strong>media</strong> en un periodo es:\n$$ \\bar{v} = d\\,V_{dc} $$\nComparando una señal <strong>moduladora</strong> \\( m(t) \\) (la referencia, p.ej. una senoide) con una\n<strong>portadora</strong> triangular a frecuencia \\( f_{sw} \\) se generan los pulsos: cuando \\( m>\\text{portadora} \\),\nel interruptor conduce. Así, el valor medio sigue a la moduladora. La conmutación introduce\n<strong>armónicos</strong> alrededor de \\( f_{sw} \\) y sus múltiplos, que el filtro atenúa. Esto justifica el\n<a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a>: para frecuencias muy por debajo de \\( f_{sw} \\), el convertidor se comporta\ncomo si aplicara \\( \\bar{v}=d\\,V_{dc} \\) de forma continua.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En prácticamente todos los convertidores (inversores, DC-DC, rectificadores activos): es el modo\nde imponer la tensión que pide el control con bajas pérdidas.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>El control calcula la tensión de referencia (moduladora).</li>\n<li>Se normaliza por \\( V_{dc} \\) para obtener el ciclo de trabajo / índice de modulación.</li>\n<li>Se compara con la portadora (\\( f_{sw} \\)) para generar los pulsos de disparo.</li>\n<li>El filtro de salida atenúa los armónicos de conmutación.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSC trifásico con \\( V_{dc}=700\\,\\text{V} \\) inyectando en red de 400 V (LL, RMS). Verificar que el modulador opera en zona lineal a plena potencia y calcular el margen de reserva.</p>\n<p>Tensión de fase pico de red: \\( \\hat V_f=400\\sqrt{2}/\\sqrt{3}\\approx327\\,\\text{V} \\). Índice de modulación: \\( m_a=\\hat V_f/(V_{dc}/2)=327/350\\approx0.934<1 \\): zona lineal (\\(\\checkmark\\)). Reserva para inyectar reactiva: con \\( Q_{max} \\) el vector de referencia crece a \\( |\\hat V_{ref}|=\\sqrt{327^2+V_q^2} \\). Margen disponible: la referencia puede crecer hasta \\( V_{dc}/2=350\\,\\text{V} \\), es decir, un \\( 7\\,\\% \\) más antes de salir de la zona lineal. Para mantener margen del 10 % ante variaciones de red: \\( V_{dc,min}=2\\times327/0.90\\approx727\\,\\text{V} \\).</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\ndef pwm(t, m, fsw):\n    tri = 2*np.abs(2*((t*fsw) % 1) - 1) - 1     # portadora triangular [-1,1]\n    return np.where(m &gt; tri, 1.0, 0.0)          # estado del interruptor\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( f_{sw} \\) de unos kHz a decenas de kHz. Índice de modulación lineal \\( \\le 1 \\) (por encima,\nsobremodulación). Regla: ancho de banda de control \\( < f_{sw}/10 \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Sobremodular (índice &gt; 1) sin querer → distorsión y pérdida de control lineal.</li>\n<li>Pedir un ancho de banda de control demasiado cerca de \\( f_{sw} \\).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a> · <a class=\"wl\" data-slug=\"topologias-multinivel\">topologias-multinivel</a> · <a class=\"wl\" data-slug=\"control-vectorial\">control-vectorial</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Mohan, Undeland, Robbins, <em>Power Electronics</em>, Wiley.</li>\n</ul>", "buscar": "modulación por ancho de pulso (pwm) definición técnica para que un convertidor genere una tensión media deseada conmutando sus interruptores entre niveles fijos (p.ej. \\( +v {dc} \\) y \\( 0 \\)). variando la fracción de tiempo que está en cada nivel se controla el valor medio. fundamento teórico el ciclo de trabajo \\( d \\) (entre 0 y 1) es la fracción del periodo de conmutación en que el interruptor está cerrado. la tensión media en un periodo es: \\bar{v} = d\\,v {dc} comparando una señal moduladora \\( m(t) \\) (la referencia, p.ej. una senoide) con una portadora triangular a frecuencia \\( f {sw} \\) se generan los pulsos: cuando \\( m \\text{portadora} \\), el interruptor conduce. así, el valor medio sigue a la moduladora. la conmutación introduce armónicos alrededor de \\( f {sw} \\) y sus múltiplos, que el filtro atenúa. esto justifica el modelo-promediado : para frecuencias muy por debajo de \\( f {sw} \\), el convertidor se comporta como si aplicara \\( \\bar{v}=d\\,v {dc} \\) de forma continua. cuándo y por qué se usa en prácticamente todos los convertidores (inversores, dc-dc, rectificadores activos): es el modo de imponer la tensión que pide el control con bajas pérdidas. procedimiento (genérico) 1. el control calcula la tensión de referencia (moduladora). 2. se normaliza por \\( v {dc} \\) para obtener el ciclo de trabajo / índice de modulación. 3. se compara con la portadora (\\( f {sw} \\)) para generar los pulsos de disparo. 4. el filtro de salida atenúa los armónicos de conmutación. ejemplo de aplicación real problema: vsc trifásico con \\( v {dc}=700\\,\\text{v} \\) inyectando en red de 400 v (ll, rms). verificar que el modulador opera en zona lineal a plena potencia y calcular el margen de reserva. tensión de fase pico de red: \\( \\hat v f=400\\sqrt{2}/\\sqrt{3}\\approx327\\,\\text{v} \\). índice de modulación: \\( m a=\\hat v f/(v {dc}/2)=327/350\\approx0.934<1 \\): zona lineal (\\(\\checkmark\\)). reserva para inyectar reactiva: con \\( q {max} \\) el vector de referencia crece a \\( |\\hat v {ref}|=\\sqrt{327^2+v q^2} \\). margen disponible: la referencia puede crecer hasta \\( v {dc}/2=350\\,\\text{v} \\), es decir, un \\( 7\\,\\% \\) más antes de salir de la zona lineal. para mantener margen del 10 % ante variaciones de red: \\( v {dc,min}=2\\times327/0.90\\approx727\\,\\text{v} \\). ejemplo de código python import numpy as np def pwm(t, m, fsw): tri = 2 np.abs(2 ((t fsw) % 1) - 1) - 1 portadora triangular -1,1 return np.where(m tri, 1.0, 0.0) estado del interruptor parámetros y valores típicos \\( f {sw} \\) de unos khz a decenas de khz. índice de modulación lineal \\( \\le 1 \\) (por encima, sobremodulación). regla: ancho de banda de control \\( < f {sw}/10 \\). errores comunes - sobremodular (índice 1) sin querer → distorsión y pérdida de control lineal. - pedir un ancho de banda de control demasiado cerca de \\( f {sw} \\). conceptos relacionados - modelo-promediado · topologias-multinivel · control-vectorial referencias - mohan, undeland, robbins, power electronics , wiley. pwm ciclo-de-trabajo conmutacion modulacion basico"}, {"slug": "potencia-ac-fasores", "titulo": "Potencia en AC y fasores (P, Q, S)", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "basico", "proyectos": [], "objetivos": ["entender potencia activa", "reactiva y aparente", "y el uso de fasores"], "tags": ["potencia", "activa", "reactiva", "aparente", "fasores", "RMS", "basico"], "relacionados": ["potencia-instantanea-dq", "marco-dq", "droop-control"], "referencias": ["Irwin, Análisis Básico de Circuitos en Ingeniería"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>En corriente alterna senoidal, la potencia se descompone en <strong>activa</strong> \\( P \\) (la que hace\ntrabajo útil, en W), <strong>reactiva</strong> \\( Q \\) (la que oscila entre fuente y campos, en var) y\n<strong>aparente</strong> \\( S \\) (el producto de tensión y corriente eficaces, en VA). Los <strong>fasores</strong>\nrepresentan magnitudes senoidales como números complejos para operar con ellas fácilmente.</p>\n<h2>Fundamento teórico</h2>\n<p>Un fasor codifica amplitud y fase: \\( v(t)=\\hat V\\cos(\\omega t+\\theta)\\to \\bar V=\\tfrac{\\hat V}{\\sqrt2}\\,e^{j\\theta} \\)\n(valor <strong>eficaz/RMS</strong> \\( =\\hat V/\\sqrt2 \\)). Con tensión y corriente eficaces \\( V, I \\) y desfase\n\\( \\varphi \\) entre ellas:\n$$ P = VI\\cos\\varphi, \\qquad Q = VI\\sin\\varphi, \\qquad S = VI = \\sqrt{P^2+Q^2} $$\nLa <strong>potencia compleja</strong> es \\( \\bar S = \\bar V\\,\\bar I^{*} = P + jQ \\). El <strong>factor de potencia</strong>\nes \\( \\cos\\varphi = P/S \\). Una carga inductiva absorbe \\( Q>0 \\); una capacitiva, \\( Q<0 \\).\nEn trifásico equilibrado, \\( P=3\\,V_{fase}I_{fase}\\cos\\varphi=\\sqrt3\\,V_{LL}I_L\\cos\\varphi \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Es la base del análisis de sistemas de potencia: dimensionar equipos (por \\( S \\)), compensar\nreactiva, y formular el control (el droop reparte \\( P \\) y \\( Q \\); ver\n<a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a> para la versión instantánea en dq).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Expresa tensiones y corrientes como fasores (eficaces).</li>\n<li>Calcula \\( \\bar S=\\bar V\\bar I^{*} \\); separa \\( P=\\mathrm{Re}\\,\\bar S \\), \\( Q=\\mathrm{Im}\\,\\bar S \\).</li>\n<li>Obtén \\( S=|\\bar S| \\) y el factor de potencia \\( P/S \\).</li>\n<li>Para trifásico, multiplica por 3 (por fase) o usa la fórmula de línea.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Carga industrial trifásica de \\( P=10\\,\\text{kW} \\), \\( \\cos\\phi=0.85\\,\\text{retraso} \\), \\( V_{LL}=400\\,\\text{V} \\). Calcular la corriente de línea y la capacitancia de compensación para elevar el fp a 0.98.</p>\n<p>Corriente: \\( I=P/(\\sqrt{3}\\,V_{LL}\\cos\\phi)=10000/(\\sqrt{3}\\times400\\times0.85)\\approx17.0\\,\\text{A} \\). Reactiva actual: \\( Q_1=P\\tan\\phi_1=10000\\times0.619\\approx6190\\,\\text{VAr} \\). Reactiva objetivo: \\( Q_2=P\\tan(\\arccos0.98)\\approx2020\\,\\text{VAr} \\). A compensar: \\( Q_C=Q_1-Q_2=4170\\,\\text{VAr} \\). Capacitancia (monofásica por fase): \\( C=Q_C/(\\omega\\,V_f^2)=4170/(314\\times231^2)\\approx249\\,\\mu\\text{F} \\). La corriente baja de 17.0 a \\( 10000/(\\sqrt{3}\\times400\\times0.98)\\approx14.7\\,\\text{A} \\): ahorro del 13 % en pérdidas Joule.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\nV = 230*np.exp(1j*0); I = 10*np.exp(-1j*np.deg2rad(30))   # fasores eficaces\nS = V*np.conj(I); P, Q = S.real, S.imag; FP = P/abs(S)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Factor de potencia objetivo cercano a 1. Convenio de signo de \\( Q \\): positivo = inductivo\n(absorbe reactiva).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mezclar valores de pico y eficaces (RMS) en las fórmulas de potencia.</li>\n<li>Olvidar el factor \\( \\sqrt3 \\) o el 3 en trifásico.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"droop-control\">droop-control</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Irwin, <em>Análisis Básico de Circuitos en Ingeniería</em>.</li>\n</ul>", "buscar": "potencia en ac y fasores (p, q, s) definición en corriente alterna senoidal, la potencia se descompone en activa \\( p \\) (la que hace trabajo útil, en w), reactiva \\( q \\) (la que oscila entre fuente y campos, en var) y aparente \\( s \\) (el producto de tensión y corriente eficaces, en va). los fasores representan magnitudes senoidales como números complejos para operar con ellas fácilmente. fundamento teórico un fasor codifica amplitud y fase: \\( v(t)=\\hat v\\cos(\\omega t+\\theta)\\to \\bar v=\\tfrac{\\hat v}{\\sqrt2}\\,e^{j\\theta} \\) (valor eficaz/rms \\( =\\hat v/\\sqrt2 \\)). con tensión y corriente eficaces \\( v, i \\) y desfase \\( \\varphi \\) entre ellas: p = vi\\cos\\varphi, \\qquad q = vi\\sin\\varphi, \\qquad s = vi = \\sqrt{p^2+q^2} la potencia compleja es \\( \\bar s = \\bar v\\,\\bar i^{ } = p + jq \\). el factor de potencia es \\( \\cos\\varphi = p/s \\). una carga inductiva absorbe \\( q 0 \\); una capacitiva, \\( q<0 \\). en trifásico equilibrado, \\( p=3\\,v {fase}i {fase}\\cos\\varphi=\\sqrt3\\,v {ll}i l\\cos\\varphi \\). cuándo y por qué se usa es la base del análisis de sistemas de potencia: dimensionar equipos (por \\( s \\)), compensar reactiva, y formular el control (el droop reparte \\( p \\) y \\( q \\); ver potencia-instantanea-dq para la versión instantánea en dq). procedimiento (genérico) 1. expresa tensiones y corrientes como fasores (eficaces). 2. calcula \\( \\bar s=\\bar v\\bar i^{ } \\); separa \\( p=\\mathrm{re}\\,\\bar s \\), \\( q=\\mathrm{im}\\,\\bar s \\). 3. obtén \\( s=|\\bar s| \\) y el factor de potencia \\( p/s \\). 4. para trifásico, multiplica por 3 (por fase) o usa la fórmula de línea. ejemplo de aplicación real problema: carga industrial trifásica de \\( p=10\\,\\text{kw} \\), \\( \\cos\\phi=0.85\\,\\text{retraso} \\), \\( v {ll}=400\\,\\text{v} \\). calcular la corriente de línea y la capacitancia de compensación para elevar el fp a 0.98. corriente: \\( i=p/(\\sqrt{3}\\,v {ll}\\cos\\phi)=10000/(\\sqrt{3}\\times400\\times0.85)\\approx17.0\\,\\text{a} \\). reactiva actual: \\( q 1=p\\tan\\phi 1=10000\\times0.619\\approx6190\\,\\text{var} \\). reactiva objetivo: \\( q 2=p\\tan(\\arccos0.98)\\approx2020\\,\\text{var} \\). a compensar: \\( q c=q 1-q 2=4170\\,\\text{var} \\). capacitancia (monofásica por fase): \\( c=q c/(\\omega\\,v f^2)=4170/(314\\times231^2)\\approx249\\,\\mu\\text{f} \\). la corriente baja de 17.0 a \\( 10000/(\\sqrt{3}\\times400\\times0.98)\\approx14.7\\,\\text{a} \\): ahorro del 13 % en pérdidas joule. ejemplo de código python import numpy as np v = 230 np.exp(1j 0); i = 10 np.exp(-1j np.deg2rad(30)) fasores eficaces s = v np.conj(i); p, q = s.real, s.imag; fp = p/abs(s) parámetros y valores típicos factor de potencia objetivo cercano a 1. convenio de signo de \\( q \\): positivo = inductivo (absorbe reactiva). errores comunes - mezclar valores de pico y eficaces (rms) en las fórmulas de potencia. - olvidar el factor \\( \\sqrt3 \\) o el 3 en trifásico. conceptos relacionados - potencia-instantanea-dq · marco-dq · droop-control referencias - irwin, análisis básico de circuitos en ingeniería . potencia activa reactiva aparente fasores rms basico"}, {"slug": "potencia-instantanea-dq", "titulo": "Potencia instantánea en dq (P, Q)", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "basico", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["medir P y Q para el droop y el reparto de carga"], "tags": ["potencia", "activa", "reactiva", "dq", "medida"], "relacionados": ["marco-dq", "droop-control"], "referencias": ["Akagi et al., Instantaneous Power Theory, Wiley-IEEE 2007"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Cálculo de las potencias activa (P) y reactiva (Q) a partir de tensiones y corrientes en el\nmarco dq, sin necesidad de promediar sobre un periodo de red (medida \"instantánea\").</p>\n<h2>Fundamento teórico</h2>\n<p>Con convención de <strong>amplitud de pico de fase</strong>:\n$$ P=\\tfrac{3}{2}(v_d i_d + v_q i_q), \\qquad Q=\\tfrac{3}{2}(v_q i_d - v_d i_q) $$\n(Con convención de potencia invariante el factor 3/2 desaparece.) Si el eje d se alinea con la\ntensión (\\( v_q=0 \\)): \\( P=\\tfrac{3}{2}v_d i_d \\), \\( Q=-\\tfrac{3}{2}v_d i_q \\) → P↔\\( i_d \\),\nQ↔\\( i_q \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para el droop (que reacciona a P y Q), el reparto de carga y la supervisión. Se suele <strong>filtrar</strong>\n(paso-bajo) para eliminar el rizado de conmutación y los transitorios rápidos.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Elige el punto de medida (condensador, PCC) y el alineamiento del marco.</li>\n<li>Aplica las fórmulas con la convención coherente con tu transformada dq.</li>\n<li>Filtra P y Q (corte 5–20 Hz) para el droop.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSC con \\( V_d=325\\,\\text{V} \\), \\( V_q=0 \\) (marco orientado a la tensión). Calcular las referencias de corriente para inyectar \\( P^*=500\\,\\text{kW} \\) y absorber \\( Q^*=100\\,\\text{kVAr} \\) (inductivo).</p>\n<p>Con el marco orientado: \\( P=\\tfrac{3}{2}V_d i_d \\) y \\( Q=-\\tfrac{3}{2}V_d i_q \\). Despejando: \\( i_d^*=2P^*/(3V_d)=2\\times500000/(3\\times325)\\approx1026\\,\\text{A} \\); \\( i_q^*=-2Q^*/(3V_d)=-2\\times100000/(3\\times325)\\approx-205\\,\\text{A} \\) (negativo porque absorción inductiva exige corriente reactiva en fase −q). Estas son las referencias que el lazo de corriente en dq debe seguir. Verificación: \\( P_{real}=\\tfrac{3}{2}\\times325\\times1026\\approx500\\,\\text{kW} \\) ✓.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">P = 1.5*(vd*id + vq*iq)\nQ = 1.5*(vq*id - vd*iq)\ndPm = wf*(P - Pm); dQm = wf*(Q - Qm)   # filtrado para el droop\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Corte del filtro de potencia 5–20 Hz. Factor 3/2 con amplitud de pico.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mezclar la convención de la transformada con la de la potencia (factor 3/2).</li>\n<li>Signo de Q según convención (inductivo/capacitivo): verifícalo en el equilibrio.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: alimentar el droop): P,Q medidas en el condensador y\n  filtradas a 15 Hz alimentan el droop P-f/Q-V. Son 2 de los 15 estados (\\( P_m,Q_m \\)).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"droop-control\">droop-control</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Akagi et al., <em>Instantaneous Power Theory</em>, 2007.</li>\n</ul>", "buscar": "potencia instantánea en dq (p, q) definición cálculo de las potencias activa (p) y reactiva (q) a partir de tensiones y corrientes en el marco dq, sin necesidad de promediar sobre un periodo de red (medida \"instantánea\"). fundamento teórico con convención de amplitud de pico de fase : p=\\tfrac{3}{2}(v d i d + v q i q), \\qquad q=\\tfrac{3}{2}(v q i d - v d i q) (con convención de potencia invariante el factor 3/2 desaparece.) si el eje d se alinea con la tensión (\\( v q=0 \\)): \\( p=\\tfrac{3}{2}v d i d \\), \\( q=-\\tfrac{3}{2}v d i q \\) → p↔\\( i d \\), q↔\\( i q \\). cuándo y por qué se usa para el droop (que reacciona a p y q), el reparto de carga y la supervisión. se suele filtrar (paso-bajo) para eliminar el rizado de conmutación y los transitorios rápidos. procedimiento de diseño (genérico) 1. elige el punto de medida (condensador, pcc) y el alineamiento del marco. 2. aplica las fórmulas con la convención coherente con tu transformada dq. 3. filtra p y q (corte 5–20 hz) para el droop. ejemplo de aplicación real problema: vsc con \\( v d=325\\,\\text{v} \\), \\( v q=0 \\) (marco orientado a la tensión). calcular las referencias de corriente para inyectar \\( p^ =500\\,\\text{kw} \\) y absorber \\( q^ =100\\,\\text{kvar} \\) (inductivo). con el marco orientado: \\( p=\\tfrac{3}{2}v d i d \\) y \\( q=-\\tfrac{3}{2}v d i q \\). despejando: \\( i d^ =2p^ /(3v d)=2\\times500000/(3\\times325)\\approx1026\\,\\text{a} \\); \\( i q^ =-2q^ /(3v d)=-2\\times100000/(3\\times325)\\approx-205\\,\\text{a} \\) (negativo porque absorción inductiva exige corriente reactiva en fase −q). estas son las referencias que el lazo de corriente en dq debe seguir. verificación: \\( p {real}=\\tfrac{3}{2}\\times325\\times1026\\approx500\\,\\text{kw} \\) ✓. ejemplo de código python p = 1.5 (vd id + vq iq) q = 1.5 (vq id - vd iq) dpm = wf (p - pm); dqm = wf (q - qm) filtrado para el droop parámetros y valores típicos corte del filtro de potencia 5–20 hz. factor 3/2 con amplitud de pico. errores comunes - mezclar la convención de la transformada con la de la potencia (factor 3/2). - signo de q según convención (inductivo/capacitivo): verifícalo en el equilibrio. uso en proyectos - 01 - gfm-impedance (objetivo: alimentar el droop): p,q medidas en el condensador y filtradas a 15 hz alimentan el droop p-f/q-v. son 2 de los 15 estados (\\( p m,q m \\)). conceptos relacionados - marco-dq · droop-control referencias - akagi et al., instantaneous power theory , 2007. potencia activa reactiva dq medida"}, {"slug": "red-thevenin-scr", "titulo": "Red Thévenin, SCR y X/R", "categoria": "fisica-modelado", "tipo": "parametro", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["modelar la fortaleza de la red en el punto de conexion"], "tags": ["SCR", "X/R", "thevenin", "red-debil", "impedancia-red"], "relacionados": ["impedancia-salida-estabilidad", "grid-forming-vs-following"], "referencias": ["IEEE Std 1204; Kundur, Power System Stability and Control, 1994"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Modelo de la red vista desde el punto de conexión (PCC) como una fuente ideal detrás de una\nimpedancia serie \\( Z_{red}=R_g+jX_g \\). La <strong>fortaleza</strong> se cuantifica con el <strong>SCR</strong>\n(short-circuit ratio) y la naturaleza con la relación <strong>X/R</strong>.</p>\n<h2>Fundamento teórico</h2>\n<p>$$ \\mathrm{SCR}=\\frac{S_{cc}}{S_n}=\\frac{V_{ll}^2}{|Z_{red}|\\,S_n},\\qquad\n   \\frac{X}{R}=\\frac{X_g}{R_g} $$\nDado SCR y X/R: \\( |Z_{red}|=\\dfrac{V_{ll}^2}{\\mathrm{SCR}\\,S_n} \\),\n\\( R_g=\\dfrac{|Z_{red}|}{\\sqrt{1+(X/R)^2}} \\), \\( X_g=R_g\\,(X/R) \\), \\( L_g=X_g/\\omega_0 \\).\nEn dq, el inductor de red aporta acoplamiento cruzado \\( \\omega_0 L_g \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para evaluar la estabilidad del inversor según la fortaleza de la red (Fase 3). Red <strong>fuerte</strong>:\nSCR alto, \\( Z_{red} \\) baja. Red <strong>débil</strong>: SCR bajo, \\( Z_{red} \\) alta.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Define el rango de SCR de interés (p.ej. 1–20) y el X/R (2–10 en transmisión).</li>\n<li>Convierte (SCR, X/R) → \\( R_g, L_g \\) con las fórmulas de arriba.</li>\n<li>Úsalo como impedancia de red en el criterio de impedancia o como inductor serie en el modelo\n   acoplado (en serie con \\( L_2 \\)).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def grid_params(scr, xr, Vll, Sn, w0):\n    Z = Vll**2/(scr*Sn)\n    Rg = Z/np.sqrt(1+xr**2); Lg = Rg*xr/w0\n    return Rg, Lg\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>SCR: fuerte &gt;10, normal 3–10, débil &lt;3. X/R: 1 (distribución) a 10+ (transmisión).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Confundir SCR con la potencia de cortocircuito absoluta.</li>\n<li>Olvidar el término cruzado \\( \\omega_0 L_g \\) al pasar la red a dq.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: fortaleza de red): se barrió el SCR para hallar el crítico.\n  La red en serie con \\( L_2 \\) permitió validar el criterio de impedancia. En <code>grid.py</code>.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Kundur, 1994; IEEE Std 1204.</li>\n</ul>", "buscar": "red thévenin, scr y x/r definición modelo de la red vista desde el punto de conexión (pcc) como una fuente ideal detrás de una impedancia serie \\( z {red}=r g+jx g \\). la fortaleza se cuantifica con el scr (short-circuit ratio) y la naturaleza con la relación x/r . fundamento teórico \\mathrm{scr}=\\frac{s {cc}}{s n}=\\frac{v {ll}^2}{|z {red}|\\,s n},\\qquad \\frac{x}{r}=\\frac{x g}{r g} dado scr y x/r: \\( |z {red}|=\\dfrac{v {ll}^2}{\\mathrm{scr}\\,s n} \\), \\( r g=\\dfrac{|z {red}|}{\\sqrt{1+(x/r)^2}} \\), \\( x g=r g\\,(x/r) \\), \\( l g=x g/\\omega 0 \\). en dq, el inductor de red aporta acoplamiento cruzado \\( \\omega 0 l g \\). cuándo y por qué se usa para evaluar la estabilidad del inversor según la fortaleza de la red (fase 3). red fuerte : scr alto, \\( z {red} \\) baja. red débil : scr bajo, \\( z {red} \\) alta. procedimiento de diseño (genérico) 1. define el rango de scr de interés (p.ej. 1–20) y el x/r (2–10 en transmisión). 2. convierte (scr, x/r) → \\( r g, l g \\) con las fórmulas de arriba. 3. úsalo como impedancia de red en el criterio de impedancia o como inductor serie en el modelo acoplado (en serie con \\( l 2 \\)). ejemplo de código python def grid params(scr, xr, vll, sn, w0): z = vll 2/(scr sn) rg = z/np.sqrt(1+xr 2); lg = rg xr/w0 return rg, lg parámetros y valores típicos scr: fuerte 10, normal 3–10, débil <3. x/r: 1 (distribución) a 10+ (transmisión). errores comunes - confundir scr con la potencia de cortocircuito absoluta. - olvidar el término cruzado \\( \\omega 0 l g \\) al pasar la red a dq. uso en proyectos - 01 - gfm-impedance (objetivo: fortaleza de red): se barrió el scr para hallar el crítico. la red en serie con \\( l 2 \\) permitió validar el criterio de impedancia. en grid.py . conceptos relacionados - impedancia-salida-estabilidad · grid-forming-vs-following referencias - kundur, 1994; ieee std 1204. scr x/r thevenin red-debil impedancia-red"}, {"slug": "representacion-espacio-estados", "titulo": "Representación en espacio de estados", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance", "03-DataCenter-IA"], "objetivos": ["escribir el modelo como x'=Ax+Bu y analizar sus propiedades"], "tags": ["espacio-estados", "A-B-C-D", "controlabilidad", "observabilidad", "MIMO"], "relacionados": ["variables-estado", "modelado-sistemas", "asignacion-polos-lqr", "respuesta-frecuencia-ss", "linealizacion-teoria"], "referencias": ["Kailath, Linear Systems, Prentice Hall 1980"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Forma estándar de escribir un sistema dinámico lineal mediante sus variables de estado:\n$$ \\dot{\\mathbf{x}} = A\\,\\mathbf{x} + B\\,\\mathbf{u}, \\qquad \\mathbf{y} = C\\,\\mathbf{x} + D\\,\\mathbf{u} $$\nEs la base del análisis y diseño modernos, natural para sistemas MIMO y de orden alto.</p>\n<h2>Fundamento teórico</h2>\n<p>Significado de las matrices:\n- \\( A \\) (dinámica): sus <strong>autovalores son los polos</strong>; gobiernan estabilidad y modos.\n- \\( B \\) (entrada): cómo actúan las entradas sobre los estados.\n- \\( C \\) (salida): qué se mide.\n- \\( D \\) (transmisión directa): efecto entrada→salida instantáneo.</p>\n<p>Relación con la función de transferencia:\n$$ G(s) = C\\,(sI-A)^{-1}B + D $$\nDos propiedades estructurales clave:\n- <strong>Controlabilidad</strong>: ¿puede la entrada llevar el estado a cualquier valor? Matriz\n  \\( \\mathcal{C}=[B\\;AB\\;\\dots\\;A^{n-1}B] \\) de rango \\( n \\). Necesaria para asignar polos / LQR.\n- <strong>Observabilidad</strong>: ¿puede reconstruirse el estado a partir de la salida? Matriz\n  \\( \\mathcal{O}=[C;\\,CA;\\,\\dots;\\,CA^{n-1}] \\) de rango \\( n \\). Necesaria para el observador.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Es el lenguaje del control en estado (LQR, observadores) y del análisis modal. Permite tratar de\nforma unificada sistemas con muchos estados y varias entradas/salidas, como un convertidor.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Elige las variables de estado (ver <a class=\"wl\" data-slug=\"variables-estado\">variables-estado</a>).</li>\n<li>Escribe las ecuaciones en forma \\( \\dot{\\mathbf{x}}=A\\mathbf{x}+B\\mathbf{u} \\) (o lineliza si es no lineal).</li>\n<li>Define la salida \\( \\mathbf{y}=C\\mathbf{x}+D\\mathbf{u} \\).</li>\n<li>Comprueba controlabilidad y observabilidad antes de diseñar control/observador.</li>\n<li>Úsalo para polos (autovalores), impedancia (\\( G(s) \\)) o diseño en estado (ver <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a>).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np, control as ct\nsys = ct.ss(A, B, C, D)\nctrb_rank = np.linalg.matrix_rank(ct.ctrb(A, B))   # = n si es controlable\nobsv_rank = np.linalg.matrix_rank(ct.obsv(A, C))   # = n si es observable\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( n \\) = orden (nº de estados). En el proyecto GFM, \\( n=15 \\); GFL, \\( n=10 \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Diseñar realimentación de estado sin comprobar controlabilidad (puede no existir solución).</li>\n<li>Invertir \\( (sI-A) \\) explícitamente en vez de resolver el sistema (peor numéricamente).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: el modelo linealizado \\( (A,B,C,D) \\) se usa para polos (estabilidad) e impedancia\n  \\( G(s)=C(sI-A)^{-1}B+D \\). Ver <a class=\"wl\" data-slug=\"respuesta-frecuencia-ss\">respuesta-frecuencia-ss</a>.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"variables-estado\">variables-estado</a> · <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a> · <a class=\"wl\" data-slug=\"respuesta-frecuencia-ss\">respuesta-frecuencia-ss</a> · <a class=\"wl\" data-slug=\"linealizacion-teoria\">linealizacion-teoria</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Kailath, <em>Linear Systems</em>, 1980.</li>\n</ul>", "buscar": "representación en espacio de estados definición forma estándar de escribir un sistema dinámico lineal mediante sus variables de estado: \\dot{\\mathbf{x}} = a\\,\\mathbf{x} + b\\,\\mathbf{u}, \\qquad \\mathbf{y} = c\\,\\mathbf{x} + d\\,\\mathbf{u} es la base del análisis y diseño modernos, natural para sistemas mimo y de orden alto. fundamento teórico significado de las matrices: - \\( a \\) (dinámica): sus autovalores son los polos ; gobiernan estabilidad y modos. - \\( b \\) (entrada): cómo actúan las entradas sobre los estados. - \\( c \\) (salida): qué se mide. - \\( d \\) (transmisión directa): efecto entrada→salida instantáneo. relación con la función de transferencia: g(s) = c\\,(si-a)^{-1}b + d dos propiedades estructurales clave: - controlabilidad : ¿puede la entrada llevar el estado a cualquier valor? matriz \\( \\mathcal{c}= b\\;ab\\;\\dots\\;a^{n-1}b \\) de rango \\( n \\). necesaria para asignar polos / lqr. - observabilidad : ¿puede reconstruirse el estado a partir de la salida? matriz \\( \\mathcal{o}= c;\\,ca;\\,\\dots;\\,ca^{n-1} \\) de rango \\( n \\). necesaria para el observador. cuándo y por qué se usa es el lenguaje del control en estado (lqr, observadores) y del análisis modal. permite tratar de forma unificada sistemas con muchos estados y varias entradas/salidas, como un convertidor. procedimiento (genérico) 1. elige las variables de estado (ver variables-estado ). 2. escribe las ecuaciones en forma \\( \\dot{\\mathbf{x}}=a\\mathbf{x}+b\\mathbf{u} \\) (o lineliza si es no lineal). 3. define la salida \\( \\mathbf{y}=c\\mathbf{x}+d\\mathbf{u} \\). 4. comprueba controlabilidad y observabilidad antes de diseñar control/observador. 5. úsalo para polos (autovalores), impedancia (\\( g(s) \\)) o diseño en estado (ver asignacion-polos-lqr ). ejemplo de código python import numpy as np, control as ct sys = ct.ss(a, b, c, d) ctrb rank = np.linalg.matrix rank(ct.ctrb(a, b)) = n si es controlable obsv rank = np.linalg.matrix rank(ct.obsv(a, c)) = n si es observable parámetros y valores típicos \\( n \\) = orden (nº de estados). en el proyecto gfm, \\( n=15 \\); gfl, \\( n=10 \\). errores comunes - diseñar realimentación de estado sin comprobar controlabilidad (puede no existir solución). - invertir \\( (si-a) \\) explícitamente en vez de resolver el sistema (peor numéricamente). uso en proyectos - 01/02 : el modelo linealizado \\( (a,b,c,d) \\) se usa para polos (estabilidad) e impedancia \\( g(s)=c(si-a)^{-1}b+d \\). ver respuesta-frecuencia-ss . conceptos relacionados - variables-estado · asignacion-polos-lqr · respuesta-frecuencia-ss · linealizacion-teoria referencias - kailath, linear systems , 1980. espacio-estados a-b-c-d controlabilidad observabilidad mimo"}, {"slug": "sistema-por-unidad", "titulo": "Sistema por unidad (p.u.)", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "basico", "proyectos": [], "objetivos": ["normalizar magnitudes eléctricas para comparar y escalar sistemas"], "tags": ["por-unidad", "pu", "normalizacion", "base", "basico", "modelado"], "relacionados": ["red-thevenin-scr", "potencia-ac-fasores", "sistema-trifasico", "filtro-lcl"], "referencias": ["Kundur, Power System Stability and Control, McGraw-Hill 1994", "Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Sistema de normalización en el que cada magnitud se expresa como fracción de un <strong>valor base</strong>:\n\\( x_{pu}=x/x_{base} \\). Convierte voltios, amperios y ohmios en números adimensionales en torno\na 1.</p>\n<h2>Fundamento teórico</h2>\n<p>Se eligen <strong>dos</strong> bases independientes (típicamente \\( S_{base} \\) y \\( V_{base} \\)); el resto se\nderivan:\n$$ I_{base}=\\frac{S_{base}}{\\sqrt{3}\\,V_{base}},\\qquad\n   Z_{base}=\\frac{V_{base}^2}{S_{base}},\\qquad\n   \\omega_{base}=2\\pi f,\\ \\ L_{base}=\\frac{Z_{base}}{\\omega_{base}},\\ \\ C_{base}=\\frac{1}{\\omega_{base}Z_{base}} $$\nVentajas: los parámetros quedan en rangos conocidos (impedancias de transformador 0.05–0.15 p.u.),\nlas relaciones de transformación desaparecen y el modelo es <strong>escalable</strong> a cualquier potencia.\nPara cambiar de base: \\( Z_{pu}^{nuevo}=Z_{pu}^{viejo}\\frac{S_{base}^{nuevo}}{S_{base}^{viejo}}\n\\left(\\frac{V_{base}^{viejo}}{V_{base}^{nuevo}}\\right)^2 \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En modelado de convertidores y redes: facilita comparar equipos de distinta potencia, fija\ncondiciones de diseño (corriente nominal = 1 p.u.) y mejora el <strong>condicionamiento numérico</strong> de\nlos modelos de estado.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Elige \\( S_{base} \\) (potencia nominal del convertidor) y \\( V_{base} \\) (tensión nominal).</li>\n<li>Deriva \\( I_{base},Z_{base},L_{base},C_{base} \\).</li>\n<li>Divide cada parámetro físico por su base.</li>\n<li>Reporta resultados en p.u.; reconvierte a SI solo al final si hace falta.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Convertidor de 500 kVA/690 V conectado a transformador de 1 MVA/690 V con \\( Z_{cc}=10\\,\\%\\) en base propia. Expresar la impedancia del transformador en la base del convertidor.</p>\n<p>Bases del convertidor: \\( S_{b,c}=500\\,\\text{kVA} \\), \\( V_{b,c}=690\\,\\text{V} \\). Cambio de base: \\( Z_{pu}^{(c)}=Z_{pu}^{(t)}\\times(S_{b,c}/S_{b,t})\\times(V_{b,t}/V_{b,c})^2=0.10\\times(500/1000)\\times1=0.05\\,\\text{p.u.} \\). En la base del convertidor, el transformador equivale a solo el 5 % de impedancia. Si el reactor de filtro es 0.12 p.u. y la red equivalente 0.08 p.u. en la misma base, la impedancia total vista desde el convertidor es \\( Z_{total}=0.12+0.05+0.08=0.25\\,\\text{p.u.} \\) y la SCR es \\( 1/0.05=20 \\) (solo el transformador). Sin p.u., cada componente estaría en ohmios de su base propia y sumarlos directamente sería un error.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">Sb, Vb, f = 1e6, 690.0, 50.0          # 1 MVA, 690 V, 50 Hz\nIb = Sb/(3**0.5*Vb); Zb = Vb**2/Sb\nLb = Zb/(2*3.14159*f); Cb = 1/(2*3.14159*f*Zb)\nL_pu = 0.15e-3 / Lb                    # ej.: 0.15 mH a p.u.\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Impedancia de cortocircuito de transformador 0.05–0.15 p.u.; filtro de convertidor \\( L\\approx\n0.05\\text{–}0.15 \\) p.u., \\( C\\approx 0.05\\text{–}0.1 \\) p.u.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mezclar bases monofásicas y trifásicas (factor \\( \\sqrt3 \\) / 3).</li>\n<li>No reescalar al combinar equipos con bases distintas.</li>\n<li>Confundir base de pico y base RMS en las tensiones.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"red-thevenin-scr\">red-thevenin-scr</a> · <a class=\"wl\" data-slug=\"potencia-ac-fasores\">potencia-ac-fasores</a> · <a class=\"wl\" data-slug=\"sistema-trifasico\">sistema-trifasico</a> · <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Kundur, <em>Power System Stability and Control</em>, 1994.</li>\n<li>Yazdani, Iravani, 2010.</li>\n</ul>", "buscar": "sistema por unidad (p.u.) definición sistema de normalización en el que cada magnitud se expresa como fracción de un valor base : \\( x {pu}=x/x {base} \\). convierte voltios, amperios y ohmios en números adimensionales en torno a 1. fundamento teórico se eligen dos bases independientes (típicamente \\( s {base} \\) y \\( v {base} \\)); el resto se derivan: i {base}=\\frac{s {base}}{\\sqrt{3}\\,v {base}},\\qquad z {base}=\\frac{v {base}^2}{s {base}},\\qquad \\omega {base}=2\\pi f,\\ \\ l {base}=\\frac{z {base}}{\\omega {base}},\\ \\ c {base}=\\frac{1}{\\omega {base}z {base}} ventajas: los parámetros quedan en rangos conocidos (impedancias de transformador 0.05–0.15 p.u.), las relaciones de transformación desaparecen y el modelo es escalable a cualquier potencia. para cambiar de base: \\( z {pu}^{nuevo}=z {pu}^{viejo}\\frac{s {base}^{nuevo}}{s {base}^{viejo}} \\left(\\frac{v {base}^{viejo}}{v {base}^{nuevo}}\\right)^2 \\). cuándo y por qué se usa en modelado de convertidores y redes: facilita comparar equipos de distinta potencia, fija condiciones de diseño (corriente nominal = 1 p.u.) y mejora el condicionamiento numérico de los modelos de estado. procedimiento (genérico) 1. elige \\( s {base} \\) (potencia nominal del convertidor) y \\( v {base} \\) (tensión nominal). 2. deriva \\( i {base},z {base},l {base},c {base} \\). 3. divide cada parámetro físico por su base. 4. reporta resultados en p.u.; reconvierte a si solo al final si hace falta. ejemplo de aplicación real problema: convertidor de 500 kva/690 v conectado a transformador de 1 mva/690 v con \\( z {cc}=10\\,\\%\\) en base propia. expresar la impedancia del transformador en la base del convertidor. bases del convertidor: \\( s {b,c}=500\\,\\text{kva} \\), \\( v {b,c}=690\\,\\text{v} \\). cambio de base: \\( z {pu}^{(c)}=z {pu}^{(t)}\\times(s {b,c}/s {b,t})\\times(v {b,t}/v {b,c})^2=0.10\\times(500/1000)\\times1=0.05\\,\\text{p.u.} \\). en la base del convertidor, el transformador equivale a solo el 5 % de impedancia. si el reactor de filtro es 0.12 p.u. y la red equivalente 0.08 p.u. en la misma base, la impedancia total vista desde el convertidor es \\( z {total}=0.12+0.05+0.08=0.25\\,\\text{p.u.} \\) y la scr es \\( 1/0.05=20 \\) (solo el transformador). sin p.u., cada componente estaría en ohmios de su base propia y sumarlos directamente sería un error. ejemplo de código python sb, vb, f = 1e6, 690.0, 50.0 1 mva, 690 v, 50 hz ib = sb/(3 0.5 vb); zb = vb 2/sb lb = zb/(2 3.14159 f); cb = 1/(2 3.14159 f zb) l pu = 0.15e-3 / lb ej.: 0.15 mh a p.u. parámetros y valores típicos impedancia de cortocircuito de transformador 0.05–0.15 p.u.; filtro de convertidor \\( l\\approx 0.05\\text{–}0.15 \\) p.u., \\( c\\approx 0.05\\text{–}0.1 \\) p.u. errores comunes - mezclar bases monofásicas y trifásicas (factor \\( \\sqrt3 \\) / 3). - no reescalar al combinar equipos con bases distintas. - confundir base de pico y base rms en las tensiones. conceptos relacionados - red-thevenin-scr · potencia-ac-fasores · sistema-trifasico · filtro-lcl referencias - kundur, power system stability and control , 1994. - yazdani, iravani, 2010. por-unidad pu normalizacion base basico modelado"}, {"slug": "sistema-trifasico", "titulo": "Sistema trifásico equilibrado", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "basico", "proyectos": [], "objetivos": ["manejar tensiones y corrientes trifásicas y sus relaciones línea-fase"], "tags": ["trifasico", "equilibrado", "fasores", "linea-fase", "basico", "modelado"], "relacionados": ["potencia-ac-fasores", "marco-dq", "transformada-clarke", "sistema-por-unidad", "componentes-simetricas"], "referencias": ["Chapman, Máquinas Eléctricas, McGraw-Hill", "Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Sistema de tres tensiones senoidales de igual amplitud y frecuencia, <strong>desfasadas 120°</strong>. Si las\ncargas son iguales en las tres fases, el sistema es <strong>equilibrado</strong> y se reduce a un análisis\nmonofásico equivalente.</p>\n<h2>Fundamento teórico</h2>\n<p>$$ v_a=\\hat V\\cos\\omega t,\\quad v_b=\\hat V\\cos(\\omega t-120^\\circ),\\quad v_c=\\hat V\\cos(\\omega t+120^\\circ) $$\nEn equilibrio la suma instantánea es nula (\\( v_a+v_b+v_c=0 \\)) → no circula corriente por el\nneutro. Relaciones línea-fase:\n- <strong>Estrella (Y):</strong> \\( V_{LL}=\\sqrt3\\,V_{fase} \\), \\( I_{L}=I_{fase} \\).\n- <strong>Triángulo (Δ):</strong> \\( V_{LL}=V_{fase} \\), \\( I_{L}=\\sqrt3\\,I_{fase} \\).</p>\n<p>Potencia trifásica total (constante en equilibrio):\n$$ P=\\sqrt3\\,V_{LL}I_L\\cos\\varphi,\\qquad S=\\sqrt3\\,V_{LL}I_L $$\nLa potencia instantánea total es <strong>constante</strong> (no pulsa a \\( 2\\omega \\) como la monofásica), lo\nque motiva el control en <a class=\"wl\" data-slug=\"marco-dq\">dq</a>.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Es el marco de todo el sistema eléctrico de potencia y de los convertidores de red. Las tensiones\nnominales y los cálculos de potencia/corriente parten siempre de estas relaciones.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Identifica conexión (Y/Δ) y si hay neutro.</li>\n<li>Pasa a fasores y usa el <strong>equivalente monofásico</strong> (una fase) si está equilibrado.</li>\n<li>Aplica relaciones línea-fase para tensiones/corrientes.</li>\n<li>Para desequilibrio o falta, usa <a class=\"wl\" data-slug=\"componentes-simetricas\">componentes-simetricas</a>.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Parque eólico de \\( P=10\\,\\text{MW} \\) a \\( V_{LL}=33\\,\\text{kV} \\), \\( \\cos\\phi=0.95\\,\\text{retraso} \\). Calcular corriente de línea, potencia reactiva y tensión de fase pico para dimensionar el convertidor.</p>\n<p>Corriente de línea: \\( I_L=P/(\\sqrt{3}\\,V_{LL}\\cos\\phi)=10\\times10^6/(\\sqrt{3}\\times33000\\times0.95)\\approx184\\,\\text{A} \\). Potencia reactiva inductiva: \\( Q=P\\tan(\\arccos0.95)\\approx3.29\\,\\text{MVAr} \\). Potencia aparente: \\( S=P/\\cos\\phi\\approx10.53\\,\\text{MVA} \\). Tensión de fase pico (para diseñar la modulación del VSC): \\( \\hat V_f=33000\\sqrt{2}/\\sqrt{3}\\approx26.9\\,\\text{kV} \\). Con estos datos se dimensiona el condensador del bus DC y se fijan las referencias \\( i_d^*,i_q^* \\) del control.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\nVll = 690.0\nVf_pico = Vll*np.sqrt(2/3)             # pico de fase (amplitud)\nP = np.sqrt(3)*Vll*IL*np.cos(phi)      # potencia activa trifásica\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Tensiones de línea típicas en convertidores: 400 V, 690 V (BT); frecuencia 50/60 Hz. Convención de\namplitud de fase: \\( \\hat V_{fase}=V_{LL}\\sqrt{2/3} \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Confundir tensión de línea con tensión de fase (factor \\( \\sqrt3 \\)).</li>\n<li>Mezclar valores de pico y RMS.</li>\n<li>Suponer suma nula con cargas o red desequilibradas (entonces circula homopolar).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"potencia-ac-fasores\">potencia-ac-fasores</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"transformada-clarke\">transformada-clarke</a> · <a class=\"wl\" data-slug=\"sistema-por-unidad\">sistema-por-unidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Cha
