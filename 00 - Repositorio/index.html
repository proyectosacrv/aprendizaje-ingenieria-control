iar potencia AC↔DC de forma controlada y bidireccional:\nconexión a red de renovables, STATCOM, motores, HVDC (en cascada/multinivel). Su salida exige un\n<a class=\"wl\" data-slug=\"filtro-lcl\">filtro</a> para atenuar la conmutación.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Dimensiona \\( V_{dc} \\) (\\( >\\,2\\sqrt2 V_{LL}/\\sqrt3 / m_{max} \\) para no saturar la modulación).</li>\n<li>Elige frecuencia de conmutación \\( f_{sw} \\) y modulación (<a class=\"wl\" data-slug=\"modulacion-pwm\">modulacion-pwm</a>).</li>\n<li>Modela en promediado (ciclos de trabajo) y pasa a dq para el control.</li>\n<li>Diseña filtro de salida y lazos de corriente/tensión.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSC de 1 MVA conectado a red de 690 V (LL, RMS) a factor de potencia unidad. Calcular la tensión de DC mínima para modulación lineal y la corriente AC nominal.</p>\n<p>Tensión de fase pico: \\( \\hat V_{ac}=690\\sqrt{2}/\\sqrt{3}\\approx563\\,\\text{V} \\). Para índice de modulación máximo \\( m_{max}=0.95 \\): \\( V_{dc,min}=2\\hat V_{ac}/m_{max}=2\\times563/0.95\\approx1185\\,\\text{V} \\). Elección práctica: \\( V_{dc}=1.2\\,\\text{kV} \\) (\\( m\\approx0.94 \\), zona lineal). Corriente AC nominal: \\( I_{ac}=S/(\\sqrt{3}\\,V_{LL})=10^6/(\\sqrt{3}\\times690)\\approx836\\,\\text{A} \\). Con \\( fp=1 \\), toda la corriente es activa (\\( i_d^*\\approx836\\,\\text{A} \\), \\( i_q^*=0 \\)). Si la tensión de DC baja bajo 1.185 kV la modulación satura y el convertidor pierde control lineal de la tensión AC.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def vsc_avg(d_abc, vdc):                 # modelo promediado, fase-neutro\n    vN = d_abc*vdc                       # tensiones rama-N (d en [0,1])\n    return vN - vN.mean()                # quita modo común -&gt; fase-neutro\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( f_{sw} \\): 2–20 kHz (red), índice de modulación de diseño \\( m\\approx0.8\\text{–}0.95 \\), tiempo\nmuerto 1–3 µs, rizado de bus DC &lt; 1–2 %.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Elegir \\( V_{dc} \\) demasiado bajo → saturación de modulación y distorsión.</li>\n<li>Despreciar el tiempo muerto (introduce armónicos y caída de tensión).</li>\n<li>Usar el modelo promediado más allá de \\( f_{sw}/2 \\) (no captura la conmutación).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"modulacion-pwm\">modulacion-pwm</a> · <a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a> · <a class=\"wl\" data-slug=\"topologias-multinivel\">topologias-multinivel</a> · <a class=\"wl\" data-slug=\"filtro-lcl\">filtro-lcl</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Yazdani, Iravani, 2010.</li>\n<li>Mohan, Undeland, Robbins, <em>Power Electronics</em>.</li>\n</ul>", "buscar": "convertidor fuente de tensión (vsc, 2 niveles) definición convertidor con un bus dc de tensión (condensador) que sintetiza tensiones ac controladas mediante tres ramas de dos interruptores (igbt + diodo). es la topología base de inversores de red, accionamientos y convertidores back-to-back. fundamento teórico cada rama conecta su salida a \\( +v {dc} \\) o a \\( 0 \\) según el interruptor activo (los dos de una rama nunca conducen a la vez → tiempo muerto ). la tensión de fase media depende del ciclo de trabajo \\( d x\\in 0,1 \\): v {x,n}=d x\\,v {dc},\\qquad v {xn}=v {x,n}-\\tfrac13\\textstyle\\sum k v {k,n} el índice de modulación \\( m=\\hat v {fase}/(v {dc}/2) \\) llega a 1 en spwm lineal y a \\( 2/\\sqrt3\\approx1.15 \\) con inyección de 3º armónico / svpwm. del lado dc, balance de potencia: \\( v {dc}i {dc}=\\sum x v x i x \\). el modelo-promediado sustituye la conmutación por las \\( d x \\) continuas para análisis y control. cuándo y por qué se usa siempre que se necesite intercambiar potencia ac↔dc de forma controlada y bidireccional: conexión a red de renovables, statcom, motores, hvdc (en cascada/multinivel). su salida exige un filtro-lcl|filtro para atenuar la conmutación. procedimiento (genérico) 1. dimensiona \\( v {dc} \\) (\\( \\,2\\sqrt2 v {ll}/\\sqrt3 / m {max} \\) para no saturar la modulación). 2. elige frecuencia de conmutación \\( f {sw} \\) y modulación ( modulacion-pwm ). 3. modela en promediado (ciclos de trabajo) y pasa a dq para el control. 4. diseña filtro de salida y lazos de corriente/tensión. ejemplo de aplicación real problema: vsc de 1 mva conectado a red de 690 v (ll, rms) a factor de potencia unidad. calcular la tensión de dc mínima para modulación lineal y la corriente ac nominal. tensión de fase pico: \\( \\hat v {ac}=690\\sqrt{2}/\\sqrt{3}\\approx563\\,\\text{v} \\). para índice de modulación máximo \\( m {max}=0.95 \\): \\( v {dc,min}=2\\hat v {ac}/m {max}=2\\times563/0.95\\approx1185\\,\\text{v} \\). elección práctica: \\( v {dc}=1.2\\,\\text{kv} \\) (\\( m\\approx0.94 \\), zona lineal). corriente ac nominal: \\( i {ac}=s/(\\sqrt{3}\\,v {ll})=10^6/(\\sqrt{3}\\times690)\\approx836\\,\\text{a} \\). con \\( fp=1 \\), toda la corriente es activa (\\( i d^ \\approx836\\,\\text{a} \\), \\( i q^ =0 \\)). si la tensión de dc baja bajo 1.185 kv la modulación satura y el convertidor pierde control lineal de la tensión ac. ejemplo de código python def vsc avg(d abc, vdc): modelo promediado, fase-neutro vn = d abc vdc tensiones rama-n (d en 0,1 ) return vn - vn.mean() quita modo común - fase-neutro parámetros y valores típicos \\( f {sw} \\): 2–20 khz (red), índice de modulación de diseño \\( m\\approx0.8\\text{–}0.95 \\), tiempo muerto 1–3 µs, rizado de bus dc < 1–2 %. errores comunes - elegir \\( v {dc} \\) demasiado bajo → saturación de modulación y distorsión. - despreciar el tiempo muerto (introduce armónicos y caída de tensión). - usar el modelo promediado más allá de \\( f {sw}/2 \\) (no captura la conmutación). conceptos relacionados - modulacion-pwm · modelo-promediado · topologias-multinivel · filtro-lcl referencias - yazdani, iravani, 2010. - mohan, undeland, robbins, power electronics . vsc inversor dos-niveles igbt puente basico modelado"}, {"slug": "dinamica-bus-dc", "titulo": "Dinámica y dimensionado del bus DC", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["modelar y dimensionar el condensador del bus DC y su tensión"], "tags": ["bus-dc", "condensador", "balance-energia", "rizado", "hold-up", "intermedio", "modelado"], "relacionados": ["convertidor-vsc", "control-tension-bus-dc", "estabilidad-bus-dc-cpl", "carga-potencia-constante-cpl", "potencia-instantanea-dq"], "referencias": ["Mohan, Undeland, Robbins, Power Electronics, Wiley", "Yazdani, Iravani, Voltage-Sourced Converters in Power Systems, Wiley 2010"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Modelo del <strong>condensador del bus DC</strong> como elemento que integra el desbalance de corriente/potencia\nentre las dos etapas del convertidor, y reglas para <strong>dimensionarlo</strong> según rizado admisible y\nautonomía (<em>hold-up</em>).</p>\n<h2>Fundamento teórico</h2>\n<p>Por la corriente del condensador:\n$$ C\\frac{dv_{dc}}{dt}=i_{in}-i_{out} $$\no en energía \\( E=\\tfrac12 C v_{dc}^2 \\):\n$$ \\frac{dE}{dt}=P_{in}-P_{out} $$\nLa planta hacia la tensión es un <strong>integrador no lineal</strong> (de ahí controlar \\( v_{dc}^2 \\); ver\n<a class=\"wl\" data-slug=\"control-tension-bus-dc\">control-tension-bus-dc</a>).</p>\n<p><strong>Fuentes de rizado:</strong>\n- Monofásico: la potencia instantánea pulsa a \\( 2\\omega \\) → rizado de \\( v_{dc} \\) a 100/120 Hz\n  $$ \\Delta v_{dc}\\approx\\frac{P}{2\\omega\\,C\\,V_{dc}} $$\n- Trifásico equilibrado: la potencia es constante (<a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a>); el rizado dominante\n  viene de la <strong>conmutación</strong> (6·\\( f \\) en rectificadores, \\( f_{sw} \\) en VSC).</p>\n<p><strong>Dimensionado por autonomía (hold-up):</strong> ante pérdida de entrada, mantener \\( v_{dc}>V_{min} \\)\ndurante \\( t_h \\):\n$$ C\\ge\\frac{2 P\\, t_h}{V_{dc0}^2-V_{min}^2} $$</p>\n<p><strong>Estabilidad:</strong> una carga de potencia constante presenta <strong>impedancia incremental negativa</strong>\n\\( \\partial v/\\partial i<0 \\), que puede desestabilizar el bus (ver\n<a class=\"wl\" data-slug=\"carga-potencia-constante-cpl\">carga-potencia-constante-cpl</a>, <a class=\"wl\" data-slug=\"estabilidad-bus-dc-cpl\">estabilidad-bus-dc-cpl</a>).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para elegir \\( C \\) (rizado, autonomía, vida útil), modelar el lazo de tensión y analizar la\nestabilidad del bus frente a cargas CPL en microrredes DC y data centers.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Calcula el rizado dominante (\\( 2\\omega \\) en 1φ, conmutación en 3φ).</li>\n<li>Dimensiona \\( C \\) por el criterio más exigente (rizado <strong>o</strong> hold-up).</li>\n<li>Verifica corriente eficaz por el condensador (vida útil/térmica), no solo capacidad.</li>\n<li>Modela \\( v_{dc} \\) (o \\( v_{dc}^2 \\)) para el <a class=\"wl\" data-slug=\"control-tension-bus-dc\">lazo de tensión</a>.</li>\n<li>Comprueba estabilidad con la carga real (CPL → criterio de impedancia).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Bus DC de \\( V_{dc0}=700\\,\\text{V} \\), potencia 100 kW, rizado admisible &lt;1 %. Dimensionar \\( C \\) por rizado (sistema monofásico) y por hold-up de 20 ms (\\( V_{min}=600\\,\\text{V} \\)).</p>\n<p>Por rizado monofásico: \\( \\Delta v_{dc}=P/(2\\omega C V_{dc0})=100000/(2\\times314\\times C\\times700) \\). Para \\( \\Delta v_{dc}/V_{dc0}<0.01 \\): \\( C\\ge100000/(2\\times314\\times0.01\\times700^2)\\approx3.27\\,\\text{mF} \\). Por hold-up: \\( C\\ge2P\\,t_h/(V_{dc0}^2-V_{min}^2)=2\\times100000\\times0.02/(700^2-600^2)=4000/130000\\approx30.8\\,\\text{mF} \\). El criterio de hold-up es casi 10× más exigente. Se elige \\( C=33\\,\\text{mF} \\) con margen. La corriente RMS del condensador a 100 Hz se verifica con la hoja de datos (límite térmico del electrolítico): \\( I_{rms}=P/(2V_{dc0})\\approx71\\,\\text{A} \\) — seleccionar un componente con margen de corriente adecuado.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">P, Vdc0, Vmin, th = 100e3, 700.0, 600.0, 20e-3\nC_holdup = 2*P*th/(Vdc0**2 - Vmin**2)          # autonomia\nw = 2*3.1416*50; dV = 0.01*Vdc0\nC_ripple = P/(2*w*dV*Vdc0)                      # rizado 1-fase (&lt;1%)\nC = max(C_holdup, C_ripple)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Rizado \\( \\Delta v_{dc} \\) 1–2 % de \\( V_{dc} \\). Hold-up 10–20 ms (fuentes con PFC). Electrolíticos\nlimitados por corriente RMS y temperatura; film para alta fiabilidad.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Dimensionar solo por capacidad e ignorar la <strong>corriente eficaz</strong> (sobrecalienta el condensador).</li>\n<li>Olvidar el rizado de \\( 2\\omega \\) en sistemas monofásicos/desequilibrados.</li>\n<li>Asumir bus DC \"rígido\" cuando una carga CPL lo desestabiliza.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"convertidor-vsc\">convertidor-vsc</a> · <a class=\"wl\" data-slug=\"control-tension-bus-dc\">control-tension-bus-dc</a> · <a class=\"wl\" data-slug=\"estabilidad-bus-dc-cpl\">estabilidad-bus-dc-cpl</a> · <a class=\"wl\" data-slug=\"carga-potencia-constante-cpl\">carga-potencia-constante-cpl</a> · <a class=\"wl\" data-slug=\"potencia-instantanea-dq\">potencia-instantanea-dq</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Mohan, Undeland, Robbins, <em>Power Electronics</em>.</li>\n<li>Yazdani, Iravani, 2010.</li>\n</ul>", "buscar": "dinámica y dimensionado del bus dc definición modelo del condensador del bus dc como elemento que integra el desbalance de corriente/potencia entre las dos etapas del convertidor, y reglas para dimensionarlo según rizado admisible y autonomía ( hold-up ). fundamento teórico por la corriente del condensador: c\\frac{dv {dc}}{dt}=i {in}-i {out} o en energía \\( e=\\tfrac12 c v {dc}^2 \\): \\frac{de}{dt}=p {in}-p {out} la planta hacia la tensión es un integrador no lineal (de ahí controlar \\( v {dc}^2 \\); ver control-tension-bus-dc ). fuentes de rizado: - monofásico: la potencia instantánea pulsa a \\( 2\\omega \\) → rizado de \\( v {dc} \\) a 100/120 hz \\delta v {dc}\\approx\\frac{p}{2\\omega\\,c\\,v {dc}} - trifásico equilibrado: la potencia es constante ( potencia-instantanea-dq ); el rizado dominante viene de la conmutación (6·\\( f \\) en rectificadores, \\( f {sw} \\) en vsc). dimensionado por autonomía (hold-up): ante pérdida de entrada, mantener \\( v {dc} v {min} \\) durante \\( t h \\): c\\ge\\frac{2 p\\, t h}{v {dc0}^2-v {min}^2} estabilidad: una carga de potencia constante presenta impedancia incremental negativa \\( \\partial v/\\partial i<0 \\), que puede desestabilizar el bus (ver carga-potencia-constante-cpl , estabilidad-bus-dc-cpl ). cuándo y por qué se usa para elegir \\( c \\) (rizado, autonomía, vida útil), modelar el lazo de tensión y analizar la estabilidad del bus frente a cargas cpl en microrredes dc y data centers. procedimiento de diseño (genérico) 1. calcula el rizado dominante (\\( 2\\omega \\) en 1φ, conmutación en 3φ). 2. dimensiona \\( c \\) por el criterio más exigente (rizado o hold-up). 3. verifica corriente eficaz por el condensador (vida útil/térmica), no solo capacidad. 4. modela \\( v {dc} \\) (o \\( v {dc}^2 \\)) para el control-tension-bus-dc|lazo de tensión . 5. comprueba estabilidad con la carga real (cpl → criterio de impedancia). ejemplo de aplicación real problema: bus dc de \\( v {dc0}=700\\,\\text{v} \\), potencia 100 kw, rizado admisible <1 %. dimensionar \\( c \\) por rizado (sistema monofásico) y por hold-up de 20 ms (\\( v {min}=600\\,\\text{v} \\)). por rizado monofásico: \\( \\delta v {dc}=p/(2\\omega c v {dc0})=100000/(2\\times314\\times c\\times700) \\). para \\( \\delta v {dc}/v {dc0}<0.01 \\): \\( c\\ge100000/(2\\times314\\times0.01\\times700^2)\\approx3.27\\,\\text{mf} \\). por hold-up: \\( c\\ge2p\\,t h/(v {dc0}^2-v {min}^2)=2\\times100000\\times0.02/(700^2-600^2)=4000/130000\\approx30.8\\,\\text{mf} \\). el criterio de hold-up es casi 10× más exigente. se elige \\( c=33\\,\\text{mf} \\) con margen. la corriente rms del condensador a 100 hz se verifica con la hoja de datos (límite térmico del electrolítico): \\( i {rms}=p/(2v {dc0})\\approx71\\,\\text{a} \\) — seleccionar un componente con margen de corriente adecuado. ejemplo de código python p, vdc0, vmin, th = 100e3, 700.0, 600.0, 20e-3 c holdup = 2 p th/(vdc0 2 - vmin 2) autonomia w = 2 3.1416 50; dv = 0.01 vdc0 c ripple = p/(2 w dv vdc0) rizado 1-fase (<1%) c = max(c holdup, c ripple) parámetros y valores típicos rizado \\( \\delta v {dc} \\) 1–2 % de \\( v {dc} \\). hold-up 10–20 ms (fuentes con pfc). electrolíticos limitados por corriente rms y temperatura; film para alta fiabilidad. errores comunes - dimensionar solo por capacidad e ignorar la corriente eficaz (sobrecalienta el condensador). - olvidar el rizado de \\( 2\\omega \\) en sistemas monofásicos/desequilibrados. - asumir bus dc \"rígido\" cuando una carga cpl lo desestabiliza. conceptos relacionados - convertidor-vsc · control-tension-bus-dc · estabilidad-bus-dc-cpl · carga-potencia-constante-cpl · potencia-instantanea-dq referencias - mohan, undeland, robbins, power electronics . - yazdani, iravani, 2010. bus-dc condensador balance-energia rizado hold-up intermedio modelado"}, {"slug": "ecuacion-oscilacion", "titulo": "Ecuación de oscilación (swing equation)", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["describir la dinámica ángulo-frecuencia de una fuente síncrona"], "tags": ["swing", "inercia", "angulo", "frecuencia", "par-sincronizante", "intermedio", "modelado"], "relacionados": ["vsm-inercia", "droop-control", "grid-forming-vs-following", "potencia-ac-fasores", "red-thevenin-scr"], "referencias": ["Kundur, Power System Stability and Control, McGraw-Hill 1994", "Machowski, Bialek, Bumby, Power System Dynamics, Wiley 2008"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Ecuación que relaciona el <strong>desbalance de potencia</strong> de una máquina (o convertidor) síncrono con la\naceleración de su <strong>ángulo y frecuencia</strong>. Es el modelo electromecánico básico que gobierna la\nestabilidad transitoria y la respuesta de frecuencia, y la base de la <a class=\"wl\" data-slug=\"vsm-inercia\">inercia\nvirtual</a> y del <a class=\"wl\" data-slug=\"droop-control\">droop</a>.</p>\n<h2>Fundamento teórico</h2>\n<p>En por unidad, con <strong>constante de inercia</strong> \\( H \\) (energía cinética almacenada / potencia base,\nen s):\n$$ \\frac{2H}{\\omega_0}\\frac{d^2\\delta}{dt^2}=P_m-P_e-D\\,\\frac{\\Delta\\omega}{\\omega_0} $$\no en forma de estado con \\( \\Delta\\omega=\\dot\\delta \\):\n$$ 2H\\,\\frac{d\\Delta\\omega}{dt}=P_m-P_e-D\\,\\Delta\\omega,\\qquad \\frac{d\\delta}{dt}=\\omega_0\\,\\Delta\\omega $$\n- \\( P_m \\): potencia mecánica/de entrada; \\( P_e \\): potencia eléctrica entregada; \\( D \\):\n  amortiguamiento.\n- Para una fuente tras una reactancia \\( X \\) hacia una red \\( V_g\\angle 0 \\):\n  \\( P_e=\\dfrac{E V_g}{X}\\sin\\delta \\).</p>\n<p><strong>Linealizando</strong> en \\( \\delta_0 \\) aparece el modo electromecánico:\n$$ 2H\\,\\Delta\\ddot\\delta + D\\,\\Delta\\dot\\delta + \\omega_0 K_s\\,\\Delta\\delta=0,\\quad\n   K_s=\\frac{\\partial P_e}{\\partial\\delta}=\\frac{E V_g}{X}\\cos\\delta_0 $$\n$$ \\omega_{n}=\\sqrt{\\frac{\\omega_0 K_s}{2H}},\\qquad \\zeta=\\frac{D}{2}\\sqrt{\\frac{\\omega_0}{2H K_s}} $$\n\\( K_s \\) es el <strong>par/potencia sincronizante</strong>: si \\( K_s<0 \\) (p.ej. \\( \\delta_0>90^\\circ \\)) se\npierde el sincronismo. Menos inercia \\( H \\) → oscilaciones más rápidas; red débil (\\( X \\) grande,\nbajo <a class=\"wl\" data-slug=\"red-thevenin-scr\">SCR</a>) → \\( K_s \\) pequeño → modo lento y poco amortiguado.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para analizar estabilidad de frecuencia/ángulo, dimensionar inercia y droop, y entender por qué los\nconvertidores grid-forming (VSM) emulan esta ecuación. Conecta el lazo de potencia con la dinámica\nde red.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Plantea \\( P_e(\\delta) \\) con la reactancia equivalente a la red.</li>\n<li>Halla el punto de equilibrio \\( \\delta_0 \\) (\\( P_m=P_e \\)).</li>\n<li>Linealiza → \\( K_s \\), \\( \\omega_n \\), \\( \\zeta \\) del modo electromecánico.</li>\n<li>Ajusta \\( H \\) (inercia) y \\( D \\) (amortiguamiento) para el \\( \\omega_n,\\zeta \\) deseados.</li>\n<li>Verifica margen de ángulo (\\( \\delta_0 \\) lejos de 90°) y respuesta ante escalón de \\( P_m \\).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSM de 1 MVA con inercia emulada \\( H=4\\,\\text{s} \\), amortiguamiento \\( D=0.1 \\), conectado a red de \\( X=0.2\\,\\text{p.u.} \\) (SCR≈5) en el punto de operación \\( P_0=0.8\\,\\text{p.u.} \\). Calcular la frecuencia y amortiguamiento del modo electromecánico.</p>\n<p>Tensión interna \\( E=1.05\\,\\text{p.u.} \\), tensión de red \\( V_g=1.0\\,\\text{p.u.} \\). Punto de equilibrio: \\( \\delta_0=\\arcsin(P_0 X/(E V_g))=\\arcsin(0.8\\times0.2/1.05)\\approx8.8° \\). Par sincronizante: \\( K_s=(E V_g/X)\\cos\\delta_0=(1.05/0.2)\\cos8.8°\\approx5.19\\,\\text{p.u.} \\). Frecuencia del modo: \\( \\omega_n=\\sqrt{\\omega_0 K_s/(2H)}=\\sqrt{314\\times5.19/(8)}\\approx14.3\\,\\text{rad/s}\\approx2.3\\,\\text{Hz} \\). Amortiguamiento: \\( \\zeta=D\\omega_0/(4H\\omega_n)=0.1\\times314/(16\\times14.3)\\approx0.14 \\). El modo oscila a 2.3 Hz con pobre amortiguamiento — típico de microrredes insulares. Para subir \\( \\zeta \\) a 0.5: aumentar \\( D \\) a ~0.35 (droop de frecuencia más agresivo) o reducir \\( H \\) (pero baja la inercia).</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\ndef swing(t, x, Pm, E, Vg, X, H, D, w0):\n    delta, dw = x\n    Pe = E*Vg/X*np.sin(delta)\n    return [w0*dw, (Pm - Pe - D*dw)/(2*H)]\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Generadores: \\( H\\approx 2\\text{–}9 \\) s. VSM: \\( H \\) emulada 1–6 s. Modo electromecánico\n0.1–2 Hz. \\( \\delta_0 \\) de diseño &lt; 30–45°.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Operar con \\( \\delta_0 \\) cercano a 90° (poco par sincronizante, riesgo de pérdida de sincronismo).</li>\n<li>Despreciar \\( D \\): sin amortiguamiento el modo oscila indefinidamente.</li>\n<li>Usar el modelo lineal para transitorios grandes (la no linealidad \\( \\sin\\delta \\) domina).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a> · <a class=\"wl\" data-slug=\"droop-control\">droop-control</a> · <a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a> · <a class=\"wl\" data-slug=\"red-thevenin-scr\">red-thevenin-scr</a> · <a class=\"wl\" data-slug=\"potencia-ac-fasores\">potencia-ac-fasores</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Kundur, <em>Power System Stability and Control</em>, 1994.</li>\n<li>Machowski, Bialek, Bumby, <em>Power System Dynamics</em>, 2008.</li>\n</ul>", "buscar": "ecuación de oscilación (swing equation) definición ecuación que relaciona el desbalance de potencia de una máquina (o convertidor) síncrono con la aceleración de su ángulo y frecuencia . es el modelo electromecánico básico que gobierna la estabilidad transitoria y la respuesta de frecuencia, y la base de la vsm-inercia|inercia virtual y del droop-control|droop . fundamento teórico en por unidad, con constante de inercia \\( h \\) (energía cinética almacenada / potencia base, en s): \\frac{2h}{\\omega 0}\\frac{d^2\\delta}{dt^2}=p m-p e-d\\,\\frac{\\delta\\omega}{\\omega 0} o en forma de estado con \\( \\delta\\omega=\\dot\\delta \\): 2h\\,\\frac{d\\delta\\omega}{dt}=p m-p e-d\\,\\delta\\omega,\\qquad \\frac{d\\delta}{dt}=\\omega 0\\,\\delta\\omega - \\( p m \\): potencia mecánica/de entrada; \\( p e \\): potencia eléctrica entregada; \\( d \\): amortiguamiento. - para una fuente tras una reactancia \\( x \\) hacia una red \\( v g\\angle 0 \\): \\( p e=\\dfrac{e v g}{x}\\sin\\delta \\). linealizando en \\( \\delta 0 \\) aparece el modo electromecánico: 2h\\,\\delta\\ddot\\delta + d\\,\\delta\\dot\\delta + \\omega 0 k s\\,\\delta\\delta=0,\\quad k s=\\frac{\\partial p e}{\\partial\\delta}=\\frac{e v g}{x}\\cos\\delta 0 \\omega {n}=\\sqrt{\\frac{\\omega 0 k s}{2h}},\\qquad \\zeta=\\frac{d}{2}\\sqrt{\\frac{\\omega 0}{2h k s}} \\( k s \\) es el par/potencia sincronizante : si \\( k s<0 \\) (p.ej. \\( \\delta 0 90^\\circ \\)) se pierde el sincronismo. menos inercia \\( h \\) → oscilaciones más rápidas; red débil (\\( x \\) grande, bajo red-thevenin-scr|scr ) → \\( k s \\) pequeño → modo lento y poco amortiguado. cuándo y por qué se usa para analizar estabilidad de frecuencia/ángulo, dimensionar inercia y droop, y entender por qué los convertidores grid-forming (vsm) emulan esta ecuación. conecta el lazo de potencia con la dinámica de red. procedimiento de diseño (genérico) 1. plantea \\( p e(\\delta) \\) con la reactancia equivalente a la red. 2. halla el punto de equilibrio \\( \\delta 0 \\) (\\( p m=p e \\)). 3. linealiza → \\( k s \\), \\( \\omega n \\), \\( \\zeta \\) del modo electromecánico. 4. ajusta \\( h \\) (inercia) y \\( d \\) (amortiguamiento) para el \\( \\omega n,\\zeta \\) deseados. 5. verifica margen de ángulo (\\( \\delta 0 \\) lejos de 90°) y respuesta ante escalón de \\( p m \\). ejemplo de aplicación real problema: vsm de 1 mva con inercia emulada \\( h=4\\,\\text{s} \\), amortiguamiento \\( d=0.1 \\), conectado a red de \\( x=0.2\\,\\text{p.u.} \\) (scr≈5) en el punto de operación \\( p 0=0.8\\,\\text{p.u.} \\). calcular la frecuencia y amortiguamiento del modo electromecánico. tensión interna \\( e=1.05\\,\\text{p.u.} \\), tensión de red \\( v g=1.0\\,\\text{p.u.} \\). punto de equilibrio: \\( \\delta 0=\\arcsin(p 0 x/(e v g))=\\arcsin(0.8\\times0.2/1.05)\\approx8.8° \\). par sincronizante: \\( k s=(e v g/x)\\cos\\delta 0=(1.05/0.2)\\cos8.8°\\approx5.19\\,\\text{p.u.} \\). frecuencia del modo: \\( \\omega n=\\sqrt{\\omega 0 k s/(2h)}=\\sqrt{314\\times5.19/(8)}\\approx14.3\\,\\text{rad/s}\\approx2.3\\,\\text{hz} \\). amortiguamiento: \\( \\zeta=d\\omega 0/(4h\\omega n)=0.1\\times314/(16\\times14.3)\\approx0.14 \\). el modo oscila a 2.3 hz con pobre amortiguamiento — típico de microrredes insulares. para subir \\( \\zeta \\) a 0.5: aumentar \\( d \\) a ~0.35 (droop de frecuencia más agresivo) o reducir \\( h \\) (pero baja la inercia). ejemplo de código python import numpy as np def swing(t, x, pm, e, vg, x, h, d, w0): delta, dw = x pe = e vg/x np.sin(delta) return w0 dw, (pm - pe - d dw)/(2 h) parámetros y valores típicos generadores: \\( h\\approx 2\\text{–}9 \\) s. vsm: \\( h \\) emulada 1–6 s. modo electromecánico 0.1–2 hz. \\( \\delta 0 \\) de diseño < 30–45°. errores comunes - operar con \\( \\delta 0 \\) cercano a 90° (poco par sincronizante, riesgo de pérdida de sincronismo). - despreciar \\( d \\): sin amortiguamiento el modo oscila indefinidamente. - usar el modelo lineal para transitorios grandes (la no linealidad \\( \\sin\\delta \\) domina). conceptos relacionados - vsm-inercia · droop-control · grid-forming-vs-following · red-thevenin-scr · potencia-ac-fasores referencias - kundur, power system stability and control , 1994. - machowski, bialek, bumby, power system dynamics , 2008. swing inercia angulo frecuencia par-sincronizante intermedio modelado"}, {"slug": "eolica-mppt", "titulo": "Sistema eólico DFIG/PMSG y MPPT", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "avanzado", "proyectos": [], "objetivos": ["modelar la turbina eólica y extraer la máxima potencia según el viento"], "tags": ["eolica", "dfig", "pmsg", "mppt", "cp-lambda", "back-to-back", "tipo-3", "tipo-4", "avanzado"], "relacionados": ["generador-sincrono", "convertidor-vsc", "control-vectorial", "ecuacion-oscilacion", "servicios-red-soporte"], "referencias": ["Hansen, Aerodynamics of Wind Turbines, Earthscan 2008", "Abad et al., Doubly Fed Induction Machine, Wiley 2011", "Blaabjerg, Ma, Future on Power Electronics for Wind Turbine Systems, IEEE JESTPE 2013"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Modelos aerodinámico, mecánico y eléctrico de una turbina eólica con generador <strong>DFIG</strong> (Tipo-3,\ndoblemente alimentado) o <strong>PMSG</strong> (Tipo-4, velocidad variable full-converter), y los algoritmos\n<strong>MPPT</strong> para seguir la curva óptima de par/potencia en función de la velocidad del viento.</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Aerodinámica.</strong> La potencia extraíble del viento:\n$$ P=\\frac{1}{2}\\rho\\pi R^2 v_w^3\\,C_p(\\lambda,\\beta) $$\ncon \\( \\rho \\) densidad del aire, \\( R \\) radio, \\( v_w \\) velocidad del viento y \\( C_p \\) el\ncoeficiente de potencia (límite de Betz: 16/27 ≈ 0.593). \\( C_p \\) depende de la <strong>velocidad\nespecífica</strong> \\( \\lambda=\\omega_r R/v_w \\) y del ángulo de paso \\( \\beta \\). Existe un \\( \\lambda^* \\)\nóptimo que maximiza \\( C_p^{max} \\approx0.45\\text{–}0.50 \\).</p>\n<p><strong>MPPT:</strong> mantener \\( \\lambda=\\lambda^* \\) a viento variable ajustando la velocidad de giro:\n\\( \\omega_r^*=\\lambda^* v_w/R \\). Para evitar anemómetro, estrategia <strong>OTC</strong> (Optimal Torque\nControl): la curva óptima \\( T^*=k_{opt}\\omega_r^2 \\) (par ∝ cuadrado de velocidad), o\n<strong>Speed-mode</strong>: regular \\( \\omega_r \\) a la referencia calculada del viento medido.</p>\n<p><strong>Drivetrain (tren de transmisión).</strong> Modelo de dos masas (rotor aerodinámico + generador):\n$$ 2H_t\\dot\\omega_t=T_{aero}-K_{dt}\\theta_{tw}-D_{dt}(\\omega_t-\\omega_g)/\\omega_0 $$\n$$ 2H_g\\dot\\omega_g=K_{dt}\\theta_{tw}+D_{dt}(\\omega_t-\\omega_g)/\\omega_0-T_e $$\nEl modo de torsión del eje (1–3 Hz) puede excitar SSR con compensación serie (ver <a class=\"wl\" data-slug=\"oscilaciones-subsincronas\">oscilaciones-subsincronas</a>).</p>\n<p><strong>DFIG (Tipo-3).</strong> El rotor se alimenta por un convertidor back-to-back de potencia parcial\n(\\(\\sim30\\,\\%\\)). Control vectorial del rotor: eje d alineado con el flujo de estátor → desacopla\n\\( T_e \\) (por \\( i_{rq} \\)) y flujo/reactiva (por \\( i_{rd} \\)). El lado red del convertidor regula\nel bus DC y la reactiva de red. Opera ±30 % alrededor de la velocidad síncrona (rango de deslizamiento).</p>\n<p><strong>PMSG (Tipo-4).</strong> El generador (imanes permanentes, sin escobillas) se desacopla completamente de\nla red por un convertidor back-to-back de potencia total. Control vectorial del lado máquina: MPPT\nvía par; lado red: <a class=\"wl\" data-slug=\"control-tension-bus-dc\">regula bus DC y potencia reactiva</a>. Sin contribución\nde cortocircuito natural, pero el convertidor puede proveer <a class=\"wl\" data-slug=\"fault-ride-through\">FRT</a> controlado.</p>\n<p><strong>Regulación de paso (pitch).</strong> Por encima de velocidad nominal se reduce \\( \\beta \\) para limitar\n\\( P \\) a la potencia nominal (control de \\( \\beta \\) con PI sobre \\( P \\) o \\( \\omega_r \\)).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para modelar el comportamiento de un parque eólico en estudios de estabilidad, diseño de control\nde parque, servicios de frecuencia (<a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios-red-soporte</a>) y análisis de interacción con la red.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Parametriza la curva \\( C_p(\\lambda,\\beta) \\) del fabricante; halla \\( \\lambda^*,C_p^{max} \\).</li>\n<li>Implementa el drivetrain de dos masas y la referencia MPPT (\\( T^*=k_{opt}\\omega_r^2 \\)).</li>\n<li>Diseña el control vectorial del generador (DFIG o PMSG): lazos de par y flujo/reactiva.</li>\n<li>Diseña el lado red: bus DC (<a class=\"wl\" data-slug=\"control-tension-bus-dc\">control-tension-bus-dc</a>) y Q de red.</li>\n<li>Añade pitch control para viento &gt; nominal y protecciones de alta velocidad.</li>\n<li>Verifica FRT e inyección de reactiva según grid code.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def cp_lambda(lam, beta, cp_table):     # interpolacion de la tabla Cp(lambda,beta)\n    import scipy.interpolate as sp\n    return sp.interpn((lam_ax, beta_ax), cp_table, [lam, beta])[0]\n\ndef mppt_otc(wr, kopt):\n    return kopt * wr**2                 # par optimo sin anemometro\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( C_p^{max}\\approx0.45\\text{–}0.50 \\); \\( \\lambda^*\\approx6\\text{–}9 \\); \\( H_t\\approx3\\text{–}5 \\) s;\n\\( H_g\\approx0.5\\text{–}1 \\) s. DFIG: deslizamiento ±30 %, potencia convertidor ∼30 %. PMSG:\nconvertidor 100 %.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Modelar la turbina sin el drivetrain de dos masas → no captura el modo torsional (crítico para SSR).</li>\n<li>DFIG con control solo de lado rotor sin regular el bus DC → tensión DC no controlada.</li>\n<li>MPPT más rápido que el drivetrain → excita la resonancia torsional.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"generador-sincrono\">generador-sincrono</a> · <a class=\"wl\" data-slug=\"convertidor-vsc\">convertidor-vsc</a> · <a class=\"wl\" data-slug=\"control-vectorial\">control-vectorial</a> · <a class=\"wl\" data-slug=\"ecuacion-oscilacion\">ecuacion-oscilacion</a> · <a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios-red-soporte</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Hansen, <em>Aerodynamics of Wind Turbines</em>, Earthscan 2008.</li>\n<li>Abad et al., <em>Doubly Fed Induction Machine</em>, Wiley 2011.</li>\n<li>Blaabjerg, Ma, <em>Future on Power Electronics for Wind Turbine Systems</em>, IEEE JESTPE 2013.</li>\n</ul>", "buscar": "sistema eólico dfig/pmsg y mppt definición modelos aerodinámico, mecánico y eléctrico de una turbina eólica con generador dfig (tipo-3, doblemente alimentado) o pmsg (tipo-4, velocidad variable full-converter), y los algoritmos mppt para seguir la curva óptima de par/potencia en función de la velocidad del viento. fundamento teórico aerodinámica. la potencia extraíble del viento: p=\\frac{1}{2}\\rho\\pi r^2 v w^3\\,c p(\\lambda,\\beta) con \\( \\rho \\) densidad del aire, \\( r \\) radio, \\( v w \\) velocidad del viento y \\( c p \\) el coeficiente de potencia (límite de betz: 16/27 ≈ 0.593). \\( c p \\) depende de la velocidad específica \\( \\lambda=\\omega r r/v w \\) y del ángulo de paso \\( \\beta \\). existe un \\( \\lambda^ \\) óptimo que maximiza \\( c p^{max} \\approx0.45\\text{–}0.50 \\). mppt: mantener \\( \\lambda=\\lambda^ \\) a viento variable ajustando la velocidad de giro: \\( \\omega r^ =\\lambda^ v w/r \\). para evitar anemómetro, estrategia otc (optimal torque control): la curva óptima \\( t^ =k {opt}\\omega r^2 \\) (par ∝ cuadrado de velocidad), o speed-mode : regular \\( \\omega r \\) a la referencia calculada del viento medido. drivetrain (tren de transmisión). modelo de dos masas (rotor aerodinámico + generador): 2h t\\dot\\omega t=t {aero}-k {dt}\\theta {tw}-d {dt}(\\omega t-\\omega g)/\\omega 0 2h g\\dot\\omega g=k {dt}\\theta {tw}+d {dt}(\\omega t-\\omega g)/\\omega 0-t e el modo de torsión del eje (1–3 hz) puede excitar ssr con compensación serie (ver oscilaciones-subsincronas ). dfig (tipo-3). el rotor se alimenta por un convertidor back-to-back de potencia parcial (\\(\\sim30\\,\\%\\)). control vectorial del rotor: eje d alineado con el flujo de estátor → desacopla \\( t e \\) (por \\( i {rq} \\)) y flujo/reactiva (por \\( i {rd} \\)). el lado red del convertidor regula el bus dc y la reactiva de red. opera ±30 % alrededor de la velocidad síncrona (rango de deslizamiento). pmsg (tipo-4). el generador (imanes permanentes, sin escobillas) se desacopla completamente de la red por un convertidor back-to-back de potencia total. control vectorial del lado máquina: mppt vía par; lado red: control-tension-bus-dc|regula bus dc y potencia reactiva . sin contribución de cortocircuito natural, pero el convertidor puede proveer fault-ride-through|frt controlado. regulación de paso (pitch). por encima de velocidad nominal se reduce \\( \\beta \\) para limitar \\( p \\) a la potencia nominal (control de \\( \\beta \\) con pi sobre \\( p \\) o \\( \\omega r \\)). cuándo y por qué se usa para modelar el comportamiento de un parque eólico en estudios de estabilidad, diseño de control de parque, servicios de frecuencia ( servicios-red-soporte ) y análisis de interacción con la red. procedimiento de diseño (genérico) 1. parametriza la curva \\( c p(\\lambda,\\beta) \\) del fabricante; halla \\( \\lambda^ ,c p^{max} \\). 2. implementa el drivetrain de dos masas y la referencia mppt (\\( t^ =k {opt}\\omega r^2 \\)). 3. diseña el control vectorial del generador (dfig o pmsg): lazos de par y flujo/reactiva. 4. diseña el lado red: bus dc ( control-tension-bus-dc ) y q de red. 5. añade pitch control para viento nominal y protecciones de alta velocidad. 6. verifica frt e inyección de reactiva según grid code. ejemplo de código python def cp lambda(lam, beta, cp table): interpolacion de la tabla cp(lambda,beta) import scipy.interpolate as sp return sp.interpn((lam ax, beta ax), cp table, lam, beta ) 0 def mppt otc(wr, kopt): return kopt wr 2 par optimo sin anemometro parámetros y valores típicos \\( c p^{max}\\approx0.45\\text{–}0.50 \\); \\( \\lambda^ \\approx6\\text{–}9 \\); \\( h t\\approx3\\text{–}5 \\) s; \\( h g\\approx0.5\\text{–}1 \\) s. dfig: deslizamiento ±30 %, potencia convertidor ∼30 %. pmsg: convertidor 100 %. errores comunes - modelar la turbina sin el drivetrain de dos masas → no captura el modo torsional (crítico para ssr). - dfig con control solo de lado rotor sin regular el bus dc → tensión dc no controlada. - mppt más rápido que el drivetrain → excita la resonancia torsional. conceptos relacionados - generador-sincrono · convertidor-vsc · control-vectorial · ecuacion-oscilacion · servicios-red-soporte referencias - hansen, aerodynamics of wind turbines , earthscan 2008. - abad et al., doubly fed induction machine , wiley 2011. - blaabjerg, ma, future on power electronics for wind turbine systems , ieee jestpe 2013. eolica dfig pmsg mppt cp-lambda back-to-back tipo-3 tipo-4 avanzado"}, {"slug": "filtro-lcl", "titulo": "Filtro LCL", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["atenuar armonicos de conmutacion", "modelar la planta de potencia"], "tags": ["filtro", "resonancia", "convertidor", "LCL", "dq"], "relacionados": ["amortiguamiento-activo-lcl", "marco-dq", "modelo-promediado"], "referencias": ["Reznik et al., LCL Filter Design and Performance Analysis for Grid-Interconnected Systems, IEEE TIA 2014"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Filtro de tercer orden (\\( L_1 \\)–\\( C_f \\)–\\( L_2 \\)) entre el puente del inversor y la red.\nAtenúa los armónicos de conmutación con mejor relación tamaño/atenuación que un filtro L\nsimple (caída de 60 dB/década por encima de la resonancia).</p>\n<h2>Fundamento teórico</h2>\n<p>La frecuencia de resonancia (sin amortiguar) es:</p>\n<p>$$ f_{res} = \\frac{1}{2\\pi}\\sqrt{\\frac{L_1+L_2}{L_1 L_2 C_f}} $$</p>\n<p>Por encima de \\( f_{res} \\) atenúa a 60 dB/dec. El problema: a \\( f_{res} \\) la impedancia se\nhace muy pequeña (o muy grande según el punto) con <strong>amortiguamiento casi nulo</strong> (\\( \\zeta\\approx0 \\)),\nlo que puede inestabilizar cualquier lazo rápido que la excite. Modelo en dq (marco a \\( \\omega \\)),\ncon \\( \\mathbf{J}=\\left[\\begin{smallmatrix}0&-1\\\\1&0\\end{smallmatrix}\\right] \\):</p>\n<p>$$ L_1\\dot{\\mathbf{i}}_{L1}=\\mathbf{v}_i-\\mathbf{v}_C-R_1\\mathbf{i}_{L1}+\\omega L_1\\mathbf{J}\\mathbf{i}_{L1} $$\n$$ C_f\\dot{\\mathbf{v}}_C=\\mathbf{i}_{L1}-\\mathbf{i}_{L2}+\\omega C_f\\mathbf{J}\\mathbf{v}_C $$\n$$ L_2\\dot{\\mathbf{i}}_{L2}=\\mathbf{v}_C-\\mathbf{v}_{pcc}-R_2\\mathbf{i}_{L2}+\\omega L_2\\mathbf{J}\\mathbf{i}_{L2} $$</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Estándar en inversores conectados a red (PV, eólica, baterías) por la normativa de inyección\nde armónicos. Se prefiere a un filtro L cuando se quiere menos inductancia total / menor caída.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li><strong>\\( L_1 \\) (lado inversor)</strong> por el rizado de corriente admisible:\n   \\( L_1 = \\dfrac{V_{dc}}{8\\,f_{sw}\\,\\Delta i_{L,pp}} \\) (típico \\( \\Delta i \\) = 10–20% de \\( I_n \\)).</li>\n<li><strong>\\( C_f \\)</strong> por la reactiva absorbida (≤ 5% de la potencia base):\n   \\( C_f \\le 0.05\\,\\dfrac{S_n}{\\omega_0 V^2} \\).</li>\n<li><strong>\\( L_2 \\)</strong> para fijar la atenuación a \\( f_{sw} \\) (relación \\( L_2/L_1 \\) = 0.2–1).</li>\n<li><strong>Coloca \\( f_{res} \\)</strong> holgada: \\( 10 f_0 < f_{res} < f_{sw}/2 \\).</li>\n<li><strong>Añade amortiguamiento</strong> (pasivo con \\( R \\) en serie con \\( C_f \\), o <strong>activo</strong> por\n   software — ver <a class=\"wl\" data-slug=\"amortiguamiento-activo-lcl\">amortiguamiento-activo-lcl</a>).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\nL1, L2, Cf = 2e-3, 1e-3, 20e-6\nf_res = 1/(2*np.pi)*np.sqrt((L1+L2)/(L1*L2*Cf))   # ~1.1 kHz\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Para 10 kVA / 400 V / 50 Hz (proyecto): \\( L_1=2\\,\\text{mH} \\), \\( C_f=20\\,\\mu\\text{F} \\),\n\\( L_2=1\\,\\text{mH} \\) → \\( f_{res}\\approx 1.1\\,\\text{kHz} \\), con \\( f_{sw}=10\\,\\text{kHz} \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Dejar \\( f_{res} \\) demasiado cerca del ancho de banda de control → resonancia excitada.</li>\n<li>Olvidar el amortiguamiento → polos de resonancia con \\( \\zeta\\approx 0 \\) (en el proyecto\n  apareció a 1.1 kHz con \\( \\zeta\\approx 0.13 \\)).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: modelar la planta): el LCL son 6 de los 15 estados del\n  modelo. Su resonancia (1.1 kHz) obligó a añadir amortiguamiento activo para poder subir el\n  lazo de tensión.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"amortiguamiento-activo-lcl\">amortiguamiento-activo-lcl</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Reznik et al., <em>LCL Filter Design...</em>, IEEE TIA 2014.</li>\n</ul>", "buscar": "filtro lcl definición filtro de tercer orden (\\( l 1 \\)–\\( c f \\)–\\( l 2 \\)) entre el puente del inversor y la red. atenúa los armónicos de conmutación con mejor relación tamaño/atenuación que un filtro l simple (caída de 60 db/década por encima de la resonancia). fundamento teórico la frecuencia de resonancia (sin amortiguar) es: f {res} = \\frac{1}{2\\pi}\\sqrt{\\frac{l 1+l 2}{l 1 l 2 c f}} por encima de \\( f {res} \\) atenúa a 60 db/dec. el problema: a \\( f {res} \\) la impedancia se hace muy pequeña (o muy grande según el punto) con amortiguamiento casi nulo (\\( \\zeta\\approx0 \\)), lo que puede inestabilizar cualquier lazo rápido que la excite. modelo en dq (marco a \\( \\omega \\)), con \\( \\mathbf{j}=\\left \\begin{smallmatrix}0&-1\\\\1&0\\end{smallmatrix}\\right \\): l 1\\dot{\\mathbf{i}} {l1}=\\mathbf{v} i-\\mathbf{v} c-r 1\\mathbf{i} {l1}+\\omega l 1\\mathbf{j}\\mathbf{i} {l1} c f\\dot{\\mathbf{v}} c=\\mathbf{i} {l1}-\\mathbf{i} {l2}+\\omega c f\\mathbf{j}\\mathbf{v} c l 2\\dot{\\mathbf{i}} {l2}=\\mathbf{v} c-\\mathbf{v} {pcc}-r 2\\mathbf{i} {l2}+\\omega l 2\\mathbf{j}\\mathbf{i} {l2} cuándo y por qué se usa estándar en inversores conectados a red (pv, eólica, baterías) por la normativa de inyección de armónicos. se prefiere a un filtro l cuando se quiere menos inductancia total / menor caída. procedimiento de diseño (genérico) 1. \\( l 1 \\) (lado inversor) por el rizado de corriente admisible: \\( l 1 = \\dfrac{v {dc}}{8\\,f {sw}\\,\\delta i {l,pp}} \\) (típico \\( \\delta i \\) = 10–20% de \\( i n \\)). 2. \\( c f \\) por la reactiva absorbida (≤ 5% de la potencia base): \\( c f \\le 0.05\\,\\dfrac{s n}{\\omega 0 v^2} \\). 3. \\( l 2 \\) para fijar la atenuación a \\( f {sw} \\) (relación \\( l 2/l 1 \\) = 0.2–1). 4. coloca \\( f {res} \\) holgada: \\( 10 f 0 < f {res} < f {sw}/2 \\). 5. añade amortiguamiento (pasivo con \\( r \\) en serie con \\( c f \\), o activo por software — ver amortiguamiento-activo-lcl ). ejemplo de código python import numpy as np l1, l2, cf = 2e-3, 1e-3, 20e-6 f res = 1/(2 np.pi) np.sqrt((l1+l2)/(l1 l2 cf)) ~1.1 khz parámetros y valores típicos para 10 kva / 400 v / 50 hz (proyecto): \\( l 1=2\\,\\text{mh} \\), \\( c f=20\\,\\mu\\text{f} \\), \\( l 2=1\\,\\text{mh} \\) → \\( f {res}\\approx 1.1\\,\\text{khz} \\), con \\( f {sw}=10\\,\\text{khz} \\). errores comunes - dejar \\( f {res} \\) demasiado cerca del ancho de banda de control → resonancia excitada. - olvidar el amortiguamiento → polos de resonancia con \\( \\zeta\\approx 0 \\) (en el proyecto apareció a 1.1 khz con \\( \\zeta\\approx 0.13 \\)). uso en proyectos - 01 - gfm-impedance (objetivo: modelar la planta): el lcl son 6 de los 15 estados del modelo. su resonancia (1.1 khz) obligó a añadir amortiguamiento activo para poder subir el lazo de tensión. conceptos relacionados - amortiguamiento-activo-lcl · marco-dq · modelo-promediado referencias - reznik et al., lcl filter design... , ieee tia 2014. filtro resonancia convertidor lcl dq"}, {"slug": "fotovoltaica-mppt", "titulo": "Sistema fotovoltaico y MPPT", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["modelar la célula PV y extraer la máxima potencia con MPPT"], "tags": ["pv", "fotovoltaica", "mppt", "p-and-o", "inc-cond", "curva-iv", "intermedio", "modelado"], "relacionados": ["modelo-bateria-bess", "convertidor-vsc", "dinamica-bus-dc", "control-tension-bus-dc", "sistema-por-unidad"], "referencias": ["Sera et al., PV Panel Model Based on Datasheet Values, IEEE ISIE 2007", "Esram, Chapman, Comparison of Photovoltaic Array MPPT Techniques, IEEE TEC 2007"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Modelo eléctrico de la célula/módulo fotovoltaico (curva I-V no lineal) y algoritmos de\n<strong>Maximum Power Point Tracking (MPPT)</strong> que ajustan el punto de operación para extraer la máxima\npotencia disponible ante variaciones de irradiancia y temperatura.</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Modelo de diodo único:</strong>\n$$ I = I_{ph} - I_0\\left(\\exp\\!\\frac{V+IR_s}{nV_T}-1\\right) - \\frac{V+IR_s}{R_{sh}} $$\ncon \\( V_T=kT/q \\) (tensión térmica, \\( \\approx26 \\) mV a 25 °C), \\( n \\) factor de idealidad,\n\\( I_{ph} \\) fotocorriente (proporcional a irradiancia G), \\( I_0 \\) corriente de saturación inversa\n(fuertemente dependiente de T). La curva I-V tiene:\n- <strong>Isc</strong> (cortocircuito, \\( V=0 \\)): corriente máxima ≈ \\( I_{ph} \\).\n- <strong>Voc</strong> (circuito abierto, \\( I=0 \\)): tensión máxima.\n- <strong>MPP</strong> (máxima potencia): punto de tangente \\( dP/dV=0 \\); típicamente 70–80 % de \\( V_{oc} \\).</p>\n<p>La irradiancia eleva \\( I_{ph}\\sim G \\); la temperatura sube \\( V_{oc} \\) cae (\\( -2.3 \\) mV/°C\npor célula).</p>\n<p><strong>MPPT — algoritmos:</strong>\n- <strong>Perturba y observa (P&amp;O):</strong> incrementa/decrementa la tensión de referencia y compara \\( P \\) con\n  el ciclo anterior. Simple; oscila alrededor del MPP en régimen permanente (amplitud \\( \\propto \\Delta V_{step} \\)).\n- <strong>Conductancia incremental (INC):</strong> condición exacta del MPP: \\( dI/dV=-I/V \\) (la conductancia\n  incremental iguala la conductancia instantánea). Sin oscilación en permanente; más costoso.\n- <strong>MPPT por tensión constante (Voc fracción):</strong> \\( V_{MPP}\\approx0.76 V_{oc} \\). Muy simple, no\n  requiere medida de corriente; impreciso ante sombreado.\n- <strong>MPP global con sombreado parcial:</strong> la curva P-V tiene <strong>múltiples máximos locales</strong> (bypass\n  diodes); P&amp;O/INC quedan atrapados. Se requieren técnicas globales (barrido periódico, PSO).</p>\n<p><strong>Integración al convertidor:</strong> el MPPT genera la referencia de tensión DC \\( V^*_{dc} \\) (o de\ncorriente). Un boost DC/DC intermedio adapta la tensión del string al bus DC; el VSC controla el bus\nDC hacia la red (<a class=\"wl\" data-slug=\"control-tension-bus-dc\">control-tension-bus-dc</a>).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En toda instalación PV conectada a red o a microrred. El MPPT es la capa de control más exterior\n(más lenta, decenas de ms) sobre el lazo de tensión/corriente del DC/DC.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Parametriza el modelo de diodo único con los datos de la hoja (Isc, Voc, Impp, Vmpp a STC).</li>\n<li>Elige el algoritmo MPPT (P&amp;O para simplicidad; INC para menos rizado; global si hay sombreado).</li>\n<li>Sintoniza el paso \\( \\Delta V \\) (P&amp;O): pequeño → poco rizado, respuesta lenta; grande → rápido, mucho rizado.</li>\n<li>Conecta el MPPT al lazo de tensión del DC/DC; separa bandas (MPPT \\( \\ll \\) lazo de tensión).</li>\n<li>Verifica comportamiento con irradiancia variable y sombreado parcial.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def mppt_po(V_ref, P_now, P_prev, V_prev, dV=0.5):\n    if P_now &gt;= P_prev:\n        return V_ref + dV if V_ref &gt;= V_prev else V_ref - dV\n    else:\n        return V_ref - dV if V_ref &gt;= V_prev else V_ref + dV\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Paso P&amp;O \\( \\Delta V \\) 0.5–2 V; periodo MPPT 10–100 ms. \\( V_{MPP}/V_{oc}\\approx0.76 \\);\n\\( I_{MPP}/I_{sc}\\approx0.92 \\). Eficiencia MPPT &gt; 99 % en condiciones uniformes.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Paso \\( \\Delta V \\) grande en P&amp;O → rizado permanente significativo en potencia.</li>\n<li>Usar P&amp;O simple con sombreado parcial → queda en máximo local (pérdidas de hasta 30–50 %).</li>\n<li>MPPT más rápido que el lazo de tensión del convertidor → interacción y oscilación.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"convertidor-vsc\">convertidor-vsc</a> · <a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a> · <a class=\"wl\" data-slug=\"control-tension-bus-dc\">control-tension-bus-dc</a> · <a class=\"wl\" data-slug=\"modelo-bateria-bess\">modelo-bateria-bess</a> · <a class=\"wl\" data-slug=\"sistema-por-unidad\">sistema-por-unidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Sera et al., <em>PV Panel Model Based on Datasheet Values</em>, IEEE ISIE 2007.</li>\n<li>Esram, Chapman, <em>Comparison of PV Array MPPT Techniques</em>, IEEE TEC 2007.</li>\n</ul>", "buscar": "sistema fotovoltaico y mppt definición modelo eléctrico de la célula/módulo fotovoltaico (curva i-v no lineal) y algoritmos de maximum power point tracking (mppt) que ajustan el punto de operación para extraer la máxima potencia disponible ante variaciones de irradiancia y temperatura. fundamento teórico modelo de diodo único: i = i {ph} - i 0\\left(\\exp\\!\\frac{v+ir s}{nv t}-1\\right) - \\frac{v+ir s}{r {sh}} con \\( v t=kt/q \\) (tensión térmica, \\( \\approx26 \\) mv a 25 °c), \\( n \\) factor de idealidad, \\( i {ph} \\) fotocorriente (proporcional a irradiancia g), \\( i 0 \\) corriente de saturación inversa (fuertemente dependiente de t). la curva i-v tiene: - isc (cortocircuito, \\( v=0 \\)): corriente máxima ≈ \\( i {ph} \\). - voc (circuito abierto, \\( i=0 \\)): tensión máxima. - mpp (máxima potencia): punto de tangente \\( dp/dv=0 \\); típicamente 70–80 % de \\( v {oc} \\). la irradiancia eleva \\( i {ph}\\sim g \\); la temperatura sube \\( v {oc} \\) cae (\\( -2.3 \\) mv/°c por célula). mppt — algoritmos: - perturba y observa (p&o): incrementa/decrementa la tensión de referencia y compara \\( p \\) con el ciclo anterior. simple; oscila alrededor del mpp en régimen permanente (amplitud \\( \\propto \\delta v {step} \\)). - conductancia incremental (inc): condición exacta del mpp: \\( di/dv=-i/v \\) (la conductancia incremental iguala la conductancia instantánea). sin oscilación en permanente; más costoso. - mppt por tensión constante (voc fracción): \\( v {mpp}\\approx0.76 v {oc} \\). muy simple, no requiere medida de corriente; impreciso ante sombreado. - mpp global con sombreado parcial: la curva p-v tiene múltiples máximos locales (bypass diodes); p&o/inc quedan atrapados. se requieren técnicas globales (barrido periódico, pso). integración al convertidor: el mppt genera la referencia de tensión dc \\( v^ {dc} \\) (o de corriente). un boost dc/dc intermedio adapta la tensión del string al bus dc; el vsc controla el bus dc hacia la red ( control-tension-bus-dc ). cuándo y por qué se usa en toda instalación pv conectada a red o a microrred. el mppt es la capa de control más exterior (más lenta, decenas de ms) sobre el lazo de tensión/corriente del dc/dc. procedimiento de diseño (genérico) 1. parametriza el modelo de diodo único con los datos de la hoja (isc, voc, impp, vmpp a stc). 2. elige el algoritmo mppt (p&o para simplicidad; inc para menos rizado; global si hay sombreado). 3. sintoniza el paso \\( \\delta v \\) (p&o): pequeño → poco rizado, respuesta lenta; grande → rápido, mucho rizado. 4. conecta el mppt al lazo de tensión del dc/dc; separa bandas (mppt \\( \\ll \\) lazo de tensión). 5. verifica comportamiento con irradiancia variable y sombreado parcial. ejemplo de código python def mppt po(v ref, p now, p prev, v prev, dv=0.5): if p now = p prev: return v ref + dv if v ref = v prev else v ref - dv else: return v ref - dv if v ref = v prev else v ref + dv parámetros y valores típicos paso p&o \\( \\delta v \\) 0.5–2 v; periodo mppt 10–100 ms. \\( v {mpp}/v {oc}\\approx0.76 \\); \\( i {mpp}/i {sc}\\approx0.92 \\). eficiencia mppt 99 % en condiciones uniformes. errores comunes - paso \\( \\delta v \\) grande en p&o → rizado permanente significativo en potencia. - usar p&o simple con sombreado parcial → queda en máximo local (pérdidas de hasta 30–50 %). - mppt más rápido que el lazo de tensión del convertidor → interacción y oscilación. conceptos relacionados - convertidor-vsc · dinamica-bus-dc · control-tension-bus-dc · modelo-bateria-bess · sistema-por-unidad referencias - sera et al., pv panel model based on datasheet values , ieee isie 2007. - esram, chapman, comparison of pv array mppt techniques , ieee tec 2007. pv fotovoltaica mppt p-and-o inc-cond curva-iv intermedio modelado"}, {"slug": "generador-sincrono", "titulo": "Generador síncrono — modelo dq y dinámica", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "avanzado", "proyectos": [], "objetivos": ["modelar la dinámica electromagnética y mecánica del generador síncrono"], "tags": ["generador-sincrono", "dq-park", "swing", "amortiguador", "AVR", "avanzado", "modelado"], "relacionados": ["ecuacion-oscilacion", "vsm-inercia", "marco-dq", "representacion-espacio-estados", "clasificacion-estabilidad"], "referencias": ["Kundur, Power System Stability and Control, McGraw-Hill 1994", "Anderson, Fouad, Power System Control and Stability, IEEE Press 2003"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Modelo matemático del generador síncrono en el marco <strong>dq de Park</strong> (referencial del rotor), que\ndesacopla las dinámicas de circuito electromagnético y mecánico y es la base de todos los estudios\nde estabilidad de sistemas de potencia y de la emulación virtual (VSM).</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Circuito electromagnético.</strong> En el eje d (flujo del rotor) y q (en cuadratura), con devanados\nde campo \\( f \\) y amortiguadores \\( D \\) (eje d) y \\( Q \\) (eje q):\n$$ \\psi_d = -L_d i_d + L_{md}(i_f+i_D),\\quad \\psi_q=-L_q i_q+L_{mq}i_Q $$\nLas tensiones de estátor (con velocidad del rotor \\( \\omega_r \\)):\n$$ v_d = -R_s i_d + \\dot\\psi_d - \\omega_r\\psi_q,\\quad v_q=-R_s i_q+\\dot\\psi_q+\\omega_r\\psi_d $$\nEsto es el <strong>modelo de orden completo</strong> (5–6 estados eléctricos). Se simplifican:\n- <strong>Modelo de 4º orden</strong> (subransitorio): \\( \\psi_d,\\psi_q,\\psi_D,\\psi_Q \\) como estados; \\( E'_d,E'_q \\) tensiones transitorias.\n- <strong>Modelo clásico</strong> (2 estados: \\( \\delta,\\omega \\)): solo la <a class=\"wl\" data-slug=\"ecuacion-oscilacion\">swing equation</a> con \\( E' \\) constante; suficiente para estabilidad transitoria.</p>\n<p><strong>Mecánica</strong> (<a class=\"wl\" data-slug=\"ecuacion-oscilacion\">ecuacion-oscilacion</a>):\n$$ 2H\\frac{d\\omega}{dt}=T_m-T_e-D\\Delta\\omega,\\quad \\frac{d\\delta}{dt}=\\omega_0\\Delta\\omega $$\nPar electromagnético: \\( T_e=\\psi_d i_q - \\psi_q i_d \\).</p>\n<p><strong>Regulación</strong>: AVR (Automatic Voltage Regulator) cierra el lazo \\( V_{terminal}\\to E_f \\) (campo);\nel governor cierra \\( \\omega\\to T_m \\). Su dinámica (tiempo \\( \\sim100\\,\\)ms–s) es la base de los\n<a class=\"wl\" data-slug=\"servicios-red-soporte\">servicios de soporte de frecuencia/tensión</a>.</p>\n<p><strong>Relevancia para convertidores.</strong> El VSM (<a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a>) emula exactamente este modelo pero\nsobre un convertidor; entender el original clarifica qué se emula, sus límites y las aproximaciones.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para estudios de estabilidad de red mixta (generadores + convertidores), para entender la base\nfísica del VSM/PSC/matching, y para modelar el lado AC de sistemas back-to-back con máquina.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Elige el orden del modelo según el estudio: clásico (ángulo), 4º (transitorio), completo (cortocircuito).</li>\n<li>Parametriza \\( L_d,L_q,L'_d,L'_q,T'_{d0},T'_{q0},H,D \\) de la hoja de datos.</li>\n<li>Implementa en espacio de estados (<a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a>) y linealiza en el punto de operación.</li>\n<li>Cierra AVR y governor para estudios de régimen dinámico.</li>\n<li>Conecta al modelo de red (Thevenin o nodos) y verifica estabilidad.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def sg_swing(delta, dw, Tm, Te, H, D, w0):\n    return [w0*dw, (Tm - Te - D*dw)/(2*H)]   # [d(delta)/dt, d(omega)/dt]\n\ndef Te_elec(psi_d, psi_q, id_, iq):\n    return psi_d*iq - psi_q*id_               # par electromagnetico\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( H=2\\text{–}9 \\) s; \\( X_d=0.8\\text{–}2.0 \\) p.u.; \\( X'_d=0.1\\text{–}0.35 \\) p.u.;\n\\( T'_{d0}=3\\text{–}10 \\) s; \\( T''_{d0}=0.02\\text{–}0.05 \\) s. \\( X_d>X_q \\) (polo saliente) o\n\\( X_d=X_q \\) (cilíndrico).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Usar el modelo clásico (2 estados) para estudios subtransitorios → no captura la dinámica de los amortiguadores.</li>\n<li>Olvidar que \\( X_d\\ne X_q \\) en máquinas de polo saliente (PMSG, hidro) → error en \\( T_e \\).</li>\n<li>Parametrizar el VSM con \\( H \\) del generador real sin considerar la limitación de corriente del convertidor.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"ecuacion-oscilacion\">ecuacion-oscilacion</a> · <a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a> · <a class=\"wl\" data-slug=\"clasificacion-estabilidad\">clasificacion-estabilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Kundur, <em>Power System Stability and Control</em>, 1994.</li>\n<li>Anderson, Fouad, <em>Power System Control and Stability</em>, IEEE Press 2003.</li>\n</ul>", "buscar": "generador síncrono — modelo dq y dinámica definición modelo matemático del generador síncrono en el marco dq de park (referencial del rotor), que desacopla las dinámicas de circuito electromagnético y mecánico y es la base de todos los estudios de estabilidad de sistemas de potencia y de la emulación virtual (vsm). fundamento teórico circuito electromagnético. en el eje d (flujo del rotor) y q (en cuadratura), con devanados de campo \\( f \\) y amortiguadores \\( d \\) (eje d) y \\( q \\) (eje q): \\psi d = -l d i d + l {md}(i f+i d),\\quad \\psi q=-l q i q+l {mq}i q las tensiones de estátor (con velocidad del rotor \\( \\omega r \\)): v d = -r s i d + \\dot\\psi d - \\omega r\\psi q,\\quad v q=-r s i q+\\dot\\psi q+\\omega r\\psi d esto es el modelo de orden completo (5–6 estados eléctricos). se simplifican: - modelo de 4º orden (subransitorio): \\( \\psi d,\\psi q,\\psi d,\\psi q \\) como estados; \\( e' d,e' q \\) tensiones transitorias. - modelo clásico (2 estados: \\( \\delta,\\omega \\)): solo la ecuacion-oscilacion|swing equation con \\( e' \\) constante; suficiente para estabilidad transitoria. mecánica ( ecuacion-oscilacion ): 2h\\frac{d\\omega}{dt}=t m-t e-d\\delta\\omega,\\quad \\frac{d\\delta}{dt}=\\omega 0\\delta\\omega par electromagnético: \\( t e=\\psi d i q - \\psi q i d \\). regulación : avr (automatic voltage regulator) cierra el lazo \\( v {terminal}\\to e f \\) (campo); el governor cierra \\( \\omega\\to t m \\). su dinámica (tiempo \\( \\sim100\\,\\)ms–s) es la base de los servicios-red-soporte|servicios de soporte de frecuencia/tensión . relevancia para convertidores. el vsm ( vsm-inercia ) emula exactamente este modelo pero sobre un convertidor; entender el original clarifica qué se emula, sus límites y las aproximaciones. cuándo y por qué se usa para estudios de estabilidad de red mixta (generadores + convertidores), para entender la base física del vsm/psc/matching, y para modelar el lado ac de sistemas back-to-back con máquina. procedimiento de diseño (genérico) 1. elige el orden del modelo según el estudio: clásico (ángulo), 4º (transitorio), completo (cortocircuito). 2. parametriza \\( l d,l q,l' d,l' q,t' {d0},t' {q0},h,d \\) de la hoja de datos. 3. implementa en espacio de estados ( representacion-espacio-estados ) y linealiza en el punto de operación. 4. cierra avr y governor para estudios de régimen dinámico. 5. conecta al modelo de red (thevenin o nodos) y verifica estabilidad. ejemplo de código python def sg swing(delta, dw, tm, te, h, d, w0): return w0 dw, (tm - te - d dw)/(2 h) d(delta)/dt, d(omega)/dt def te elec(psi d, psi q, id , iq): return psi d iq - psi q id par electromagnetico parámetros y valores típicos \\( h=2\\text{–}9 \\) s; \\( x d=0.8\\text{–}2.0 \\) p.u.; \\( x' d=0.1\\text{–}0.35 \\) p.u.; \\( t' {d0}=3\\text{–}10 \\) s; \\( t'' {d0}=0.02\\text{–}0.05 \\) s. \\( x d x q \\) (polo saliente) o \\( x d=x q \\) (cilíndrico). errores comunes - usar el modelo clásico (2 estados) para estudios subtransitorios → no captura la dinámica de los amortiguadores. - olvidar que \\( x d\\ne x q \\) en máquinas de polo saliente (pmsg, hidro) → error en \\( t e \\). - parametrizar el vsm con \\( h \\) del generador real sin considerar la limitación de corriente del convertidor. conceptos relacionados - ecuacion-oscilacion · vsm-inercia · marco-dq · representacion-espacio-estados · clasificacion-estabilidad referencias - kundur, power system stability and control , 1994. - anderson, fouad, power system control and stability , ieee press 2003. generador-sincrono dq-park swing amortiguador avr avanzado modelado"}, {"slug": "impedancia-dq-vs-secuencia", "titulo": "Impedancia en dq vs en secuencia", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "avanzado", "proyectos": [], "objetivos": ["elegir y relacionar los dos formalismos de modelado de impedancia de convertidor"], "tags": ["impedancia", "dq", "secuencia", "mirror-frequency", "acoplamiento", "avanzado", "modelado"], "relacionados": ["impedancia-salida-estabilidad", "marco-dq", "componentes-simetricas", "nyquist-generalizado", "medicion-impedancia-inyeccion"], "referencias": ["Wang, Blaabjerg, Harmonic Stability in Power-Electronic-Based Power Systems, IEEE TPEL 2014", "Rygg et al., A Modified Sequence-Domain Impedance Definition, IEEE JESTPE 2016", "Sun, Impedance-Based Stability Criterion for Grid-Connected Inverters, IEEE TPEL 2011"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Dos representaciones equivalentes de la <strong>impedancia de pequeña señal</strong> de un convertidor: la\n<strong>dq</strong> (matriz \\( 2\\times2 \\) en marco síncrono giratorio) y la <strong>de secuencia</strong> (impedancias\n\\( Z_+,Z_- \\) en marco estacionario, definidas por inyección de secuencia positiva/negativa). Ambas\nalimentan el <a class=\"wl\" data-slug=\"nyquist-generalizado\">criterio de estabilidad por impedancia</a>.</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Marco dq.</strong> Se linealiza el convertidor en el marco síncrono y se obtiene\n$$ \\begin{bmatrix}\\Delta v_d\\\\\\Delta v_q\\end{bmatrix}=\n   \\begin{bmatrix}Z_{dd}&Z_{dq}\\\\Z_{qd}&Z_{qq}\\end{bmatrix}\n   \\begin{bmatrix}\\Delta i_d\\\\\\Delta i_q\\end{bmatrix} $$\nLos términos cruzados \\( Z_{dq},Z_{qd} \\) capturan el acoplamiento (PLL, lazo de potencia,\n<a class=\"wl\" data-slug=\"marco-dq\">términos \\( \\pm\\omega \\)</a>). Es el marco natural cuando el control vive en dq (GFL con\nPLL, GFM con droop/VSM).</p>\n<p><strong>Marco de secuencia.</strong> Inyectando una pequeña tensión de secuencia positiva a frecuencia \\( f_p \\),\nel convertidor responde a \\( f_p \\) <strong>y</strong> a la <strong>frecuencia espejo</strong> \\( f_p-2f_1 \\) (mirror\nfrequency coupling), por la asimetría que introducen PLL/control. Esto obliga a una definición\n\\( 2\\times2 \\) (impedancia de secuencia <strong>modificada</strong>):\n$$ \\begin{bmatrix}\\Delta V_p\\\\\\Delta V_m^*\\end{bmatrix}=\n   \\begin{bmatrix}Z_{pp}&Z_{pm}\\\\Z_{mp}&Z_{mm}\\end{bmatrix}\n   \\begin{bmatrix}\\Delta I_p\\\\\\Delta I_m^*\\end{bmatrix} $$\ncon \\( f_m=f_p-2f_1 \\). Si el acoplamiento es débil, se reduce a dos escalares \\( Z_+,Z_- \\)\ndesacoplados.</p>\n<p><strong>Equivalencia.</strong> Hay una transformación lineal exacta entre ambas (un cambio de variable complejo\n\\( s_{dq}\\leftrightarrow s\\mp j\\omega_1 \\)): el acoplamiento d-q en dq ⇔ acoplamiento de frecuencia\nespejo en secuencia. No son fenómenos distintos, son <strong>el mismo</strong> visto en dos marcos.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>dq</th>\n<th>Secuencia</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Marco</td>\n<td>giratorio</td>\n<td>estacionario</td>\n</tr>\n<tr>\n<td>Variable</td>\n<td>\\( Z_{dd},Z_{qq},Z_{dq},Z_{qd} \\)</td>\n<td>\\( Z_{pp},Z_{mm},Z_{pm},Z_{mp} \\)</td>\n</tr>\n<tr>\n<td>Medida</td>\n<td>inyección en dq (necesita ángulo)</td>\n<td>inyección de secuencia (frecuencia real)</td>\n</tr>\n<tr>\n<td>Intuición</td>\n<td>acoplamiento de control</td>\n<td>resonancia/espejo físico</td>\n</tr>\n</tbody>\n</table>\n<h2>Cuándo y por qué se usa</h2>\n<p><strong>dq</strong> cuando el modelo analítico del control está en dq (tus proyectos GFM/GFL) y para casar con\nel <a class=\"wl\" data-slug=\"nyquist-generalizado\">GNC</a>. <strong>Secuencia</strong> cuando mides experimentalmente con inyección de\nfrecuencia real, o para razonar sobre resonancias y armónicos de red (<a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad-armonica</a>).</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Define el punto de operación y linealiza (<a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a>).</li>\n<li>Elige marco: dq (analítico) o secuencia (experimental/físico).</li>\n<li>Obtén la matriz \\( 2\\times2 \\) por columnas (dos inyecciones independientes).</li>\n<li>Si necesitas el otro marco, aplica la transformación \\( s\\mp j\\omega_1 \\).</li>\n<li>Lleva la impedancia al criterio de estabilidad (<a class=\"wl\" data-slug=\"nyquist-generalizado\">nyquist-generalizado</a>).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># Conversión conceptual dq -&gt; secuencia (par de frecuencias espejo)\n# Z_seq(f_p) se arma con Z_dq evaluada en s = j2*pi*(f_p - f1)\nimport numpy as np\ndef dq_to_seq_freq(fp, f1):\n    return 2*np.pi*(fp - f1)        # desplazamiento de frecuencia del marco\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Acoplamiento d-q (o espejo) relevante cuando la PLL/lazo de potencia es de banda ancha o la red es\ndébil (bajo <a class=\"wl\" data-slug=\"red-thevenin-scr\">SCR</a>); entonces los términos cruzados no se pueden despreciar.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Usar impedancia <strong>escalar</strong> (SISO) cuando hay acoplamiento fuerte → estabilidad mal evaluada.</li>\n<li>Ignorar la <strong>frecuencia espejo</strong> al medir en secuencia (subestima el acoplamiento).</li>\n<li>Mezclar convenciones de marco/ángulo entre la impedancia de fuente y la de carga.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"componentes-simetricas\">componentes-simetricas</a> · <a class=\"wl\" data-slug=\"nyquist-generalizado\">nyquist-generalizado</a> · <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Wang, Blaabjerg, <em>Harmonic Stability in Power-Electronic-Based Power Systems</em>, IEEE TPEL 2014.</li>\n<li>Rygg et al., <em>A Modified Sequence-Domain Impedance Definition</em>, IEEE JESTPE 2016.</li>\n<li>Sun, <em>Impedance-Based Stability Criterion</em>, IEEE TPEL 2011.</li>\n</ul>", "buscar": "impedancia en dq vs en secuencia definición dos representaciones equivalentes de la impedancia de pequeña señal de un convertidor: la dq (matriz \\( 2\\times2 \\) en marco síncrono giratorio) y la de secuencia (impedancias \\( z +,z - \\) en marco estacionario, definidas por inyección de secuencia positiva/negativa). ambas alimentan el nyquist-generalizado|criterio de estabilidad por impedancia . fundamento teórico marco dq. se linealiza el convertidor en el marco síncrono y se obtiene \\begin{bmatrix}\\delta v d\\\\\\delta v q\\end{bmatrix}= \\begin{bmatrix}z {dd}&z {dq}\\\\z {qd}&z {qq}\\end{bmatrix} \\begin{bmatrix}\\delta i d\\\\\\delta i q\\end{bmatrix} los términos cruzados \\( z {dq},z {qd} \\) capturan el acoplamiento (pll, lazo de potencia, marco-dq|términos \\( \\pm\\omega \\) ). es el marco natural cuando el control vive en dq (gfl con pll, gfm con droop/vsm). marco de secuencia. inyectando una pequeña tensión de secuencia positiva a frecuencia \\( f p \\), el convertidor responde a \\( f p \\) y a la frecuencia espejo \\( f p-2f 1 \\) (mirror frequency coupling), por la asimetría que introducen pll/control. esto obliga a una definición \\( 2\\times2 \\) (impedancia de secuencia modificada ): \\begin{bmatrix}\\delta v p\\\\\\delta v m^ \\end{bmatrix}= \\begin{bmatrix}z {pp}&z {pm}\\\\z {mp}&z {mm}\\end{bmatrix} \\begin{bmatrix}\\delta i p\\\\\\delta i m^ \\end{bmatrix} con \\( f m=f p-2f 1 \\). si el acoplamiento es débil, se reduce a dos escalares \\( z +,z - \\) desacoplados. equivalencia. hay una transformación lineal exacta entre ambas (un cambio de variable complejo \\( s {dq}\\leftrightarrow s\\mp j\\omega 1 \\)): el acoplamiento d-q en dq ⇔ acoplamiento de frecuencia espejo en secuencia. no son fenómenos distintos, son el mismo visto en dos marcos. | aspecto | dq | secuencia | |---|---|---| | marco | giratorio | estacionario | | variable | \\( z {dd},z {qq},z {dq},z {qd} \\) | \\( z {pp},z {mm},z {pm},z {mp} \\) | | medida | inyección en dq (necesita ángulo) | inyección de secuencia (frecuencia real) | | intuición | acoplamiento de control | resonancia/espejo físico | cuándo y por qué se usa dq cuando el modelo analítico del control está en dq (tus proyectos gfm/gfl) y para casar con el nyquist-generalizado|gnc . secuencia cuando mides experimentalmente con inyección de frecuencia real, o para razonar sobre resonancias y armónicos de red ( estabilidad-armonica ). procedimiento de diseño (genérico) 1. define el punto de operación y linealiza ( linealizacion-numerica ). 2. elige marco: dq (analítico) o secuencia (experimental/físico). 3. obtén la matriz \\( 2\\times2 \\) por columnas (dos inyecciones independientes). 4. si necesitas el otro marco, aplica la transformación \\( s\\mp j\\omega 1 \\). 5. lleva la impedancia al criterio de estabilidad ( nyquist-generalizado ). ejemplo de código python conversión conceptual dq - secuencia (par de frecuencias espejo) z seq(f p) se arma con z dq evaluada en s = j2 pi (f p - f1) import numpy as np def dq to seq freq(fp, f1): return 2 np.pi (fp - f1) desplazamiento de frecuencia del marco parámetros y valores típicos acoplamiento d-q (o espejo) relevante cuando la pll/lazo de potencia es de banda ancha o la red es débil (bajo red-thevenin-scr|scr ); entonces los términos cruzados no se pueden despreciar. errores comunes - usar impedancia escalar (siso) cuando hay acoplamiento fuerte → estabilidad mal evaluada. - ignorar la frecuencia espejo al medir en secuencia (subestima el acoplamiento). - mezclar convenciones de marco/ángulo entre la impedancia de fuente y la de carga. conceptos relacionados - impedancia-salida-estabilidad · marco-dq · componentes-simetricas · nyquist-generalizado · medicion-impedancia-inyeccion referencias - wang, blaabjerg, harmonic stability in power-electronic-based power systems , ieee tpel 2014. - rygg et al., a modified sequence-domain impedance definition , ieee jestpe 2016. - sun, impedance-based stability criterion , ieee tpel 2011. impedancia dq secuencia mirror-frequency acoplamiento avanzado modelado"}, {"slug": "linealizacion-teoria", "titulo": "Teoría de linealización", "categoria": "fisica-modelado", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["aproximar un sistema no lineal por uno lineal para analizar y disenar"], "tags": ["linealizacion", "jacobiano", "equilibrio", "pequena-senal", "validez"], "relacionados": ["linealizacion-numerica", "equilibrio-fsolve", "representacion-espacio-estados", "modelado-sistemas"], "referencias": ["Khalil, Nonlinear Systems, Prentice Hall 2002 (cap. 4)"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Aproximar un sistema no lineal \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\) por un\nmodelo <strong>lineal</strong> válido en un entorno de un punto de operación (equilibrio). Es lo que permite\naplicar toda la teoría de control lineal a sistemas que en realidad no lo son.</p>\n<h2>Fundamento teórico</h2>\n<p>En un equilibrio \\( (\\mathbf{x}_e,\\mathbf{u}_e) \\) con \\( \\mathbf{f}(\\mathbf{x}_e,\\mathbf{u}_e)=0 \\),\nse desarrolla \\( \\mathbf{f} \\) en serie de Taylor y se conserva el primer orden. Con las\ndesviaciones \\( \\Delta\\mathbf{x}=\\mathbf{x}-\\mathbf{x}_e \\):\n$$ \\Delta\\dot{\\mathbf{x}} = A\\,\\Delta\\mathbf{x} + B\\,\\Delta\\mathbf{u}, \\qquad\n   A=\\left.\\frac{\\partial \\mathbf{f}}{\\partial \\mathbf{x}}\\right|_e, \\quad\n   B=\\left.\\frac{\\partial \\mathbf{f}}{\\partial \\mathbf{u}}\\right|_e $$\n\\( A \\) y \\( B \\) son los <strong>Jacobianos</strong> evaluados en el equilibrio.</p>\n<p><strong>Validez</strong> (teorema de Hartman–Grobman): si el equilibrio es <strong>hiperbólico</strong> (ningún autovalor\nde \\( A \\) sobre el eje imaginario), el comportamiento cualitativo del no lineal cerca del\nequilibrio coincide con el del linealizado. Es un resultado <strong>local</strong> (pequeña señal): vale\nmientras las desviaciones sean pequeñas. Falla con no linealidades fuertes (saturación,\nzona muerta) o en equilibrios no hiperbólicos.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para diseñar y analizar control con herramientas lineales (polos, Bode, impedancia, LQR). El\nrégimen de gran señal (faltas, saturación) requiere otros métodos (simulación no lineal).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Halla el equilibrio resolviendo \\( \\mathbf{f}(\\mathbf{x}_e,\\mathbf{u}_e)=0 \\) (ver <a class=\"wl\" data-slug=\"equilibrio-fsolve\">equilibrio-fsolve</a>).</li>\n<li>Calcula los Jacobianos \\( A,B \\) (y \\( C,D \\) de la salida): analíticamente o\n   <strong>numéricamente</strong> (ver <a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a>).</li>\n<li>Comprueba que el equilibrio es hiperbólico (ningún autovalor en el eje imaginario).</li>\n<li>Recuerda el rango de validez: solo pequeña señal alrededor de ese punto.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># linealizacion analitica de un pendulo: d/dt[theta, w] ; equilibrio theta=0\n# A = [[0,1],[-g/l*cos(theta_e), -b/m]]  evaluado en theta_e=0  -&gt; [[0,1],[-g/l,-b/m]]\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>La región de validez depende de la curvatura de \\( \\mathbf{f} \\); en convertidores, las\nperturbaciones de pequeña señal (p.ej. inyección de impedancia con amplitud pequeña) están en\nrégimen lineal; las faltas, no.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Linealizar fuera del equilibrio (residuo \\( \\neq 0 \\)) → \\( A \\) sin sentido.</li>\n<li>Aplicar conclusiones del linealizado en gran señal (cuando hay saturación/current limiting).</li>\n<li>Equilibrio no hiperbólico (autovalor en \\( j\\omega \\)): el linealizado no decide la estabilidad.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: todo el análisis de estabilidad e impedancia parte de la linealización en el punto\n  de operación; el régimen de gran señal (faltas) se trató por simulación temporal.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a> · <a class=\"wl\" data-slug=\"equilibrio-fsolve\">equilibrio-fsolve</a> · <a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a> · <a class=\"wl\" data-slug=\"modelado-sistemas\">modelado-sistemas</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Khalil, <em>Nonlinear Systems</em>, cap. 4.</li>\n</ul>", "buscar": "teoría de linealización definición aproximar un sistema no lineal \\( \\dot{\\mathbf{x}}=\\mathbf{f}(\\mathbf{x},\\mathbf{u}) \\) por un modelo lineal válido en un entorno de un punto de operación (equilibrio). es lo que permite aplicar toda la teoría de control lineal a sistemas que en realidad no lo son. fundamento teórico en un equilibrio \\( (\\mathbf{x} e,\\mathbf{u} e) \\) con \\( \\mathbf{f}(\\mathbf{x} e,\\mathbf{u} e)=0 \\), se desarrolla \\( \\mathbf{f} \\) en serie de taylor y se conserva el primer orden. con las desviaciones \\( \\delta\\mathbf{x}=\\mathbf{x}-\\mathbf{x} e \\): \\delta\\dot{\\mathbf{x}} = a\\,\\delta\\mathbf{x} + b\\,\\delta\\mathbf{u}, \\qquad a=\\left.\\frac{\\partial \\mathbf{f}}{\\partial \\mathbf{x}}\\right| e, \\quad b=\\left.\\frac{\\partial \\mathbf{f}}{\\partial \\mathbf{u}}\\right| e \\( a \\) y \\( b \\) son los jacobianos evaluados en el equilibrio. validez (teorema de hartman–grobman): si el equilibrio es hiperbólico (ningún autovalor de \\( a \\) sobre el eje imaginario), el comportamiento cualitativo del no lineal cerca del equilibrio coincide con el del linealizado. es un resultado local (pequeña señal): vale mientras las desviaciones sean pequeñas. falla con no linealidades fuertes (saturación, zona muerta) o en equilibrios no hiperbólicos. cuándo y por qué se usa para diseñar y analizar control con herramientas lineales (polos, bode, impedancia, lqr). el régimen de gran señal (faltas, saturación) requiere otros métodos (simulación no lineal). procedimiento (genérico) 1. halla el equilibrio resolviendo \\( \\mathbf{f}(\\mathbf{x} e,\\mathbf{u} e)=0 \\) (ver equilibrio-fsolve ). 2. calcula los jacobianos \\( a,b \\) (y \\( c,d \\) de la salida): analíticamente o numéricamente (ver linealizacion-numerica ). 3. comprueba que el equilibrio es hiperbólico (ningún autovalor en el eje imaginario). 4. recuerda el rango de validez: solo pequeña señal alrededor de ese punto. ejemplo de código python linealizacion analitica de un pendulo: d/dt theta, w ; equilibrio theta=0 a = 0,1 , -g/l cos(theta e), -b/m evaluado en theta e=0 - 0,1 , -g/l,-b/m parámetros y valores típicos la región de validez depende de la curvatura de \\( \\mathbf{f} \\); en convertidores, las perturbaciones de pequeña señal (p.ej. inyección de impedancia con amplitud pequeña) están en régimen lineal; las faltas, no. errores comunes - linealizar fuera del equilibrio (residuo \\( \\neq 0 \\)) → \\( a \\) sin sentido. - aplicar conclusiones del linealizado en gran señal (cuando hay saturación/current limiting). - equilibrio no hiperbólico (autovalor en \\( j\\omega \\)): el linealizado no decide la estabilidad. uso en proyectos - 01/02 : todo el análisis de estabilidad e impedancia parte de la linealización en el punto de operación; el régimen de gran señal (faltas) se trató por simulación temporal. conceptos relacionados - linealizacion-numerica · equilibrio-fsolve · representacion-espacio-estados · modelado-sistemas referencias - khalil, nonlinear systems , cap. 4. linealizacion jacobiano equilibrio pequena-senal validez"}, {"slug": "marco-dq", "titulo": "M
