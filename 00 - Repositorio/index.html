 orden del controlador si hace falta. errores comunes - pesos mal elegidos → controlador conservador o de orden altísimo. - olvidar reducir el orden: \\(h \\infty\\) da controladores del orden de la planta + pesos. uso en proyectos - candidato a proyecto propio (p.ej. control robusto de un gfl/gfm ante scr incierto). ficha de panorama por ahora. conceptos relacionados - metodos-sintesis-control · funciones-sensibilidad · robustez-parametrica · margenes-estabilidad referencias - skogestad, postlethwaite, multivariable feedback control , cap. 8-9. robusto h-infinito mu-sintesis incertidumbre panorama"}, {"slug": "criterio-middlebrook", "titulo": "Criterio de Middlebrook (estabilidad de cascadas por impedancia)", "categoria": "metodologia", "tipo": "metodo", "nivel": "avanzado", "proyectos": ["03-DataCenter-IA"], "objetivos": ["evaluar la estabilidad de una cascada fuente-carga por sus impedancias"], "tags": ["middlebrook", "impedancia", "cascada", "bus-dc", "estabilidad"], "relacionados": ["estabilidad-bus-dc-cpl", "carga-potencia-constante-cpl", "impedancia-salida-estabilidad", "no-pasividad-resistencia-negativa"], "referencias": ["Middlebrook, Input Filter Considerations in Design of Switching Regulators, IEEE 1976"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Criterio para decidir la estabilidad de una <strong>cascada fuente → carga</strong> (p.ej. filtro/fuente que\nalimenta un convertidor) a partir del cociente de sus impedancias, sin reconstruir el sistema\ncompleto. Es el análogo DC del criterio de estabilidad por impedancia en AC.</p>\n<h2>Fundamento teórico</h2>\n<p>Sea \\( Z_{fuente}(s) \\) la impedancia de salida de la fuente y \\( Z_{carga}(s) \\) la impedancia\nde entrada de la carga. Si ambas son estables por separado, la cascada es estable según el\nNyquist del <strong>cociente</strong>:\n$$ T_m(s) = \\frac{Z_{fuente}(s)}{Z_{carga}(s)} $$\nEl <strong>criterio de Middlebrook</strong> (condición suficiente y conservadora) exige:\n$$ |Z_{fuente}(j\\omega)| \\ll |Z_{carga}(j\\omega)| \\quad \\forall \\omega $$\nes decir, que la impedancia de salida de la fuente sea mucho menor que la de entrada de la carga.\nCon una <a class=\"wl\" data-slug=\"carga-potencia-constante-cpl\">CPL</a>, \\( Z_{carga}=-V^2/P \\) (resistencia negativa,\n\\( |Z|=V^2/P \\)): al subir \\( P \\), \\( |Z_{carga}| \\) baja y, cuando cae por debajo del pico de\nresonancia de \\( |Z_{fuente}| \\), el sistema se inestabiliza. Existen criterios menos\nconservadores (GMPM, banda prohibida, ESAC) que relajan el de Middlebrook.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En sistemas DC en cascada (microrredes DC, data centers, alimentación distribuida) y en filtros\nde entrada de convertidores. Permite diseñar de forma modular: caracterizar fuente y carga por\nseparado.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Obtén \\( Z_{fuente}(j\\omega) \\) (impedancia de salida del filtro/fuente).</li>\n<li>Obtén \\( Z_{carga}(j\\omega) \\) (de la CPL: \\( -V^2/P \\)).</li>\n<li>Compara magnitudes: si \\( |Z_{fuente}| \\) supera \\( |Z_{carga}| \\) en alguna banda → riesgo.</li>\n<li>Para el límite exacto, aplica Nyquist a \\( T_m=Z_{fuente}/Z_{carga} \\).</li>\n<li>Si no cumple: baja \\( |Z_{fuente}| \\) (más \\( C \\), amortiguamiento) o sube \\( |Z_{carga}| \\).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># pico de |Z_fuente| vs |Z_carga| = V^2/P  -&gt; potencia limite\nP_lim = V**2 / np.max(np.abs(Z_fuente))\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Margen recomendado: \\( |Z_{fuente}| \\) varias veces menor que \\( |Z_{carga}| \\) en la resonancia.\nCriterio conservador (deja margen de diseño).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Aplicar Middlebrook (muy conservador) y sobredimensionar; para el límite real usar Nyquist del cociente.</li>\n<li>Olvidar que \\( |Z_{carga}| \\) de la CPL baja al subir la potencia.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>03 - DataCenter-IA</strong>: pico de \\( |Z_{fuente}|\\approx 4.8 \\) Ω → potencia límite \\( V^2/4.8 \\approx 134 \\)\n  kW, coincide con la \\( P_{crit} \\) por autovalores (128 kW). Validación cruzada de la Fase 2.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"estabilidad-bus-dc-cpl\">estabilidad-bus-dc-cpl</a> · <a class=\"wl\" data-slug=\"carga-potencia-constante-cpl\">carga-potencia-constante-cpl</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Middlebrook, <em>Input Filter Considerations...</em>, IEEE 1976.</li>\n</ul>", "buscar": "criterio de middlebrook (estabilidad de cascadas por impedancia) definición criterio para decidir la estabilidad de una cascada fuente → carga (p.ej. filtro/fuente que alimenta un convertidor) a partir del cociente de sus impedancias, sin reconstruir el sistema completo. es el análogo dc del criterio de estabilidad por impedancia en ac. fundamento teórico sea \\( z {fuente}(s) \\) la impedancia de salida de la fuente y \\( z {carga}(s) \\) la impedancia de entrada de la carga. si ambas son estables por separado, la cascada es estable según el nyquist del cociente : t m(s) = \\frac{z {fuente}(s)}{z {carga}(s)} el criterio de middlebrook (condición suficiente y conservadora) exige: |z {fuente}(j\\omega)| \\ll |z {carga}(j\\omega)| \\quad \\forall \\omega es decir, que la impedancia de salida de la fuente sea mucho menor que la de entrada de la carga. con una carga-potencia-constante-cpl|cpl , \\( z {carga}=-v^2/p \\) (resistencia negativa, \\( |z|=v^2/p \\)): al subir \\( p \\), \\( |z {carga}| \\) baja y, cuando cae por debajo del pico de resonancia de \\( |z {fuente}| \\), el sistema se inestabiliza. existen criterios menos conservadores (gmpm, banda prohibida, esac) que relajan el de middlebrook. cuándo y por qué se usa en sistemas dc en cascada (microrredes dc, data centers, alimentación distribuida) y en filtros de entrada de convertidores. permite diseñar de forma modular: caracterizar fuente y carga por separado. procedimiento (genérico) 1. obtén \\( z {fuente}(j\\omega) \\) (impedancia de salida del filtro/fuente). 2. obtén \\( z {carga}(j\\omega) \\) (de la cpl: \\( -v^2/p \\)). 3. compara magnitudes: si \\( |z {fuente}| \\) supera \\( |z {carga}| \\) en alguna banda → riesgo. 4. para el límite exacto, aplica nyquist a \\( t m=z {fuente}/z {carga} \\). 5. si no cumple: baja \\( |z {fuente}| \\) (más \\( c \\), amortiguamiento) o sube \\( |z {carga}| \\). ejemplo de código python pico de |z fuente| vs |z carga| = v^2/p - potencia limite p lim = v 2 / np.max(np.abs(z fuente)) parámetros y valores típicos margen recomendado: \\( |z {fuente}| \\) varias veces menor que \\( |z {carga}| \\) en la resonancia. criterio conservador (deja margen de diseño). errores comunes - aplicar middlebrook (muy conservador) y sobredimensionar; para el límite real usar nyquist del cociente. - olvidar que \\( |z {carga}| \\) de la cpl baja al subir la potencia. uso en proyectos - 03 - datacenter-ia : pico de \\( |z {fuente}|\\approx 4.8 \\) ω → potencia límite \\( v^2/4.8 \\approx 134 \\) kw, coincide con la \\( p {crit} \\) por autovalores (128 kw). validación cruzada de la fase 2. conceptos relacionados - estabilidad-bus-dc-cpl · carga-potencia-constante-cpl · impedancia-salida-estabilidad referencias - middlebrook, input filter considerations... , ieee 1976. middlebrook impedancia cascada bus-dc estabilidad"}, {"slug": "especificaciones-control", "titulo": "Especificaciones de control (traducir requisitos a métricas)", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["fijar objetivos medibles antes de disenar"], "tags": ["especificaciones", "ancho-de-banda", "margen", "requisitos", "diseno"], "relacionados": ["ciclo-diseno-control", "metricas-desempeno", "margenes-estabilidad", "metodos-sintesis-control"], "referencias": ["Aström, Murray, Feedback Systems, Princeton 2008 (cap. 11)"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Primer paso del diseño: convertir requisitos cualitativos (\"rápido\", \"estable\", \"robusto\") en\n<strong>números objetivo</strong> que guían la síntesis y sirven de criterio de aceptación.</p>\n<h2>Fundamento teórico</h2>\n<p>Especificaciones típicas y su forma medible:\n- <strong>Velocidad / ancho de banda</strong> \\( \\omega_c \\) (frecuencia de cruce de ganancia). Regla:\n  \\( t_{s}\\approx 4/(\\zeta\\omega_n) \\), \\( \\omega_c \\) marca la rapidez del lazo.\n- <strong>Amortiguamiento</strong> \\( \\zeta \\) (o sobreimpulso \\( M_p\\approx e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}} \\)).\n- <strong>Robustez</strong>: margen de fase \\( \\ge 40\\text{–}60° \\), margen de ganancia \\( \\ge 6 \\) dB,\n  pico de sensibilidad \\( M_s \\le 2 \\) (≈6 dB).\n- <strong>Error en régimen</strong>: tipo de sistema / ganancia DC para anular error a escalón/rampa.\n- <strong>Rechazo de perturbación</strong> y atenuación de ruido (forma de S y T, ver <a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a>).</p>\n<p>En convertidores hay además restricciones físicas: \\( \\omega_c < \\) (1/5–1/10) de \\( f_{sw} \\),\ny separación de escalas entre lazos en cascada.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Antes de elegir cualquier método. Sin especificaciones medibles no hay forma de saber si el\ndiseño \"está bien\" ni de validarlo objetivamente.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Lista los requisitos del sistema (rapidez, precisión, robustez, límites físicos).</li>\n<li>Tradúcelos a métricas: \\( \\omega_c, \\zeta/M_p, \\) márgenes, \\( M_s \\), error, anchos de\n   banda relativos de lazos en cascada.</li>\n<li>Comprueba compatibilidad (p.ej. ancho de banda vs \\( f_{sw} \\), vs resonancia del filtro).</li>\n<li>Documenta cada métrica como <strong>criterio de aceptación</strong> para la fase de evaluación/validación.</li>\n</ol>\n<h2>Parámetros y valores típicos (convertidores)</h2>\n<p>Lazo de corriente: \\( f_c \\) ≈ \\( f_{sw}/10 \\). Lazo de tensión: ≈ \\( f_{ci}/(3\\text{–}5) \\).\nMargen de fase 45–60°, \\( M_s \\) &lt; 2. Droop/PLL: el lazo más lento (Hz–decenas de Hz).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>\"Ajustar hasta que vaya\" sin objetivos → no es reproducible ni validable.</li>\n<li>Pedir ancho de banda incompatible con \\( f_{sw} \\) o con la resonancia del filtro.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: lazo de corriente ~1 kHz, tensión ~350 Hz, droop/PLL ~Hz; margen y \\( \\zeta \\)\n  objetivo guiaron la sintonía (modo de potencia GFM a \\( \\zeta=0.40 \\)).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"ciclo-diseno-control\">ciclo-diseno-control</a> · <a class=\"wl\" data-slug=\"metricas-desempeno\">metricas-desempeno</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Aström, Murray, <em>Feedback Systems</em>, cap. 11.</li>\n</ul>", "buscar": "especificaciones de control (traducir requisitos a métricas) definición primer paso del diseño: convertir requisitos cualitativos (\"rápido\", \"estable\", \"robusto\") en números objetivo que guían la síntesis y sirven de criterio de aceptación. fundamento teórico especificaciones típicas y su forma medible: - velocidad / ancho de banda \\( \\omega c \\) (frecuencia de cruce de ganancia). regla: \\( t {s}\\approx 4/(\\zeta\\omega n) \\), \\( \\omega c \\) marca la rapidez del lazo. - amortiguamiento \\( \\zeta \\) (o sobreimpulso \\( m p\\approx e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}} \\)). - robustez : margen de fase \\( \\ge 40\\text{–}60° \\), margen de ganancia \\( \\ge 6 \\) db, pico de sensibilidad \\( m s \\le 2 \\) (≈6 db). - error en régimen : tipo de sistema / ganancia dc para anular error a escalón/rampa. - rechazo de perturbación y atenuación de ruido (forma de s y t, ver funciones-sensibilidad ). en convertidores hay además restricciones físicas: \\( \\omega c < \\) (1/5–1/10) de \\( f {sw} \\), y separación de escalas entre lazos en cascada. cuándo y por qué se usa antes de elegir cualquier método. sin especificaciones medibles no hay forma de saber si el diseño \"está bien\" ni de validarlo objetivamente. procedimiento (genérico) 1. lista los requisitos del sistema (rapidez, precisión, robustez, límites físicos). 2. tradúcelos a métricas: \\( \\omega c, \\zeta/m p, \\) márgenes, \\( m s \\), error, anchos de banda relativos de lazos en cascada. 3. comprueba compatibilidad (p.ej. ancho de banda vs \\( f {sw} \\), vs resonancia del filtro). 4. documenta cada métrica como criterio de aceptación para la fase de evaluación/validación. parámetros y valores típicos (convertidores) lazo de corriente: \\( f c \\) ≈ \\( f {sw}/10 \\). lazo de tensión: ≈ \\( f {ci}/(3\\text{–}5) \\). margen de fase 45–60°, \\( m s \\) < 2. droop/pll: el lazo más lento (hz–decenas de hz). errores comunes - \"ajustar hasta que vaya\" sin objetivos → no es reproducible ni validable. - pedir ancho de banda incompatible con \\( f {sw} \\) o con la resonancia del filtro. uso en proyectos - 01/02 : lazo de corriente ~1 khz, tensión ~350 hz, droop/pll ~hz; margen y \\( \\zeta \\) objetivo guiaron la sintonía (modo de potencia gfm a \\( \\zeta=0.40 \\)). conceptos relacionados - ciclo-diseno-control · metricas-desempeno · margenes-estabilidad referencias - aström, murray, feedback systems , cap. 11. especificaciones ancho-de-banda margen requisitos diseno"}, {"slug": "funciones-sensibilidad", "titulo": "Funciones de sensibilidad (S y T)", "categoria": "metodologia", "tipo": "concepto", "nivel": "avanzado", "proyectos": ["01-GFM-Impedance"], "objetivos": ["evaluar rechazo de perturbacion", "ruido y robustez"], "tags": ["sensibilidad", "S", "T", "rechazo", "ruido", "compromiso-bode"], "relacionados": ["margenes-estabilidad", "loop-shaping", "metricas-desempeno", "control-robusto-hinf"], "referencias": ["Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Las funciones que describen cómo el lazo cerrado responde a referencia, perturbación y ruido. La\n<strong>sensibilidad</strong> \\( S \\) y la <strong>complementaria</strong> \\( T \\) resumen casi todo el desempeño y la\nrobustez en un solo par de curvas.</p>\n<h2>Fundamento teórico</h2>\n<p>Con ganancia de lazo \\( L=CG \\):\n$$ S=\\frac{1}{1+L}, \\qquad T=\\frac{L}{1+L}, \\qquad S+T=1 $$\n- \\( S \\): de la perturbación de salida y de la referencia al error. Pequeña \\( S \\) (baja\n  frecuencia) → buen rechazo y seguimiento.\n- \\( T \\): de la referencia a la salida y del <strong>ruido</strong> de medida a la salida. Pequeña \\( T \\)\n  (alta frecuencia) → atenúa ruido y dinámica no modelada.\n- <strong>Compromiso de Bode</strong>: como \\( S+T=1 \\), no pueden ser ambas pequeñas en la misma banda;\n  además \\( \\int \\ln|S|\\,d\\omega = 0 \\) (área de \"waterbed\"): reducir \\( S \\) en una banda la\n  aumenta en otra. \\( M_s=\\max|S| \\) es el <a class=\"wl\" data-slug=\"margenes-estabilidad\">margen de módulo</a>.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para evaluar de un vistazo rechazo (S), atenuación de ruido (T) y robustez (\\( M_s \\)), y para\ndiseñar por <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> o \\(H_\\infty\\) (los pesos dan forma a S y T).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Calcula \\( L(j\\omega) \\), luego \\( S \\) y \\( T \\).</li>\n<li>Verifica: \\( |S| \\) pequeña en baja frecuencia (rechazo), \\( |T| \\) pequeña en alta (ruido).</li>\n<li>Lee \\( M_s=\\max|S| \\) (objetivo &lt; 2) y el ancho de banda (donde \\( |T|=-3 \\) dB).</li>\n<li>Si el compromiso no cumple, reubica el cruce o cambia de método.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">S = 1/(1+L);  T = L/(1+L)\nMs = np.max(np.abs(S(1j*w)));  BW = w[np.argmin(np.abs(np.abs(T(1j*w))-1/np.sqrt(2)))]\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( M_s<2 \\) (6 dB). Ancho de banda de \\( T \\) ≈ \\( \\omega_c \\). \\( |T| \\) cae en alta frecuencia.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Intentar S y T pequeñas a la vez en la misma banda (imposible, \\( S+T=1 \\)).</li>\n<li>Subir ganancia para mejorar rechazo sin mirar el pico de \\( S \\) (empeora robustez).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 (GFM)</strong>: el comportamiento de la impedancia de salida y el pico del modo de potencia se\n  interpretan como sensibilidad; el buen \\( \\zeta \\) evita un pico de \\( S \\) alto.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> · <a class=\"wl\" data-slug=\"metricas-desempeno\">metricas-desempeno</a> · <a class=\"wl\" data-slug=\"control-robusto-hinf\">control-robusto-hinf</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, 2005.</li>\n</ul>", "buscar": "funciones de sensibilidad (s y t) definición las funciones que describen cómo el lazo cerrado responde a referencia, perturbación y ruido. la sensibilidad \\( s \\) y la complementaria \\( t \\) resumen casi todo el desempeño y la robustez en un solo par de curvas. fundamento teórico con ganancia de lazo \\( l=cg \\): s=\\frac{1}{1+l}, \\qquad t=\\frac{l}{1+l}, \\qquad s+t=1 - \\( s \\): de la perturbación de salida y de la referencia al error. pequeña \\( s \\) (baja frecuencia) → buen rechazo y seguimiento. - \\( t \\): de la referencia a la salida y del ruido de medida a la salida. pequeña \\( t \\) (alta frecuencia) → atenúa ruido y dinámica no modelada. - compromiso de bode : como \\( s+t=1 \\), no pueden ser ambas pequeñas en la misma banda; además \\( \\int \\ln|s|\\,d\\omega = 0 \\) (área de \"waterbed\"): reducir \\( s \\) en una banda la aumenta en otra. \\( m s=\\max|s| \\) es el margenes-estabilidad|margen de módulo . cuándo y por qué se usa para evaluar de un vistazo rechazo (s), atenuación de ruido (t) y robustez (\\( m s \\)), y para diseñar por loop-shaping o \\(h \\infty\\) (los pesos dan forma a s y t). procedimiento (genérico) 1. calcula \\( l(j\\omega) \\), luego \\( s \\) y \\( t \\). 2. verifica: \\( |s| \\) pequeña en baja frecuencia (rechazo), \\( |t| \\) pequeña en alta (ruido). 3. lee \\( m s=\\max|s| \\) (objetivo < 2) y el ancho de banda (donde \\( |t|=-3 \\) db). 4. si el compromiso no cumple, reubica el cruce o cambia de método. ejemplo de código python s = 1/(1+l); t = l/(1+l) ms = np.max(np.abs(s(1j w))); bw = w np.argmin(np.abs(np.abs(t(1j w))-1/np.sqrt(2))) parámetros y valores típicos \\( m s<2 \\) (6 db). ancho de banda de \\( t \\) ≈ \\( \\omega c \\). \\( |t| \\) cae en alta frecuencia. errores comunes - intentar s y t pequeñas a la vez en la misma banda (imposible, \\( s+t=1 \\)). - subir ganancia para mejorar rechazo sin mirar el pico de \\( s \\) (empeora robustez). uso en proyectos - 01 (gfm) : el comportamiento de la impedancia de salida y el pico del modo de potencia se interpretan como sensibilidad; el buen \\( \\zeta \\) evita un pico de \\( s \\) alto. conceptos relacionados - margenes-estabilidad · loop-shaping · metricas-desempeno · control-robusto-hinf referencias - skogestad, postlethwaite, multivariable feedback control , 2005. sensibilidad s t rechazo ruido compromiso-bode"}, {"slug": "loop-shaping", "titulo": "Loop-shaping (diseño en frecuencia)", "categoria": "metodologia", "tipo": "metodo", "nivel": "avanzado", "proyectos": ["01-GFM-Impedance"], "objetivos": ["disenar el controlador dando forma a la ganancia de lazo"], "tags": ["bode", "ganancia-de-lazo", "frecuencia", "margen", "diseno"], "relacionados": ["metodos-sintesis-control", "margenes-estabilidad", "funciones-sensibilidad", "sintonia-pi-pid"], "referencias": ["Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005 (cap. 2-3)"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Método de diseño que da forma a la <strong>ganancia de lazo abierto</strong> \\( L(s)=C(s)G(s) \\) en el dominio\nde la frecuencia para cumplir las especificaciones, en vez de razonar sobre los polos cerrados.</p>\n<h2>Fundamento teórico</h2>\n<p>Objetivos de forma de \\( L(j\\omega) \\):\n- <strong>Baja frecuencia</strong>: ganancia alta → buen seguimiento y rechazo (S pequeña).\n- <strong>Cruce \\( \\omega_c \\)</strong>: fija el ancho de banda; pendiente ≈ −20 dB/dec en el cruce para buen\n  margen de fase.\n- <strong>Alta frecuencia</strong>: ganancia baja → atenúa ruido y dinámica no modelada (T pequeña).\nCompromiso fundamental (Bode): no se puede tener S y T pequeñas a la vez en la misma banda\n(\\( S+T=1 \\)); ver <a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a>. El margen de fase y \\( M_s \\) se leen directo de \\( L \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando se quiere control explícito del compromiso desempeño/robustez/ruido, o la planta tiene\nresonancias/retardos que conviene modelar en frecuencia. Es el lenguaje natural del análisis de\nimpedancia.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Traza \\( G(j\\omega) \\) (Bode de la planta).</li>\n<li>Diseña \\( C(s) \\) para situar el cruce en \\( \\omega_c \\) con pendiente −20 dB/dec y margen de\n   fase objetivo (añade ceros/polos, adelanto-retardo).</li>\n<li>Comprueba S y T (sensibilidad/complementaria) y \\( M_s \\).</li>\n<li>Itera hasta el compromiso deseado.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\nL = C(1j*w) * G(1j*w)                  # ganancia de lazo\nwc = w[np.argmin(np.abs(np.abs(L)-1))] # cruce de ganancia\nPM = 180 + np.degrees(np.angle(L[np.argmin(np.abs(np.abs(L)-1))]))  # margen de fase\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Margen de fase 45–60°, pendiente −20 dB/dec en el cruce, \\( M_s<2 \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Cruce con pendiente −40 dB/dec → margen de fase pobre.</li>\n<li>Forzar S pequeña en banda donde T debe serlo (viola el compromiso de Bode).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 (GFM)</strong>: el diagnóstico del lazo de potencia se hizo en frecuencia (margen de fase −86°\n  reveló la causa de la inestabilidad), lenguaje de loop-shaping.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"metodos-sintesis-control\">metodos-sintesis-control</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, 2005.</li>\n</ul>", "buscar": "loop-shaping (diseño en frecuencia) definición método de diseño que da forma a la ganancia de lazo abierto \\( l(s)=c(s)g(s) \\) en el dominio de la frecuencia para cumplir las especificaciones, en vez de razonar sobre los polos cerrados. fundamento teórico objetivos de forma de \\( l(j\\omega) \\): - baja frecuencia : ganancia alta → buen seguimiento y rechazo (s pequeña). - cruce \\( \\omega c \\) : fija el ancho de banda; pendiente ≈ −20 db/dec en el cruce para buen margen de fase. - alta frecuencia : ganancia baja → atenúa ruido y dinámica no modelada (t pequeña). compromiso fundamental (bode): no se puede tener s y t pequeñas a la vez en la misma banda (\\( s+t=1 \\)); ver funciones-sensibilidad . el margen de fase y \\( m s \\) se leen directo de \\( l \\). cuándo y por qué se usa cuando se quiere control explícito del compromiso desempeño/robustez/ruido, o la planta tiene resonancias/retardos que conviene modelar en frecuencia. es el lenguaje natural del análisis de impedancia. procedimiento (genérico) 1. traza \\( g(j\\omega) \\) (bode de la planta). 2. diseña \\( c(s) \\) para situar el cruce en \\( \\omega c \\) con pendiente −20 db/dec y margen de fase objetivo (añade ceros/polos, adelanto-retardo). 3. comprueba s y t (sensibilidad/complementaria) y \\( m s \\). 4. itera hasta el compromiso deseado. ejemplo de código python import numpy as np l = c(1j w) g(1j w) ganancia de lazo wc = w np.argmin(np.abs(np.abs(l)-1)) cruce de ganancia pm = 180 + np.degrees(np.angle(l np.argmin(np.abs(np.abs(l)-1)) )) margen de fase parámetros y valores típicos margen de fase 45–60°, pendiente −20 db/dec en el cruce, \\( m s<2 \\). errores comunes - cruce con pendiente −40 db/dec → margen de fase pobre. - forzar s pequeña en banda donde t debe serlo (viola el compromiso de bode). uso en proyectos - 01 (gfm) : el diagnóstico del lazo de potencia se hizo en frecuencia (margen de fase −86° reveló la causa de la inestabilidad), lenguaje de loop-shaping. conceptos relacionados - metodos-sintesis-control · margenes-estabilidad · funciones-sensibilidad referencias - skogestad, postlethwaite, multivariable feedback control , 2005. bode ganancia-de-lazo frecuencia margen diseno"}, {"slug": "margenes-estabilidad", "titulo": "Márgenes de estabilidad (ganancia, fase, módulo)", "categoria": "metodologia", "tipo": "metodo", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["cuantificar cuanto margen tiene el diseno antes de inestabilizarse"], "tags": ["margen-fase", "margen-ganancia", "M_s", "robustez", "nyquist"], "relacionados": ["funciones-sensibilidad", "loop-shaping", "robustez-parametrica", "impedancia-salida-estabilidad"], "referencias": ["Aström, Murray, Feedback Systems, Princeton 2008"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Medidas de <strong>cuánto puede cambiar</strong> el sistema antes de volverse inestable. Cuantifican la\nrobustez del diseño, no solo si es estable.</p>\n<h2>Fundamento teórico</h2>\n<p>Sobre la ganancia de lazo \\( L(j\\omega) \\):\n- <strong>Margen de ganancia</strong> (GM): cuánto se puede subir la ganancia antes de inestabilizar (a la\n  frecuencia donde la fase es −180°).\n- <strong>Margen de fase</strong> (PM): retardo de fase admisible en el cruce de ganancia (\\( |L|=1 \\)).\n  Se relaciona con el amortiguamiento: \\( \\zeta\\approx \\mathrm{PM}/100 \\).\n- <strong>Margen de módulo</strong> \\( = 1/M_s \\), con \\( M_s=\\max_\\omega |S(j\\omega)| \\) (pico de\n  sensibilidad): distancia mínima de \\( L(j\\omega) \\) al punto crítico −1. Es el más completo\n  (resume GM y PM). \\( M_s<2 \\) (≈6 dB) es buen objetivo.\n- <strong>Margen de retardo</strong>: \\( \\mathrm{PM}/\\omega_c \\) → retardo de cómputo/PWM admisible.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Tras comprobar estabilidad nominal: dice si el diseño aguanta variaciones de planta, retardos y\nerrores de modelo. Imprescindible antes de validar en hardware.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Calcula \\( L(j\\omega)=C(j\\omega)G(j\\omega) \\) (o el minor loop gain en impedancia).</li>\n<li>PM y GM con <code>control.margin</code> o leyendo el cruce; \\( M_s \\) como pico de \\( |S| \\).</li>\n<li>Comprueba contra los objetivos (PM 45–60°, GM&gt;6 dB, \\( M_s<2 \\)).</li>\n<li>Convierte PM a margen de retardo y compáralo con el retardo real (cómputo + PWM).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct\ngm, pm, wcg, wcp = ct.margin(L)        # L: ganancia de lazo (sistema LTI)\nMs = (1/(1+L)).frequency_response(w)   # pico = M_s ; margen de modulo = 1/Ms\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>PM 45–60°, GM &gt; 6 dB, \\( M_s < 2 \\). Margen de retardo &gt; varios periodos de muestreo.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mirar solo PM/GM: pueden ser buenos y aún tener \\( M_s \\) alto (poco robusto). Usar \\( M_s \\).</li>\n<li>Olvidar el retardo de cómputo/PWM al evaluar el margen real.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 (GFM)</strong>: el lazo de potencia tenía <strong>margen de fase −86°</strong> (inestable) — eso reveló la\n  causa y guió la cura (impedancia virtual). El criterio de impedancia (Fase 3) es el Nyquist\n  generalizado equivalente.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a> · <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"robustez-parametrica\">robustez-parametrica</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Aström, Murray, <em>Feedback Systems</em>, 2008.</li>\n</ul>", "buscar": "márgenes de estabilidad (ganancia, fase, módulo) definición medidas de cuánto puede cambiar el sistema antes de volverse inestable. cuantifican la robustez del diseño, no solo si es estable. fundamento teórico sobre la ganancia de lazo \\( l(j\\omega) \\): - margen de ganancia (gm): cuánto se puede subir la ganancia antes de inestabilizar (a la frecuencia donde la fase es −180°). - margen de fase (pm): retardo de fase admisible en el cruce de ganancia (\\( |l|=1 \\)). se relaciona con el amortiguamiento: \\( \\zeta\\approx \\mathrm{pm}/100 \\). - margen de módulo \\( = 1/m s \\), con \\( m s=\\max \\omega |s(j\\omega)| \\) (pico de sensibilidad): distancia mínima de \\( l(j\\omega) \\) al punto crítico −1. es el más completo (resume gm y pm). \\( m s<2 \\) (≈6 db) es buen objetivo. - margen de retardo : \\( \\mathrm{pm}/\\omega c \\) → retardo de cómputo/pwm admisible. cuándo y por qué se usa tras comprobar estabilidad nominal: dice si el diseño aguanta variaciones de planta, retardos y errores de modelo. imprescindible antes de validar en hardware. procedimiento (genérico) 1. calcula \\( l(j\\omega)=c(j\\omega)g(j\\omega) \\) (o el minor loop gain en impedancia). 2. pm y gm con control.margin o leyendo el cruce; \\( m s \\) como pico de \\( |s| \\). 3. comprueba contra los objetivos (pm 45–60°, gm 6 db, \\( m s<2 \\)). 4. convierte pm a margen de retardo y compáralo con el retardo real (cómputo + pwm). ejemplo de código python import control as ct gm, pm, wcg, wcp = ct.margin(l) l: ganancia de lazo (sistema lti) ms = (1/(1+l)).frequency response(w) pico = m s ; margen de modulo = 1/ms parámetros y valores típicos pm 45–60°, gm 6 db, \\( m s < 2 \\). margen de retardo varios periodos de muestreo. errores comunes - mirar solo pm/gm: pueden ser buenos y aún tener \\( m s \\) alto (poco robusto). usar \\( m s \\). - olvidar el retardo de cómputo/pwm al evaluar el margen real. uso en proyectos - 01 (gfm) : el lazo de potencia tenía margen de fase −86° (inestable) — eso reveló la causa y guió la cura (impedancia virtual). el criterio de impedancia (fase 3) es el nyquist generalizado equivalente. conceptos relacionados - funciones-sensibilidad · loop-shaping · impedancia-salida-estabilidad · robustez-parametrica referencias - aström, murray, feedback systems , 2008. margen-fase margen-ganancia m s robustez nyquist"}, {"slug": "metodos-sintesis-control", "titulo": "Métodos de síntesis de control (panorama)", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["elegir el metodo de diseno adecuado al problema"], "tags": ["sintesis", "clasico", "estado", "robusto", "predictivo", "panorama"], "relacionados": ["ciclo-diseno-control", "sintonia-pi-pid", "loop-shaping", "asignacion-polos-lqr", "control-predictivo", "control-robusto-hinf"], "referencias": ["Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Catálogo de familias de métodos para obtener el controlador a partir del modelo y las\nespecificaciones, con sus compromisos. Sirve para <strong>elegir</strong> el método antes de detallarlo.</p>\n<h2>Fundamento teórico (familias)</h2>\n<ul>\n<li><strong>Clásico SISO</strong> — lugar de raíces y <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> en Bode; sintonía <a class=\"wl\" data-slug=\"sintonia-pi-pid\">sintonia-pi-pid</a>\n  (cancelación de polo, módulo/simetría óptima). Intuitivo, lazo a lazo. Base de los convertidores.</li>\n<li><strong>Espacio de estados</strong> — <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a>: asignación de polos (colocar autovalores) y\n  <strong>LQR/LQG</strong> (óptimo cuadrático + observador). Natural para sistemas MIMO y de muchos estados.</li>\n<li><strong>Robusto / óptimo</strong> — <a class=\"wl\" data-slug=\"control-robusto-hinf\">control-robusto-hinf</a> (\\(H_\\infty\\), \\(\\mu\\)-síntesis): diseña para el\n  peor caso de incertidumbre, con garantías de robustez.</li>\n<li><strong>Predictivo</strong> — <a class=\"wl\" data-slug=\"control-predictivo\">control-predictivo</a> (MPC, FCS-MPC): optimiza sobre un horizonte con\n  restricciones explícitas; muy usado en convertidores y máquinas.</li>\n<li><strong>Específicos de convertidores</strong> — separación de escalas, impedancia virtual, amortiguamiento\n  activo: dan forma a la dinámica aprovechando la estructura física.</li>\n</ul>\n<h2>Cuándo elegir cada uno (guía rápida)</h2>\n<table>\n<thead>\n<tr>\n<th>Situación</th>\n<th>Método recomendado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SISO, intuición física, convertidor estándar</td>\n<td>clásico (Bode/lugar de raíces) + cascada</td>\n</tr>\n<tr>\n<td>MIMO acoplado, muchos estados</td>\n<td>espacio de estados (LQR)</td>\n</tr>\n<tr>\n<td>Incertidumbre fuerte, garantías</td>\n<td>\\(H_\\infty\\) / robusto</td>\n</tr>\n<tr>\n<td>Restricciones de corriente/tensión explícitas</td>\n<td>MPC / FCS-MPC</td>\n</tr>\n<tr>\n<td>Resonancias de filtro, redes débiles</td>\n<td>impedance shaping + damping</td>\n</tr>\n</tbody>\n</table>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Clasifica el problema (SISO/MIMO, lineal, restricciones, incertidumbre).</li>\n<li>Elige la familia según la tabla y la experiencia del equipo.</li>\n<li>Diseña, evalúa (márgenes, sensibilidad) y valida.</li>\n<li>Si no cumple robustez/restricciones, sube de familia (clásico → estado → robusto/predictivo).</li>\n</ol>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: método clásico (cascada + sintonía por ancho de banda) + técnicas de convertidor\n  (impedancia virtual, damping activo, PLL). Los demás métodos se abordarán en proyectos propios.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"sintonia-pi-pid\">sintonia-pi-pid</a> · <a class=\"wl\" data-slug=\"loop-shaping\">loop-shaping</a> · <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a> · <a class=\"wl\" data-slug=\"control-predictivo\">control-predictivo</a> · <a class=\"wl\" data-slug=\"control-robusto-hinf\">control-robusto-hinf</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, 2005.</li>\n</ul>", "buscar": "métodos de síntesis de control (panorama) definición catálogo de familias de métodos para obtener el controlador a partir del modelo y las especificaciones, con sus compromisos. sirve para elegir el método antes de detallarlo. fundamento teórico (familias) - clásico siso — lugar de raíces y loop-shaping en bode; sintonía sintonia-pi-pid (cancelación de polo, módulo/simetría óptima). intuitivo, lazo a lazo. base de los convertidores. - espacio de estados — asignacion-polos-lqr : asignación de polos (colocar autovalores) y lqr/lqg (óptimo cuadrático + observador). natural para sistemas mimo y de muchos estados. - robusto / óptimo — control-robusto-hinf (\\(h \\infty\\), \\(\\mu\\)-síntesis): diseña para el peor caso de incertidumbre, con garantías de robustez. - predictivo — control-predictivo (mpc, fcs-mpc): optimiza sobre un horizonte con restricciones explícitas; muy usado en convertidores y máquinas. - específicos de convertidores — separación de escalas, impedancia virtual, amortiguamiento activo: dan forma a la dinámica aprovechando la estructura física. cuándo elegir cada uno (guía rápida) | situación | método recomendado | |---|---| | siso, intuición física, convertidor estándar | clásico (bode/lugar de raíces) + cascada | | mimo acoplado, muchos estados | espacio de estados (lqr) | | incertidumbre fuerte, garantías | \\(h \\infty\\) / robusto | | restricciones de corriente/tensión explícitas | mpc / fcs-mpc | | resonancias de filtro, redes débiles | impedance shaping + damping | procedimiento (genérico) 1. clasifica el problema (siso/mimo, lineal, restricciones, incertidumbre). 2. elige la familia según la tabla y la experiencia del equipo. 3. diseña, evalúa (márgenes, sensibilidad) y valida. 4. si no cumple robustez/restricciones, sube de familia (clásico → estado → robusto/predictivo). uso en proyectos - 01/02 : método clásico (cascada + sintonía por ancho de banda) + técnicas de convertidor (impedancia virtual, damping activo, pll). los demás métodos se abordarán en proyectos propios. conceptos relacionados - sintonia-pi-pid · loop-shaping · asignacion-polos-lqr · control-predictivo · control-robusto-hinf referencias - skogestad, postlethwaite, multivariable feedback control , 2005. sintesis clasico estado robusto predictivo panorama"}, {"slug": "metricas-desempeno", "titulo": "Métricas de desempeño (temporal y frecuencial)", "categoria": "metodologia", "tipo": "concepto", "nivel": "basico", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["medir si el control cumple los objetivos de desempeno"], "tags": ["sobreimpulso", "tiempo-establecimiento", "ancho-de-banda", "zeta", "metricas"], "relacionados": ["especificaciones-control", "analisis-modal", "funciones-sensibilidad", "margenes-estabilidad"], "referencias": ["Aström, Murray, Feedback Systems, Princeton 2008"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Conjunto de números que cuantifican cómo de bien se comporta el lazo cerrado, en el dominio del\ntiempo y de la frecuencia. Son los criterios de aceptación frente a las especificaciones.</p>\n<h2>Fundamento teórico</h2>\n<p><strong>Temporal</strong> (respuesta a escalón):\n- Sobreimpulso \\( M_p \\), tiempo de subida \\( t_r \\), tiempo de establecimiento\n  \\( t_s\\approx 4/(\\zeta\\omega_n) \\), error en régimen \\( e_{ss} \\).\n- Para 2º orden: \\( M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}} \\) → relación directa con \\( \\zeta \\).</p>\n<p><strong>Frecuencial</strong>:\n- Ancho de banda (donde \\( |T|=-3 \\) dB), pico de resonancia \\( M_r \\), \\( M_s=\\max|S| \\).\n- Amortiguamiento de cada modo \\( \\zeta_i=-\\sigma_i/|\\lambda_i| \\) (ver <a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a>).</p>\n<p>Para sistemas de orden alto (un convertidor), las fórmulas de 2º orden son orientativas; lo\nriguroso es mirar polos dominantes + simulación.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En la fase de evaluación, para comprobar objetivamente contra las <a class=\"wl\" data-slug=\"especificaciones-control\">especificaciones-control</a>.\nTambién guían el rediseño (qué métrica falla → qué tocar).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Respuesta a escalón (simulación o <code>control.step_response</code>) → \\( M_p, t_s, e_{ss} \\).</li>\n<li>Respuesta en frecuencia → ancho de banda, \\( M_r, M_s \\).</li>\n<li>Autovalores → \\( \\zeta \\) de cada modo (criterio \\( \\zeta>0.1 \\), idealmente &gt;0.3).</li>\n<li>Compara con objetivos; identifica el modo/métrica limitante.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> El lazo de tensión de un microgrid ante un escalón de carga del 50 % muestra: caída pico de 7 %, recuperación en 80 ms, sobreimpulso de retorno de 3 %. Evaluar contra especificaciones habituales y calcular el amortiguamiento del modo dominante.</p>\n<p>Métricas medidas vs. límites típicos de microrredes: caída \\( 7\\,\\%<10\\,\\% \\) (\\(\\checkmark\\)), tiempo de asentamiento \\( 80\\,\\text{ms}<100\\,\\text{ms} \\) (\\(\\checkmark\\)), sobreimpulso de retorno \\( 3\\,\\%<5\\,\\% \\) (\\(\\checkmark\\)). El modo dominante tiene frecuencia de oscilación \\( \\approx3\\,\\text{Hz} \\): con el sobreimpulso del 3 %, \\( \\zeta\\approx0.65 \\). Comparar con un diseño más agresivo (caída 4 %, 50 ms, retorno 8 %): mejora caída y asentamiento pero viola el límite de retorno. Las métricas no son independientes — el optimum no es siempre el más rápido.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct, numpy as np\nt, y = ct.step_response(T)\nMp = (y.max()-y[-1])/y[-1]*100\nts = t[np.where(np.abs(y-y[-1])&gt;0.02*y[-1])[0][-1]]   # banda del 2%\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( \\zeta>0.3 \\) bueno, \\( M_p<10\\% \\), \\( M_s<2 \\). En convertidores el modo electromecánico\n(droop/PLL) suele ser el limitante.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Aplicar fórmulas de 2º orden a un sistema de orden alto sin verificar polos dominantes.</li>\n<li>Medir solo en un punto de operación (ver <a class=\"wl\" data-slug=\"robustez-parametrica\">robustez-parametrica</a>).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 (GFM)</strong>: modo de potencia 3.3 Hz con \\( \\zeta=0.40 \\) (objetivo cumplido).</li>\n<li><strong>02 (GFL)</strong>: modo de la PLL 21 Hz con \\( \\zeta=0.71 \\).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"especificaciones-control\">especificaciones-control</a> · <a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a> · <a class=\"wl\" data-slug=\"funciones-sensibilidad\">funciones-sensibilidad</a> · <a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Aström, Murray, <em>Feedback Systems</em>, 2008.</li>\n</ul>", "buscar": "métricas de desempeño (temporal y frecuencial) definición conjunto de números que cuantifican cómo de bien se comporta el lazo cerrado, en el dominio del tiempo y de la frecuencia. son los criterios de aceptación frente a las especificaciones. fundamento teórico temporal (respuesta a escalón): - sobreimpulso \\( m p \\), tiempo de subida \\( t r \\), tiempo de establecimiento \\( t s\\approx 4/(\\zeta\\omega n) \\), error en régimen \\( e {ss} \\). - para 2º orden: \\( m p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}} \\) → relación directa con \\( \\zeta \\). frecuencial : - ancho de banda (donde \\( |t|=-3 \\) db), pico de resonancia \\( m r \\), \\( m s=\\max|s| \\). - amortiguamiento de cada modo \\( \\zeta i=-\\sigma i/|\\lambda i| \\) (ver analisis-modal ). para sistemas de orden alto (un convertidor), las fórmulas de 2º orden son orientativas; lo riguroso es mirar polos dominantes + simulación. cuándo y por qué se usa en la fase de evaluación, para comprobar objetivamente contra las especificaciones-control . también guían el rediseño (qué métrica falla → qué tocar). procedimiento (genérico) 1. respuesta a escalón (simulación o control.step response ) → \\( m p, t s, e {ss} \\). 2. respuesta en frecuencia → ancho de banda, \\( m r, m s \\). 3. autovalores → \\( \\zeta \\) de cada modo (criterio \\( \\zeta 0.1 \\), idealmente 0.3). 4. compara con objetivos; identifica el modo/métrica limitante. ejemplo de aplicación real problema: el lazo de tensión de un microgrid ante un escalón de carga del 50 % muestra: caída pico de 7 %, recuperación en 80 ms, sobreimpulso de retorno de 3 %. evaluar contra especificaciones habituales y calcular el amortiguamiento del modo dominante. métricas medidas vs. límites típicos de microrredes: caída \\( 7\\,\\%<10\\,\\% \\) (\\(\\checkmark\\)), tiempo de asentamiento \\( 80\\,\\text{ms}<100\\,\\text{ms} \\) (\\(\\checkmark\\)), sobreimpulso de retorno \\( 3\\,\\%<5\\,\\% \\) (\\(\\checkmark\\)). el modo dominante tiene frecuencia de oscilación \\( \\approx3\\,\\text{hz} \\): con el sobreimpulso del 3 %, \\( \\zeta\\approx0.65 \\). comparar con un diseño más agresivo (caída 4 %, 50 ms, retorno 8 %): mejora caída y asentamiento pero viola el límite de retorno. las métricas no son independientes — el optimum no es siempre el más rápido. ejemplo de código python import control as ct, numpy as np t, y = ct.step response(t) mp = (y.max()-y -1 )/y -1 100 ts = t np.where(np.abs(y-y -1 ) 0.02 y -1 ) 0 -1 banda del 2% parámetros y valores típicos \\( \\zeta 0.3 \\) bueno, \\( m p<10\\% \\), \\( m s<2 \\). en convertidores el modo electromecánico (droop/pll) suele ser el limitante. errores comunes - aplicar fórmulas de 2º orden a un sistema de orden alto sin verificar polos dominantes. - medir solo en un punto de operación (ver robustez-parametrica ). uso en proyectos - 01 (gfm) : modo de potencia 3.3 hz con \\( \\zeta=0.40 \\) (objetivo cumplido). - 02 (gfl) : modo de la pll 21 hz con \\( \\zeta=0.71 \\). conceptos relacionados - especificaciones-control · analisis-modal · funciones-sensibilidad · margenes-estabilidad referencias - aström, murray, feedback systems , 2008. sobreimpulso tiempo-establecimiento ancho-de-banda zeta metricas"}, {"slug": "niveles-validacion", "titulo": "Niveles de validación (fidelidad creciente)", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["validar el control subiendo niveles de realismo hasta el hardware"], "tags": ["validacion", "fidelidad", "conmutado", "HIL", "hardware", "PLECS"], "relacionados": ["validacion-cruzada", "pruebas-validacion", "modelo-promediado", "medicion-impedancia-inyeccion"], "referencias": ["Lauss et al., Characteristics and Design of Power-HIL Simulations, IEEE TIE 2016"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Escalera de modelos de <strong>realismo creciente</strong> por la que pasa un control antes de llegar al\nhardware. Cada nivel añade efectos que el anterior ignoraba; subir solo cuando el nivel previo\nestá validado.</p>\n<h2>Fundamento teórico</h2>\n<ol>\n<li><strong>Modelo lineal</strong> (análisis): polos, impedancia, márgenes. Donde se <strong>diseña</strong>. Rápido pero\n   solo pequeña señal alrededor de un punto.</li>\n<li><strong>Modelo no lineal / promediado</strong> (simulación temporal): gran señal, saturaciones, faltas,\n   escalones grandes. Captura no linealidades pero no la conmutación. Ver <a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a>.</li>\n<li><strong>Modelo conmutado</strong> (PLECS/Spice): IGBTs, PWM, rizado, retardo de cómputo, muestreo,\n   cuantización. La \"verdad\" de simulación.</li>\n<li><strong>HIL</strong> (Hardware-in-the-Loop): el control <strong>real</strong> (DSP/FPGA) contra la planta simulada en\n   tiempo real. Valida el código, los tiempos y la implementación digital sin arriesgar potencia.</li>\n<li><strong>Prototipo / hardware</strong>: la realidad (parásitos, EMI, térmica, tolerancias).</li>\n</ol>\n<p>Cada salto añade riesgo de descubrir algo nuevo; el coste y el tiempo también crecen.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para no llevar a hardware un diseño que falla por algo que un nivel intermedio habría detectado\nbarato. Estructura el \"de la teoría a la realidad\".</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Diseña y evalúa en el nivel lineal.</li>\n<li>Sube a no lineal: prueba gran señal (faltas, current limiting).</li>\n<li>Sube a conmutado: comprueba que el promediado seguía siendo válido (rizado, retardos).</li>\n<li>HIL: porta el control al hardware de control contra planta en tiempo real.</li>\n<li>Hardware: pruebas finales con todas las protecciones.\nVuelve atrás si un nivel revela un problema.</li>\n</ol>\n<h2>Parámetros y valores típicos</h2>\n<p>Validez del promediado: \\( f_{sw}/f_{control}\\gtrsim 10 \\). HIL: paso de tiempo del simulador\n~µs. El retardo de cómputo (1–1.5 periodos de muestreo) suele aparecer en conmutado/HIL.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Saltarse niveles (\"del lineal al hardware\"): caro y peligroso.</li>\n<li>No re-evaluar márgenes al añadir el retardo de cómputo (aparece en conmutado/HIL).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01/02</strong>: niveles 1 (lineal: polos, impedancia) y 2 (no lineal: faltas, gran señal). El nivel\n  3 (conmutado/PLECS) se valida con <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a>; HIL y hardware, pendientes.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"validacion-cruzada\">validacion-cruzada</a> · <a class=\"wl\" data-slug=\"pruebas-validacion\">pruebas-validacion</a> · <a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a> · <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Lauss et al., <em>Power-HIL Simulations</em>, IEEE TIE 2016.</li>\n</ul>", "buscar": "niveles de validación (fidelidad creciente) definición escalera de modelos de realismo creciente por la que pasa un control antes de llegar al hardware. cada nivel añade efectos que el anterior ignoraba; subir solo cuando el nivel previo está validado. fundamento teórico 1. modelo lineal (análisis): polos, impedancia, márgenes. donde se diseña . rápido pero solo pequeña señal alrededor de un punto. 2. modelo no lineal / promediado (simulación temporal): gran señal, saturaciones, faltas, escalones grandes. captura no linealidades pero no la conmutación. ver modelo-promediado . 3. modelo conmutado (plecs/spice): igbts, pwm, rizado, retardo de cómputo, muestreo, cuantización. la \"verdad\" de simulación. 4. hil (hardware-in-the-loop): el control real (dsp/fpga) contra la planta simulada en tiempo real. valida el código, los tiempos y la implementación digital sin arriesgar potencia. 5. prototipo / hardware : la realidad (parásitos, emi, térmica, tolerancias). cada salto añade riesgo de descubrir algo nuevo; el coste y el tiempo también crecen. cuándo y por qué se usa para no llevar a hardware un diseño que falla por algo que un nivel intermedio habría detectado barato. estructura el \"de la teoría a la realidad\". procedimiento (genérico) 1. diseña y evalúa en el nivel lineal. 2. sube a no lineal: prueba gran señal (faltas, current limiting). 3. sube a conmutado: comprueba que el promediado seguía siendo válido (rizado, retardos). 4. hil: porta el control al hardware de control contra planta en tiempo real. 5. hardware: pruebas finales con todas las protecciones. vuelve atrás si un nivel revela un problema. parámetros y valores típicos validez del promediado: \\( f {sw}/f {control}\\gtrsim 10 \\). hil: paso de tiempo del simulador ~µs. el retardo de cómputo (1–1.5 periodos de muestreo) suele aparecer en conmutado/hil. errores comunes - saltarse niveles (\"del lineal al hardware\"): caro y peligroso. - no re-evaluar márgenes al añadir el retardo de cómputo (aparece en conmutado/hil). uso en proyectos - 01/02 : niveles 1 (lineal: polos, impedancia) y 2 (no lineal: faltas, gran señal). el nivel 3 (conmutado/plecs) se valida con medicion-impedancia-inyeccion ; hil y hardware, pendientes. conceptos relacionados - validacion-cruzada · pruebas-validacion · modelo-promediado · medicion-impedancia-inyeccion referencias - lauss et al., power-hil simulations , ieee tie 2016. validacion fidelidad conmutado hil hardware plecs"}, {"slug": "nyquist-generalizado", "titulo": "Criterio de Nyquist generalizado (MIMO, GNC)", "categoria": "metodologia", "tipo": "metodo", "nivel": "avanzado", "proyectos": [], "objetivos": ["decidir estabilidad de sistemas multivariable y del cociente de impedancias"], "tags": ["nyquist-generalizado", "gnc", "mimo", "eigenloci", "impedancia", "minor-loop-gain", "avanzado"], "relacionados": ["criterio-nyquist", "impedancia-salida-estabilidad", "valores-singulares-mimo", "criterio-middlebrook", "impedancia-dq-vs-secuencia"], "referencias": ["Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005", "Sun, Impedance-Based Stability Criterion for Grid-Connected Inverters, IEEE TPEL 2011", "Belkhayat, Stability Criteria for AC Power Systems with Regulated Loads, PhD Purdue 1997"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Extensión del <a class=\"wl\" data-slug=\"criterio-nyquist\">criterio de Nyquist</a> a sistemas <strong>multivariable</strong>: la estabilidad\nen lazo cerrado se decide por los rodeos de \\( -1 \\) de los <strong>loci característicos</strong> (autovalores)\nde la matriz de ganancia de lazo \\( \\mathbf{L}(j\\omega) \\). Es la base formal del <strong>criterio de\nestabilidad por impedancia</strong> en convertidores (cociente de impedancias \\( 2\\times2 \\) en dq).</p>\n<h2>Fundamento teórico</h2>\n<p>Para una planta MIMO con lazo \\( \\mathbf{L}(s)=\\mathbf{C}(s)\\mathbf{G}(s) \\), el polinomio\ncaracterístico del lazo cerrado es \\( \\det(\\mathbf{I}+\\mathbf{L}(s)) \\). Aplicando el principio del\nargumento a este determinante:\n$$ Z = N\\big(\\det(\\mathbf{I}+\\mathbf{L}),\\,-1\\big) + P_{ol} $$\nEquivalentemente (Teorema de Nyquist generalizado), se trazan los <strong>eigenloci</strong>\n\\( \\lambda_i(j\\omega)=\\mathrm{eig}\\,\\mathbf{L}(j\\omega) \\), \\( i=1\\dots m \\), y la suma de sus rodeos\nnetos de \\( -1 \\) debe ser \\( -P_{ol} \\) (polos inestables de lazo abierto) para que \\( Z=0 \\).</p>\n<p><strong>Aplicación a impedancia (source-load).</strong> Partiendo de un divisor fuente–carga estable por\nseparado, la tensión en el punto de conexión es\n$$ \\mathbf{V}=\\mathbf{V}_s\\big(\\mathbf{I}+\\mathbf{Z}_s\\mathbf{Y}_l\\big)^{-1} $$\ncon <strong>minor loop gain</strong> \\( \\mathbf{L}=\\mathbf{Z}_s\\mathbf{Y}_l=\\mathbf{Z}_s\\mathbf{Z}_l^{-1} \\). El\nconjunto es estable \\( \\iff \\mathbf{L}(j\\omega) \\) cumple Nyquist generalizado. En AC trifásico,\n\\( \\mathbf{Z} \\) son matrices \\( 2\\times2 \\) en dq → <strong>dos</strong> eigenloci. El caso SISO (DC, o\ndesacoplado) recupera el <a class=\"wl\" data-slug=\"criterio-middlebrook\">criterio de Middlebrook</a> (\\( Z_s/Z_l \\) dentro del\ncírculo unidad como condición suficiente).</p>\n<p><strong>Criterios suficientes (menos conservadores que la norma).</strong> Calcular eigenloci es costoso y poco\nrobusto; alternativas:\n- Norma: si \\( \\bar\\sigma(\\mathbf{Z}_s\\mathbf{Y}_l)<1\\ \\forall\\omega \\) → estable (muy conservador).\n- <strong>G-norm / pasividad</strong>: índices de pasividad de la impedancia (ver <a class=\"wl\" data-slug=\"no-pasividad-resistencia-negativa\">no-pasividad-resistencia-negativa</a>).\n- Valores singulares estructurados (μ) para incertidumbre (ver <a class=\"wl\" data-slug=\"valores-singulares-mimo\">valores-singulares-mimo</a>).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Estabilidad de convertidor conectado a red (GFL/GFM), interacción entre subsistemas (fuente–carga,\nconvertidor–convertidor) y microrredes, donde el modelo natural es MIMO y el acoplamiento d-q no es\ndespreciable. Es el criterio que sustenta el análisis por impedancia de tus proyectos.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Verifica estabilidad <strong>individual</strong> de fuente y carga (sin interconectar).</li>\n<li>Forma el minor loop gain \\( \\mathbf{L}=\\mathbf{Z}_s\\mathbf{Y}_l \\) en la frecuencia (dq, 2×2).</li>\n<li>Calcula los eigenloci \\( \\lambda_i(j\\omega) \\) y cuenta rodeos de \\( -1 \\).</li>\n<li>Compara con \\( -P_{ol} \\); si hay polos inestables de lazo abierto, contabilízalos.</li>\n<li>Para márgenes, mide la distancia de los eigenloci a \\( -1 \\) (margen de módulo MIMO).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\ndef eigenloci(Zs, Yl, freqs):           # Zs, Yl: (Nf,2,2) en dq\n    loci = np.zeros((len(freqs), 2), dtype=complex)\n    for k in range(len(freqs)):\n        loci[k] = np.linalg.eigvals(Zs[k] @ Yl[k])   # rodeos de -1 -&gt; Nyquist\n    return loci\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Margen de módulo MIMO (mín. distancia de los eigenloci a \\( -1 \\)) &gt; 0.3–0.5. Malla de frecuencia\nfina alrededor de las resonancias de \\( \\mathbf{Z}_s,\\mathbf{Z}_l \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Aplicar el criterio sin comprobar la estabilidad individual de fuente y carga.</li>\n<li>Usar \\( |Z_s/Z_l|<1 \\) (SISO) en un sistema con fuerte acoplamiento d-q → conclusión errónea.</li>\n<li>Olvidar \\( P_{ol} \\) (rodeos requeridos ≠ 0 cuando hay polos inestables de lazo abierto).</li>\n<li>Confundir el determinante \\( \\det(\\mathbf{I}+\\mathbf{L}) \\) con uno solo de los eigenloci.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"criterio-nyquist\">criterio-nyquist</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"criterio-middlebrook\">criterio-middlebrook</a> · <a class=\"wl\" data-slug=\"valores-singulares-mimo\">valores-singulares-mimo</a> · <a class=\"wl\" data-slug=\"impedancia-dq-vs-secuencia\">impedancia-dq-vs-secuencia</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, 2005.</li>\n<li>Sun, <em>Impedance-Based Stability Criterion for Grid-Connected Inverters</em>, IEEE TPEL 2011.</li>\n<li>Belkhayat, <em>Stability Criteria for AC Power Systems with Regulated Loads</em>, PhD 1997.</li>\n</ul>", "buscar": "criterio de nyquist generalizado (mimo, gnc) definición extensión del criterio-nyquist|criterio de nyquist a sistemas multivariable : la estabilidad en lazo cerrado se decide por los rodeos de \\( -1 \\) de los loci característicos (autovalores) de la matriz de ganancia de lazo \\( \\mathbf{l}(j\\omega) \\). es la base formal del criterio de estabilidad por impedancia en convertidores (cociente de impedancias \\( 2\\times2 \\) en dq). fundamento teórico para una planta mimo con lazo \\( \\mathbf{l}(s)=\\mathbf{c}(s)\\mathbf{g}(s) \\), el polinomio característico del lazo cerrado es \\( \\det(\\mathbf{i}+\\mathbf{l}(s)) \\). aplicando el principio del argumento a este determinante: z = n\\big(\\det(\\mathbf{i}+\\mathbf{l}),\\,-1\\big) + p {ol} equivalentemente (teorema de nyquist generalizado), se trazan los eigenloci \\( \\lambda i(j\\omega)=\\mathrm{eig}\\,\\mathbf{l}(j\\omega) \\), \\( i=1\\dots m \\), y la suma de sus rodeos netos de \\( -1 \\) debe ser \\( -p {ol} \\) (polos inestables de lazo abierto) para que \\( z=0 \\). aplicación a impedancia (source-load). partiendo de un divisor fuente–carga estable por separado, la tensión en el punto de conexión es \\mathbf{v}=\\mathbf{v} s\\big(\\mathbf{i}+\\mathbf{z} s\\mathbf{y} l\\big)^{-1} con minor loop gain \\( \\mathbf{l}=\\mathbf{z} s\\mathbf{y} l=\\mathbf{z} s\\mathbf{z} l^{-1} \\). el conjunto es estable \\( \\iff \\mathbf{l}(j\\omega) \\) cumple nyquist generalizado. en ac trifásico, \\( \\mathbf{z} \\) son matrices \\( 2\\times2 \\) en dq → dos eigenloci. el caso siso (dc, o desacoplado) recupera el criterio-middlebrook|criterio de middlebrook (\\( z s/z l \\) dentro del círculo unidad como condición suficiente). criterios suficientes (menos conservadores que la norma). calcular eigenloci es costoso y poco robusto; alternativas: - norma: si \\( \\bar\\sigma(\\mathbf{z} s\\mathbf{y} l)<1\\ \\forall\\omega \\) → estable (muy conservador). - g-norm / pasividad : índices de pasividad de la impedancia (ver no-pasividad-resistencia-negativa ). - valores singulares estructurados (μ) para incertidumbre (ver valores-singulares-mimo ). cuándo y por qué se usa estabilidad de convertidor conectado a red (gfl/gfm), interacción entre subsistemas (fuente–carga, convertidor–convertidor) y microrredes, donde el modelo natural es mimo y el acoplamiento d-q no es despreciable. es el criterio que sustenta el análisis por impedancia de tus proyectos. procedimiento de diseño (genérico) 1. verifica estabilidad individual de fuente y carga (sin interconectar). 2. forma el minor loop gain \\( \\mathbf{l}=\\mathbf{z} s\\mathbf{y} l \\) en la frecuencia (dq, 2×2). 3. calcula los eigenloci \\( \\lambda i(j\\omega) \\) y cuenta rodeos de \\( -1 \\). 4. compara con \\( -p {ol} \\); si hay polos inestables de lazo abierto, contabilízalos. 5. para márgenes, mide la distancia de los eigenloci a \\( -1 \\) (margen de módulo mimo). ejemplo de código python import numpy as np def eigenloci(zs, yl, freqs): zs, yl: (nf,2,2) en dq loci = np.zeros((len(freqs), 2), dtype=complex) for k in range(len(freqs)): loci k = np.linalg.eigvals(zs k @ yl k ) rodeos de -1 - nyquist return loci parámetros y valores típicos margen de módulo mimo (mín. distancia de los eigenloci a \\( -1 \\)) 0.3–0.5. malla de frecuencia fina alrededor de las resonancias de \\( \\mathbf{z} s,\\mathbf{z} l \\). errores comunes - aplicar el criterio sin comprobar la estabilidad individual de fuente y carga. - usar \\( |z s/z l|<1 \\) (siso) en un sistema con fuerte acoplamiento d-q → conclusión errónea. - olvidar \\( p {ol} \\) (rodeos requeridos ≠ 0 cuando hay polos inestables de lazo abierto). - confundir el determinante \\( \\det(\\mathbf{i}+\\mathbf{l}) \\) con uno solo de los eigenloci. conceptos relacionados - criterio-nyquist · impedancia-salida-estabilidad · criterio-middlebrook · valores-singulares-mimo · impedancia-dq-vs-secuencia referencias - skogestad, postlethwaite, multivariable feedback control , 2005. - sun, impedance-based stability criterion for grid-connected inverters , ieee tpel 2011. - belkhayat, stability criteria for ac power systems with regulated loads , phd 1997. nyquist-generalizado gnc mimo eigenloci impedancia minor-loop-gain avanzado"}, {"slug": "pruebas-validacion", "titulo": "Pruebas de validación (escalón, perturbación, inyección, falta)", "categoria": "metodologia", "tipo": "metodo", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["definir que ensayos confirman cada especificacion"], "tags": ["ensayos", "escalon", "perturbacion", "inyeccion", "falta", "validacion"], "relacionados": ["niveles-validacion", "validacion-cruzada", "medicion-impedancia-inyeccion", "especificaciones-control"], "referencias": ["Teodorescu et al., Grid Converters for PV and Wind Power Systems, Wiley 2011"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Catálogo de ensayos que confirman, cada uno, una especificación concreta. La regla: <strong>a cada\nespecificación, su prueba</strong>.</p>\n<h2>Fundamento teórico (ensayos típicos)</h2>\n<ul>\n<li><strong>Escalón de referencia</strong>: mide \\( M_p, t_s, e_{ss} \\) → desempeño de seguimiento.</li>\n<li><strong>Escalón de perturbación / carga</strong>: mide el rechazo (caída y recuperación) → robustez del lazo.</li>\n<li><strong>Barrido / inyección de pequeña señal</strong>: mide la respuesta en frecuencia o la <strong>impedancia</strong>\n  (ver <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a>) → valida el modelo lineal y la robustez en frecuencia.</li>\n<li><strong>Falta / hueco de tensión</strong>: gran señal → activa el <a class=\"wl\" data-slug=\"current-limiting\">current-limiting</a> y prueba la\n  supervivencia y la sincronización.</li>\n<li><strong>Arranque / black-start, cambio de modo</strong>: prueba transitorios de puesta en marcha.</li>\n<li><strong>Variación paramétrica</strong> (cambiar SCR, potencia): liga con <a class=\"wl\" data-slug=\"robustez-parametrica\">robustez-parametrica</a>.</li>\n</ul>\n<h2>Cuándo y por qué se usa</h2>\n<p>En la fase de validación, en cada nivel de fidelidad. Cada ensayo debe tener un <strong>criterio de\naceptación</strong> derivado de las <a class=\"wl\" data-slug=\"especificaciones-control\">especificaciones-control</a>.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Por cada especificación, elige el ensayo que la mide.</li>\n<li>Define el criterio de aceptación numérico (p.ej. \\( M_p<10\\% \\), pico de falta &lt; 1.5 pu).</li>\n<li>Ejecuta el ensayo en el nivel de fidelidad correspondiente.</li>\n<li>Registra resultado vs criterio; documenta. Si falla, vuelve a diseño.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># escalon de potencia + falta (simulacion temporal del modelo no lineal)\npset = lambda t: 5e3 if t &lt; 0.2 else 9e3            # escalon de referencia\nefunc = lambda t: (0.3*V0,0) if 0.3&lt;=t&lt;0.42 else (V0,0)  # hueco de tension (falta)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Escalón 50→90% de potencia, hueco al 30% durante ~100 ms, inyección de pequeña señal (amplitud\npequeña), barrido de SCR.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Ensayos sin criterio de aceptación previo → \"parece que va bien\" subjetivo.</li>\n<li>Probar inyección de impedancia con amplitud que activa saturación (deja de ser pequeña señal).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 (GFM)</strong>: escalón de potencia (droop vs VSM), falta con current limiting (4.76→1.51 pu),\n  inyección de impedancia (error 0.21%).</li>\n<li><strong>02 (GFL)</strong>: barrido de SCR y de ancho de banda de la PLL.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"niveles-validacion\">niveles-validacion</a> · <a class=\"wl\" data-slug=\"validacion-cruzada\">validacion-cruzada</a> · <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a> · <a class=\"wl\" data-slug=\"current-limiting\">current-limiting</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Teodorescu et al., <em>Grid Converters for PV and Wind Power Systems</em>, 2011.</li>\n</ul>", "buscar": "pruebas de validación (escalón, perturbación, inyección, falta) definición catálogo de ensayos que confirman, cada uno, una especificación concreta. la regla: a cada especificación, su prueba . fundamento teórico (ensayos típicos) - escalón de referencia : mide \\( m p, t s, e {ss} \\) → desempeño de seguimiento. - escalón de perturbación / carga : mide el rechazo (caída y recuperación) → robustez del lazo. - barrido / inyección de pequeña señal : mide la respuesta en frecuencia o la impedancia (ver medicion-impedancia-inyeccion ) → valida el modelo lineal y la robustez en frecuencia. - falta / hueco de tensión : gran señal → activa el current-limiting y prueba la supervivencia y la sincronización. - arranque / black-start, cambio de modo : prueba transitorios de puesta en marcha. - variación paramétrica (cambiar scr, potencia): liga con robustez-parametrica . cuándo y por qué se usa en la fase de validación, en cada nivel de fidelidad. cada ensayo debe tener un criterio de aceptación derivado de las especificaciones-control . procedimiento (genérico) 1. por cada especificación, elige el ensayo que la mide. 2. define el criterio de aceptación numérico (p.ej. \\( m p<10\\% \\), pico de falta < 1.5 pu). 3. ejecuta el ensayo en el nivel de fidelidad correspondiente. 4. registra resultado vs criterio; documenta. si falla, vuelve a diseño. ejemplo de código python escalon de potencia + falta (simulacion temporal del modelo no lineal) pset = lambda t: 5e3 if t < 0.2 else 9e3 escalon de referencia efunc = lambda t: (0.3 v0,0) if 0.3<=t<0.42 else (v0,0) hueco de tension (falta) parámetros y valores típicos escalón 50→90% de potencia, hueco al 30% durante ~100 ms, inyección de pequeña señal (amplitud pequeña), barrido de scr. errores comunes - ensayos sin criterio de aceptación previo → \"parece que va bien\" subjetivo. - probar inyección de impedancia con amplitud que activa saturación (deja de ser pequeña señal). uso en proyectos - 01 (gfm) : escalón de potencia (droop vs vsm), falta con current limiting (4.76→1.51 pu), inyección de impedancia (error 0.21%). - 02 (gfl) : barrido de scr y de ancho de banda de la pll. conceptos relacionados - niveles-validacion · validacion-cruzada · medicion-impedancia-inyeccion · current-limiting referencias - teodorescu et al., grid converters for pv and wind power systems , 2011. ensayos escalon perturbacion inyeccion falta validacion"}, {"slug": "robustez-parametrica", "titulo": "Robustez paramétrica (barridos, peor caso, Monte Carlo)", "categoria": "metodologia", "tipo": "metodo", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance", "03-DataCenter-IA"], "objetivos": ["comprobar que el control aguanta la variacion de la planta"], "tags": ["robustez", "barrido", "monte-carlo", "peor-caso", "SCR", "sensibilidad-parametrica"], "relacionados": ["margenes-estabilidad", "niveles-validacion", "impedancia-salida-estabilidad", "analisis-modal"], "referencias": ["Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Evaluación de cómo cambia la estabilidad y el desempeño cuando los parámetros de la planta o del\npunto de operación varían dentro de su rango realista (no solo en el valor nominal).</p>\n<h2>Fundamento teórico</h2>\n<ul>\n<li><strong>Barrido</strong> (sweep) de un parámetro clave (p.ej. SCR de la red, potencia, temperatura) y\n  observación de \\( \\max\\mathrm{Re}(\\lambda) \\), \\( \\zeta \\), márgenes → curvas de estabilidad y\n  valores <strong>críticos</strong>.</li>\n<li><strong>Peor caso</strong>: identificar la combinación de parámetros más desfavorable (vértices del rango si\n  la dependencia es monótona).</li>\n<li><strong>Monte Carlo</strong>: muestreo aleatorio del espacio de parámetros → distribución de la métrica y\n  probabilidad de cumplir especificaciones (útil con tolerancias de componentes).</li>\n<li>Conecta con el control robusto (<a class=\"wl\" data-slug=\"control-robusto-hinf\">control-robusto-hinf</a>) y con el análisis de impedancia\n  (<a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a>) cuando la incertidumbre es la red.</li>\n</ul>\n<h2>Cuándo y por qué se usa</h2>\n<p>Siempre antes de dar por bueno un diseño: el valor nominal puede ser estable y el rango real no.\nEs lo que reveló los SCR críticos de GFM/GFL.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Lista los parámetros inciertos y su rango (componentes ±tolerancia, SCR, punto de operación).</li>\n<li>Barre los más influyentes; localiza valores críticos por bisección.</li>\n<li>Para varios a la vez: peor caso (vértices) o Monte Carlo.</li>\n<li>Reporta el margen al peor caso y, si no cumple, rediseña (o usa control robusto).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\nscr = np.linspace(1, 12, 40)\nmaxre = [np.linalg.eigvals(A_coupled(s)).real.max() for s in scr]\nscr_critico = scr[np.argmin(np.abs(maxre))]      # cruce de estabilidad\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Barrer SCR (1–20), X/R (1–10), potencia (0–100%), tolerancia de L/C (±10–20%).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Validar solo en el punto nominal (el error más común y peligroso).</li>\n<li>Asumir peor caso en los vértices cuando la dependencia no es monótona (usar Monte Carlo).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 (GFM)</strong>: barrido de SCR → crítico ≈3.35 (inestable en red fuerte).</li>\n<li><strong>02 (GFL)</strong>: barrido de SCR y de ancho de banda de la PLL → crítico ≈3.48 (inestable en red débil).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"margenes-estabilidad\">margenes-estabilidad</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"niveles-validacion\">niveles-validacion</a> · <a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, 2005.</li>\n</ul>", "buscar": "robustez paramétrica (barridos, peor caso, monte carlo) definición evaluación de cómo cambia la estabilidad y el desempeño cuando los parámetros de la planta o del punto de operación varían dentro de su rango realista (no solo en el valor nominal). fundamento teórico - barrido (sweep) de un parámetro clave (p.ej. scr de la red, potencia, temperatura) y observación de \\( \\max\\mathrm{re}(\\lambda) \\), \\( \\zeta \\), márgenes → curvas de estabilidad y valores críticos . - peor caso : identificar la combinación de parámetros más desfavorable (vértices del rango si la dependencia es monótona). - monte carlo : muestreo aleatorio del espacio de parámetros → distribución de la métrica y probabilidad de cumplir especificaciones (útil con tolerancias de componentes). - conecta con el control robusto ( control-robusto-hinf ) y con el análisis de impedancia ( impedancia-salida-estabilidad ) cuando la incertidumbre es la red. cuándo y por qué se usa siempre antes de dar por bueno un diseño: el valor nominal puede ser estable y el rango real no. es lo que reveló los scr críticos de gfm/gfl. procedimiento (genérico) 1. lista los parámetros inciertos y su rango (componentes ±tolerancia, scr, punto de operación). 2. barre los más influyentes; localiza valores críticos por bisección. 3. para varios a la vez: peor caso (vértices) o monte carlo. 4. reporta el margen al peor caso y, si no cumple, rediseña (o usa control robusto). ejemplo de código python import numpy as np scr = np.linspace(1, 12, 40) maxre = np.linalg.eigvals(a coupled(s)).real.max() for s in scr scr critico = scr np.argmin(np.abs(maxre)) cruce de estabilidad parámetros y valores típicos barrer scr (1–20), x/r (1–10), potencia (0–100%), tolerancia de l/c (±10–20%). errores comunes - validar solo en el punto nominal (el error más común y peligroso). - asumir peor caso en los vértices cuando la dependencia no es monótona (usar monte carlo). uso en proyectos - 01 (gfm) : barrido de scr → crítico ≈3.35 (inestable en red fuerte). - 02 (gfl) : barrido de scr y de ancho de banda de la pll → crítico ≈3.48 (inestable en red débil). conceptos relacionados - margenes-estabilidad · impedancia-salida-estabilidad · niveles-validacion · analisis-modal referencias - skogestad, postlethwaite, multivariable feedback control , 2005. robustez barrido monte-carlo peor-caso scr sensibilidad-parametrica"}, {"slug": "servicios-red-soporte", "titulo": "Servicios de red y soporte de la red (grid services)", "categoria": "metodologia", "tipo": "concepto", "nivel": "intermedio", "proyectos": [], "objetivos": ["conocer los servicios auxiliares que un convertidor puede prestar a la red"], "tags": ["servicios-red", "inercia", "ffr", "p-f", "q-v", "ancillary", "grid-code", "intermedio"], "relacionados": ["vsm-inercia", "droop-control", "fault-ride-through", "ecuacion-oscilacion", "grid-forming-vs-following"], "referencias": ["ENTSO-E, Network Codes (RfG, HVDC)", "Milano et al., Foundations and Challenges of Low-Inertia Systems, PSCC 2018"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Conjunto de <strong>servicios auxiliares</strong> (ancillary services) que un convertidor presta para mantener\nla calidad y estabilidad de la red: respuesta de frecuencia, soporte de tensión/reactiva, inercia\nsintética y soporte en falta. Cada vez más exigidos por los grid codes a renovables.</p>\n<h2>Fundamento teórico</h2>\n<ul>\n<li><strong>Respuesta inercial (sintética):</strong> entregar potencia proporcional a la derivada de frecuencia,\n  emulando inercia (ver <a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a>, <a class=\"wl\" data-slug=\"ecuacion-oscilacion\">ecuacion-oscilacion</a>):\n  $$ \\Delta P_{iner}=-2H_{v}\\frac{d f}{dt} $$</li>\n<li><strong>Respuesta rápida de frecuencia (FFR) y regulación primaria (droop P-f):</strong>\n  $$ \\Delta P = -\\frac{1}{R}\\,\\Delta f $$\n  con estatismo \\( R \\) (típ. 2–5 %), banda muerta y saturación; reserva activa o almacenamiento.</li>\n<li><strong>Soporte de tensión (droop Q-V):</strong> \\( \\Delta Q=-\\dfrac{1}{R_v}\\Delta V \\); regula reactiva para\n  sostener tensión, dentro del diagrama P-Q del convertidor.</li>\n<li><strong>Modos de factor de potencia / Q(P) / Q(V):</strong> según consigna o normativa.</li>\n<li><strong>Soporte en falta:</strong> inyección de reactiva durante huecos (<a class=\"wl\" data-slug=\"fault-ride-through\">fault-ride-through</a>).</li>\n<li><strong>Calidad:</strong> compensación de armónicos/desequilibrio (filtro activo).</li>\n</ul>\n<p>Distinción clave: grid-following <strong>sigue</strong> la red y modula corriente para estos servicios;\ngrid-forming <strong>forma</strong> tensión/frecuencia y aporta inercia y soporte de forma intrínseca (ver\n<a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a>). En <strong>redes de baja inercia</strong> estos servicios pasan de opcionales a\nimprescindibles.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En el diseño del nivel superior de control de cualquier convertidor de red moderno: define qué\nreferencias de P y Q recibe el control de corriente y cómo responde a \\( f \\) y \\( V \\). Es donde\nse traducen los requisitos del grid code a lazos concretos.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Lista los servicios exigidos por el grid code y el mercado (inercia, FFR, droop, Q-V, FRT).</li>\n<li>Asigna reservas (margen de P, capacidad de Q, almacenamiento) en el diagrama P-Q.</li>\n<li>Implementa cada lazo: droop con banda muerta y saturación, inercia con filtro de \\( df/dt \\).</li>\n<li>Coordina prioridades y límites (corriente, térmico) y la jerarquía (<a class=\"wl\" data-slug=\"control-jerarquico-microrred\">control-jerarquico-microrred</a>).</li>\n<li>Verifica respuesta temporal frente a eventos normativos.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def primary_response(f, V, f0=50.0, R=0.04, Rv=0.05, Pmax=1.0, Qmax=0.6):\n    dP = -(1/R)*(f - f0)/f0              # droop P-f (p.u.)\n    dQ = -(1/Rv)*(V - 1.0)              # droop Q-V (p.u.)\n    return max(min(dP, Pmax), -Pmax), max(min(dQ, Qmax), -Qmax)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Estatismo P-f \\( R \\) 2–5 %; banda muerta ±10–20 mHz; \\( H_v \\) 2–6 s; respuesta FFR &lt; 1–2 s;\nsoporte de reactiva hasta 0.3–0.5 p.u. de Q.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Pedir inercia sintética sin <strong>reserva</strong> de energía (no hay potencia que entregar).</li>\n<li>Droop sin banda muerta → actuación continua por ruido de frecuencia.</li>\n<li>Ignorar el acoplamiento P-f / Q-V en redes con relación X/R baja (distribución).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a> · <a class=\"wl\" data-slug=\"droop-control\">droop-control</a> · <a class=\"wl\" data-slug=\"fault-ride-through\">fault-ride-through</a> · <a class=\"wl\" data-slug=\"ecuacion-oscilacion\">ecuacion-oscilacion</a> · <a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>ENTSO-E, <em>Network Codes (RfG, HVDC)</em>.</li>\n<li>Milano et al., <em>Foundations and Challenges of Low-Inertia Systems</em>, PSCC 2018.</li>\n</ul>", "buscar": "servicios de red y soporte de la red (grid services) definición conjunto de servicios auxiliares (ancillary services) que un convertidor presta para mantener la calidad y estabilidad de la red: respuesta de frecuencia, soporte de tensión/reactiva, inercia sintética y soporte en falta. cada vez más exigidos por los grid codes a renovables. fundamento teór
