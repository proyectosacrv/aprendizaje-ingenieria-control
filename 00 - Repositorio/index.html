 en simulacion/hardware y validar el modelo"], "tags": ["impedancia", "inyeccion", "demodulacion", "MIMO", "validacion", "PLECS"], "relacionados": ["impedancia-salida-estabilidad", "respuesta-frecuencia-ss", "modelo-promediado"], "referencias": ["Roinila et al., Frequency-Response Measurement of Converters, IEEE TPEL"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Procedimiento para <strong>medir</strong> la impedancia/admitancia dq de un convertidor (en simulación\nconmutada, PLECS o hardware) inyectando perturbaciones y analizando la respuesta. Es la\ncontraparte experimental del cálculo analítico \\( Y=C(sI-A)^{-1}B+D \\).</p>\n<h2>Fundamento teórico</h2>\n<p>A cada frecuencia \\( f_p \\) se inyecta una perturbación senoidal de tensión. Como el sistema dq\nes <strong>MIMO 2×2</strong>, se necesitan <strong>dos</strong> inyecciones linealmente independientes (eje d y eje q)\npara identificar la matriz completa. Con los fasores de tensión \\( \\mathbf{V} \\) y corriente\n\\( \\mathbf{I} \\) (columnas = experimentos):\n$$ \\mathbf{I}=\\mathbf{G}\\,\\mathbf{V}\\;\\Rightarrow\\;\\mathbf{G}=\\mathbf{I}\\,\\mathbf{V}^{-1},\\qquad\n   \\mathbf{Y}=-\\mathbf{G},\\quad \\mathbf{Z}=\\mathbf{Y}^{-1} $$\nLos fasores se extraen por <strong>demodulación</strong> (correlación con sin/cos sobre un número entero de\nperiodos).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para <strong>validar</strong> el modelo promediado contra la planta conmutada/real, y para caracterizar\nconvertidores comerciales \"caja negra\" cuya impedancia no se conoce analíticamente.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Lleva el sistema al punto de operación.</li>\n<li>Para cada \\( f_p \\): inyecta en d (exp.1) y en q (exp.2), pequeña amplitud (pequeña señal).</li>\n<li>Simula hasta régimen permanente (descarta el transitorio).</li>\n<li>Demodula \\( v,i \\) a \\( f_p \\) (correlación sobre periodos enteros) → fasores.</li>\n<li>Monta \\( \\mathbf{G}=\\mathbf{I}\\,\\mathbf{V}^{-1} \\), \\( Z=(-G)^{-1} \\). Repite en frecuencia.</li>\n<li>Compara con el analítico (debe coincidir en pequeña señal).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def phasor(t, x, fp):                 # demodulacion sobre periodos enteros\n    w = 2*np.pi*fp; T = t[-1]-t[0]\n    c = np.trapz(x*np.cos(w*t), t); s = np.trapz(x*np.sin(w*t), t)\n    return (2/T)*(c - 1j*s)\n# dos inyecciones (d, q) -&gt; columnas de V e I\nG = I @ np.linalg.inv(V); Y = -G; Z = np.linalg.inv(Y)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Amplitud pequeña (pequeña señal); ventana de varios periodos tras el asentamiento. Validez solo\nmientras no haya saturación (si entra el current limiting, deja de ser lineal).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Una sola inyección en un sistema dq acoplado → no identifica la matriz 2×2.</li>\n<li>Ventana no entera de periodos → fuga espectral en la demodulación.</li>\n<li>Amplitud grande que activa no linealidades → la \"impedancia\" deja de tener sentido.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: validar el modelo): la Z medida por inyección coincidió con\n  la analítica con <strong>error medio 0.21%</strong>. En <code>inject.py</code> / <code>main_phase4.py</code>. El mismo código\n  procesa datos exportados de PLECS.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"respuesta-frecuencia-ss\">respuesta-frecuencia-ss</a> · <a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Roinila et al., medición de respuesta en frecuencia de convertidores.</li>\n</ul>", "buscar": "medición de impedancia por inyección de perturbación definición procedimiento para medir la impedancia/admitancia dq de un convertidor (en simulación conmutada, plecs o hardware) inyectando perturbaciones y analizando la respuesta. es la contraparte experimental del cálculo analítico \\( y=c(si-a)^{-1}b+d \\). fundamento teórico a cada frecuencia \\( f p \\) se inyecta una perturbación senoidal de tensión. como el sistema dq es mimo 2×2 , se necesitan dos inyecciones linealmente independientes (eje d y eje q) para identificar la matriz completa. con los fasores de tensión \\( \\mathbf{v} \\) y corriente \\( \\mathbf{i} \\) (columnas = experimentos): \\mathbf{i}=\\mathbf{g}\\,\\mathbf{v}\\;\\rightarrow\\;\\mathbf{g}=\\mathbf{i}\\,\\mathbf{v}^{-1},\\qquad \\mathbf{y}=-\\mathbf{g},\\quad \\mathbf{z}=\\mathbf{y}^{-1} los fasores se extraen por demodulación (correlación con sin/cos sobre un número entero de periodos). cuándo y por qué se usa para validar el modelo promediado contra la planta conmutada/real, y para caracterizar convertidores comerciales \"caja negra\" cuya impedancia no se conoce analíticamente. procedimiento de diseño (genérico) 1. lleva el sistema al punto de operación. 2. para cada \\( f p \\): inyecta en d (exp.1) y en q (exp.2), pequeña amplitud (pequeña señal). 3. simula hasta régimen permanente (descarta el transitorio). 4. demodula \\( v,i \\) a \\( f p \\) (correlación sobre periodos enteros) → fasores. 5. monta \\( \\mathbf{g}=\\mathbf{i}\\,\\mathbf{v}^{-1} \\), \\( z=(-g)^{-1} \\). repite en frecuencia. 6. compara con el analítico (debe coincidir en pequeña señal). ejemplo de código python def phasor(t, x, fp): demodulacion sobre periodos enteros w = 2 np.pi fp; t = t -1 -t 0 c = np.trapz(x np.cos(w t), t); s = np.trapz(x np.sin(w t), t) return (2/t) (c - 1j s) dos inyecciones (d, q) - columnas de v e i g = i @ np.linalg.inv(v); y = -g; z = np.linalg.inv(y) parámetros y valores típicos amplitud pequeña (pequeña señal); ventana de varios periodos tras el asentamiento. validez solo mientras no haya saturación (si entra el current limiting, deja de ser lineal). errores comunes - una sola inyección en un sistema dq acoplado → no identifica la matriz 2×2. - ventana no entera de periodos → fuga espectral en la demodulación. - amplitud grande que activa no linealidades → la \"impedancia\" deja de tener sentido. uso en proyectos - 01 - gfm-impedance (objetivo: validar el modelo): la z medida por inyección coincidió con la analítica con error medio 0.21% . en inject.py / main phase4.py . el mismo código procesa datos exportados de plecs. conceptos relacionados - impedancia-salida-estabilidad · respuesta-frecuencia-ss · modelo-promediado referencias - roinila et al., medición de respuesta en frecuencia de convertidores. impedancia inyeccion demodulacion mimo validacion plecs"}, {"slug": "respuesta-frecuencia-ss", "titulo": "Respuesta en frecuencia de un sistema en espacio de estados", "categoria": "programacion", "tipo": "metodo", "nivel": "intermedio", "proyectos": ["01-GFM-Impedance", "02-GFL-Impedance"], "objetivos": ["calcular Y(s)/Z(s) y Bode desde A", "B", "C", "D"], "tags": ["espacio-estados", "bode", "transferencia", "frecuencia", "numpy"], "relacionados": ["linealizacion-numerica", "impedancia-salida-estabilidad", "medicion-impedancia-inyeccion"], "referencias": ["Skogestad, Postlethwaite, Multivariable Feedback Control, Wiley 2005"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Cálculo de la matriz de transferencia \\( \\mathbf{G}(s)=\\mathbf{C}(s\\mathbf{I}-\\mathbf{A})^{-1}\\mathbf{B}+\\mathbf{D} \\)\nevaluada en \\( s=j\\omega \\), a partir del modelo en espacio de estados. Base para Bode,\nimpedancia y análisis de estabilidad.</p>\n<h2>Fundamento teórico</h2>\n<p>Para cada frecuencia se resuelve un sistema lineal en vez de invertir explícitamente\n\\( (j\\omega\\mathbf{I}-\\mathbf{A}) \\) (más estable numéricamente con <code>np.linalg.solve</code>). En MIMO,\n\\( \\mathbf{G}(j\\omega) \\) es una matriz; la admitancia de salida del convertidor es \\( Y=-G \\) y\nla impedancia \\( Z=Y^{-1} \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para obtener la impedancia analítica del inversor (Fase 2), trazar Bode de lazos, o construir el\n<em>minor loop gain</em> del criterio de estabilidad por impedancia.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Parte de \\( A,B,C,D \\) (de la linealización).</li>\n<li>Define la malla de frecuencias (logarítmica).</li>\n<li>Para cada \\( \\omega \\): \\( G=C\\,(j\\omega I-A)^{-1}B+D \\) vía <code>solve</code>.</li>\n<li>Deriva lo que necesites: \\( Y=-G \\), \\( Z=Y^{-1} \\), magnitud/fase para Bode.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\ndef freqresp(A, B, C, D, freqs):\n    n = A.shape[0]; I = np.eye(n)\n    G = np.zeros((len(freqs), C.shape[0], B.shape[1]), dtype=complex)\n    for k, f in enumerate(freqs):\n        s = 2j*np.pi*f\n        G[k] = C @ np.linalg.solve(s*I - A, B) + D\n    return G\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Malla logarítmica (p.ej. 0.1 Hz–5 kHz, 300–2000 puntos). Usar <code>solve</code>, no <code>inv</code>.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Invertir \\( (sI-A) \\) explícitamente → menos preciso/eficiente que <code>solve</code>.</li>\n<li>Malla de frecuencias demasiado gruesa → pierde resonancias agudas.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: impedancia y estabilidad): <code>impedance.py</code> calcula \\( Y \\) y\n  \\( Z \\) así; <code>main_phase3.py</code> lo usa para el Nyquist generalizado.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Skogestad, Postlethwaite, <em>Multivariable Feedback Control</em>, 2005.</li>\n</ul>", "buscar": "respuesta en frecuencia de un sistema en espacio de estados definición cálculo de la matriz de transferencia \\( \\mathbf{g}(s)=\\mathbf{c}(s\\mathbf{i}-\\mathbf{a})^{-1}\\mathbf{b}+\\mathbf{d} \\) evaluada en \\( s=j\\omega \\), a partir del modelo en espacio de estados. base para bode, impedancia y análisis de estabilidad. fundamento teórico para cada frecuencia se resuelve un sistema lineal en vez de invertir explícitamente \\( (j\\omega\\mathbf{i}-\\mathbf{a}) \\) (más estable numéricamente con np.linalg.solve ). en mimo, \\( \\mathbf{g}(j\\omega) \\) es una matriz; la admitancia de salida del convertidor es \\( y=-g \\) y la impedancia \\( z=y^{-1} \\). cuándo y por qué se usa para obtener la impedancia analítica del inversor (fase 2), trazar bode de lazos, o construir el minor loop gain del criterio de estabilidad por impedancia. procedimiento de diseño (genérico) 1. parte de \\( a,b,c,d \\) (de la linealización). 2. define la malla de frecuencias (logarítmica). 3. para cada \\( \\omega \\): \\( g=c\\,(j\\omega i-a)^{-1}b+d \\) vía solve . 4. deriva lo que necesites: \\( y=-g \\), \\( z=y^{-1} \\), magnitud/fase para bode. ejemplo de código python import numpy as np def freqresp(a, b, c, d, freqs): n = a.shape 0 ; i = np.eye(n) g = np.zeros((len(freqs), c.shape 0 , b.shape 1 ), dtype=complex) for k, f in enumerate(freqs): s = 2j np.pi f g k = c @ np.linalg.solve(s i - a, b) + d return g parámetros y valores típicos malla logarítmica (p.ej. 0.1 hz–5 khz, 300–2000 puntos). usar solve , no inv . errores comunes - invertir \\( (si-a) \\) explícitamente → menos preciso/eficiente que solve . - malla de frecuencias demasiado gruesa → pierde resonancias agudas. uso en proyectos - 01 - gfm-impedance (objetivo: impedancia y estabilidad): impedance.py calcula \\( y \\) y \\( z \\) así; main phase3.py lo usa para el nyquist generalizado. conceptos relacionados - linealizacion-numerica · impedancia-salida-estabilidad · medicion-impedancia-inyeccion referencias - skogestad, postlethwaite, multivariable feedback control , 2005. espacio-estados bode transferencia frecuencia numpy"}, {"slug": "simulacion-conmutada", "titulo": "Simulación conmutada vs promediada", "categoria": "programacion", "tipo": "metodo", "nivel": "intermedio", "proyectos": [], "objetivos": ["validar el modelo promediado frente a la conmutación real del convertidor"], "tags": ["conmutada", "promediado", "switching", "paso-fijo", "validacion", "intermedio", "programacion"], "relacionados": ["modelo-promediado", "modulacion-pwm", "convertidor-vsc", "integracion-edos-stiff", "fft-analisis-espectral"], "referencias": ["Mohan, Undeland, Robbins, Power Electronics, Wiley", "Maksimovic et al., Modeling and Simulation of Power Electronic Converters, Proc. IEEE 2001"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Comparación de dos niveles de modelo: la <strong>simulación conmutada</strong> (reproduce el encendido/apagado\nreal de los interruptores) y la <strong>promediada</strong> (sustituye la conmutación por los ciclos de trabajo\ncontinuos). El método consiste en simular ambas y verificar que coinciden en la banda de interés.</p>\n<h2>Fundamento teórico</h2>\n<ul>\n<li><strong>Conmutada:</strong> las funciones de conmutación \\( s_x(t)\\in\\{0,1\\}_ \\) imponen la tensión de rama;\n  la dinámica es lineal a tramos con <strong>eventos</strong> en cada cruce de la portadora PWM. Captura\n  armónicos de conmutación, tiempos muertos y rizado, pero es <strong>rígida</strong> y cara (paso pequeño).</li>\n<li><strong>Promediada:</strong> \\( \\langle v_x\\rangle=d_x V_{dc} \\); válida hasta \\( \\approx f_{sw}/2 \\) (teorema\n  de muestreo del promediado). Rápida, ideal para diseño de control y linealización\n  (<a class=\"wl\" data-slug=\"linealizacion-numerica\">linealizacion-numerica</a>).</li>\n</ul>\n<p>La equivalencia se cuantifica comparando la <strong>componente fundamental y la dinámica de baja\nfrecuencia</strong>; las diferencias por encima de \\( f_{sw}/2 \\) son esperables (el promediado no las\nmodela). Un <strong>paso de integración</strong> demasiado grande en la conmutada \"pierde\" instantes de\nconmutación y falsea el rizado: regla práctica \\( \\Delta t \\lesssim \\dfrac{1}{20\\,f_{sw}} \\), o\nusar detección de eventos.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para <strong>validar</strong> que el modelo de control diseñado sobre el promediado funciona con conmutación\nreal, antes de pasar a HIL/hardware; para cuantificar rizado y armónicos (con\n<a class=\"wl\" data-slug=\"fft-analisis-espectral\">fft-analisis-espectral</a>); y para detectar efectos no capturados por el promediado (tiempo muerto,\nsaturación de modulación).</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Implementa el modelo promediado (ciclos de trabajo) y el conmutado (portadora + comparador).</li>\n<li>Fija el paso: conmutada con \\( \\Delta t \\le 1/(20 f_{sw}) \\) o solver con eventos; promediada con\n   paso mayor (puede ser <strong>stiff</strong> → ver <a class=\"wl\" data-slug=\"integracion-edos-stiff\">integracion-edos-stiff</a>).</li>\n<li>Aplica el <strong>mismo</strong> control y la misma perturbación a ambos.</li>\n<li>Compara: fundamental, transitorios de baja frecuencia (deben coincidir) y espectro (FFT).</li>\n<li>Si divergen en baja frecuencia, revisa el promediado (tiempo muerto, no linealidades, saturación).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> VSC con filtro LCL, \\( f_{sw}=5\\,\\text{kHz} \\). Comparar la corriente de red del modelo promediado (\\( \\Delta t=50\\,\\mu\\text{s} \\)) contra la conmutada (\\( \\Delta t=1\\,\\mu\\text{s} \\)) ante un escalón de referencia de corriente.</p>\n<p>En baja frecuencia (&lt;500 Hz): la corriente de ambos modelos sigue idéntica trayectoria — la diferencia en amplitud de fundamental es &lt;0.3 %. En alta frecuencia: el modelo conmutado muestra rizado triangular de ~1.8 A de pico a pico a 5 kHz (corriente del inductor) más armónicos a \\( f_{sw}\\pm50 \\). El promediado no los tiene. Divergencia esperable y normal. Si la fundamental difiere &gt;2 % en régimen permanente, hay un efecto no modelado (tiempo muerto, caída de tensión en IGBTs) que el promediado ignora. En ese caso: cuantificar la distorsión con <a class=\"wl\" data-slug=\"fft-analisis-espectral\">fft-analisis-espectral</a> y decidir si añadirla al promediado como feedforward de compensación.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def pwm_switch(d, carrier):              # 1 rama: comparador PWM\n    return 1.0 if d &gt; carrier else 0.0   # s_x in {0,1}\n# conmutada: dt &lt;= 1/(20*fsw); promediada: v_x = d*Vdc (paso mayor)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Conmutada: \\( \\Delta t \\) = 0.1–1 µs (o eventos). Promediada: \\( \\Delta t \\) = 1–50 µs. La\ndiferencia de baja frecuencia entre ambas debe ser &lt; 1–2 %.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Paso fijo grande en la conmutada → rizado y pérdidas mal calculados (aliasing de la conmutación).</li>\n<li>Esperar que el promediado reproduzca armónicos de conmutación (no puede, por definición).</li>\n<li>Comparar con controles o condiciones iniciales distintas entre ambos modelos.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"modelo-promediado\">modelo-promediado</a> · <a class=\"wl\" data-slug=\"modulacion-pwm\">modulacion-pwm</a> · <a class=\"wl\" data-slug=\"convertidor-vsc\">convertidor-vsc</a> · <a class=\"wl\" data-slug=\"integracion-edos-stiff\">integracion-edos-stiff</a> · <a class=\"wl\" data-slug=\"fft-analisis-espectral\">fft-analisis-espectral</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Mohan, Undeland, Robbins, <em>Power Electronics</em>.</li>\n<li>Maksimovic et al., <em>Modeling and Simulation of Power Electronic Converters</em>, Proc. IEEE 2001.</li>\n</ul>", "buscar": "simulación conmutada vs promediada definición comparación de dos niveles de modelo: la simulación conmutada (reproduce el encendido/apagado real de los interruptores) y la promediada (sustituye la conmutación por los ciclos de trabajo continuos). el método consiste en simular ambas y verificar que coinciden en la banda de interés. fundamento teórico - conmutada: las funciones de conmutación \\( s x(t)\\in\\{0,1\\} \\) imponen la tensión de rama; la dinámica es lineal a tramos con eventos en cada cruce de la portadora pwm. captura armónicos de conmutación, tiempos muertos y rizado, pero es rígida y cara (paso pequeño). - promediada: \\( \\langle v x\\rangle=d x v {dc} \\); válida hasta \\( \\approx f {sw}/2 \\) (teorema de muestreo del promediado). rápida, ideal para diseño de control y linealización ( linealizacion-numerica ). la equivalencia se cuantifica comparando la componente fundamental y la dinámica de baja frecuencia ; las diferencias por encima de \\( f {sw}/2 \\) son esperables (el promediado no las modela). un paso de integración demasiado grande en la conmutada \"pierde\" instantes de conmutación y falsea el rizado: regla práctica \\( \\delta t \\lesssim \\dfrac{1}{20\\,f {sw}} \\), o usar detección de eventos. cuándo y por qué se usa para validar que el modelo de control diseñado sobre el promediado funciona con conmutación real, antes de pasar a hil/hardware; para cuantificar rizado y armónicos (con fft-analisis-espectral ); y para detectar efectos no capturados por el promediado (tiempo muerto, saturación de modulación). procedimiento de diseño (genérico) 1. implementa el modelo promediado (ciclos de trabajo) y el conmutado (portadora + comparador). 2. fija el paso: conmutada con \\( \\delta t \\le 1/(20 f {sw}) \\) o solver con eventos; promediada con paso mayor (puede ser stiff → ver integracion-edos-stiff ). 3. aplica el mismo control y la misma perturbación a ambos. 4. compara: fundamental, transitorios de baja frecuencia (deben coincidir) y espectro (fft). 5. si diver fijo validacion intermedio programacion"}];window.CATL={"fisica-modelado": "Física y modelado", "control": "Teoría de control", "programacion": "Programación e implementación", "metodologia": "Metodología de control"};window.PROJL={"01-GFM-Impedance": "../01%20-%20GFM-Impedance/informe.html", "02-GFL-Impedance": "../02%20-%20GFL-Impedance/informe.html", "03-DataCenter-IA": "../03%20-%20Energia-DataCenter-IA/informe.html"};window.RUTAS=[{"nombre": "Fundamentos de control", "descripcion": "Transformadas, estabilidad y sintonía de controladores clásicos", "icono": "📐", "conceptos": ["transformada-laplace", "funcion-transferencia", "polos-ceros", "sistema-primer-orden", "respuesta-segundo-orden", "realimentacion", "diagrama-bode", "lugar-raices", "routh-hurwitz", "estabilidad-bibo", "criterio-nyquist", "controlador-pid", "anti-windup", "error-regimen-permanente", "diagrama-bloques"]}, {"nombre": "Física del convertidor VSC", "descripcion": "Transformaciones, potencia y modelo del inversor trifásico", "icono": "⚡", "conceptos": ["sistema-trifasico", "potencia-ac-fasores", "convertidor-vsc", "modulacion-pwm", "transformada-clarke", "marco-dq", "potencia-instantanea-dq", "sistema-por-unidad", "filtro-lcl"]}, {"nombre": "Control del lazo de corriente", "descripcion": "Diseño del lazo interno: desacoplo, resonante, notch y discretización", "icono": "🎛", "conceptos": ["diagrama-bloques", "desacoplo-dq", "control-cascada", "controlador-resonante", "compensador-adelanto-atraso", "filtro-notch", "observador-estados", "compensacion-retardo", "discretizacion-controladores"]}, {"nombre": "Estabilidad y robustez", "descripcion": "Márgenes, criterios y robustez ante variación de parámetros", "icono": "🛡", "conceptos": ["margenes-estabilidad", "clasificacion-estabilidad", "especificaciones-control", "criterio-middlebrook", "robustez-parametrica", "funciones-sensibilidad", "nyquist-generalizado", "valores-singulares-mimo"]}, {"nombre": "Grid-forming", "descripcion": "Droop, VSM, inerci <script>
const D = window.DATA, CATL = window.CATL, RUTAS = window.RUTAS||[];
const $=s=>document.querySelector(s);
let sel=null, view='list';

// ─── Estado (progress tracking) ──────────────────────────────────────────
const ST_KEY='repoKB_v1';
const ST_LABELS={visto:'Visto', dominado:'Dominado', repasar:'Repasar'};
const ST_COLOR={visto:'var(--acc)', dominado:'var(--programacion)', repasar:'var(--metodologia)'};

function stMap(){ return JSON.parse(localStorage.getItem(ST_KEY)||'{}'); }
function getStatus(slug){ return stMap()[slug]||null; }
function setStatus(slug,val){
  const m=stMap();
  if(val) m[slug]=val; else delete m[slug];
  localStorage.setItem(ST_KEY,JSON.stringify(m));
  render();
  if(sel===slug) renderStBar(slug);
  if(view==='rutas') renderRutas();
}
function toggleStatus(slug,val){ setStatus(slug, getStatus(slug)===val?null:val); }

function renderStBar(slug){
  const bar=$('#st-bar'); if(!bar) return;
  const s=getStatus(slug);
  bar.innerHTML='<span class="st-label">Estado:</span>'+
    ['visto','dominado','repasar'].map(v=>`<button class="st-btn"${
      s===v?` style="background:${ST_COLOR[v]};color:#0b0e12;border-color:${ST_COLOR[v]}"`:''
    } onclick="toggleStatus('${slug}','${v}')">${ST_LABELS[v]}</button>`
    ).join('')+
    (s?`<button class="st-btn" onclick="setStatus('${slug}',null)">✕</button>`:'');
}

function stBadge(slug){
  const s=getStatus(slug); if(!s) return '';
  return `<span class="st-badge" style="background:${ST_COLOR[s]}">${ST_LABELS[s]}</span>`;
}

// ─── Filtros y lista ──────────────────────────────────────────────────────
function uniqOptions(id,key){
  const s=new Set(); D.forEach(d=>{const v=d[key]; Array.isArray(v)?v.forEach(x=>s.add(x)):s.add(v);});
  const el=$(id); [...s].filter(Boolean).sort().forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=(CATL[v]||v); el.appendChild(o);});
}

function matches(d){
  const q=$('#q').value.trim().toLowerCase();
  if(q && !d.buscar.includes(q) && !d.titulo.toLowerCase().includes(q)) return false;
  for(const [id,key] of [['#fcat','categoria'],['#ftipo','tipo'],['#fniv','nivel']]){
    const v=$(id).value; if(v && d[key]!==v) return false;
  }
  for(const [id,key] of [['#fpro','proyectos'],['#fobj','objetivos'],['#ftag','tags']]){
    const v=$(id).value; if(v && !(d[key]||[]).includes(v)) return false;
  }
  const fs=$('#fstat').value;
  if(fs){ const s=getStatus(d.slug); if(fs==='ninguno'?!!s:(s!==fs)) return false; }
  return true;
}

function render(){
  const sort=$('#sort').value;
  let r=D.filter(matches);
  r.sort((a,b)=> sort==='titulo'? a.titulo.localeCompare(b.titulo)
    : (b.fecha_actualizacion||'').localeCompare(a.fecha_actualizacion||''));
  const tot=D.length,
        ndom=D.filter(d=>getStatus(d.slug)==='dominado').length,
        nvis=D.filter(d=>getStatus(d.slug)==='visto').length;
  const pct=Math.round(ndom/tot*100);
  $('#count').innerHTML=`${r.length} concepto(s) &nbsp;·&nbsp; `+
    `<span style="color:var(--programacion)">${ndom} dom.</span> `+
    `<span style="color:var(--acc)">${nvis} vis.</span> `+
    `<span style="color:var(--muted)">${tot-ndom-nvis} sin</span>`+
    `<span class="mini-prog"><span style="width:${pct}%"></span></span>`;
  const L=$('#list'); L.querySelectorAll('.card').forEach(e=>e.remove());
  r.forEach(d=>{
    const c=document.createElement('div'); c.className='card'+(sel===d.slug?' active':'');
    c.onclick=()=>show(d.slug);
    c.innerHTML=`<h3>${d.titulo}${stBadge(d.slug)}</h3><div class="meta">
      <span class="chip cat" style="background:${catColor(d.categoria)}">${CATL[d.categoria]||d.categoria}</span>
      <span class="chip">${d.tipo}</span><span class="chip">${d.nivel}</span>
      ${(d.proyectos||[]).map(p=>`<span class="chip">${p}</span>`).join('')}</div>`;
    L.appendChild(c);
  });
}
function catColor(c){return getComputedStyle(document.documentElement).getPropertyValue('--'+c.split('-')[0])||'#888';}

// ─── Detail view ─────────────────────────────────────────────────────────
function show(slug){
  if(view!=='list') setView('list');
  sel=slug; const d=D.find(x=>x.slug===slug); const det=$('#detail');
  det.className='detail';
  const bl=D.filter(x=>(x.relacionados||[]).includes(slug)&&x.slug!==slug);
  const blHTML=bl.length?`<div class="backlinks"><span class="bl-lbl">← Referenciado por:</span>`+
    bl.map(x=>`<a class="wl" data-slug="${x.slug}">${x.titulo}</a>`).join(' · ')+`</div>`:'';
  det.innerHTML=`<h1>${d.titulo}</h1><div class="metahead">
    <span class="chip cat" style="background:${catColor(d.categoria)}">${CATL[d.categoria]||d.categoria}</span>
    <span class="chip">${d.tipo}</span><span class="chip">${d.nivel}</span>
    ${(d.proyectos||[]).map(p=> PROJL[p]
       ? `<a class="chip" href="${PROJL[p]}" title="abrir informe del proyecto">📁 ${p} ↗</a>`
       : `<span class="chip">📁 ${p}</span>`).join('')}
    ${(d.objetivos||[]).map(o=>`<span class="chip">🎯 ${o}</span>`).join('')}
    <span class="chip">🗓 ${d.fecha_actualizacion}</span></div>
    <div class="st-bar" id="st-bar"></div>
    ${d.html}${blHTML}`;
  renderStBar(slug);
  det.querySelectorAll('.wl').forEach(a=>a.onclick=()=>{const s=a.dataset.slug; if(D.find(x=>x.slug===s)) show(s);});
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([det]);
  history.replaceState(null,'','#'+slug);
  det.scrollTop=0; render();
}

// ─── Rutas de aprendizaje ─────────────────────────────────────────────────
function renderRutas(){
  const el=$('#rutaswrap'); if(!el) return;
  el.innerHTML=RUTAS.map(r=>{
    const slugs=r.conceptos||[], tot=slugs.length;
    const ndom=slugs.filter(s=>getStatus(s)==='dominado').length;
    const nvis=slugs.filter(s=>getStatus(s)==='visto').length;
    const prep=slugs.filter(s=>getStatus(s)==='repasar').length;
    const pdom=tot?Math.round(ndom/tot*100):0, pall=tot?Math.round((ndom+nvis)/tot*100):0;
    const items=slugs.map((slug,i)=>{
      const dd=D.find(x=>x.slug===slug), nm=dd?dd.titulo:slug, s=getStatus(slug);
      const ico={visto:'👁',dominado:'✓',repasar:'↩'}[s]||'○';
      const col=ST_COLOR[s]||'var(--muted)';
      return `<div class="ruta-item" onclick="show('${slug}')">
        <span class="ruta-n">${i+1}</span>
        <span class="ruta-step-ico" style="color:${col}">${ico}</span>
        <span class="ruta-nm">${nm}</span>
        ${s?`<span class="st-badge" style="background:${col}">${ST_LABELS[s]}</span>`:''}
      </div>`;
    }).join('');
    return `<div class="ruta-card">
      <div class="ruta-hdr">
        <span class="ruta-ico">${r.icono||'📚'}</span>
        <div><div class="ruta-nom">${r.nombre}</div><div class="ruta-dsc">${r.descripcion}</div></div>
        <div class="ruta-st">
          <span style="color:var(--programacion)">${ndom} dom.</span>
          <span style="color:var(--acc)">${nvis} vis.</span>
          ${prep?`<span style="color:var(--metodologia)">${prep} rep.</span>`:''}
          <br><span style="color:var(--muted)">${tot-ndom-nvis-prep} sin · ${tot} total</span>
        </div>
      </div>
      <div class="ruta-pbwrap">
        <div class="ruta-pb ruta-pb-v" style="width:${pall}%"></div>
        <div class="ruta-pb ruta-pb-d" style="width:${pdom}%"></div>
      </div>
      <div class="ruta-list">${items}</div>
    </div>`;
  }).join('');
}

// ─── Vistas ───────────────────────────────────────────────────────────────
let net=null;
const GCOLOR={'fisica-modelado':'#4ea3ff','control':'#a78bfa','programacion':'#5ad19a','metodologia':'#ffb454'};

function setView(v){
  view=v;
  $('#vlist').classList.toggle('on',v==='list');
  $('#vgraph').classList.toggle('on',v==='graph');
  $('#vrutas').classList.toggle('on',v==='rutas');
  $('#list').classList.toggle('hide',v!=='list');
  $('#detail').style.display=v==='list'?'':'none';
  $('#graphwrap').classList.toggle('show',v==='graph');
  $('#rutaswrap').classList.toggle('show',v==='rutas');
  if(v==='graph') buildGraph();
  if(v==='rutas') renderRutas();
}

function buildGraph(){
  if(typeof vis==='undefined'){setTimeout(buildGraph,200);return;}
  const vd=D.filter(matches), ok=new Set(vd.map(d=>d.slug));
  const nodes=vd.map(d=>({id:d.slug,label:d.titulo,group:d.categoria,value:1+(d.relacionados||[]).length}));
  const edges=[], ek=new Set();
  vd.forEach(d=>(d.relacionados||[]).forEach(r=>{
    if(!ok.has(r))return; const k=[d.slug,r].sort().join('|');
    if(!ek.has(k)){ek.add(k); edges.push({from:d.slug,to:r});}
  }));
  const opts={
    groups:{'fisica-modelado':{color:GCOLOR['fisica-modelado']},'control':{color:GCOLOR['control']},
            'programacion':{color:GCOLOR['programacion']},'metodologia':{color:GCOLOR['metodologia']}},
    nodes:{shape:'dot',scaling:{min:8,max:26},font:{color:'#e6edf3',size:13}},
    edges:{color:{color:'#3a4756',highlight:'#4ea3ff'},smooth:false,width:1},
    physics:{barnesHut:{gravitationalConstant:-4000,springLength:130,springConstant:0.04},stabilization:{iterations:250}},
    interaction:{hover:true,tooltipDelay:120}
  };
  if(net) net.destroy();
  net=new vis.Network($('#graph'),{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},opts);
  net.on('click',p=>{if(p.nodes.length){sel=p.nodes[0]; show(sel);}});
}

function onFilter(){render(); if(view==='graph') buildGraph(); if(view==='rutas') renderRutas();}
function clearAll(){['#q','#fcat','#ftipo','#fniv','#fpro','#fobj','#ftag','#fstat'].forEach(s=>$(s).value=''); onFilter();}
function applyHash(){const s=decodeURIComponent(location.hash.slice(1)); if(s&&D.find(x=>x.slug===s)) show(s);}

window.addEventListener('DOMContentLoaded',()=>{
  uniqOptions('#fcat','categoria'); uniqOptions('#ftipo','tipo'); uniqOptions('#fniv','nivel');
  uniqOptions('#fpro','proyectos'); uniqOptions('#fobj','objetivos'); uniqOptions('#ftag','tags');
  ['#q','#fcat','#ftipo','#fniv','#fpro','#fobj','#ftag','#fstat','#sort'].forEach(s=>$(s).addEventListener('input',onFilter));
  $('#vlist').onclick=()=>setView('list');
  $('#vgraph').onclick=()=>setView('graph');
  $('#vrutas').onclick=()=>setView('rutas');
  render(); applyHash();
});
window.addEventListener('hashchange', applyHash);
</script>
