ilidad en red): SCR crítico por Nyquist = <strong>3.39</strong> y\n  por autovalores del modelo acoplado = <strong>3.35</strong> (diferencia 1.3%). En <code>main_phase3.py</code>.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"respuesta-frecuencia-ss\">respuesta-frecuencia-ss</a> · <a class=\"wl\" data-slug=\"red-thevenin-scr\">red-thevenin-scr</a> · <a class=\"wl\" data-slug=\"medicion-impedancia-inyeccion\">medicion-impedancia-inyeccion</a> · <a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Sun, IEEE TPEL 2011 · Wang, Blaabjerg, IEEE TPEL 2019.</li>\n</ul>", "buscar": "estabilidad por impedancia (nyquist generalizado) definición criterio que decide la estabilidad de la interacción inversor–red comparando sus impedancias, sin reconstruir el modelo completo cada vez. en dq es un sistema mimo 2×2, así que se usa el nyquist generalizado (sobre los autovalores de la matriz de retorno). fundamento teórico inversor como admitancia de salida \\( y {inv}(s) \\) (2×2), red como impedancia \\( z {red}(s) \\). el minor loop gain es: \\mathbf{l}(s)=\\mathbf{z} {red}(s)\\,\\mathbf{y} {inv}(s) si inversor y red son estables por separado, el conjunto es estable si y solo si los autovalores de \\( \\mathbf{l}(j\\omega) \\) no rodean −1 (nyquist generalizado). equivale a exigir que \\( \\det(\\mathbf{i}+\\mathbf{l}(s)) \\) no tenga ceros en el semiplano derecho. cuándo y por qué se usa integración masiva de inversores, oscilaciones subsíncronas, redes débiles. permite barrer la fortaleza de red (scr) y hallar el scr crítico de inestabilidad de forma modular. procedimiento de diseño (genérico) 1. obtén \\( y {inv}(j\\omega) \\) del inversor (ver respuesta-frecuencia-ss o medicion-impedancia-inyeccion ). 2. modela \\( z {red}(j\\omega) \\) según scr y x/r (ver red-thevenin-scr ). 3. calcula \\( \\mathbf{l}=z {red}y {inv} \\) y sus autovalores en frecuencia. 4. aplica nyquist generalizado: ¿rodean −1? barre scr hasta el crítico. 5. valida contra los autovalores del modelo acoplado (deben coincidir). ejemplo de código python autovalores del minor loop gain en cada frecuencia for k, f in enumerate(freqs): s = 2j np.pi f g = c @ np.linalg.solve(s np.eye(n) - a, b) + d yinv = -g zg = np.array( rg+s lg, -w0 lg , w0 lg, rg+s lg ) lam k = np.linalg.eigvals(zg @ yinv) no deben rodear -1 parámetros y valores típicos scr crítico depende del control. grid-following: inestable en red débil (scr bajo). grid-forming agresivo: inestable en red fuerte (scr alto). errores comunes - confundir el signo: \\( y {inv}=-\\partial i g/\\partial v {pcc} \\) (convención de fuente). - aplicar el nyquist siso a un sistema dq acoplado → hay que usar el generalizado (autovalores de la matriz 2×2). - olvidar validar contra el modelo acoplado. uso en proyectos - 01 - gfm-impedance (objetivo: estabilidad en red): scr crítico por nyquist = 3.39 y por autovalores del modelo acoplado = 3.35 (diferencia 1.3%). en main phase3.py . conceptos relacionados - respuesta-frecuencia-ss · red-thevenin-scr · medicion-impedancia-inyeccion · analisis-modal referencias - sun, ieee tpel 2011 · wang, blaabjerg, ieee tpel 2019. impedancia nyquist dq red-debil scr oscilaciones-subsincronas"}, {"slug": "impedancia-virtual", "titulo": "Impedancia virtual", "categoria": "control", "tipo": "tecnica", "nivel": "avanzado", "proyectos": ["01-GFM-Impedance"], "objetivos": ["estabilizar el lazo de potencia", "amortiguar oscilaciones", "desacoplar P-Q"], "tags": ["grid-forming", "droop", "reactancia", "dq", "amortiguamiento"], "relacionados": ["droop-control", "control-cascada", "grid-forming-vs-following"], "referencias": ["Rocabert et al., Control of Power Converters in AC Microgrids, IEEE Trans. Power Electron., 2012", "Wang, Blaabjerg, Harmonic Stability in Power-Electronic-Based Power Systems, IEEE TPEL 2019"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>La <strong>impedancia virtual</strong> es una impedancia emulada por software que el inversor añade a su\nsalida <strong>restándola de la referencia de tensión</strong>, sin componentes físicos. Sirve para dar\nforma a la impedancia de salida del convertidor: amortiguar, desacoplar P–Q y limitar\ncorriente.</p>\n<h2>Fundamento teórico</h2>\n<p>La referencia de tensión del lazo se corrige con la caída sobre una impedancia\n\\( Z_v = R_v + jX_v \\) recorrida por la corriente de salida \\( \\mathbf{i} \\):</p>\n<p>$$ \\mathbf{v}_{C}^{*} = \\mathbf{v}_{ref} - Z_v\\,\\mathbf{i} $$</p>\n<p>En el marco dq (síncrono a \\( \\omega \\)) la caída se expresa con el acoplamiento cruzado:</p>\n<p>$$ v^{*}_{Cd} = v_{ref,d} - R_v i_d + \\omega L_v i_q, \\qquad\n   v^{*}_{Cq} = v_{ref,q} - R_v i_q - \\omega L_v i_d $$</p>\n<p>El efecto clave: la ganancia del lazo de potencia de un grid-forming es\n\\( \\partial P/\\partial\\delta \\approx 1.5\\,V^2/X \\). Aumentar la reactancia efectiva con\n\\( X_v \\) <strong>reduce esa ganancia</strong> y, por tanto, el riesgo de inestabilidad del lazo de\npotencia, sin añadir un polo de planta lento (es algebraica sobre la referencia).</p>\n<h2>Cuándo y por qué se usa</h2>\n<ul>\n<li>Cuando la reactancia de acoplamiento real es pequeña → \\( \\partial P/\\partial\\delta \\)\n  enorme → el lazo de potencia tiene poco margen de fase y oscila o se inestabiliza.</li>\n<li>Para <strong>desacoplar</strong> P (ángulo) de Q (tensión) haciendo la red vista más inductiva.</li>\n<li>Como base del <strong>current limiting</strong> (impedancia virtual adaptativa en faltas).</li>\n</ul>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li><strong>Elige la parte inductiva \\( X_v \\)</strong> para fijar la impedancia de acoplamiento total\n   deseada (típico 0.1–0.3 pu): \\( X_{tot} = X_{fisica} + X_v \\). Más \\( X_v \\) → menor\n   \\( \\partial P/\\partial\\delta \\) → lazo de potencia más amortiguado, pero más caída de\n   tensión y mayor \\( \\delta \\) en operación.</li>\n<li><strong>Verifica el equilibrio</strong>: la parte <strong>resistiva \\( R_v \\)</strong> estática introduce una caída\n   en el eje d que el droop Q–V intenta compensar generando reactiva → puede disparar\n   \\( Q_{eq} \\). Usa \\( R_v \\) pequeña.</li>\n<li><strong>Para amortiguar sin distorsionar el equilibrio</strong>, usa <strong>resistencia virtual transitoria</strong>:\n   aplica \\( R_v \\) solo a la componente de alta frecuencia de la corriente (filtro paso-alto),\n   con corte <strong>por debajo</strong> del modo a amortiguar:\n   $$ v_{virt} = R_{v,tr}\\,\\big(i - \\text{LPF}_{f_{ht}}(i)\\big) $$</li>\n<li><strong>Comprueba con autovalores</strong>: barre \\( X_v, R_{v,tr} \\) y maximiza el amortiguamiento\n   \\( \\zeta \\) del modo de potencia manteniendo \\( Q_{eq} \\) y \\( \\delta \\) razonables.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># Impedancia virtual estatica + resistencia virtual transitoria (marco dq)\nwht = 2*np.pi*f_ht                      # corte del HPF\niL2_hp = iL2 - iL2_lp                   # componente transitoria (estado iL2_lp = LPF)\nvvirt_d = Rv*iL2d - w*Lv*iL2q + Rvt*iL2_hp[0]\nvvirt_q = Rv*iL2q + w*Lv*iL2d + Rvt*iL2_hp[1]\nvcref_d, vcref_q = Vref - vvirt_d, 0.0 - vvirt_q\ndiL2_lp = wht*(iL2 - iL2_lp)            # dinamica del filtro paso-bajo\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<ul>\n<li>\\( X_v \\): 0.1–0.3 pu (en el proyecto, \\( L_v = 8\\,\\text{mH} \\approx 0.16\\,\\text{pu} \\)).</li>\n<li>\\( R_v \\) estática: pequeña (≈0.05 pu) para no disparar Q.</li>\n<li>\\( R_{v,tr} \\): mayor (≈0.1–0.2 pu) porque solo actúa en transitorios; corte \\( f_{ht} \\)\n  por debajo del modo (en el proyecto, 4 Hz para un modo de 3.3 Hz).</li>\n</ul>\n<h2>Errores comunes</h2>\n<ul>\n<li><strong>Usar \\( R_v \\) resistiva grande</strong> para amortiguar → dispara \\( Q_{eq} \\) (pelea con el\n  droop Q–V). Solución: inductiva para ganancia, transitoria para amortiguamiento.</li>\n<li><strong>Confundir \\( L_v \\) virtual con subir \\( L_2 \\) físico</strong>: el físico añade un polo lento de\n  planta y mueve la resonancia LCL; la virtual no.</li>\n<li>Poner el corte del HPF por encima del modo → la resistencia transitoria no actúa donde se\n  necesita.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>01 - GFM-Impedance</strong> (objetivo: estabilizar el lazo de potencia): el primer diseño era\n  inestable porque \\( \\partial P/\\partial\\delta \\) era enorme. Añadir \\( L_v = 8\\,\\text{mH} \\)\n  estabilizó sin distorsionar el equilibrio, y la \\( R_{v,tr} \\) subió el amortiguamiento del\n  modo de potencia de \\( \\zeta=0.17 \\) a \\( \\zeta=0.40 \\). Implementado en <code>simulate.py</code> y\n  <code>model.py</code>.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"droop-control\">droop-control</a> — la impedancia virtual moldea el lazo de potencia del droop.</li>\n<li><a class=\"wl\" data-slug=\"control-cascada\">control-cascada</a> — se aplica sobre la referencia del lazo de tensión.</li>\n<li><a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a> — pieza casi obligatoria en grid-forming.</li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Rocabert et al., <em>Control of Power Converters in AC Microgrids</em>, IEEE TPEL 2012.</li>\n</ul>", "buscar": "impedancia virtual definición la impedancia virtual es una impedancia emulada por software que el inversor añade a su salida restándola de la referencia de tensión , sin componentes físicos. sirve para dar forma a la impedancia de salida del convertidor: amortiguar, desacoplar p–q y limitar corriente. fundamento teórico la referencia de tensión del lazo se corrige con la caída sobre una impedancia \\( z v = r v + jx v \\) recorrida por la corriente de salida \\( \\mathbf{i} \\): \\mathbf{v} {c}^{ } = \\mathbf{v} {ref} - z v\\,\\mathbf{i} en el marco dq (síncrono a \\( \\omega \\)) la caída se expresa con el acoplamiento cruzado: v^{ } {cd} = v {ref,d} - r v i d + \\omega l v i q, \\qquad v^{ } {cq} = v {ref,q} - r v i q - \\omega l v i d el efecto clave: la ganancia del lazo de potencia de un grid-forming es \\( \\partial p/\\partial\\delta \\approx 1.5\\,v^2/x \\). aumentar la reactancia efectiva con \\( x v \\) reduce esa ganancia y, por tanto, el riesgo de inestabilidad del lazo de potencia, sin añadir un polo de planta lento (es algebraica sobre la referencia). cuándo y por qué se usa - cuando la reactancia de acoplamiento real es pequeña → \\( \\partial p/\\partial\\delta \\) enorme → el lazo de potencia tiene poco margen de fase y oscila o se inestabiliza. - para desacoplar p (ángulo) de q (tensión) haciendo la red vista más inductiva. - como base del current limiting (impedancia virtual adaptativa en faltas). procedimiento de diseño (genérico) 1. elige la parte inductiva \\( x v \\) para fijar la impedancia de acoplamiento total deseada (típico 0.1–0.3 pu): \\( x {tot} = x {fisica} + x v \\). más \\( x v \\) → menor \\( \\partial p/\\partial\\delta \\) → lazo de potencia más amortiguado, pero más caída de tensión y mayor \\( \\delta \\) en operación. 2. verifica el equilibrio : la parte resistiva \\( r v \\) estática introduce una caída en el eje d que el droop q–v intenta compensar generando reactiva → puede disparar \\( q {eq} \\). usa \\( r v \\) pequeña. 3. para amortiguar sin distorsionar el equilibrio , usa resistencia virtual transitoria : aplica \\( r v \\) solo a la componente de alta frecuencia de la corriente (filtro paso-alto), con corte por debajo del modo a amortiguar: v {virt} = r {v,tr}\\,\\big(i - \\text{lpf} {f {ht}}(i)\\big) 4. comprueba con autovalores : barre \\( x v, r {v,tr} \\) y maximiza el amortiguamiento \\( \\zeta \\) del modo de potencia manteniendo \\( q {eq} \\) y \\( \\delta \\) razonables. ejemplo de código python impedancia virtual estatica + resistencia virtual transitoria (marco dq) wht = 2 np.pi f ht corte del hpf il2 hp = il2 - il2 lp componente transitoria (estado il2 lp = lpf) vvirt d = rv il2d - w lv il2q + rvt il2 hp 0 vvirt q = rv il2q + w lv il2d + rvt il2 hp 1 vcref d, vcref q = vref - vvirt d, 0.0 - vvirt q dil2 lp = wht (il2 - il2 lp) dinamica del filtro paso-bajo parámetros y valores típicos - \\( x v \\): 0.1–0.3 pu (en el proyecto, \\( l v = 8\\,\\text{mh} \\approx 0.16\\,\\text{pu} \\)). - \\( r v \\) estática: pequeña (≈0.05 pu) para no disparar q. - \\( r {v,tr} \\): mayor (≈0.1–0.2 pu) porque solo actúa en transitorios; corte \\( f {ht} \\) por debajo del modo (en el proyecto, 4 hz para un modo de 3.3 hz). errores comunes - usar \\( r v \\) resistiva grande para amortiguar → dispara \\( q {eq} \\) (pelea con el droop q–v). solución: inductiva para ganancia, transitoria para amortiguamiento. - confundir \\( l v \\) virtual con subir \\( l 2 \\) físico : el físico añade un polo lento de planta y mueve la resonancia lcl; la virtual no. - poner el corte del hpf por encima del modo → la resistencia transitoria no actúa donde se necesita. uso en proyectos - 01 - gfm-impedance (objetivo: estabilizar el lazo de potencia): el primer diseño era inestable porque \\( \\partial p/\\partial\\delta \\) era enorme. añadir \\( l v = 8\\,\\text{mh} \\) estabilizó sin distorsionar el equilibrio, y la \\( r {v,tr} \\) subió el amortiguamiento del modo de potencia de \\( \\zeta=0.17 \\) a \\( \\zeta=0.40 \\). implementado en simulate.py y model.py . conceptos relacionados - droop-control — la impedancia virtual moldea el lazo de potencia del droop. - control-cascada — se aplica sobre la referencia del lazo de tensión. - grid-forming-vs-following — pieza casi obligatoria en grid-forming. referencias - rocabert et al., control of power converters in ac microgrids , ieee tpel 2012. grid-forming droop reactancia dq amortiguamiento"}, {"slug": "interaccion-pll-red-debil", "titulo": "Interacción PLL–red débil (inestabilidad del grid-following)", "categoria": "control", "tipo": "fenomeno", "nivel": "avanzado", "proyectos": ["02-GFL-Impedance"], "objetivos": ["entender y evitar la inestabilidad del GFL en red debil"], "tags": ["pll", "red-debil", "SCR", "grid-following", "oscilaciones", "estabilidad"], "relacionados": ["pll-srf", "no-pasividad-resistencia-negativa", "impedancia-salida-estabilidad", "grid-forming-vs-following", "red-thevenin-scr"], "referencias": ["Dong et al., Analysis of Phase-Locked Loop Low-Frequency Stability in DG, IEEE TIE 2015"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Inestabilidad característica del inversor grid-following en <strong>red débil</strong> (SCR bajo): la PLL y\nla impedancia de red forman un lazo de realimentación positiva que produce oscilaciones de baja\nfrecuencia.</p>\n<h2>Fundamento teórico</h2>\n<p>La PLL mide la tensión en el PCC para estimar el ángulo. En red débil (alta \\( L_g \\)), la\n<strong>corriente inyectada perturba esa tensión</strong>: al inyectar, cae/gira la tensión del PCC, la PLL\nmalinterpreta el ángulo y corrige la corriente, que vuelve a perturbar la tensión. Si la PLL es\nrápida, esta realimentación se cierra con fase desfavorable → inestable. En términos de\nimpedancia, la PLL hace \\( \\mathrm{Re}\\{Z\\}<0 \\) (ver <a class=\"wl\" data-slug=\"no-pasividad-resistencia-negativa\">no-pasividad-resistencia-negativa</a>) y al\ncruzarse con la red inductiva se viola el Nyquist (ver <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a>).</p>\n<p>Es el <strong>espejo</strong> del grid-forming: el GFL se inestabiliza en red DÉBIL; el GFM (con control\nagresivo) en red FUERTE.</p>\n<h2>Cuándo y por qué se usa (cómo se evita)</h2>\n<p>Aparece en parques PV/eólicos GFL conectados por líneas largas (red débil). Se previene\nlimitando el ancho de banda de la PLL, con impedance shaping, o migrando a grid-forming.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Estima el SCR del punto de conexión (ver <a class=\"wl\" data-slug=\"red-thevenin-scr\">red-thevenin-scr</a>).</li>\n<li>Calcula la impedancia del GFL y verifica el Nyquist de \\( Z_{red}Y_{inv} \\) en el SCR mínimo.</li>\n<li>Si hay riesgo: <strong>reduce el ancho de banda de la PLL</strong> (es la palanca principal), añade\n   amortiguamiento/impedance shaping, o usa grid-forming.</li>\n<li>Verifica el SCR crítico vs el ancho de banda de la PLL.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\"># barrer SCR y ancho de banda de la PLL -&gt; mapa de estabilidad\nfor fpll in [40, 60, 100, 150]:\n    scr_crit = biseccion(lambda scr: maxre_acoplado(scr, fpll))  # inestable por debajo\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>PLL lenta (≈30 Hz): robusta hasta SCR≈1. PLL rápida (≈100 Hz): inestable por debajo de\nSCR≈3.5. PLL muy rápida (≈170 Hz): inestable hasta SCR≈8 (casi cualquier red).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Acelerar la PLL para \"mejorar\" el seguimiento sin comprobar la red débil.</li>\n<li>Diseñar con red fuerte y desplegar en red débil sin reevaluar.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>02 - GFL-Impedance</strong> (objetivo: entender la inestabilidad): SCR crítico validado por dos\n  vías (acoplado 3.48 vs Nyquist 3.55). La curva SCR_crítico(f_pll) muestra que la PLL rápida\n  amplía la región débil inestable. Comparación directa con el GFM en <code>main_compare.py</code>.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"pll-srf\">pll-srf</a> · <a class=\"wl\" data-slug=\"no-pasividad-resistencia-negativa\">no-pasividad-resistencia-negativa</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a> · <a class=\"wl\" data-slug=\"red-thevenin-scr\">red-thevenin-scr</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Dong et al., <em>Analysis of PLL Low-Frequency Stability in DG</em>, IEEE TIE 2015.</li>\n</ul>", "buscar": "interacción pll–red débil (inestabilidad del grid-following) definición inestabilidad característica del inversor grid-following en red débil (scr bajo): la pll y la impedancia de red forman un lazo de realimentación positiva que produce oscilaciones de baja frecuencia. fundamento teórico la pll mide la tensión en el pcc para estimar el ángulo. en red débil (alta \\( l g \\)), la corriente inyectada perturba esa tensión : al inyectar, cae/gira la tensión del pcc, la pll malinterpreta el ángulo y corrige la corriente, que vuelve a perturbar la tensión. si la pll es rápida, esta realimentación se cierra con fase desfavorable → inestable. en términos de impedancia, la pll hace \\( \\mathrm{re}\\{z\\}<0 \\) (ver no-pasividad-resistencia-negativa ) y al cruzarse con la red inductiva se viola el nyquist (ver impedancia-salida-estabilidad ). es el espejo del grid-forming: el gfl se inestabiliza en red débil; el gfm (con control agresivo) en red fuerte. cuándo y por qué se usa (cómo se evita) aparece en parques pv/eólicos gfl conectados por líneas largas (red débil). se previene limitando el ancho de banda de la pll, con impedance shaping, o migrando a grid-forming. procedimiento de diseño (genérico) 1. estima el scr del punto de conexión (ver red-thevenin-scr ). 2. calcula la impedancia del gfl y verifica el nyquist de \\( z {red}y {inv} \\) en el scr mínimo. 3. si hay riesgo: reduce el ancho de banda de la pll (es la palanca principal), añade amortiguamiento/impedance shaping, o usa grid-forming. 4. verifica el scr crítico vs el ancho de banda de la pll. ejemplo de código python barrer scr y ancho de banda de la pll - mapa de estabilidad for fpll in 40, 60, 100, 150 : scr crit = biseccion(lambda scr: maxre acoplado(scr, fpll)) inestable por debajo parámetros y valores típicos pll lenta (≈30 hz): robusta hasta scr≈1. pll rápida (≈100 hz): inestable por debajo de scr≈3.5. pll muy rápida (≈170 hz): inestable hasta scr≈8 (casi cualquier red). errores comunes - acelerar la pll para \"mejorar\" el seguimiento sin comprobar la red débil. - diseñar con red fuerte y desplegar en red débil sin reevaluar. uso en proyectos - 02 - gfl-impedance (objetivo: entender la inestabilidad): scr crítico validado por dos vías (acoplado 3.48 vs nyquist 3.55). la curva scr crítico(f pll) muestra que la pll rápida amplía la región débil inestable. comparación directa con el gfm en main compare.py . conceptos relacionados - pll-srf · no-pasividad-resistencia-negativa · impedancia-salida-estabilidad · grid-forming-vs-following · red-thevenin-scr referencias - dong et al., analysis of pll low-frequency stability in dg , ieee tie 2015. pll red-debil scr grid-following oscilaciones estabilidad"}, {"slug": "lugar-raices", "titulo": "Lugar de las raíces (root locus)", "categoria": "control", "tipo": "metodo", "nivel": "basico", "proyectos": [], "objetivos": ["ver cómo migran los polos del lazo cerrado al variar una ganancia"], "tags": ["root-locus", "lugar-raices", "polos", "ganancia", "basico", "control"], "relacionados": ["polos-ceros", "realimentacion", "funcion-transferencia", "controlador-pid", "respuesta-segundo-orden"], "referencias": ["Ogata, Ingeniería de Control Moderna, Pearson", "Franklin, Powell, Feedback Control of Dynamic Systems, Pearson"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Trayectoria que describen los <strong>polos del lazo cerrado</strong> en el plano \\( s \\) cuando una ganancia\n\\( K \\) varía de \\( 0 \\) a \\( \\infty \\). Muestra de un vistazo cómo la realimentación reubica la\ndinámica.</p>\n<h2>Fundamento teórico</h2>\n<p>Para \\( 1+K\\,G(s)H(s)=0 \\), un punto \\( s \\) pertenece al lugar si cumple la <strong>condición de\nángulo</strong> y fija \\( K \\) con la de <strong>módulo</strong>:\n$$ \\angle G(s)H(s) = \\pm 180^\\circ(2k+1), \\qquad K = \\frac{1}{|G(s)H(s)|} $$\nReglas clave: las ramas parten de los <strong>polos</strong> (\\( K=0 \\)) y terminan en los <strong>ceros</strong> o en el\ninfinito (\\( K\\to\\infty \\)); hay \\( n-m \\) <strong>asíntotas</strong> con ángulos \\( \\frac{(2k+1)180^\\circ}{n-m} \\)\ny centroide \\( \\sigma_a=\\frac{\\sum p_i-\\sum z_i}{n-m} \\); el lugar sobre el eje real queda a la\nizquierda de un número impar de polos+ceros.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Diseño y sintonía clásicos: elegir \\( K \\) para un amortiguamiento/velocidad objetivo, ver el\nefecto de añadir un cero (red de adelanto) o un polo, y anticipar cuándo el sistema se vuelve\ninestable (ramas cruzando al SPD).</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Escribe la ecuación \\( 1+K\\,G(s)H(s)=0 \\) e identifica polos y ceros.</li>\n<li>Dibuja ramas, asíntotas, puntos de ruptura y cruces con \\( j\\omega \\).</li>\n<li>Superpón rectas de \\( \\zeta \\) constante / \\( \\omega_n \\) constante.</li>\n<li>Lee el \\( K \\) que coloca los polos dominantes en la zona deseada.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Planta de corriente \\( G(s)=1/(Ls)=500/s \\) (con \\( L=2\\,\\text{mH} \\) tras cancelar el polo resistivo) más realimentación proporcional \\( K_p \\). Usar el lugar de raíces para encontrar \\( K_p \\) tal que \\( \\omega_{cl}>5\\,\\text{krad/s} \\).</p>\n<p>El lazo abierto \\( K_p\\cdot500/s \\) tiene un único polo en el origen. El lugar de raíces es el eje real negativo: el polo del lazo cerrado es \\( p_{cl}=-500K_p \\). Para \\( \\omega_{cl}=|p_{cl}|>5000\\,\\text{rad/s} \\): \\( K_p>10 \\). Con \\( K_p=12.6 \\) (diseño previo): \\( p_{cl}=-6300\\,\\text{rad/s} \\approx f_c=1\\,\\text{kHz} \\). Al ser el único polo, \\( \\zeta=1 \\) siempre (respuesta exponencial pura). El lugar de raíces confirma que no hay riesgo de oscilación con este tipo de planta y que la ganancia solo controla la velocidad.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct\nG = ct.tf([1], [1, 3, 2, 0])       # planta con integrador\nct.root_locus(G)                    # K de 0 a inf\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Polos dominantes con \\( \\zeta\\approx0.5\\text{–}0.7 \\) (sobreimpulso 5–15 %). El cruce con\n\\( j\\omega \\) marca el \\( K \\) límite de estabilidad.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Fiarse solo de los polos dominantes ignorando ceros cercanos que alteran la respuesta.</li>\n<li>Olvidar que añadir integrador desplaza ramas hacia el SPD (desestabiliza).</li>\n<li>Confundir el lugar (varía \\( K \\)) con el mapa polo-cero fijo.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"polos-ceros\">polos-ceros</a> · <a class=\"wl\" data-slug=\"realimentacion\">realimentacion</a> · <a class=\"wl\" data-slug=\"respuesta-segundo-orden\">respuesta-segundo-orden</a> · <a class=\"wl\" data-slug=\"controlador-pid\">controlador-pid</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Ogata, <em>Ingeniería de Control Moderna</em>.</li>\n<li>Franklin, Powell, <em>Feedback Control of Dynamic Systems</em>.</li>\n</ul>", "buscar": "lugar de las raíces (root locus) definición trayectoria que describen los polos del lazo cerrado en el plano \\( s \\) cuando una ganancia \\( k \\) varía de \\( 0 \\) a \\( \\infty \\). muestra de un vistazo cómo la realimentación reubica la dinámica. fundamento teórico para \\( 1+k\\,g(s)h(s)=0 \\), un punto \\( s \\) pertenece al lugar si cumple la condición de ángulo y fija \\( k \\) con la de módulo : \\angle g(s)h(s) = \\pm 180^\\circ(2k+1), \\qquad k = \\frac{1}{|g(s)h(s)|} reglas clave: las ramas parten de los polos (\\( k=0 \\)) y terminan en los ceros o en el infinito (\\( k\\to\\infty \\)); hay \\( n-m \\) asíntotas con ángulos \\( \\frac{(2k+1)180^\\circ}{n-m} \\) y centroide \\( \\sigma a=\\frac{\\sum p i-\\sum z i}{n-m} \\); el lugar sobre el eje real queda a la izquierda de un número impar de polos+ceros. cuándo y por qué se usa diseño y sintonía clásicos: elegir \\( k \\) para un amortiguamiento/velocidad objetivo, ver el efecto de añadir un cero (red de adelanto) o un polo, y anticipar cuándo el sistema se vuelve inestable (ramas cruzando al spd). procedimiento (genérico) 1. escribe la ecuación \\( 1+k\\,g(s)h(s)=0 \\) e identifica polos y ceros. 2. dibuja ramas, asíntotas, puntos de ruptura y cruces con \\( j\\omega \\). 3. superpón rectas de \\( \\zeta \\) constante / \\( \\omega n \\) constante. 4. lee el \\( k \\) que coloca los polos dominantes en la zona deseada. ejemplo de aplicación real problema: planta de corriente \\( g(s)=1/(ls)=500/s \\) (con \\( l=2\\,\\text{mh} \\) tras cancelar el polo resistivo) más realimentación proporcional \\( k p \\). usar el lugar de raíces para encontrar \\( k p \\) tal que \\( \\omega {cl} 5\\,\\text{krad/s} \\). el lazo abierto \\( k p\\cdot500/s \\) tiene un único polo en el origen. el lugar de raíces es el eje real negativo: el polo del lazo cerrado es \\( p {cl}=-500k p \\). para \\( \\omega {cl}=|p {cl}| 5000\\,\\text{rad/s} \\): \\( k p 10 \\). con \\( k p=12.6 \\) (diseño previo): \\( p {cl}=-6300\\,\\text{rad/s} \\approx f c=1\\,\\text{khz} \\). al ser el único polo, \\( \\zeta=1 \\) siempre (respuesta exponencial pura). el lugar de raíces confirma que no hay riesgo de oscilación con este tipo de planta y que la ganancia solo controla la velocidad. ejemplo de código python import control as ct g = ct.tf( 1 , 1, 3, 2, 0 ) planta con integrador ct.root locus(g) k de 0 a inf parámetros y valores típicos polos dominantes con \\( \\zeta\\approx0.5\\text{–}0.7 \\) (sobreimpulso 5–15 %). el cruce con \\( j\\omega \\) marca el \\( k \\) límite de estabilidad. errores comunes - fiarse solo de los polos dominantes ignorando ceros cercanos que alteran la respuesta. - olvidar que añadir integrador desplaza ramas hacia el spd (desestabiliza). - confundir el lugar (varía \\( k \\)) con el mapa polo-cero fijo. conceptos relacionados - polos-ceros · realimentacion · respuesta-segundo-orden · controlador-pid referencias - ogata, ingeniería de control moderna . - franklin, powell, feedback control of dynamic systems . root-locus lugar-raices polos ganancia basico control"}, {"slug": "matching-control", "titulo": "Matching control (control por emparejamiento)", "categoria": "control", "tipo": "tecnica", "nivel": "avanzado", "proyectos": [], "objetivos": ["emparejar la dinámica del bus DC con la frecuencia de red para sincronización natural"], "tags": ["matching", "grid-forming", "bus-dc", "sincronizacion", "energia", "avanzado"], "relacionados": ["grid-forming-vs-following", "vsm-inercia", "power-synchronization-control", "dinamica-bus-dc", "ecuacion-oscilacion"], "referencias": ["Arghir, Jouini, Dörfler, Grid-Forming Control for Power Converters based on Matching, Automatica 2018", "Dörfler et al., Taming Instabilities in Power Grid Networks, Physica D 2016"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Estrategia grid-forming que <strong>empareja</strong> la dinámica del condensador del bus DC con la ecuación de\nsincronización de un generador síncrono: la tensión del bus \\( v_{dc} \\) actúa como variable de\nfrecuencia, de modo que la sincronización se produce de forma <strong>física y natural</strong> sin bucles de\ncontrol artificiales.</p>\n<h2>Fundamento teórico</h2>\n<p>En un generador síncrono la variable de sincronización es la velocidad \\( \\omega \\). En un\nconvertidor, el equivalente natural es la tensión del bus DC \\( v_{dc} \\) (su cuadrado es la\nenergía almacenada \\( E=\\tfrac12 Cv_{dc}^2 \\), igual que la cinética \\( E=\\tfrac12 J\\omega^2 \\)).\nLa idea del matching es <strong>asignar el ángulo</strong> del convertidor directamente proporcional al bus DC:\n$$ \\dot\\theta = k_{match}\\,v_{dc} $$\ny diseñar el control de modulación para que el balance de energía del condensador sea\n$$ C\\,v_{dc}\\dot v_{dc} = P_s - P_e $$\nidéntico a la swing equation con \\( \\omega\\equiv k_{match}v_{dc} \\). El resultado es:\n- La tensión del bus <strong>oscila</strong> con la potencia, como la frecuencia de un generador.\n- La sincronización con la red emerge de la dinámica física del almacenamiento DC.\n- No se necesita PLL ni lazo de frecuencia artificial.\n- <strong>Ventaja</strong>: la inercia es la del condensador real (no virtual), la estabilidad es intrínseca.\n- <strong>Limitación</strong>: el bus DC oscila con la carga (no regulado a tensión constante), lo que requiere\n  dimensionar \\( C \\) para el rizado de frecuencia admisible y es incompatible con topologías que\n  exigen bus DC estricto.</p>\n<p>La conexión formal con el VSM: tomando \\( J_{v}=C/k_{match}^2 \\) se recupera la inercia virtual\nequivalente del condensador. El matching es el camino más corto desde la física del convertidor\nhasta la dinámica del generador.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Convertidores con fuente de energía en el bus DC (BESS, supercondensadores) donde el rizado de\ntensión DC es aceptable, y donde se quiere la máxima simplicidad de control con inercia genuina.\nEs un marco teórico que también justifica y conecta VSM, PSC y droop.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Elige \\( k_{match} \\) de modo que el rango de \\( v_{dc} \\) corresponda al rango de frecuencia\n   admisible: \\( \\Delta\\omega=k_{match}\\Delta v_{dc} \\).</li>\n<li>Dimensiona \\( C \\) para la inercia efectiva deseada \\( J_v=C/k_{match}^2 \\).</li>\n<li>Diseña el control de modulación para imponer \\( \\dot\\theta=k_{match}v_{dc} \\) y eliminar el\n   término de acoplo d-q.</li>\n<li>Añade regulación de Q/tensión AC de forma independiente (desacoplada).</li>\n<li>Verifica rizado de \\( v_{dc} \\) bajo perturbaciones de potencia.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">def matching_angle(vdc, theta, k_match, dt):\n    theta += k_match * vdc * dt     # angulo directo del bus DC\n    return theta % (2*3.14159)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( k_{match} \\) tal que \\( \\Delta v_{dc}\\approx1\\text{–}5\\,\\% \\) de \\( V_{dc0} \\) corresponda a\n\\( \\Delta\\omega/\\omega_0\\approx0.5\\text{–}2\\,\\% \\). Inercia equivalente según la constante \\( H \\)\ndeseada.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Ignorar que el bus DC no está regulado: incompatible con cargas que necesitan tensión DC estable.</li>\n<li>Confundir con PSC: el PSC regula \\( P \\) directamente; el matching deja que la física haga la\n  sincronización sin lazo explícito de potencia.</li>\n<li>Dimensionar \\( C \\) solo por rizado de tensión y olvidar la inercia resultante.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a> · <a class=\"wl\" data-slug=\"vsm-inercia\">vsm-inercia</a> · <a class=\"wl\" data-slug=\"power-synchronization-control\">power-synchronization-control</a> · <a class=\"wl\" data-slug=\"dinamica-bus-dc\">dinamica-bus-dc</a> · <a class=\"wl\" data-slug=\"ecuacion-oscilacion\">ecuacion-oscilacion</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Arghir, Jouini, Dörfler, <em>Grid-Forming Control for Power Converters based on Matching</em>, Automatica 2018.</li>\n<li>Dörfler et al., <em>Taming Instabilities in Power Grid Networks</em>, Physica D 2016.</li>\n</ul>", "buscar": "matching control (control por emparejamiento) definición estrategia grid-forming que empareja la dinámica del condensador del bus dc con la ecuación de sincronización de un generador síncrono: la tensión del bus \\( v {dc} \\) actúa como variable de frecuencia, de modo que la sincronización se produce de forma física y natural sin bucles de control artificiales. fundamento teórico en un generador síncrono la variable de sincronización es la velocidad \\( \\omega \\). en un convertidor, el equivalente natural es la tensión del bus dc \\( v {dc} \\) (su cuadrado es la energía almacenada \\( e=\\tfrac12 cv {dc}^2 \\), igual que la cinética \\( e=\\tfrac12 j\\omega^2 \\)). la idea del matching es asignar el ángulo del convertidor directamente proporcional al bus dc: \\dot\\theta = k {match}\\,v {dc} y diseñar el control de modulación para que el balance de energía del condensador sea c\\,v {dc}\\dot v {dc} = p s - p e idéntico a la swing equation con \\( \\omega\\equiv k {match}v {dc} \\). el resultado es: - la tensión del bus oscila con la potencia, como la frecuencia de un generador. - la sincronización con la red emerge de la dinámica física del almacenamiento dc. - no se necesita pll ni lazo de frecuencia artificial. - ventaja : la inercia es la del condensador real (no virtual), la estabilidad es intrínseca. - limitación : el bus dc oscila con la carga (no regulado a tensión constante), lo que requiere dimensionar \\( c \\) para el rizado de frecuencia admisible y es incompatible con topologías que exigen bus dc estricto. la conexión formal con el vsm: tomando \\( j {v}=c/k {match}^2 \\) se recupera la inercia virtual equivalente del condensador. el matching es el camino más corto desde la física del convertidor hasta la dinámica del generador. cuándo y por qué se usa convertidores con fuente de energía en el bus dc (bess, supercondensadores) donde el rizado de tensión dc es aceptable, y donde se quiere la máxima simplicidad de control con inercia genuina. es un marco teórico que también justifica y conecta vsm, psc y droop. procedimiento de diseño (genérico) 1. elige \\( k {match} \\) de modo que el rango de \\( v {dc} \\) corresponda al rango de frecuencia admisible: \\( \\delta\\omega=k {match}\\delta v {dc} \\). 2. dimensiona \\( c \\) para la inercia efectiva deseada \\( j v=c/k {match}^2 \\). 3. diseña el control de modulación para imponer \\( \\dot\\theta=k {match}v {dc} \\) y eliminar el término de acoplo d-q. 4. añade regulación de q/tensión ac de forma independiente (desacoplada). 5. verifica rizado de \\( v {dc} \\) bajo perturbaciones de potencia. ejemplo de código python def matching angle(vdc, theta, k match, dt): theta += k match vdc dt angulo directo del bus dc return theta % (2 3.14159) parámetros y valores típicos \\( k {match} \\) tal que \\( \\delta v {dc}\\approx1\\text{–}5\\,\\% \\) de \\( v {dc0} \\) corresponda a \\( \\delta\\omega/\\omega 0\\approx0.5\\text{–}2\\,\\% \\). inercia equivalente según la constante \\( h \\) deseada. errores comunes - ignorar que el bus dc no está regulado: incompatible con cargas que necesitan tensión dc estable. - confundir con psc: el psc regula \\( p \\) directamente; el matching deja que la física haga la sincronización sin lazo explícito de potencia. - dimensionar \\( c \\) solo por rizado de tensión y olvidar la inercia resultante. conceptos relacionados - grid-forming-vs-following · vsm-inercia · power-synchronization-control · dinamica-bus-dc · ecuacion-oscilacion referencias - arghir, jouini, dörfler, grid-forming control for power converters based on matching , automatica 2018. - dörfler et al., taming instabilities in power grid networks , physica d 2016. matching grid-forming bus-dc sincronizacion energia avanzado"}, {"slug": "no-pasividad-resistencia-negativa", "titulo": "No pasividad y resistencia negativa", "categoria": "control", "tipo": "concepto", "nivel": "avanzado", "proyectos": ["02-GFL-Impedance", "03-DataCenter-IA"], "objetivos": ["explicar la inestabilidad por interaccion de impedancias"], "tags": ["pasividad", "resistencia-negativa", "impedancia", "estabilidad", "pll"], "relacionados": ["impedancia-salida-estabilidad", "pll-srf", "interaccion-pll-red-debil", "respuesta-frecuencia-ss"], "referencias": ["Harnefors et al., Passivity-Based Stability Assessment of Grid-Connected VSCs, IEEE TIE 2016"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Un puerto eléctrico es <strong>pasivo</strong> si no genera energía neta: en términos de impedancia,\n\\( \\mathrm{Re}\\{Z(j\\omega)\\}\\ge 0 \\) para todo \\( \\omega \\). Cuando \\( \\mathrm{Re}\\{Z\\}<0 \\) en\nalguna banda, el puerto presenta <strong>resistencia negativa</strong> (es no pasivo) y puede entregar\nenergía a una resonancia → riesgo de inestabilidad al conectarse a la red.</p>\n<h2>Fundamento teórico</h2>\n<p>Si tanto el inversor como la red son pasivos en todo el rango, su interconexión es estable\n(criterio de pasividad, suficiente). La inestabilidad solo puede aparecer donde <strong>al menos uno</strong>\nes no pasivo. En el grid-following, los lazos (sobre todo la <strong>PLL</strong>) introducen un desfase que\nvuelve \\( \\mathrm{Re}\\{Z\\}<0 \\) en su banda. Si la impedancia de la red (inductiva) cruza esa\nregión, se forma una resonancia mal amortiguada → oscilación.</p>\n<p>Relación con <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a>: la pasividad es una condición <strong>suficiente</strong> y\nlocal en frecuencia; el Nyquist generalizado de \\( Z_{red}Y_{inv} \\) es el criterio exacto.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Para <strong>explicar y prevenir</strong> inestabilidades de convertidores: dar forma a la impedancia\n(impedance shaping) de modo que sea pasiva en el rango de interés evita la inestabilidad sin\nconocer la red exacta.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Calcula/mide la impedancia de salida \\( Z(j\\omega) \\) (ver <a class=\"wl\" data-slug=\"respuesta-frecuencia-ss\">respuesta-frecuencia-ss</a>).</li>\n<li>Localiza las bandas con \\( \\mathrm{Re}\\{Z\\}<0 \\) (no pasivas).</li>\n<li>Identifica la causa (PLL, retardo de cómputo, lazos lentos) y redúcela: PLL más lenta,\n   compensación de retardo, resistencia/realimentación que aporte amortiguamiento.</li>\n<li>Objetivo de diseño: \\( \\mathrm{Re}\\{Z\\}\\ge 0 \\) al menos donde la red pueda resonar.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">Z = impedance(A, B, C, D, freqs)          # matriz dq 2x2 por frecuencia\nnopasiva = freqs[Z[:, 1, 1].real &lt; 0]     # bandas no pasivas (eje q)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>La banda no pasiva del GFL coincide con el ancho de banda de la PLL. Una PLL rápida la ensancha\nhacia frecuencias mayores.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Confundir pasividad (suficiente, conservadora) con el criterio exacto de Nyquist: un sistema\n  no pasivo <strong>puede</strong> ser estable con una red concreta; la no pasividad solo señala el riesgo.</li>\n<li>Mirar solo una componente: en dq es un sistema MIMO (la resistencia negativa apareció en\n  \\( \\mathrm{Re}\\{Z_{qq}\\} \\)).</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>02 - GFL-Impedance</strong> (objetivo: explicar la inestabilidad): la impedancia de salida del GFL\n  tiene \\( \\mathrm{Re}\\{Z_{qq}\\}<0 \\) en la banda de la PLL; con PLL rápida se extiende a más\n  frecuencia, lo que explica la inestabilidad en red débil.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"pll-srf\">pll-srf</a> · <a class=\"wl\" data-slug=\"interaccion-pll-red-debil\">interaccion-pll-red-debil</a> · <a class=\"wl\" data-slug=\"respuesta-frecuencia-ss\">respuesta-frecuencia-ss</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Harnefors et al., <em>Passivity-Based Stability Assessment...</em>, IEEE TIE 2016.</li>\n</ul>", "buscar": "no pasividad y resistencia negativa definición un puerto eléctrico es pasivo si no genera energía neta: en términos de impedancia, \\( \\mathrm{re}\\{z(j\\omega)\\}\\ge 0 \\) para todo \\( \\omega \\). cuando \\( \\mathrm{re}\\{z\\}<0 \\) en alguna banda, el puerto presenta resistencia negativa (es no pasivo) y puede entregar energía a una resonancia → riesgo de inestabilidad al conectarse a la red. fundamento teórico si tanto el inversor como la red son pasivos en todo el rango, su interconexión es estable (criterio de pasividad, suficiente). la inestabilidad solo puede aparecer donde al menos uno es no pasivo. en el grid-following, los lazos (sobre todo la pll ) introducen un desfase que vuelve \\( \\mathrm{re}\\{z\\}<0 \\) en su banda. si la impedancia de la red (inductiva) cruza esa región, se forma una resonancia mal amortiguada → oscilación. relación con impedancia-salida-estabilidad : la pasividad es una condición suficiente y local en frecuencia; el nyquist generalizado de \\( z {red}y {inv} \\) es el criterio exacto. cuándo y por qué se usa para explicar y prevenir inestabilidades de convertidores: dar forma a la impedancia (impedance shaping) de modo que sea pasiva en el rango de interés evita la inestabilidad sin conocer la red exacta. procedimiento de diseño (genérico) 1. calcula/mide la impedancia de salida \\( z(j\\omega) \\) (ver respuesta-frecuencia-ss ). 2. localiza las bandas con \\( \\mathrm{re}\\{z\\}<0 \\) (no pasivas). 3. identifica la causa (pll, retardo de cómputo, lazos lentos) y redúcela: pll más lenta, compensación de retardo, resistencia/realimentación que aporte amortiguamiento. 4. objetivo de diseño: \\( \\mathrm{re}\\{z\\}\\ge 0 \\) al menos donde la red pueda resonar. ejemplo de código python z = impedance(a, b, c, d, freqs) matriz dq 2x2 por frecuencia nopasiva = freqs z :, 1, 1 .real < 0 bandas no pasivas (eje q) parámetros y valores típicos la banda no pasiva del gfl coincide con el ancho de banda de la pll. una pll rápida la ensancha hacia frecuencias mayores. errores comunes - confundir pasividad (suficiente, conservadora) con el criterio exacto de nyquist: un sistema no pasivo puede ser estable con una red concreta; la no pasividad solo señala el riesgo. - mirar solo una componente: en dq es un sistema mimo (la resistencia negativa apareció en \\( \\mathrm{re}\\{z {qq}\\} \\)). uso en proyectos - 02 - gfl-impedance (objetivo: explicar la inestabilidad): la impedancia de salida del gfl tiene \\( \\mathrm{re}\\{z {qq}\\}<0 \\) en la banda de la pll; con pll rápida se extiende a más frecuencia, lo que explica la inestabilidad en red débil. conceptos relacionados - impedancia-salida-estabilidad · pll-srf · interaccion-pll-red-debil · respuesta-frecuencia-ss referencias - harnefors et al., passivity-based stability assessment... , ieee tie 2016. pasividad resistencia-negativa impedancia estabilidad pll"}, {"slug": "observador-estados", "titulo": "Observador de estados (Luenberger)", "categoria": "control", "tipo": "metodo", "nivel": "intermedio", "proyectos": [], "objetivos": ["estimar estados no medidos a partir de entradas y salidas"], "tags": ["observador", "luenberger", "estimador", "separacion", "espacio-estados", "intermedio", "control"], "relacionados": ["controlabilidad-observabilidad", "asignacion-polos-lqr", "representacion-espacio-estados", "variables-estado"], "referencias": ["Ogata, Ingeniería de Control Moderna, Pearson", "Franklin, Powell, Feedback Control of Dynamic Systems, Pearson"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Sistema dinámico que <strong>reconstruye el vector de estado</strong> \\( \\hat{\\mathbf{x}} \\) de una planta a\npartir de su entrada \\( \\mathbf{u} \\) y su salida medida \\( \\mathbf{y} \\), cuando no todos los\nestados se miden. Permite cerrar realimentación de estado usando estimaciones.</p>\n<h2>Fundamento teórico</h2>\n<p>Para \\( \\dot{\\mathbf{x}}=A\\mathbf{x}+B\\mathbf{u} \\), \\( \\mathbf{y}=C\\mathbf{x} \\), el observador\ncopia la planta y corrige con el error de salida:\n$$ \\dot{\\hat{\\mathbf{x}}}=A\\hat{\\mathbf{x}}+B\\mathbf{u}+L\\,(\\mathbf{y}-C\\hat{\\mathbf{x}}) $$\nEl error \\( \\mathbf{e}=\\mathbf{x}-\\hat{\\mathbf{x}} \\) evoluciona como\n$$ \\dot{\\mathbf{e}}=(A-LC)\\,\\mathbf{e} $$\nasí que <strong>converge a cero</strong> si \\( A-LC \\) es estable. Los autovalores de \\( A-LC \\) se sitúan\nlibremente mediante \\( L \\) <strong>si y solo si el par \\( (A,C) \\) es observable</strong> (problema dual de la\n<a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignación de polos</a>: \\( L^\\top \\) se calcula como una realimentación sobre\n\\( (A^\\top,C^\\top) \\)). El <strong>principio de separación</strong> garantiza que diseñar control (ganancia\n\\( K \\)) y observador (ganancia \\( L \\)) por separado conserva los polos de ambos en el lazo\ncombinado. La versión <strong>óptima</strong> ante ruido es el filtro de Kalman (\\( L \\) de la ecuación de\nRiccati). Existe el observador de <strong>orden reducido</strong> (estima solo los estados no medidos).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Cuando faltan sensores (estimar flujo, tensión de condensador, par de carga), para filtrar ruido,\no en control \"sensorless\". Imprescindible junto a realimentación de estado/LQR cuando el estado no\nes accesible.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Verifica observabilidad de \\( (A,C) \\) (ver <a class=\"wl\" data-slug=\"controlabilidad-observabilidad\">controlabilidad-observabilidad</a>).</li>\n<li>Elige los polos del observador <strong>2–5× más rápidos</strong> que los de control (pero no tanto que\n   amplifiquen ruido).</li>\n<li>Calcula \\( L \\) por asignación de polos (dual) o resuelve Kalman si hay modelo de ruido.</li>\n<li>Implementa el observador en discreto y comprueba convergencia y rechazo de ruido.</li>\n<li>Cierra el lazo con \\( \\mathbf{u}=-K\\hat{\\mathbf{x}} \\) (principio de separación).</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> Filtro LCL con estados \\( [i_{L1},\\,v_C,\\,i_{L2}] \\). Solo se mide \\( i_{L2} \\). Diseñar un observador de Luenberger que estime \\( v_C \\) e \\( i_{L1} \\) para implementar amortiguamiento activo sin sensor en el condensador.</p>\n<p>El par \\( (A,C) \\) con \\( C=[0,0,1] \\) es observable (verificar \\( \\text{rank}(\\mathcal{O})=3 \\)). Se colocan los polos del observador a \\( 3\\times\\omega_{res,LCL}\\approx3\\times2\\pi\\times2050\\approx38\\,700\\,\\text{rad/s} \\) (3× más rápidos que la resonancia del filtro), dando convergencia del error de estimación en \\( <3/(3\\omega_{res})\\approx75\\,\\mu\\text{s} \\). \\( L \\) se calcula con <code>ct.place(A.T, C.T, obs_poles).T</code>. El \\( v_C \\) estimado se usa en el lazo de amortiguamiento activo (<a class=\"wl\" data-slug=\"amortiguamiento-activo-lcl\">amortiguamiento-activo-lcl</a>): en simulación, el pico de resonancia del filtro a 2 kHz cae &gt;20 dB respecto al caso sin observador.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import control as ct, numpy as np\nL = ct.place(A.T, C.T, obs_poles).T     # dualidad: polos del observador\n# x_hat[k+1] = A@x_hat + B@u + L@(y - C@x_hat)   (discretizar A,B,L)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Polos del observador 2–5× los del control. Compromiso clásico: rápido → converge antes pero\namplifica ruido de medida; lento → suave pero arrastra error.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Observador más lento que la planta → estimación retrasada, lazo degradado.</li>\n<li>Polos demasiado rápidos → ruido de medida amplificado en \\( \\hat{\\mathbf{x}} \\).</li>\n<li>Diseñar con \\( (A,C) \\) no observable (o casi) → \\( L \\) no estabiliza ciertos modos.</li>\n<li>Modelo \\( A,B,C \\) mal identificado → sesgo permanente en la estimación.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"controlabilidad-observabilidad\">controlabilidad-observabilidad</a> · <a class=\"wl\" data-slug=\"asignacion-polos-lqr\">asignacion-polos-lqr</a> · <a class=\"wl\" data-slug=\"representacion-espacio-estados\">representacion-espacio-estados</a> · <a class=\"wl\" data-slug=\"variables-estado\">variables-estado</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Ogata, <em>Ingeniería de Control Moderna</em>.</li>\n<li>Franklin, Powell, <em>Feedback Control of Dynamic Systems</em>.</li>\n</ul>", "buscar": "observador de estados (luenberger) definición sistema dinámico que reconstruye el vector de estado \\( \\hat{\\mathbf{x}} \\) de una planta a partir de su entrada \\( \\mathbf{u} \\) y su salida medida \\( \\mathbf{y} \\), cuando no todos los estados se miden. permite cerrar realimentación de estado usando estimaciones. fundamento teórico para \\( \\dot{\\mathbf{x}}=a\\mathbf{x}+b\\mathbf{u} \\), \\( \\mathbf{y}=c\\mathbf{x} \\), el observador copia la planta y corrige con el error de salida: \\dot{\\hat{\\mathbf{x}}}=a\\hat{\\mathbf{x}}+b\\mathbf{u}+l\\,(\\mathbf{y}-c\\hat{\\mathbf{x}}) el error \\( \\mathbf{e}=\\mathbf{x}-\\hat{\\mathbf{x}} \\) evoluciona como \\dot{\\mathbf{e}}=(a-lc)\\,\\mathbf{e} así que converge a cero si \\( a-lc \\) es estable. los autovalores de \\( a-lc \\) se sitúan libremente mediante \\( l \\) si y solo si el par \\( (a,c) \\) es observable (problema dual de la asignacion-polos-lqr|asignación de polos : \\( l^\\top \\) se calcula como una realimentación sobre \\( (a^\\top,c^\\top) \\)). el principio de separación garantiza que diseñar control (ganancia \\( k \\)) y observador (ganancia \\( l \\)) por separado conserva los polos de ambos en el lazo combinado. la versión óptima ante ruido es el filtro de kalman (\\( l \\) de la ecuación de riccati). existe el observador de orden reducido (estima solo los estados no medidos). cuándo y por qué se usa cuando faltan sensores (estimar flujo, tensión de condensador, par de carga), para filtrar ruido, o en control \"sensorless\". imprescindible junto a realimentación de estado/lqr cuando el estado no es accesible. procedimiento de diseño (genérico) 1. verifica observabilidad de \\( (a,c) \\) (ver controlabilidad-observabilidad ). 2. elige los polos del observador 2–5× más rápidos que los de control (pero no tanto que amplifiquen ruido). 3. calcula \\( l \\) por asignación de polos (dual) o resuelve kalman si hay modelo de ruido. 4. implementa el observador en discreto y comprueba convergencia y rechazo de ruido. 5. cierra el lazo con \\( \\mathbf{u}=-k\\hat{\\mathbf{x}} \\) (principio de separación). ejemplo de aplicación real problema: filtro lcl con estados \\( i {l1},\\,v c,\\,i {l2} \\). solo se mide \\( i {l2} \\). diseñar un observador de luenberger que estime \\( v c \\) e \\( i {l1} \\) para implementar amortiguamiento activo sin sensor en el condensador. el par \\( (a,c) \\) con \\( c= 0,0,1 \\) es observable (verificar \\( \\text{rank}(\\mathcal{o})=3 \\)). se colocan los polos del observador a \\( 3\\times\\omega {res,lcl}\\approx3\\times2\\pi\\times2050\\approx38\\,700\\,\\text{rad/s} \\) (3× más rápidos que la resonancia del filtro), dando convergencia del error de estimación en \\( <3/(3\\omega {res})\\approx75\\,\\mu\\text{s} \\). \\( l \\) se calcula con ct.place(a.t, c.t, obs poles).t . el \\( v c \\) estimado se usa en el lazo de amortiguamiento activo ( amortiguamiento-activo-lcl ): en simulación, el pico de resonancia del filtro a 2 khz cae 20 db respecto al caso sin observador. ejemplo de código python import control as ct, numpy as np l = ct.place(a.t, c.t, obs poles).t dualidad: polos del observador x hat k+1 = a@x hat + b@u + l@(y - c@x hat) (discretizar a,b,l) parámetros y valores típicos polos del observador 2–5× los del control. compromiso clásico: rápido → converge antes pero amplifica ruido de medida; lento → suave pero arrastra error. errores comunes - observador más lento que la planta → estimación retrasada, lazo degradado. - polos demasiado rápidos → ruido de medida amplificado en \\( \\hat{\\mathbf{x}} \\). - diseñar con \\( (a,c) \\) no observable (o casi) → \\( l \\) no estabiliza ciertos modos. - modelo \\( a,b,c \\) mal identificado → sesgo permanente en la estimación. conceptos relacionados - controlabilidad-observabilidad · asignacion-polos-lqr · representacion-espacio-estados · variables-estado referencias - ogata, ingeniería de control moderna . - franklin, powell, feedback control of dynamic systems . observador luenberger estimador separacion espacio-estados intermedio control"}, {"slug": "oscilaciones-subsincronas", "titulo": "Oscilaciones subsíncronas (SSO / SSCI)", "categoria": "control", "tipo": "fenomeno", "nivel": "avanzado", "proyectos": [], "objetivos": ["entender y mitigar oscilaciones por interacción convertidor-compensación serie"], "tags": ["sso", "ssci", "ssr", "compensacion-serie", "subsincrono", "eolica", "avanzado"], "relacionados": ["estabilidad-armonica", "clasificacion-estabilidad", "interaccion-pll-red-debil", "impedancia-salida-estabilidad", "red-thevenin-scr"], "referencias": ["IEEE SSR Working Group, Terms, Definitions and Symbols for Subsynchronous Oscillations, IEEE 1985", "Irwin et al., Sub-synchronous control interactions between Type-3 wind turbines and series compensated transmission, IEEE PES 2011"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Oscilaciones de frecuencia <strong>inferior a la fundamental</strong> (típ. 5–100 Hz) que se amplifican por la\ninteracción entre convertidores (o generadores) y elementos de red, sobre todo <strong>líneas con\ncompensación serie</strong>. La variante moderna sin partes mecánicas es la <strong>SSCI</strong> (subsynchronous\ncontrol interaction), propia de eólica Tipo-3/4.</p>\n<h2>Fundamento teórico</h2>\n<p>Una línea con condensador serie \\( C_s \\) y reactancia \\( X_L \\) resuena a\n$$ f_n=f_1\\sqrt{\\frac{X_{C_s}}{X_L}}<f_1 $$\nA esa frecuencia subsíncrona, la red presenta baja impedancia. Tres mecanismos clásicos (SSR):\n- <strong>IGE</strong> (induction generator effect): a \\( f_n \\) la resistencia equivalente del generador es\n  <strong>negativa</strong> → autoexcitación eléctrica.\n- <strong>TI</strong> (torsional interaction): \\( f_n \\) excita modos torsionales del eje turbina-generador.\n- <strong>TA</strong> (transient torque): pares de eje grandes tras faltas.</p>\n<p><strong>SSCI:</strong> no hay modo mecánico; es puramente <strong>control–red</strong>. El control del convertidor (lazo de\ncorriente, PLL) presenta a frecuencias subsíncronas una <strong>resistencia negativa</strong> que, combinada con\nla resonancia serie, da amortiguamiento neto negativo. Es rápida (puede crecer en ciclos) y depende\nfuertemente del nivel de compensación y del <a class=\"wl\" data-slug=\"red-thevenin-scr\">SCR</a>. Se analiza con el modelo de\n<a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia</a>: la inestabilidad aparece donde\n\\( \\mathrm{Re}\\{Z_{conv}+Z_{red}\\}<0 \\) cerca de \\( f_n \\).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En parques eólicos conectados por líneas compensadas serie (causa de eventos reales, p.ej. ERCOT\n2009), en HVDC y en redes débiles con alta penetración de convertidores. Es una subclase\n\"resonancia\" de la <a class=\"wl\" data-slug=\"clasificacion-estabilidad\">clasificación de estabilidad</a>.</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Identifica resonancias serie de la red \\( f_n \\) según el nivel de compensación.</li>\n<li>Modela la impedancia del convertidor a frecuencias subsíncronas (incluye control y PLL).</li>\n<li>Busca resistencia negativa neta cerca de \\( f_n \\) (criterio de impedancia).</li>\n<li>Mitiga: ajustar banda de PLL/lazo de corriente, <strong>damping subsíncrono</strong> dedicado (SSDC), filtros\n   o impedancia virtual; a nivel red, TCSC/bypass del condensador.</li>\n<li>Valida con barrido del nivel de compensación y SCR (<a class=\"wl\" data-slug=\"barrido-parametrico\">barrido-parametrico</a>).</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\ndef series_resonance(f1, XL, XCs):       # frecuencia subsincrona de red\n    return f1*np.sqrt(XCs/XL)\n# inestable si Re{Z_conv(fn)+Z_red(fn)} &lt; 0\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Compensación serie 20–75 % → \\( f_n\\approx 10\\text{–}45 \\) Hz. SSCI puede crecer en 0.1–1 s. Modos\ntorsionales 10–50 Hz.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Suponer que sin masas rotativas no hay riesgo subsíncrono (la SSCI es de control).</li>\n<li>Modelar el convertidor solo a la fundamental (no captura la resistencia negativa subsíncrona).</li>\n<li>Diseñar la PLL solo por respuesta nominal, sin ver su efecto en impedancia subsíncrona.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"estabilidad-armonica\">estabilidad-armonica</a> · <a class=\"wl\" data-slug=\"clasificacion-estabilidad\">clasificacion-estabilidad</a> · <a class=\"wl\" data-slug=\"interaccion-pll-red-debil\">interaccion-pll-red-debil</a> · <a class=\"wl\" data-slug=\"impedancia-salida-estabilidad\">impedancia-salida-estabilidad</a> · <a class=\"wl\" data-slug=\"red-thevenin-scr\">red-thevenin-scr</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>IEEE SSR WG, <em>Terms, Definitions and Symbols for Subsynchronous Oscillations</em>, 1985.</li>\n<li>Irwin et al., <em>Sub-synchronous control interactions ... series compensated transmission</em>, IEEE PES 2011.</li>\n</ul>", "buscar": "oscilaciones subsíncronas (sso / ssci) definición oscilaciones de frecuencia inferior a la fundamental (típ. 5–100 hz) que se amplifican por la interacción entre convertidores (o generadores) y elementos de red, sobre todo líneas con compensación serie . la variante moderna sin partes mecánicas es la ssci (subsynchronous control interaction), propia de eólica tipo-3/4. fundamento teórico una línea con condensador serie \\( c s \\) y reactancia \\( x l \\) resuena a f n=f 1\\sqrt{\\frac{x {c s}}{x l}}<f 1 a esa frecuencia subsíncrona, la red presenta baja impedancia. tres mecanismos clásicos (ssr): - ige (induction generator effect): a \\( f n \\) la resistencia equivalente del generador es negativa → autoexcitación eléctrica. - ti (torsional interaction): \\( f n \\) excita modos torsionales del eje turbina-generador. - ta (transient torque): pares de eje grandes tras faltas. ssci: no hay modo mecánico; es puramente control–red . el control del convertidor (lazo de corriente, pll) presenta a frecuencias subsíncronas una resistencia negativa que, combinada con la resonancia serie, da amortiguamiento neto negativo. es rápida (puede crecer en ciclos) y depende fuertemente del nivel de compensación y del red-thevenin-scr|scr . se analiza con el modelo de impedancia-salida-estabilidad|impedancia : la inestabilidad aparece donde \\( \\mathrm{re}\\{z {conv}+z {red}\\}<0 \\) cerca de \\( f n \\). cuándo y por qué se usa en parques eólicos conectados por líneas compensadas serie (causa de eventos reales, p.ej. ercot 2009), en hvdc y en redes débiles con alta penetración de convertidores. es una subclase \"resonancia\" de la clasificacion-estabilidad|clasificación de estabilidad . procedimiento de diseño (genérico) 1. identifica resonancias serie de la red \\( f n \\) según el nivel de compensación. 2. modela la impedancia del convertidor a frecuencias subsíncronas (incluye control y pll). 3. busca resistencia negativa neta cerca de \\( f n \\) (criterio de impedancia). 4. mitiga: ajustar banda de pll/lazo de corriente, damping subsíncrono dedicado (ssdc), filtros o impedancia virtual; a nivel red, tcsc/bypass del condensador. 5. valida con barrido del nivel de compensación y scr ( barrido-parametrico ). ejemplo de código python import numpy as np def series resonance(f1, xl, xcs): frecuencia subsincrona de red return f1 np.sqrt(xcs/xl) inestable si re{z conv(fn)+z red(fn)} < 0 parámetros y valores típicos compensación serie 20–75 % → \\( f n\\approx 10\\text{–}45 \\) hz. ssci puede crecer en 0.1–1 s. modos torsionales 10–50 hz. errores comunes - suponer que sin masas rotativas no hay riesgo subsíncrono (la ssci es de control). - modelar el convertidor solo a la fundamental (no captura la resistencia negativa subsíncrona). - diseñar la pll solo por respuesta nominal, sin ver su efecto en impedancia subsíncrona. conceptos relacionados - estabilidad-armonica · clasificacion-estabilidad · interaccion-pll-red-debil · impedancia-salida-estabilidad · red-thevenin-scr referencias - ieee ssr wg, terms, definitions and symbols for subsynchronous oscillations , 1985. - irwin et al., sub-synchronous control interactions ... series compensated transmission , ieee pes 2011. sso ssci ssr compensacion-serie subsincrono eolica avanzado"}, {"slug": "pll-srf", "titulo": "PLL de marco síncrono (SRF-PLL)", "categoria": "control", "tipo": "tecnica", "nivel": "intermedio", "proyectos": ["02-GFL-Impedance"], "objetivos": ["sincronizar el inversor con la tension de red"], "tags": ["pll", "sincronizacion", "grid-following", "dq", "ancho-de-banda"], "relacionados": ["grid-forming-vs-following", "marco-dq", "no-pasividad-resistencia-negativa", "interaccion-pll-red-debil"], "referencias": ["Kaura, Blasko, Operation of a Phase Locked Loop System Under Distorted Utility Conditions, IEEE TIA 1997", "Teodorescu et al., Grid Converters for PV and Wind Power Systems, Wiley 2011"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>La <strong>SRF-PLL</strong> (Synchronous Reference Frame PLL) estima el ángulo y la frecuencia de la\ntensión de red alineando el marco dq con dicha tensión: lleva la componente <strong>q</strong> a cero. Es\nel bloque de sincronización del grid-following.</p>\n<h2>Fundamento teórico</h2>\n<p>Mide la tensión, la pasa a dq con su ángulo estimado \\( \\theta_{pll} \\) y regula \\( v_q\\to 0 \\)\ncon un PI que ajusta la frecuencia:\n$$ \\omega_{pll}=\\omega_0 + K_{p}\\,v_q + K_{i}\\!\\int v_q,\\qquad \\dot\\theta_{pll}=\\omega_{pll} $$\nLinealizada (\\( v_q\\approx V\\,\\Delta\\theta \\)) es un lazo de 2º orden:\n$$ \\omega_n=\\sqrt{K_i V},\\qquad \\zeta=\\frac{K_p V}{2\\omega_n} $$\nEl <strong>ancho de banda</strong> de la PLL es \\( \\approx \\omega_n \\). Es el parámetro que gobierna la\nrobustez frente a la red (ver <a class=\"wl\" data-slug=\"interaccion-pll-red-debil\">interaccion-pll-red-debil</a>).</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>En todo inversor grid-following (PV, eólica GFL) y en cualquier control que necesite el ángulo\nde red. No se usa en grid-forming (que genera su propio ángulo).</p>\n<h2>Procedimiento de diseño (genérico)</h2>\n<ol>\n<li>Fija el ancho de banda \\( f_{pll} \\): compromiso entre rapidez de sincronización (rechazo de\n   huecos, saltos) y <strong>robustez</strong> (una PLL rápida interactúa con la red débil → inestabilidad).\n   Típico 10–50 Hz.</li>\n<li>Con \\( \\zeta\\approx 0.707 \\): \\( K_i=\\omega_n^2/V \\), \\( K_p=2\\zeta\\omega_n/V \\) (normaliza por\n   la amplitud \\( V \\) de la tensión).</li>\n<li>Si la red puede tener armónicos/desequilibrio, añade prefiltros (DSOGI, notch) o usa una\n   variante (DDSRF, SOGI-PLL).</li>\n<li>Verifica la interacción con la red en el rango de SCR esperado.</li>\n</ol>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">wn = 2*np.pi*f_pll\nKi = wn**2 / V0;  Kp = 2*zeta*wn / V0\n# dinamica de la PLL (v_q es la componente q de la tension medida en el marco PLL)\nw_pll = w0 + Kp*v_q + Ki*eps\nd_eps = v_q                # integrador\nd_theta = w_pll            # angulo estimado\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>\\( f_{pll} \\) 10–50 Hz (robusta) ; &gt;80–100 Hz ya es \"rápida\" y arriesgada en red débil.\n\\( \\zeta\\approx 0.707 \\).</p>\n<h2>Errores comunes</h2>\n<ul>\n<li><strong>PLL demasiado rápida</strong> \"para sincronizar mejor\": desestabiliza en red débil (el gran\n  pitfall del GFL).</li>\n<li>No normalizar por la amplitud → ganancias dependientes del punto de operación.</li>\n<li>Ignorar armónicos/desequilibrio → ángulo con rizado.</li>\n</ul>\n<h2>Uso en proyectos</h2>\n<ul>\n<li><strong>02 - GFL-Impedance</strong> (objetivo: sincronizar): SRF-PLL sobre \\( v_C \\). Con \\( f_{pll}=30 \\) Hz\n  el GFL es robusto en todo SCR; con \\( f_{pll}=100 \\) Hz se inestabiliza en red débil\n  (SCR crítico ≈3.5). El ancho de banda de la PLL fija el SCR crítico.</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"grid-forming-vs-following\">grid-forming-vs-following</a> · <a class=\"wl\" data-slug=\"marco-dq\">marco-dq</a> · <a class=\"wl\" data-slug=\"no-pasividad-resistencia-negativa\">no-pasividad-resistencia-negativa</a> · <a class=\"wl\" data-slug=\"interaccion-pll-red-debil\">interaccion-pll-red-debil</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Teodorescu et al., <em>Grid Converters for PV and Wind Power Systems</em>, 2011.</li>\n</ul>", "buscar": "pll de marco síncrono (srf-pll) definición la srf-pll (synchronous reference frame pll) estima el ángulo y la frecuencia de la tensión de red alineando el marco dq con dicha tensión: lleva la componente q a cero. es el bloque de sincronización del grid-following. fundamento teórico mide la tensión, la pasa a dq con su ángulo estimado \\( \\theta {pll} \\) y regula \\( v q\\to 0 \\) con un pi que ajusta la frecuencia: \\omega {pll}=\\omega 0 + k {p}\\,v q + k {i}\\!\\int v q,\\qquad \\dot\\theta {pll}=\\omega {pll} linealizada (\\( v q\\approx v\\,\\delta\\theta \\)) es un lazo de 2º orden: \\omega n=\\sqrt{k i v},\\qquad \\zeta=\\frac{k p v}{2\\omega n} el ancho de banda de la pll es \\( \\approx \\omega n \\). es el parámetro que gobierna la robustez frente a la red (ver interaccion-pll-red-debil ). cuándo y por qué se usa en todo inversor grid-following (pv, eólica gfl) y en cualquier control que necesite el ángulo de red. no se usa en grid-forming (que genera su propio ángulo). procedimiento de diseño (genérico) 1. fija el ancho de banda \\( f {pll} \\): compromiso entre rapidez de sincronización (rechazo de huecos, saltos) y robustez (una pll rápida interactúa con la red débil → inestabilidad). típico 10–50 hz. 2. con \\( \\zeta\\approx 0.707 \\): \\( k i=\\omega n^2/v \\), \\( k p=2\\zeta\\omega n/v \\) (normaliza por la amplitud \\( v \\) de la tensión). 3. si la red puede tener armónicos/desequilibrio, añade prefiltros (dsogi, notch) o usa una variante (ddsrf, sogi-pll). 4. verifica la interacción con la red en el rango de scr esperado. ejemplo de código python wn = 2 np.pi f pll ki = wn 2 / v0; kp = 2 zeta wn / v0 dinamica de la pll (v q es la componente q de la tension medida en el marco pll) w pll = w0 + kp v q + ki eps d eps = v q integrador d theta = w pll angulo estimado parámetros y valores típicos \\( f {pll} \\) 10–50 hz (robusta) ; 80–100 hz ya es \"rápida\" y arriesgada en red débil. \\( \\zeta\\approx 0.707 \\). errores comunes - pll demasiado rápida \"para sincronizar mejor\": desestabiliza en red débil (el gran pitfall del gfl). - no normalizar por la amplitud → ganancias dependientes del punto de operación. - ignorar armónicos/desequilibrio → ángulo con rizado. uso en proyectos - 02 - gfl-impedance (objetivo: sincronizar): srf-pll sobre \\( v c \\). con \\( f {pll}=30 \\) hz el gfl es robusto en todo scr; con \\( f {pll}=100 \\) hz se inestabiliza en red débil (scr crítico ≈3.5). el ancho de banda de la pll fija el scr crítico. conceptos relacionados - grid-forming-vs-following · marco-dq · no-pasividad-resistencia-negativa · interaccion-pll-red-debil referencias - teodorescu et al., grid converters for pv and wind power systems , 2011. pll sincronizacion grid-following dq ancho-de-banda"}, {"slug": "polos-ceros", "titulo": "Polos y ceros", "categoria": "control", "tipo": "concepto", "nivel": "basico", "proyectos": [], "objetivos": ["interpretar la dinamica y la estabilidad a partir de los polos y ceros"], "tags": ["polos", "ceros", "estabilidad", "plano-s", "basico"], "relacionados": ["funcion-transferencia", "sistema-primer-orden", "respuesta-segundo-orden", "estabilidad-bibo", "analisis-modal"], "referencias": ["Franklin, Powell, Feedback Control of Dynamic Systems"], "fecha_creacion": "2026-06-08", "fecha_actualizacion": "2026-06-08", "html": "<h2>Definición</h2>\n<p>Los <strong>polos</strong> son las raíces del denominador de la función de transferencia (la ecuación\ncaracterística); los <strong>ceros</strong>, las del numerador. Los polos determinan la <strong>forma</strong> de la\nrespuesta y la <strong>estabilidad</strong>; los ceros, cómo se ponderan los modos.</p>\n<h2>Fundamento teórico</h2>\n<p>Cada polo \\( p=\\sigma+j\\omega \\) aporta un modo \\( e^{\\sigma t}(\\cos\\omega t,\\sin\\omega t) \\):\n- \\( \\sigma<0 \\) (semiplano <strong>izquierdo</strong>): el modo <strong>decae</strong> → contribuye a la estabilidad.\n- \\( \\sigma>0 \\) (semiplano derecho): el modo <strong>crece</strong> → inestable.\n- \\( \\omega\\neq 0 \\): el modo <strong>oscila</strong> a esa frecuencia.\nLa distancia al origen marca la rapidez; el ángulo respecto al eje real, el amortiguamiento\n\\( \\zeta=-\\sigma/|p| \\). Un sistema lineal es <strong>estable</strong> si y solo si <strong>todos</strong> sus polos están\nen el semiplano izquierdo. Los ceros no afectan a la estabilidad, pero un <strong>cero en el semiplano\nderecho</strong> (fase no mínima) produce respuesta inicial en sentido contrario y limita el control.</p>\n<h2>Cuándo y por qué se usa</h2>\n<p>Es la lectura básica de cualquier diseño: mirar el mapa de polos dice de un vistazo si es estable,\ncómo de rápido y cómo de amortiguado. Es la base del análisis modal.</p>\n<h2>Procedimiento (genérico)</h2>\n<ol>\n<li>Obtén la función de transferencia o el modelo de estado.</li>\n<li>Calcula los polos (raíces del denominador / autovalores de \\( A \\)).</li>\n<li>Comprueba estabilidad (todos con parte real negativa).</li>\n<li>Lee rapidez (\\( |\\sigma| \\)) y amortiguamiento (\\( \\zeta \\)) de los polos dominantes.</li>\n</ol>\n<h2>Ejemplo de aplicación real</h2>\n<p><strong>Problema:</strong> PI de corriente con \\( K_p=5 \\), cero en \\( z=-10 \\), planta \\( G(s)=1/(s+10) \\). Identificar la cancelación polo-cero y su efecto en la respuesta.</p>\n<p>El PI tiene numerador \\( K_p(s+10) \\); la planta tiene polo en \\( s=-10 \\). Al multiplicar, el factor \\( (s+10) \\) se cancela: la ganancia de lazo abierto queda \\( L(s)=5/s \\) (integrador puro). El lazo cerrado es \\( G_{cl}(s)=5/(s+5) \\): polo único en \\( s=-5 \\), sin oscilación. Si el polo de la planta varía un 10 % (\\( r'=11 \\)), queda un polo residual en \\( s=-11 \\) no cancelado: como sigue en el SPD, el sistema permanece estable y el efecto sobre la respuesta transitoria es mínimo. La cancelación imperfecta es aceptable siempre que el residuo esté en el semiplano izquierdo.</p>\n<h2>Ejemplo de código</h2>\n<pre><code class=\"language-python\">import numpy as np\npolos = np.roots([1, 2, 5])             # raices del denominador s^2+2s+5\nestable = np.all(polos.real &lt; 0)\n</code></pre>\n<h2>Parámetros y valores típicos</h2>\n<p>Polos dominantes: los más cercanos al eje imaginario (los más lentos) dominan la respuesta.\n\\( \\zeta>0.3 \\) suele dar respuesta aceptable.</p>\n<h2>Errores comunes</h2>\n<ul>\n<li>Mirar solo la parte real e ignorar el amortiguamiento (un polo poco amortiguado oscila).</li>\n<li>Cancelar un polo inestable con un cero (cancelación no robusta, peligrosa).</li>\n</ul>\n<h2>Conceptos relacionados</h2>\n<ul>\n<li><a class=\"wl\" data-slug=\"funcion-transferencia\">funcion-transferencia</a> · <a class=\"wl\" data-slug=\"respuesta-segundo-orden\">respuesta-segundo-orden</a> · <a class=\"wl\" data-slug=\"estabilidad-bibo\">estabilidad-bibo</a> · <a class=\"wl\" data-slug=\"analisis-modal\">analisis-modal</a></li>\n</ul>\n<h2>Referencias</h2>\n<ul>\n<li>Franklin, Powell, <em>Feedback Control of Dynamic Systems</em>.</li>\n</ul>", "buscar": "polos y ceros definición los polos son las raíces del denominador de la función de transferencia (la ecuación característica); los ceros , las del numerador. los polos determinan la forma de la respuesta y la estabilidad ; los ceros, cómo se ponderan los modos. fundamento teórico cada polo \\( p=\\sigma+j\\omega \\) aporta un modo \\( e^{\\sigma t}(\\cos\\omega t,\\sin\\omega t) \\): - \\( \\sigma<0 \\) (semiplano izquierdo ): el modo decae → contribuye a la estabilidad. - \\( \\sigma 0 \\) (semiplano derecho): el modo crece → inestable. - \\( \\omega\\neq 0 \\): el modo oscila a esa frecuencia. la distancia al origen marca la rapidez; el ángulo respecto al eje real, el amortiguamiento \\( \\zeta=-\\sigma/|p| \\). un sistema lineal es estable si y solo si todos sus polos están en el semiplano izquierdo. los ceros no afectan a la estabilidad, pero un cero en el semiplano derecho (fase no mínima) produce respuesta inicial en sentido contrario y limita el control. cuándo y por qué se usa es la lectura básica de cualquier diseño: mirar el mapa de polos dice de un vistazo si es estable, cómo de rápido y cómo de amortiguado. es la base del análisis modal. procedimiento (genérico) 1. obtén la función de transferencia o el modelo de estado. 2. calcula los polos (raíces del denominador / autovalores de \\( a \\)). 3. comprueba estabilidad (todos con parte real negativa). 4. lee rapidez (\\( |\\sigma| \\)) y amortiguamiento (\\( \\zeta \\)) de los polos dominantes. ejemplo de aplicación real problema: pi de corriente con \\( k p=5 \\), cero en \\( z=-10 \\), planta \\( g(s)=1/(s+10) \\). identificar la cancelación polo-cero y su efecto en la respuesta. el pi tiene numerador \\( k p(s+10) \\); la planta tiene polo en \\( s=-10 \\). al multiplicar, el factor \\( (s+10) \\) se cancela: la ganancia de lazo abierto queda \\( l(s)=5/s \\) (integrador puro). el lazo cerrado es \\( g {cl}(s)=5/(s+5) \\): polo único en \\( s=-5 \\), sin oscilación. si el polo de la planta varía un 10 % (\\( r'=11 \\)), queda un polo residual en \\( s=-11 \\) no cancelado: como sigue en el spd, el sistema permanece estable y el efecto sobre la respuesta transitoria es mínimo. la cancelación imperfecta es aceptable siempre que el residuo esté en el semiplano izquierdo. ejemplo de código python import numpy as np polos = np.roots( 1, 2, 5 ) raices del denominador s^2+2s+5 estable = np.all(polos.real < 0) parámetros y valores típicos polos dominantes: los más cercanos al eje imaginario (los más lentos) dominan la respuesta. \\( \\zeta 0.3 \\) suele dar respuesta aceptable. errores comunes - mirar solo la parte real e ignorar el amortiguamiento (un polo poco amortiguado oscila). - cancelar un polo inestable con un cero (cancelación no robusta, peligrosa). conceptos relacionados - funcion-transferencia · respuesta-segundo-orden · estabilidad-bibo · analisis-modal referencias - franklin, powell, feedback control of dynamic systems . polos ceros estabilidad plano-s basico"}, {"slug": "power-synchronization-control", "titulo": "Power Synchronization Control (PSC)", "categoria": "control", "tipo": "tecnica", "nivel": "avanzado", "proyectos": [], "objetivos": ["sincronizar un convertidor a la red por potencia activa", "sin PLL"], "tags": ["psc", "sincronizacion", "grid-forming", "sin-pll", "hvdc", "red-debil", "avanzado"], "relacionados": ["grid-forming-vs-following", "vsm-inercia", "droop-control", "interaccion-pll-red-debil", "ecuacion-oscilacion"], "referencias": ["Zhang et al., Power Synchronization Control of Grid-Connected VSC, IEEE TPWRS 2010", "Harnefors et al., Synchronization Stability of Grid-Connected VSCs, IEEE TPEL 2017"], "fecha_creacion": "2026-06-09", "fecha_actualizacion": "2026-06-09", "html": "<h2>Definición</h2>\n<p>Estrategia grid-forming en la que el ángulo de salida del convertidor se genera <strong>integrando el\nerror de potencia activa</strong> —en vez de usar una PLL que mide la fase de la red— de forma análoga a\nla sincronización electromagnética de un generador síncrono.</p>\n<h2>Fundamento teórico</h2>\n<p>La idea central es que la <strong>potencia activa</strong> fluye entre dos fuentes de tensión según su diferencia\nde ángulo \\( \\delta \\). Usando esa relación como lazo de control:\n$$ \\dot\\delta = K_{psc}(P^*-P) \\implies \\delta = \\int K_{psc}(P^*-P)\\,dt $$\ncon \\( K_{psc} \\) ganancia de sincronización. Esto produce la misma dinámica que la\n<a class=\"wl\" data-slug=\"ecuacion-oscilacion\">swing equation</a> sin inercia explícita: en régimen permanente \\( P=P^* \\) y\nel ángulo \\( \\delta \\) queda fijo. La acción integral acumula el ángulo relativo correcto.</p>\n<p>Comparando con <a class=\"wl\" data-slug=\"vsm-inercia\">VSM</a> y <a class=\"wl\" data-slug=\"droop-control\">droop P-f</a>:</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Droop \\(\\omega-P\\)</th>\n<th>VSM</th>\n<th>PSC</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Variable de lazo</td>\n<td>frecuencia</td>\n<td>frecuencia (virtual)</td>\n<td>ángulo</td>\n</tr>\n<tr>\n<td>PLL</td>\n<td>necesaria</td>\n<td>puede evitarse</td>\n<td>no, intrínseca</td>\n</tr>\n<tr>\n<td>Inercia</td>\n<td>no</td>\n<td>sí (emulada)</td>\n<td>no (puede añadirse)</td>\n</tr>\n<tr>\n<td>Análisis</td>\n<td>Bode de lazo P</td>\n<td>modelo SS mecánico</td>\n<td>sistema de 1er orden en \\(\\delta\\)</td>\n</tr>\n</tbody>\n</table>\n<p>La <strong>estabilidad</strong> de PSC se analiza linearizando la potencia \\( P=\\frac{EV_g}{X}\\sin\\delta \\) en\nel punto de operación: la ganancia del lazo de sincronización es \\( K_{psc}\\cdot K_s \\) (par\nsincronizante \\( K_s=EV_g\\cos\\delta_0/X \\)). Un polo dominante en\n\\( s=-K_{psc}K_s \\) → la sincronización es de <strong>primer orden</strong> (sin oscilación) mientras no haya\nretardos importantes. La <strong>limitación de corriente</strong> se implementa reduciendo \\( E \\) (tensión\nvirtual) o cambiando la referencia de \\( Q \\); esto cambia dinámicamente la reactancia efectiva y\npuede inestabilizar en red muy débil si no se coordina.</p>\n<p>En red débil (bajo <a class=\"wl\" data-slug=\"red-thevenin-scr\">SCR</a>), la PLL de un GFL desestabiliza\n(<a class=\"wl\" data-slug=\"interaccion-pll-red-debil\">interaccion-pll-red-debil</a>), mientras PSC opera estable porque no depende de medir la fase de\nla red; fue propuesto originalmente para <strong>HVDC</strong> en red déb
